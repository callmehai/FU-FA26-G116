<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustCabinet — Phòng họp không giấy ứng dụng AI</title>
    <meta
      name="description"
      content="TrustCabinet — hệ thống phòng họp không giấy ứng dụng AI, có gọi thoại/video trong ứng dụng. Đồ án tốt nghiệp SEP490-G116."
    />
    <!-- Installable on a phone (PWA): name, icons and colours live in public/manifest.webmanifest. There is no service
         worker on purpose: browsers no longer require one to install, and none means a deploy can never be hidden
         behind a cached app shell. theme-color is --brand, the colour of the sidebar and the room's title bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2a4d94" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TrustCabinet" />
    <!-- Opened from the home screen, iOS shows the app without Safari's address bar (the manifest's display: standalone covers Chromium). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Same mark as components/BrandMark.tsx; colours are --surface, --brand and --gold from global.css. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18.5' fill='%23ffffff' stroke='%232a4d94' stroke-width='2'/><path d='M20 9.5l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1z' fill='%23c99a2e'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
