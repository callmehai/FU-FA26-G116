ents.", "applies": ["UC-71c"], "rationale": "ADR-0018", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:235"], "test": [], "ucs": ["UC-71c"]}, "BR-246": {"text": "A comment must not be blank.", "applies": ["UC-35"], "rationale": "Report 3 screen 7.5 — required comment text", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-35"]}, "BR-248": {"text": "A DOCX comment has no page reference.", "applies": ["UC-35"], "rationale": "ADR-0018", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:101", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:30", "frontend/src/types/document.ts:146", "frontend/src/features/documents/CommentsPanel.tsx:16", "frontend/src/features/documents/CommentsPanel.tsx:211"], "test": [], "ucs": ["UC-35"]}, "BR-249": {"text": "Anyone who can view a Meeting document may comment on it before the Meeting ends.", "applies": ["UC-35"], "rationale": "PO 15/10/2026 — read-only after Meeting end", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:15", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:22", "frontend/src/features/documents/CommentsPanel.tsx:15"], "test": [], "ucs": ["UC-35"]}, "BR-250": {"text": "Each comment records its author and posting time.", "applies": ["UC-35"], "rationale": "Report 3 screen 7.5", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-35"]}, "BR-251": {"text": "Personal-library usage details show only Meetings the user may access.", "applies": ["UC-34"], "rationale": "Existing resource confidentiality rule", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:285", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:30", "frontend/src/types/document.ts:102"], "test": [], "ucs": ["UC-34"]}, "BR-252": {"text": "Only the current Chair or the current Secretary may create or configure a Draft Vote while its Meeting is Approved, Published or InProgress.", "applies": ["UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Votes/VoteRules.cs:16"], "test": [], "ucs": ["UC-53", "UC-76a", "UC-76b"]}, "BR-253": {"text": "Only the current Chair and the current Secretary may view Draft Votes in the Meeting.", "applies": ["UC-52a", "UC-52b", "UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Web/VoteChangePublisher.cs:13", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:85", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:106", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:138", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:182", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentVisibility.cs:11", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:32", "backend/TrustCabinet.Infrastructure/Meetings/MeetingLifecycleService.cs:119", "backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:58", "backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:92", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:93", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:147", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:191", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:176", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:183", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:103", "frontend/src/types/vote.ts:58"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:253", "tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:534", "tests/TrustCabinet.Web.Tests/Votes/VoteDocumentEndpointTests.cs:91", "tests/TrustCabinet.Web.Tests/Votes/VoteHubTests.cs:35", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:101", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:195"], "ucs": ["UC-32a", "UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57", "UC-76a", "UC-76b"]}, "BR-254": {"text": "The content, options, ballot type and selected roles of an Open or Closed Vote cannot be edited.", "applies": ["UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:393"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:126"], "ucs": ["UC-53", "UC-54"]}, "BR-255": {"text": "Vote content must not be blank.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Votes/VoteRules.cs:59"], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-256": {"text": "A Vote must have at least two distinct, non-empty options.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Votes/VoteRules.cs:59"], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-257": {"text": "The Chair selects one or more eligible meeting roles from Chair, Secretary, Member and Guest; all four roles are selected by default.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Entities/VotingSession.cs:31", "backend/TrustCabinet.Domain/Votes/VoteRules.cs:59"], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-258": {"text": "Each eligible voter may cast at most one ballot in a Vote.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:166"], "test": [], "ucs": ["UC-55"]}, "BR-259": {"text": "A secret Vote records participation without linking a voter to a chosen option; only aggregate results may be disclosed.", "applies": ["UC-52b", "UC-55", "UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Configurations/VoteChoiceConfiguration.cs:27", "backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:129", "backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:137", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:494", "backend/TrustCabinet.Domain/Entities/VoteChoice.cs:8", "backend/TrustCabinet.Domain/Entities/VotingOption.cs:21", "backend/TrustCabinet.Domain/Entities/VotingSession.cs:24", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:75", "frontend/src/types/vote.ts:119"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:295"], "ucs": ["UC-52b", "UC-55", "UC-56"]}, "BR-260": {"text": "The status view of an Open Vote shows turnout, without disclosing individual choices or results per option.", "applies": ["UC-52b"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:98"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:243"], "ucs": ["UC-52a", "UC-52b"]}, "BR-261": {"text": "Closing a Vote tallies all recorded ballots per option; each percentage uses ballots cast as its denominator. With no ballots, option counts are zero and percentages are not shown.", "applies": ["UC-52b", "UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Votes/VoteContracts.cs:71", "frontend/src/types/vote.ts:104", "frontend/src/features/votes/VotingPanel.tsx:735"], "test": [], "ucs": ["UC-52b", "UC-56"]}, "BR-262": {"text": "A recorded Vote conclusion and its note cannot be changed or replaced.", "applies": ["UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:523", "backend/TrustCabinet.Domain/Entities/VotingSession.cs:52", "frontend/src/api/votes.ts:48", "frontend/src/types/vote.ts:31", "frontend/src/features/votes/VotingPanel.tsx:795"], "test": [], "ucs": ["UC-57"]}, "BR-263": {"text": "The Chair determines a Vote conclusion; the system does not infer it from the tally.", "applies": ["UC-56", "UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:528", "backend/TrustCabinet.Domain/Entities/VotingSession.cs:52", "backend/TrustCabinet.Domain/Enums/VotingEnums.cs:10", "frontend/src/api/votes.ts:48", "frontend/src/features/votes/VotingPanel.tsx:812"], "test": [], "ucs": ["UC-52b", "UC-56", "UC-57"]}, "BR-264": {"text": "Meeting Minutes include the Vote tally and the conclusion recorded by the Chair.", "applies": ["UC-57", "UC-59"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-57", "UC-59"]}, "BR-265": {"text": "A recorded ballot cannot be changed or withdrawn.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Entities/VoteChoice.cs:11", "frontend/src/api/votes.ts:41"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:239"], "ucs": ["UC-55"]}, "BR-266": {"text": "A Meeting may have at most one Open Vote at a time.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Configurations/VotingSessionConfiguration.cs:24", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:458"], "test": ["tests/TrustCabinet.Web.Tests/DatabaseModelTests.cs:422", "tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:265", "tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:153"], "ucs": ["UC-54"]}, "BR-267": {"text": "A Vote cannot be opened if no eligible voters are available.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-54"]}, "BR-268": {"text": "Changing a voter's meeting role after opening does not change the fixed eligible-voter list or count.", "applies": ["UC-54", "UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:458"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:148"], "ucs": ["UC-54", "UC-55"]}, "BR-269": {"text": "Loss of Meeting access prevents new ballots without deleting previously recorded ballots.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:43"], "test": [], "ucs": ["UC-55"]}, "BR-270": {"text": "The current Chair may close and tally an existing Open Vote while its Meeting is InProgress or Ended.", "applies": ["UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Votes/VoteRules.cs:20"], "test": [], "ucs": ["UC-56"]}, "BR-271": {"text": "A ballot selects exactly one option belonging to its Vote.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-272": {"text": "Each Vote uses either a Public or Secret ballot type.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Domain/Entities/VotingSession.cs:22", "backend/TrustCabinet.Domain/Votes/VoteRules.cs:59"], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-273": {"text": "After a Public Vote closes, its result shows each eligible voter's recorded choice or that the voter did not vote.", "applies": ["UC-52b"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:136", "backend/TrustCabinet.Domain/Entities/VoteChoice.cs:6", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:73", "frontend/src/types/vote.ts:108"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:258"], "ucs": ["UC-52b"]}, "BR-274": {"text": "The current Chair or the current Secretary may access Vote draft preparation in an Approved Meeting; this does not grant access to other restricted Meeting records.", "applies": ["UC-52a", "UC-52b", "UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52a", "UC-52b", "UC-53"]}, "BR-275": {"text": "Anyone who can view a Meeting can read its documents, except a document that is linked only to a Draft Vote (no Agenda Item, and no Open or Closed Vote): anyone except the current Chair and Secretary does not see it in any group, and opening, downloading, reading or commenting on it answers as if the document did not exist (MSG156). Once the Vote opens, everyone who can view the Meeting reads the document.", "applies": ["UC-32a", "UC-32c", "UC-35"], "rationale": "ADR-0020 / PO 15/10/2026 / PO 03/11/2026 — option B (SCRUM-21)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Agenda/AgendaService.cs:73", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:15", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:22", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:111", "frontend/src/features/documents/CommentsPanel.tsx:15"], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-35", "UC-74"]}, "BR-276": {"text": "A Meeting document keeps the name copied when it was added to the Meeting; later personal-library renaming does not change that name.", "applies": ["UC-33a", "UC-71b"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:372", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:224", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:130", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:84", "frontend/src/api/library.ts:57"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:569"], "ucs": ["UC-33a", "UC-33b", "UC-71b", "UC-76a"]}, "BR-277": {"text": "One Meeting document may be linked to multiple Agenda Items.", "applies": ["UC-33b"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:44", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:274", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:43", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:71", "frontend/src/types/document.ts:32", "frontend/src/features/documents/DocumentsPanel.tsx:38"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:94"], "ucs": ["UC-23b", "UC-32a", "UC-33b", "UC-33d"]}, "BR-278": {"text": "A document may be linked only to Agenda Items of the same Meeting.", "applies": ["UC-33b", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:41"], "test": [], "ucs": ["UC-23b", "UC-33b", "UC-33d"]}, "BR-279": {"text": "Pending, InProgress and Done Agenda Items all permit document-link additions and removals until the Meeting ends.", "applies": ["UC-33b", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:328", "frontend/src/features/documents/DocumentsPanel.tsx:40"], "test": [], "ucs": ["UC-23b", "UC-33b", "UC-33c", "UC-33d"]}, "BR-280": {"text": "Removing one Agenda Item link keeps the document in the Meeting and preserves its other Item links. A document is a general Meeting document only while it is linked to no Agenda Item and to no Vote; a document linked to a Vote appears in the Voting group only. When its last Item link is removed, it becomes general only if no Vote links it.", "applies": ["UC-32a", "UC-33b", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026 / PO 03/11/2026 — option B (SCRUM-21)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:45", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:321", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentVisibility.cs:10", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:88", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:152", "frontend/src/api/documents.ts:79", "frontend/src/types/document.ts:43", "frontend/src/features/documents/DocumentsPanel.tsx:38", "frontend/src/features/documents/useMeetingDocuments.ts:60"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentChangeEndpointsTests.cs:364", "tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:242", "tests/TrustCabinet.Web.Tests/GuestAccess/GuestDocumentAccessTests.cs:257", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:217"], "ucs": ["UC-23c", "UC-32a", "UC-33b", "UC-33d"]}, "BR-281": {"text": "Removing a document from a Meeting removes it from every Agenda Item of that Meeting.", "applies": ["UC-33c"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:251", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:134", "frontend/src/api/documents.ts:58"], "test": [], "ucs": ["UC-33c"]}, "BR-282": {"text": "Meeting documents and comments are read-only after the Meeting ends.", "applies": ["UC-32a", "UC-32c", "UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:16", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:72", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:14", "frontend/src/features/documents/CommentsPanel.tsx:16"], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35"]}, "BR-283": {"text": "Deleting an Agenda Item removes its document links but keeps the documents in the Meeting.", "applies": ["UC-23c", "UC-32a", "UC-33b", "UC-33d"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-23c", "UC-32a", "UC-33b", "UC-33d"]}, "BR-284": {"text": "Readding a removed Meeting document starts a new addition without its previous comments.", "applies": ["UC-33a", "UC-33c", "UC-35"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/DocumentCommentEndpoints.cs:53", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:16", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:251", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:412", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:134"], "test": ["tests/TrustCabinet.Web.Tests/Documents/DocumentCommentEndpointsTests.cs:179"], "ucs": ["UC-33a", "UC-33c", "UC-35"]}, "BR-285": {"text": "Each Vote belongs to one Meeting and is not linked to an Agenda Item.", "applies": ["UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57"], "rationale": "ADR-0019 / ADR-0020", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Domain/Entities/AgendaItem.cs:9", "backend/TrustCabinet.Domain/Entities/VotingSession.cs:8"], "test": ["tests/TrustCabinet.Web.Tests/DatabaseModelTests.cs:410"], "ucs": ["UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57"]}, "BR-286": {"text": "A document chosen from the personal library is added together with the others chosen with it, or not at all. A file uploaded from the computer is added on its own, as a whole or not at all (BR-194), and a file that fails does not stop the other files.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "User confirmation 15/10/2026 — multiple-file upload; changed to per-file upload by PO 27/10/2026 (upload queue, ADR-0033)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/StoredFileWriter.cs:14", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:126", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:80"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteDocumentEndpointTests.cs:196"], "ucs": ["UC-33a", "UC-33b", "UC-36", "UC-76a"]}, "BR-287": {"text": "The current Chair or Secretary may attach one or more documents to a Draft Vote as Vote documents. A Vote may have no Vote documents.", "applies": ["UC-52b", "UC-74", "UC-76a"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:310", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:43", "backend/TrustCabinet.Domain/Entities/VoteDocument.cs:4", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:25"], "test": [], "ucs": ["UC-52b", "UC-74", "UC-76a", "UC-76b"]}, "BR-288": {"text": "Vote documents can be attached or detached only while the Vote is Draft. The Vote document list is fixed when the Vote opens.", "applies": ["UC-52b", "UC-54", "UC-76a", "UC-76b"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:311", "backend/TrustCabinet.Domain/Entities/VoteDocument.cs:6", "frontend/src/features/votes/ReadConfirmButton.tsx:14", "frontend/src/features/votes/VotingPanel.tsx:525"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteDocumentEndpointTests.cs:160"], "ucs": ["UC-52b", "UC-54", "UC-76a", "UC-76b"]}, "BR-289": {"text": "An eligible voter may cast a ballot only after confirming reading of every Vote document of that Vote.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:483", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:21"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:15"], "ucs": ["UC-55", "UC-74"]}, "BR-290": {"text": "The server only records the user's confirmation that he or she has read the document; it does not verify actual reading and is not a security control. Confirmation requires that the user has scrolled to the last page in the viewer and then confirms reading. The system records the user, the document and the confirmation time.", "applies": ["UC-32c", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:281", "backend/TrustCabinet.Domain/Entities/DocumentReadConfirmation.cs:6", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:39", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:135", "frontend/src/api/votes.ts:80", "frontend/src/features/documents/DocumentViewerPage.tsx:234", "frontend/src/features/votes/ReadConfirmButton.tsx:12"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:60"], "ucs": ["UC-32c", "UC-74"]}, "BR-291": {"text": "A read confirmation belongs to one user and one Meeting document. It counts for every Vote of the Meeting that links the same document and cannot be withdrawn.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/VoteEndpoints.cs:105", "backend/TrustCabinet.Infrastructure/Configurations/DocumentReadConfirmationConfiguration.cs:15", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:71", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:276", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:176", "backend/TrustCabinet.Domain/Entities/DocumentReadConfirmation.cs:8", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:135", "frontend/src/api/votes.ts:80"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:71", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:209"], "ucs": ["UC-32a", "UC-55", "UC-74"]}, "BR-292": {"text": "If a Vote document is removed from the Meeting, including after the Vote has opened or closed, it no longer counts towards the reading requirement of that Vote and is hidden from the Vote.", "applies": ["UC-55"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteRepository.cs:69", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:483", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:21"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:83"], "ucs": ["UC-55"]}, "BR-293": {"text": "Read confirmations are stored separately from ballots and never reveal or link a voter's choice in a secret Vote.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:284", "backend/TrustCabinet.Domain/Entities/DocumentReadConfirmation.cs:9", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:135"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:15", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:165"], "ucs": ["UC-55", "UC-74"]}, "BR-294": {"text": "Before the Meeting is Published, the assigned Secretary may assign or replace the Chair.", "applies": ["UC-28b"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b"]}, "BR-295": {"text": "The Chair role may be handed over only to a current active internal participant of the Meeting who is neither a Guest nor the current Secretary, so the Chair and the Secretary do not swap roles. The same rule applies when the Secretary replaces a Chair whose account is locked.", "applies": ["UC-28b", "UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair; PO 23/10/2026 — no swap between Chair and Secretary", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-296": {"text": "After a hand-over, the former Chair remains a Member of the Meeting; leaving the meeting room does not remove him or her from the Meeting.", "applies": ["UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-73"]}, "BR-297": {"text": "A Meeting can be cancelled only by its Meeting Organizer, and only while it is Draft, WaitingApproval, Rejected, Approved or Published. An InProgress or Ended Meeting cannot be cancelled. Cancelled is a final status.", "applies": ["UC-17", "UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:493", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:19", "frontend/src/types/meeting.ts:36"], "test": [], "ucs": ["UC-17", "UC-75"]}, "BR-298": {"text": "Cancelling a Meeting requires a non-blank reason of at most 1,000 characters. The reason, the actor and the cancellation time are recorded in the Meeting status history and shown with the Meeting.", "applies": ["UC-16", "UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:52", "backend/TrustCabinet.Domain/Entities/MeetingStatusHistory.cs:42", "backend/TrustCabinet.Domain/Meetings/MeetingContracts.cs:47", "backend/TrustCabinet.Domain/Meetings/MeetingWorkflowContracts.cs:12", "frontend/src/types/meeting.ts:118", "frontend/src/types/meeting.ts:296", "frontend/src/features/meetings/detail/MeetingDetailPage.tsx:483"], "test": [], "ucs": ["UC-16", "UC-75"]}, "BR-299": {"text": "A Cancelled Meeting cannot be edited, submitted, approved, published, rescheduled or started. Its agenda, participants, documents and Votes remain read-only, and any pending approval request is closed.", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:602", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:66", "frontend/src/features/documents/DocumentsPanel.tsx:40"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35", "UC-37", "UC-75"]}, "BR-300": {"text": "When a Published Meeting is cancelled, every invited internal participant is notified in the application and by email, and every invited Guest by email, including the reason; a person who was never sent the invitation email is not sent a cancellation email. When a Meeting awaiting approval is cancelled, its assigned Meeting Approver is notified in the application. A notification failure does not undo the cancellation.", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Email/MeetingInvitationEvents.cs:9", "backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:691", "backend/TrustCabinet.Domain/Meetings/IMeetingRepository.cs:49", "backend/TrustCabinet.Domain/Meetings/MeetingReadPolicy.cs:20"], "test": ["tests/TrustCabinet.Web.Tests/Participants/ParticipantDeliveryTests.cs:88"], "ucs": ["UC-75"]}, "BR-301": {"text": "If a Meeting that is Draft, WaitingApproval, Rejected, Approved or Published has not been started 24 hours after its planned start time, the system cancels it with the reason \"Not held as scheduled\", records System as the actor and notifies its Meeting Organizer. A Meeting that has started is never cancelled this way. (PO 27/10/2026)", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Web/MeetingOverdueWorker.cs:6", "backend/TrustCabinet.Web/Program.cs:90", "backend/TrustCabinet.Web/Endpoints/MeetingEndpoints.cs:737", "backend/TrustCabinet.Infrastructure/Meetings/MeetingOverdueService.cs:16", "backend/TrustCabinet.Infrastructure/Meetings/MeetingOverdueService.cs:32", "backend/TrustCabinet.Domain/Entities/Meeting.cs:55", "backend/TrustCabinet.Domain/Entities/MeetingStatusHistory.cs:36", "backend/TrustCabinet.Domain/Enums/MeetingEnums.cs:41", "backend/TrustCabinet.Domain/Meetings/IMeetingOverdueService.cs:4", "backend/TrustCabinet.Domain/Meetings/MeetingWorkflowContracts.cs:11", "frontend/src/types/meeting.ts:124", "frontend/src/types/meeting.ts:271", "frontend/src/features/meetings/MeetingForm.tsx:158", "frontend/src/features/meetings/MeetingForm.tsx:167"], "test": [], "ucs": ["UC-15", "UC-75"]}, "BR-302": {"text": "Retired (PO 27/10/2026): the system no longer ends an InProgress Meeting on its own; the Chair ends it through UC-22. The number is kept so existing references stay valid and must not be reused.", "applies": ["UC-22"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": [], "test": [], "ucs": ["UC-22"]}, "BR-303": {"text": "The system sends one in-app reminder to each invited active internal participant of a Published Meeting during the 15 minutes before its planned start. If the Meeting is rescheduled, the reminder is sent again for the new start time. Guests do not receive in-app reminders. The lead time is configurable.", "applies": ["UC-66"], "rationale": "Council review 1 — reminder rules; matches the implemented reminder job", "enforced": "Email & In-App Notification", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-304": {"text": "Documents attached to an Agenda Item or a Vote may be chosen from the Meeting documents, uploaded from the computer or chosen from the personal library. Documents not yet in the Meeting are added to it and attached in the same save. All documents submitted together are attached together, or none are.", "applies": ["UC-33b", "UC-76a"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:311", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:330", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:138", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:130", "frontend/src/api/votes.ts:58", "frontend/src/features/documents/AddDocumentsDialog.tsx:55", "frontend/src/features/documents/AttachMenu.tsx:14"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteDocumentEndpointTests.cs:81"], "ucs": ["UC-33b", "UC-76a"]}, "BR-305": {"text": "Detaching a document from a Vote keeps the document in the Meeting with its Agenda Item links, comments and read confirmations unchanged.", "applies": ["UC-76b"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Configurations/VoteDocumentConfiguration.cs:19", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:352", "backend/TrustCabinet.Domain/Entities/VoteDocument.cs:7", "frontend/src/api/votes.ts:74"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteDocumentEndpointTests.cs:99", "tests/TrustCabinet.Web.Tests/Votes/VoteReadConfirmationTests.cs:130"], "ucs": ["UC-76b"]}, "BR-306": {"text": "The Presenter of an Agenda Item is optional; when set, it must be a current internal participant or a current Guest of the same Meeting.", "applies": ["UC-23a", "UC-23b"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-307": {"text": "When a Presenter is assigned or changed while the Meeting is Published or InProgress, the new Presenter is notified: an internal user in the application, a Guest by email including the Meeting title and start time. No in-app notification is created when the assignee is the person making the change (BR-322), for example a Secretary assigning themselves. A Guest who declined the invitation may still be chosen as Presenter and may still join the Meeting: declining is only an advance answer that hides the Meeting from the personal calendar and does not block permissions (BR-321). A notification failure does not undo the change.", "applies": ["UC-23a", "UC-23b"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-308": {"text": "When a participant is removed from the Meeting or a Guest invitation is revoked, the Agenda Items that person presents no longer have a Presenter.", "applies": ["UC-28c"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-309": {"text": "An Agenda Item has at most one conclusion: a non-blank text of at most 2,000 characters. Saving again replaces the earlier conclusion.", "applies": ["UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-77"]}, "BR-310": {"text": "The current Chair or Secretary may record or change an Item conclusion only for an InProgress or Done Item, while the Meeting is InProgress or after it ends until the minutes draft is generated. After that, the conclusion is read-only.", "applies": ["UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": ["backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:78"], "test": [], "ucs": ["UC-77"]}, "BR-311": {"text": "The system records who last saved an Item conclusion and when, and shows them with the conclusion.", "applies": ["UC-26", "UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-26", "UC-77"]}, "BR-312": {"text": "Meeting Minutes include each Agenda Item with its Presenter and recorded conclusion.", "applies": ["UC-59", "UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-59", "UC-77"]}, "BR-313": {"text": "A change to a role's permissions applies to the users holding that role from their next action, without ending their active sessions.", "applies": ["UC-11"], "rationale": "SCRUM-105, BA 22/10/2026", "enforced": "Role-Based Access Control", "code": [], "test": [], "ucs": ["UC-11"]}, "BR-314": {"text": "Changing a user's system role applies the new role's permissions to that user from their next action, without ending their active sessions.", "applies": ["UC-08"], "rationale": "SCRUM-105, PO 22/10/2026", "enforced": "Role-Based Access Control", "code": [], "test": [], "ucs": ["UC-08"]}, "BR-315": {"text": "Opening a Meeting document from the online meeting room keeps the user in the room.", "applies": ["UC-32a", "UC-32c"], "rationale": "SCRUM-21, BA 22/10/2026 — ADR-0011, PO approved 22/10/2026", "enforced": "Document Management", "code": ["frontend/src/features/agenda/AgendaPanel.tsx:324", "frontend/src/features/documents/DocumentsPanel.tsx:43", "frontend/src/features/documents/DocumentViewerPage.tsx:38"], "test": [], "ucs": ["UC-32a", "UC-32c"]}, "BR-316": {"text": "The online meeting room offers Meeting documents for reading and commenting only; adding, linking and removing documents are done outside the room.", "applies": ["UC-32a"], "rationale": "SCRUM-21, BA 22/10/2026 — ADR-0011, PO approved 22/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:90", "frontend/src/types/document.ts:39", "frontend/src/features/agenda/AgendaPanel.tsx:59", "frontend/src/features/documents/DocumentsPanel.tsx:42", "frontend/src/features/votes/VotingPanel.tsx:55"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:88"], "ucs": ["UC-32a"]}, "BR-317": {"text": "A reply belongs to one top-level comment of the same Meeting document; replies are not nested further.", "applies": ["UC-35"], "rationale": "SCRUM-23, BA 22/10/2026 — PO approved 22/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:93", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:10", "backend/TrustCabinet.Domain/Entities/DocumentComment.cs:8", "frontend/src/types/document.ts:150", "frontend/src/features/documents/CommentsPanel.tsx:16"], "test": ["tests/TrustCabinet.Web.Tests/GuestAccess/GuestDocumentAccessTests.cs:294"], "ucs": ["UC-35"]}, "BR-318": {"text": "Each view of a document of a Secret Meeting is recorded in the audit log with the user and time.", "applies": ["UC-32c"], "rationale": "SCRUM-22, PO 13/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:158", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:163", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:118", "frontend/src/features/documents/DocumentViewerPage.tsx:36", "frontend/src/features/meetings/MeetingForm.tsx:92"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:186", "tests/TrustCabinet.Web.Tests/GuestAccess/GuestDocumentAccessTests.cs:79"], "ucs": ["UC-32c"]}, "BR-319": {"text": "One upload from the computer — to a Meeting (UC-33a, UC-33b) or to the personal library (UC-36) — contains at most 10 files with a total size of at most 200 MB.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "PO 22/10/2026 — extended to UC-33b and UC-36 by PO 27/10/2026 (SCRUM-58)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:281", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:17", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:18", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:83", "backend/TrustCabinet.Domain/Votes/VoteContracts.cs:31", "frontend/src/features/documents/useFileUpload.ts:5"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36"]}, "BR-320": {"text": "When a Meeting is created, the Organizer chooses 1 to 100 initial participants. Each is an existing active internal user listed once, with the Meeting Role Chair, Secretary or Member, and exactly one participant is the Chair. A Secretary is optional, the Organizer need not be a participant, and Guests cannot be added at creation. The participants are saved with the Meeting in one save, each with a Pending response, and no invitation is sent while the Meeting is Draft.", "applies": ["UC-14"], "rationale": "PO 20/10/2026", "enforced": "Meeting Management", "code": [], "test": [], "ucs": ["UC-14"]}, "BR-321": {"text": "An invitee who has not answered is treated as attending. A Declined response only hides the Meeting from that invitee's own calendar; it does not change the invitee's Meeting Role, access to the Meeting, its documents or its online room, and the Meeting still appears in the Meeting list. The Chair is never hidden, even when an earlier Declined response exists.", "applies": ["UC-17", "UC-29", "UC-30"], "rationale": "PO 21/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-17", "UC-23a", "UC-23b", "UC-29", "UC-30"]}, "BR-322": {"text": "No one receives an in-app notification about their own action. Email still goes to the actor too, so their calendar updates.", "applies": ["UC-15", "UC-21", "UC-23a", "UC-23b", "UC-28b", "UC-73"], "rationale": "BA Final Review, PR #136", "enforced": "Email & In-App Notification", "code": [], "test": [], "ucs": ["UC-15", "UC-21", "UC-23a", "UC-23b", "UC-28b", "UC-73", "UC-75"]}, "BR-323": {"text": "A person may enter a Meeting's online room only while holding a current participant assignment of that Meeting or a valid Guest access relationship for it; being the Organizer or the Approver alone is not enough.", "applies": ["UC-37"], "rationale": "SCRUM-39 audit 25/10/2026 — the room follows the current roster", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37"]}, "BR-324": {"text": "Leaving the online room, or being disconnected from it, does not change the Meeting lifecycle, its roster, its roles, its attendance or its ballots.", "applies": ["UC-37", "UC-38"], "rationale": "SCRUM-39 audit 25/10/2026 — the Meeting continues for everyone else", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37", "UC-38"]}, "BR-325": {"text": "Only the current Chair may mute another person's microphone in the online room, and muting only turns the microphone off: the Chair cannot unmute it, and the person may turn it on again.", "applies": ["UC-39a", "UC-41"], "rationale": "SCRUM-41 audit 25/10/2026 — chair mute is one-way", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-39a", "UC-40", "UC-41", "UC-79"]}, "BR-326": {"text": "At most one person presents a screen in the online room at a time; when another person starts presenting, the previous presentation stops.", "applies": ["UC-39c"], "rationale": "SCRUM-43 audit 25/10/2026 — one presenter", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-39c"]}, "BR-327": {"text": "In-room chat messages are delivered only to the people connected to the room at the time and are never stored; a person who joins later does not receive earlier messages.", "applies": ["UC-42"], "rationale": "SCRUM-41 audit 25/10/2026 — temporary chat, PO 25/10/2026", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-42"]}, "BR-328": {"text": "One account holds one connection to a Meeting's online room at a time; joining from a second tab or device closes the earlier connection.", "applies": ["UC-37", "UC-38"], "rationale": "SCRUM-39 audit 25/10/2026 — one identity per room", "enforced": "Meeting Room", "code": ["frontend/src/features/calls/room/roomRoles.ts:14", "frontend/src/features/calls/room/RoomView.tsx:121"], "test": [], "ucs": ["UC-37", "UC-38", "UC-78"]}, "BR-329": {"text": "A change of Meeting Role takes effect in the online room without the person rejoining: the room shows the new role and the new permissions from that moment. A change of Meeting Role is not blocked while the Meeting is in progress.", "applies": ["UC-40", "UC-41", "UC-73"], "rationale": "SCRUM-97 audit 25/10/2026, PO 26/10/2026 — Chair hand-over while the room is open", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37", "UC-40", "UC-41", "UC-73"]}, "BR-330": {"text": "Being connected to the online room is not attendance and never sets an attendance value; attendance is recorded only through the Attendance function.", "applies": ["UC-31", "UC-37", "UC-38", "UC-40"], "rationale": "SCRUM-26, SCRUM-39 audit 25/10/2026 — room presence is not attendance", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-31", "UC-37", "UC-38", "UC-40", "UC-79"]}, "BR-331": {"text": "Microphone, speaker and camera choices belong to the person's browser on that device; they change no Meeting setting and are not stored with the Meeting.", "applies": ["UC-39a", "UC-39b", "UC-39d"], "rationale": "SCRUM-42 audit 25/10/2026 — devices are a browser choice", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37", "UC-39a", "UC-39b", "UC-39d"]}, "BR-332": {"text": "The floating window shows the same room connection as the main window and is not a second join; closing it or leaving from it does not change the Meeting.", "applies": ["UC-78"], "rationale": "SCRUM-42 audit 25/10/2026 — floating window", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-38", "UC-78"]}, "BR-333": {"text": "The documents of all Meetings and personal libraries together may take at most 10 GB of storage in the whole system. Every stored file not yet purged counts, including a file already deleted from a library or removed from a Meeting that the periodic cleanup has not yet removed (BR-213). There is no limit per user. An upload that would take the total above 10 GB is rejected and none of its files is stored.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "PO 27/10/2026 (SCRUM-58, ADR-0034)", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36"]}, "BR-334": {"text": "A System Admin may read, but never change, the folders and documents in the personal library of a locked account. The library of an active account stays private to its owner. The Admin never sees the files of a Secret Meeting, nor that Meeting’s upload folder and its subfolders, even when the Admin may view the Meeting: those open only under the Meeting’s own rules.", "applies": ["UC-34b"], "rationale": "PO 27/10/2026 (SCRUM-58, ADR-0035)", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-34b"]}, "BR-335": {"text": "Every read of a locked account’s library by a System Admin — a folder listing or a document — is written to the audit log with who read, whose library, which item and when. If the entry cannot be saved, the read is refused.", "applies": ["UC-34b"], "rationale": "PO 27/10/2026 (SCRUM-58)", "enforced": "Audit", "code": [], "test": [], "ucs": ["UC-34b"]}, "BR-336": {"text": "At most 50 people are connected to a Meeting's online room at the same time; a further person cannot join until someone leaves.", "applies": ["UC-37"], "rationale": "SCRUM-39 audit 29/10/2026 — room capacity of ADR-0010", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37"]}, "BR-337": {"text": "A person has at most one open speaking request in a Meeting at a time. The request ends when the person lowers the hand, finishes speaking, leaves the room or the Meeting ends.", "applies": ["UC-79"], "rationale": "SCRUM-27 — Register to Speak, requirement 29/10/2026", "enforced": "Meeting Room", "code": ["backend/TrustCabinet.Infrastructure/Calls/CallRepository.cs:155", "backend/TrustCabinet.Infrastructure/Calls/CallRepository.cs:180", "backend/TrustCabinet.Infrastructure/Calls/CallRepository.cs:235", "backend/TrustCabinet.Infrastructure/Calls/CallRoomService.cs:34", "backend/TrustCabinet.Infrastructure/Configurations/SpeakingRequestConfiguration.cs:9", "backend/TrustCabinet.Infrastructure/Participants/ParticipantService.cs:528", "backend/TrustCabinet.Infrastructure/Speaking/SpeakingService.cs:18", "backend/TrustCabinet.Infrastructure/Speaking/SpeakingService.cs:303", "backend/TrustCabinet.Domain/Calls/CallInterfaces.cs:46", "backend/TrustCabinet.Domain/Calls/CallInterfaces.cs:52", "backend/TrustCabinet.Domain/Speaking/SpeakingContracts.cs:61", "backend/TrustCabinet.Domain/Speaking/SpeakingContracts.cs:93"], "test": ["tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:17", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:237", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingReviewGapTests.cs:19", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingReviewGapTests.cs:122"], "ucs": ["UC-79"]}, "BR-338": {"text": "Raised hands are queued in the order they were made. Only the current Chair may reorder the queue, invite a person to speak, decline a request or close a turn; one person holds the floor at a time, and being invited never turns a microphone on or off.", "applies": ["UC-79"], "rationale": "SCRUM-27 — turn-based speaking", "enforced": "Meeting Room", "code": ["backend/TrustCabinet.Infrastructure/Configurations/SpeakingRequestConfiguration.cs:12", "backend/TrustCabinet.Infrastructure/Speaking/SpeakingService.cs:19", "backend/TrustCabinet.Infrastructure/Speaking/SpeakingService.cs:203", "backend/TrustCabinet.Domain/Speaking/SpeakingContracts.cs:21", "backend/TrustCabinet.Domain/Speaking/SpeakingContracts.cs:23"], "test": ["tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:17", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingReviewGapTests.cs:145"], "ucs": ["UC-79"]}, "BR-339": {"text": "A speaking request, its order, its invitation and the start and end of each turn are kept with the Meeting after it ends as a record of who spoke and for how long; they are not tasks and have no assignee or due date.", "applies": ["UC-79"], "rationale": "SCRUM-27 — evidence for the minutes", "enforced": "Meeting Room", "code": ["backend/TrustCabinet.Infrastructure/Calls/CallRepository.cs:168", "backend/TrustCabinet.Infrastructure/Configurations/SpeakingRequestConfiguration.cs:51", "backend/TrustCabinet.Infrastructure/Speaking/SpeakingService.cs:18", "backend/TrustCabinet.Domain/Entities/SpeakingRequest.cs:8"], "test": ["tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:17", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:129", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingEndpointTests.cs:329", "tests/TrustCabinet.Web.Tests/Speaking/SpeakingReviewGapTests.cs:19"], "ucs": ["UC-79"]}, "BR-340": {"text": "How a Meeting is recorded follows its format: an Online Meeting records each person's own microphone, an In-person Meeting records the room, and a Hybrid Meeting records both. Nobody chooses the method.", "applies": ["UC-39a", "UC-44a", "UC-44c"], "rationale": "ADR-0040 — recording method follows the Meeting format", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-43a", "UC-44a", "UC-44c"]}, "BR-341": {"text": "Only the current Secretary may record the room, upload an audio file, delete a take or erase a recording.", "applies": ["UC-44a", "UC-44b", "UC-44c", "UC-44d", "UC-44e"], "rationale": "SCRUM-29 / AI-eCabinet — room recording administration", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44a", "UC-44b", "UC-44c", "UC-44d", "UC-44e", "UC-45c", "UC-46b"]}, "BR-342": {"text": "The room may be recorded only while the Meeting is In Progress; an audio file may be uploaded while it is In Progress or Ended.", "applies": ["UC-44a", "UC-44c"], "rationale": "ADR-0040 / SCRUM-29 — sitting recording lifecycle", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44a", "UC-44c"]}, "BR-343": {"text": "Before the first room take of a Meeting, and before each upload, the Secretary confirms that attendees were informed and nobody objected; the confirmation time and purpose are kept with the recording.", "applies": ["UC-44a", "UC-44c"], "rationale": "Luật 91/2025/QH15 / SCRUM-29 — data protection notice & purpose", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44a", "UC-44c"]}, "BR-344": {"text": "A Meeting has at most one open room take at a time.", "applies": ["UC-44a"], "rationale": "ADR-0041 — one open room take at a time", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44a", "UC-44b"]}, "BR-345": {"text": "Each saved take is appended to the Meeting's room recording, and the whole recording is transcribed again; the text edited and the names assigned before are replaced by the new transcript (BR-360). When adding the take would make the recording larger than 300 MB, the take becomes a new recording instead.", "applies": ["UC-44b", "UC-45c"], "rationale": "ADR-0041 — one room recording per Meeting", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44a", "UC-44b", "UC-45c"]}, "BR-346": {"text": "A room take that receives no audio for 12 hours is saved by the system.", "applies": ["UC-44b"], "rationale": "ADR-0041 / PO 29/10/2026 — unattended take saved automatically", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44b"]}, "BR-347": {"text": "Recordings, transcripts and recorded sentences are kept for 180 days and are then erased automatically. For the room recording of a Meeting the 180 days count from the day its first take was started, and takes added later do not extend them; for an uploaded file and for the sentences recorded from a person's own microphone they count from the day it was saved.", "applies": ["UC-39a", "UC-44e"], "rationale": "Luật 91/2025/QH15 — retention limit", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-43a", "UC-44e"]}, "BR-348": {"text": "Erasing a recording removes its audio and transcript but keeps the fact that it existed and when it was erased. Who erased it, or that it expired, is kept in the audit log.", "applies": ["UC-44e"], "rationale": "SCRUM-29 — audit trail for erased media", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44e"]}, "BR-349": {"text": "Deleting a take removes its audio and sentences; edited text and assigned names elsewhere in the recording are kept. A voice heard only in the deleted take loses its assigned name. The only take of a recording cannot be deleted: the Secretary erases the whole recording instead (UC-44e).", "applies": ["UC-44d"], "rationale": "SCRUM-29 / PO 29/10/2026 — take deletion semantics", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-44d"]}, "BR-350": {"text": "Only the current Chair, Secretary and Participants may list and play a Meeting's recordings.", "applies": ["UC-43a", "UC-43b", "UC-45a"], "rationale": "SCRUM-29 — meeting attendees only", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-43a", "UC-43b", "UC-45a"]}, "BR-351": {"text": "Only the current Chair or Secretary may download a recording or export a transcript, and nobody may for a Secret Meeting. Each download is recorded in the audit log.", "applies": ["UC-43c", "UC-45b"], "rationale": "SCRUM-29, SCRUM-31 / AI-eCabinet — export control", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-43c", "UC-45b"]}, "BR-352": {"text": "In the online room, a person's microphone switch is the only recording switch: speech is recorded only while that person's microphone is on.", "applies": ["UC-39a"], "rationale": "ADR-0040 / SCRUM-109 — single microphone toggle", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-39a"]}, "BR-353": {"text": "Before joining, the lobby tells the person that the Meeting is recorded for the minutes and erased after 180 days.", "applies": ["UC-37", "UC-39a"], "rationale": "Luật 91/2025/QH15 — prior notice requirement", "enforced": "Meeting Room", "code": [], "test": [], "ucs": ["UC-37", "UC-39a"]}, "BR-354": {"text": "A sentence not yet sent stays on the person's device and is accepted up to 7 days after the Meeting ends, if it was spoken during the Meeting.", "applies": ["UC-39a", "UC-80"], "rationale": "ADR-0038 / SCRUM-109 — unsent sentences kept on the device", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-80"]}, "BR-355": {"text": "A person may withdraw their own sentence - a Member while signed in, a Guest while the verified session lasts - and the Secretary may delete any sentence; deleting removes its text and audio.", "applies": ["UC-46d", "UC-80"], "rationale": "SCRUM-109 — individual deletion and moderation; Guest from SCRUM-129 (ADR-0051)", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-46d", "UC-80"]}, "BR-356": {"text": "A sentence that repeats a neighbour's speech picked up by another microphone is marked, not hidden.", "applies": ["UC-39a", "UC-43a"], "rationale": "ADR-0038 / SCRUM-109 — cross-talk indication", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-43a"]}, "BR-357": {"text": "Only the current Chair or Secretary may exclude a sentence from the record, with a reason, or restore it. An excluded sentence is not deleted; only they can read and play it.", "applies": ["UC-46c"], "rationale": "SCRUM-109 / AI-eCabinet — exclusion from minutes", "enforced": "Meeting Recording", "code": ["backend/TrustCabinet.Infrastructure/Summaries/SummaryService.cs:367"], "test": [], "ucs": ["UC-43a", "UC-43b", "UC-46c"]}, "BR-358": {"text": "Excluded sentences are left out of an exported transcript.", "applies": ["UC-45b"], "rationale": "SCRUM-109 — export exclusion", "enforced": "Transcription", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MeetingTranscriptReader.cs:10"], "test": [], "ucs": ["UC-45b", "UC-46c"]}, "BR-359": {"text": "Only the Secretary may edit transcript text; edited text shows who edited it and when.", "applies": ["UC-46a"], "rationale": "SCRUM-31 — transcript editing provenance", "enforced": "Transcription", "code": [], "test": [], "ucs": ["UC-46a"]}, "BR-360": {"text": "Transcribing a completed transcript again replaces all its text, edits and assigned names, whether the Secretary asks for it or the system does it because a take was added to the recording (BR-345).", "applies": ["UC-45c"], "rationale": "SCRUM-31 / PO 29/10/2026 — retranscription overwrite", "enforced": "Transcription", "code": [], "test": [], "ucs": ["UC-44b", "UC-45c"]}, "BR-361": {"text": "Voice ID requires the person's own separate consent, not combined with consent to recording and never pre-selected.", "applies": ["UC-81b"], "rationale": "Luật 91/2025/QH15 — sensitive biometric consent", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-81b", "UC-81c", "UC-81f"]}, "BR-362": {"text": "Consent is tied to the notice version the person read; when the notice changes, the person must accept the new version. The current version is 1.2, which states that the system may fill in the person's name by itself when the voice matches clearly (BR-366); a person who accepted an earlier version is only suggested, never named automatically.", "applies": ["UC-81a", "UC-81b"], "rationale": "ADR-0042, ADR-0048 / SCRUM-35 — versioned biometric consent, notice 1.2", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-81a", "UC-81b"]}, "BR-363": {"text": "A person may keep at most five voice samples; a sample must contain 6 to 60 seconds of one person's clear speech.", "applies": ["UC-81c"], "rationale": "SCRUM-35 — voice sample quality & limit", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-81a", "UC-81c"]}, "BR-364": {"text": "Voice samples are stored protected; only their owner may play them back.", "applies": ["UC-81c", "UC-81d"], "rationale": "Luật 91/2025/QH15 / ADR-0042 — biometric audio privacy", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-81c", "UC-81d", "UC-81e"]}, "BR-365": {"text": "Withdrawing consent deletes all the person's voice samples, every speaker suggestion pointing to them and every name the system filled in automatically, at once; names assigned by a Secretary are kept.", "applies": ["UC-81f"], "rationale": "Luật 91/2025/QH15 / ADR-0027 — consent revocation", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-06c", "UC-48", "UC-81f"]}, "BR-366": {"text": "Speaker suggestions compare only with consenting people on that Meeting's current roster, are shown only to the Secretary, and never name a Guest. When a speaker matches such a person's voice at or above the configured auto-assign threshold (0.75 by default) the system fills in that person's name by itself, but only for a person who accepted the current notice version (BR-362); the Secretary may still change or clear it. Below the threshold the name is only suggested.", "applies": ["UC-45a", "UC-46b"], "rationale": "PR #225 / ADR-0045 — automatic naming above the threshold", "enforced": "Transcription", "code": [], "test": [], "ucs": ["UC-45a", "UC-45c", "UC-46b", "UC-81b"]}, "BR-367": {"text": "One person may be suggested for several voices. A second voice joins that person when it matches the person's enrolled voice at or above the configured second-voice threshold (0.7 by default); a voice still unnamed after the suggestions joins the person whose first named voice it resembles at or above the inherited-voice threshold (0.8 by default) and takes that name and score. Otherwise the voice stays a speaker of its own. (ADR-0045, ADR-0050)", "applies": ["UC-46b"], "rationale": "ADR-0045 / PO 29/10/2026 — second-voice threshold", "enforced": "Transcription", "code": [], "test": [], "ucs": ["UC-46b"]}, "BR-368": {"text": "A speaker may be assigned only to a person on the Meeting's current roster.", "applies": ["UC-46b"], "rationale": "SCRUM-35 — roster constraint on speaker assignment", "enforced": "Transcription", "code": [], "test": [], "ucs": ["UC-46b"]}, "BR-369": {"text": "Meeting audio and voice samples are processed inside the system and never sent to an outside service.", "applies": ["UC-39a", "UC-45c", "UC-81c"], "rationale": "ADR-0026 — on-premises speech processing", "enforced": "Meeting Recording / Voice ID", "code": [], "test": [], "ucs": ["UC-39a", "UC-45c", "UC-81b", "UC-81c"]}, "BR-370": {"text": "A Guest's own microphone is recorded in the online room like a Member's, and the Guest may read, replay and delete the sentences of that microphone while the verified session lasts; a Guest cannot open the Meeting's room recordings or transcript, and a sentence of another speaker is answered as if it did not exist. (ADR-0051)", "applies": ["UC-39a", "UC-43a"], "rationale": "PO 01/11/2026 / ADR-0051 - a Guest in an online Meeting is recorded through their own microphone (SCRUM-129)", "enforced": "Meeting Recording", "code": [], "test": [], "ucs": ["UC-39a", "UC-43a", "UC-80"]}, "BR-371": {"text": "For one Guest invitation, a new verification code can be requested at most once per minute, and at most 20 codes can be sent within any 24 hours.", "applies": ["UC-04"], "rationale": "NEEDS REVIEW PO — set during the SCRUM-116 review on 31/10/2026; not yet confirmed by PO", "enforced": "Guest participation", "code": [], "test": [], "ucs": ["UC-04"]}, "BR-372": {"text": "Deactivating a user account ends that person's Voice ID in the same transaction as the status change: every voice sample, every speaker suggestion and every name the system filled in automatically is deleted, the consent is closed and the audit log names the administrator who did it; reactivating the account restores nothing.", "applies": ["UC-06c"], "rationale": "ADR-0049 / SCRUM-35 — deactivation ends Voice ID", "enforced": "Voice ID", "code": [], "test": [], "ucs": ["UC-06c", "UC-48", "UC-81a", "UC-81f"]}, "BR-373": {"text": "The AI draft of a Meeting has exactly three sections — I. Mục tiêu và phạm vi cuộc họp, II. Nội dung thảo luận và đánh giá, III. Kết luận và phân công thực hiện — written as plain text under the headings of the minutes template.", "applies": ["UC-47", "UC-48", "UC-49"], "rationale": "SCRUM-36 / ADR-0054 — the three sections of Decree 30's Mẫu 1.4", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47", "UC-48", "UC-49"]}, "BR-374": {"text": "Only the current Chair or the current Secretary of a Meeting may ask for its AI draft, correct it and review it. Until the draft is reviewed, no other person who may read the Meeting can read it.", "applies": ["UC-47", "UC-48", "UC-49", "UC-50"], "rationale": "SCRUM-36 — an unreviewed machine text is not shown to the participants", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47", "UC-48", "UC-49", "UC-50"]}, "BR-375": {"text": "An AI draft may be asked for only while the Meeting is InProgress or Ended.", "applies": ["UC-47"], "rationale": "SCRUM-36 — there is nothing to draft before the meeting starts", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47"]}, "BR-376": {"text": "A Meeting has at most one AI draft. A new request replaces the earlier text and its review whole, and the earlier draft stays readable until the new one is ready.", "applies": ["UC-47", "UC-48"], "rationale": "SCRUM-36 / AI-eCabinet — one draft per meeting, rewritten in place", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47", "UC-48"]}, "BR-377": {"text": "Correcting a reviewed AI draft withdraws the review; the other participants stop seeing the draft until it is reviewed again.", "applies": ["UC-49", "UC-50"], "rationale": "ADR-0054 — a changed text has not been vouched for", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-49", "UC-50"]}, "BR-378": {"text": "The AI writes no attendance, guesses no name for an unnamed voice and writes no vote result; the attendance, the names assigned and the vote results come from the Meeting's record.", "applies": ["UC-47", "UC-59"], "rationale": "ADR-0054 / AI-eCabinet — the tally is legally operative", "enforced": "Meeting Summary / Meeting Minutes", "code": [], "test": [], "ucs": ["UC-47", "UC-59"]}, "BR-379": {"text": "The AI writes only from the Meeting's own record. A Meeting with little or nothing recorded still produces a draft that says so instead of inventing content.", "applies": ["UC-47", "UC-48"], "rationale": "SCRUM-36 — no content invented for the minutes", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47", "UC-48"]}, "BR-380": {"text": "Each part of section II is written from the transcript between the moment its agenda item was started and the moment it was closed, and keeps that time range so the Secretary can check it against the transcript. Speech that falls outside every timed agenda item is grouped into one extra part titled “Nội dung khác”; a leftover of 300 characters or fewer is ignored as greeting between items.", "applies": ["UC-47", "UC-48"], "rationale": "ADR-0054 — one model call per agenda item", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47", "UC-48"]}, "BR-381": {"text": "An AI draft is written by the team's own server. For a Normal meeting, the system administrator may choose an outside AI service on the AI settings screen, and the transcript is then sent to that service; the access key is stored encrypted. A meeting of any other sensitivity level always uses the team's own server, and its transcript never leaves the system.", "applies": ["UC-47"], "rationale": "ADR-0054, ADR-0056 / Luật 91/2025/QH15 — personal data stays inside unless the meeting is Normal", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-47"]}, "BR-382": {"text": "An AI draft is marked as written by AI. The minutes take the meeting's current draft, reviewed or not, because the draft minutes are seen only by the Chair and the Secretary, who also review the draft; the minutes card tells them when the draft is unreviewed or has changed since. Without a draft the minutes leave sections I–III for the Secretary to write.", "applies": ["UC-47", "UC-50", "UC-59"], "rationale": "ADR-0054 + quyết định PO 05/11/2026", "enforced": "Meeting Summary / Meeting Minutes", "code": [], "test": [], "ucs": ["UC-47", "UC-48", "UC-50", "UC-59"]}, "BR-383": {"text": "Meeting minutes are produced from one fixed template, Biên bản cuộc họp theo Mẫu 1.4 Nghị định 30/2020/NĐ-CP. The system offers no template management and no second template.", "applies": ["UC-58", "UC-59"], "rationale": "SCRUM-32 / ADR-0054 — one template, as AI-eCabinet", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-58", "UC-59"]}, "BR-384": {"text": "The minutes are filled from the Meeting's records: title, start and end time, place, attendance, Chair, Secretary, the agenda and each item's recorded conclusion, and the result and conclusion of each closed vote.", "applies": ["UC-59"], "rationale": "SCRUM-32 — the minutes restate the Meeting's record", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-59"]}, "BR-385": {"text": "Minutes content is HTML that the server filters before saving; the page, the Word file and the PDF file read the same content, and nothing in it can run in a browser.", "applies": ["UC-58", "UC-60"], "rationale": "ADR-0055 — one content, three renderers", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-58", "UC-60"]}, "BR-386": {"text": "Only the current Chair or the current Secretary may read or correct a minutes draft. Everyone else sees the minutes only after they are issued.", "applies": ["UC-58", "UC-59", "UC-60"], "rationale": "SCRUM-32 — a draft is the two officers' alone until it is issued", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:18", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:365", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:31"], "test": [], "ucs": ["UC-58", "UC-59", "UC-60", "UC-61", "UC-64", "UC-65", "UC-83"]}, "BR-387": {"text": "Minutes may be built only while the Meeting is InProgress or Ended.", "applies": ["UC-59"], "rationale": "SCRUM-32 — there is nothing to write up before the meeting starts", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-59"]}, "BR-388": {"text": "A Meeting has at most one minutes draft. Building it again replaces all of its content, and minutes submitted for approval or issued can no longer be built again or corrected; a revision the Chair returned can be corrected and submitted again. (BR-407)", "applies": ["UC-59", "UC-60"], "rationale": "SCRUM-32 / SCRUM-33 — one draft per meeting, sealed once issued", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:315"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:93"], "ucs": ["UC-59", "UC-60", "UC-61"]}, "BR-389": {"text": "A minutes save made from an out-of-date copy is rejected; newer text is never overwritten by an older one.", "applies": ["UC-60"], "rationale": "SCRUM-32 — two people editing the same draft", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:325"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:156"], "ucs": ["UC-60", "UC-61", "UC-64", "UC-65"]}, "BR-390": {"text": "The minutes of a Secret Meeting cannot be downloaded as a Word or PDF file; they are read on the screen only.", "applies": ["UC-60"], "rationale": "SCRUM-32 / BR-188 — the same rule as documents and transcripts", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-58", "UC-60"]}, "BR-391": {"text": "The minutes are downloaded as a Word file (.docx) or a PDF file; both are built from the same content, and a table wider than 63 columns keeps only its first 63 columns in both.", "applies": ["UC-60"], "rationale": "SCRUM-32 / ADR-0055 — Word and PDF from one content", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-60"]}, "BR-392": {"text": "Section III of the minutes keeps the line “Nhiệm vụ, sản phẩm và thời hạn” as text only; the system tracks no assignee, due date or progress for a task.", "applies": ["UC-59"], "rationale": "ADR-0054 / README scope — no task tracking", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-59"]}, "BR-393": {"text": "Each section of the AI draft is limited to 2,000 (I), 12,000 (II) and 8,000 (III) characters, and no section may be empty.", "applies": ["UC-49"], "rationale": "SCRUM-36 — what the draft card accepts", "enforced": "Meeting Summary", "code": [], "test": [], "ucs": ["UC-49"]}, "BR-394": {"text": "Minutes content may not be empty (after filtering), may not exceed 300,000 characters, and its tags may not nest deeper than 64 levels.", "applies": ["UC-60"], "rationale": "SCRUM-32 — what the editor accepts", "enforced": "Meeting Minutes", "code": [], "test": [], "ucs": ["UC-60"]}, "BR-395": {"text": "Changing the speaker of one sentence moves that sentence to the chosen person's voice, creating a new voice for a person who has none; the other sentences keep their voices.", "applies": ["UC-46b"], "rationale": "SCRUM-35 / PR #265 — one sentence, the rest of the voice untouched", "enforced": "Transcription", "code": ["backend/TrustCabinet.Web/NotesChangePublisher.cs:10", "backend/TrustCabinet.Infrastructure/Notes/MeetingNoteService.cs:15", "backend/TrustCabinet.Infrastructure/Notes/MeetingNoteService.cs:130", "backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:18", "backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:30", "frontend/src/features/meetings/detail/MeetingDetailPage.tsx:67"], "test": [], "ucs": ["UC-46b"]}, "BR-396": {"text": "While the AI is writing a draft again, the draft cannot be edited or approved; the actor waits for it to finish.", "applies": ["UC-49", "UC-50"], "rationale": "SCRUM-36 / PR #265 — one write at a time", "enforced": "Meeting Summary", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:45", "backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:18", "backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:32", "backend/TrustCabinet.Domain/Notes/MeetingNoteContracts.cs:78"], "test": [], "ucs": ["UC-49", "UC-50"]}, "BR-404": {"text": "Only the current Secretary may submit the minutes for approval.", "applies": ["UC-61"], "rationale": "SCRUM-33 — the Secretary sends the minutes for approval", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:35", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:59", "frontend/src/types/summary.ts:110"], "test": [], "ucs": ["UC-61"]}, "BR-405": {"text": "The minutes may be submitted for approval only after the Meeting has Ended.", "applies": ["UC-61"], "rationale": "SCRUM-33 — the minutes record a finished sitting", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:61"], "test": [], "ucs": ["UC-61"]}, "BR-406": {"text": "Only the current Chair may approve or return minutes waiting for approval.", "applies": ["UC-64", "UC-65"], "rationale": "SCRUM-33 — the Chair approves or returns", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:35", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:63", "frontend/src/types/summary.ts:112"], "test": [], "ucs": ["UC-64", "UC-65"]}, "BR-407": {"text": "Returning minutes requires a reason of at most 2,000 characters, which the Secretary sees. Returned minutes can be corrected and submitted again; only the reason of the latest return is kept.", "applies": ["UC-60", "UC-61", "UC-65"], "rationale": "SCRUM-33 — a return carries a remark to the Secretary", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:98", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:315", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:67", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:118", "frontend/src/features/minutes/MinutesPanel.tsx:518"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:217"], "ucs": ["UC-58", "UC-59", "UC-60", "UC-61", "UC-65"]}, "BR-408": {"text": "Approving the minutes issues them at once. The Meeting keeps its Ended status; being issued is a state of the minutes.", "applies": ["UC-64"], "rationale": "SCRUM-33 / ADR-0013 — no MinutesIssued meeting state", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:203", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:206"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:105"], "ucs": ["UC-61", "UC-64"]}, "BR-409": {"text": "Issued minutes are never changed. A correction is a new revision that starts from the issued text, is numbered after it and follows the same submission and approval; once the correction is issued, the earlier revision is superseded and stays readable.", "applies": ["UC-64", "UC-83"], "rationale": "SCRUM-33 — a change after issue is a new revision, the old one is kept", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:209"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:296"], "ucs": ["UC-58", "UC-64", "UC-83"]}, "BR-410": {"text": "The minutes of a Meeting have at most one revision that is not yet issued.", "applies": ["UC-83"], "rationale": "SCRUM-33 — one draft per meeting (BR-388), one correction at a time", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:262", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:304", "backend/Trust
