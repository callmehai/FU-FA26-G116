Cabinet.Domain/Summaries/MinutesContracts.cs:71"], "test": [], "ucs": ["UC-83"]}, "BR-411": {"text": "Submitting the minutes notifies the current Chair; returning them notifies the current Secretary; issuing them notifies everyone who may read the issued minutes except the Chair who issued them. The state change and its notifications are one save.", "applies": ["UC-61", "UC-64", "UC-65"], "rationale": "SCRUM-33 — the participants are told the minutes are issued", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:347"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:111"], "ucs": ["UC-61", "UC-64", "UC-65"]}, "BR-412": {"text": "Issued minutes, and the revisions they superseded, can be read and downloaded as a Word or PDF file by everyone who may read the Meeting, except Guests; nobody may download the minutes of a Secret Meeting (BR-390). A draft, a revision waiting for approval or a returned one is read and downloaded by the current Chair and the current Secretary only.", "applies": ["UC-58", "UC-64"], "rationale": "SCRUM-33 / BR-390 — PO 07/11/2026 (a Guest never sees the minutes) and 08/11/2026 (a reader may download the issued minutes)", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:18", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:141", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:318", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:334", "backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:365", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:26", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:31", "frontend/src/features/minutes/MinutesPanel.tsx:523"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:13"], "ucs": ["UC-58", "UC-60", "UC-64", "UC-83"]}, "BR-413": {"text": "A correction cannot be rebuilt from the template; it starts from the issued text and is corrected by hand.", "applies": ["UC-59", "UC-83"], "rationale": "SCRUM-33 — the record behind the issued text has been sealed", "enforced": "Meeting Minutes", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:56", "backend/TrustCabinet.Domain/Summaries/MinutesContracts.cs:73", "frontend/src/features/minutes/MinutesPanel.tsx:518"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:258"], "ucs": ["UC-59", "UC-83"]}, "BR-414": {"text": "Calendar sharing has exactly two levels: Level 1 covers Normal meetings, Level 2 covers Normal and Internal meetings. A Secret meeting is never shared, not even as busy. Find-a-time may therefore propose a slot that overlaps a Secret meeting; the meeting can still be created and that invitee declines the invitation (BR-428, UC-29).", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-85a", "UC-85c"], "rationale": "SCRUM-142 / ADR-0058 — two sharing levels; a Secret meeting is never shared", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarBusyReader.cs:9", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:202", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:7", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:38", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:63", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:45", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:4", "frontend/src/types/calendarSharing.ts:6"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareRulesTests.cs:7", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:11"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-85a", "UC-85c"]}, "BR-415": {"text": "A day outside the share’s date range is “unknown”: it is neither free nor busy and is never proposed as a slot.", "applies": ["UC-85a", "UC-85c"], "rationale": "SCRUM-142 / ADR-0058 — a day outside the range is unknown, never proposed", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/SharedCalendarService.cs:83", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:151", "frontend/src/types/calendarSharing.ts:74", "frontend/src/features/calendarSharing/SharedWeek.tsx:35"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:12"], "ucs": ["UC-85a", "UC-85c"]}, "BR-416": {"text": "A person who has not shared with the viewer shows “Not shared” and is counted as neither free nor busy. The finder’s own calendar is counted only when the finder ticks “Tính cả tôi”, and then at every level (BR-418, BR-421).", "applies": ["UC-85a"], "rationale": "SCRUM-137 / ADR-0058 — a person without a share is not counted as free", "enforced": "Calendar Sharing", "code": [], "test": [], "ucs": ["UC-85a"]}, "BR-417": {"text": "A meeting above the shared level counts as free for the viewer (for example an Internal meeting at Level 1).", "applies": ["UC-85a", "UC-85c"], "rationale": "SCRUM-142 / ADR-0058 — a meeting above the shared level counts as free", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:7", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:38"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:11"], "ucs": ["UC-85a", "UC-85c"]}, "BR-418": {"text": "The finder’s own meetings count at every level, including Secret.", "applies": ["UC-85a"], "rationale": "SCRUM-137 — the finder’s own meetings count at every level", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarBusyReader.cs:11", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:39"], "test": [], "ucs": ["UC-85a"]}, "BR-419": {"text": "Only a current Chair, Secretary or Member assignment counts as busy. A person who only created the meeting or only approves it never counts as busy. A person who declined the invitation never counts as busy.", "applies": ["UC-85a", "UC-85c"], "rationale": "SCRUM-142 / ADR-0058 — only Chair, Secretary or Member counts as busy", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:10", "backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:25"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarBusyRulesTests.cs:7", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:12"], "ucs": ["UC-85a", "UC-85c"]}, "BR-420": {"text": "A meeting counts as busy while it is Chờ duyệt, Đã duyệt, Đã công bố, Đang họp or Đã kết thúc (until its actual end time). A meeting in Nháp, Bị từ chối or Đã huỷ never counts as busy.", "applies": ["UC-85a", "UC-85c"], "rationale": "SCRUM-142 — which meeting statuses count as busy", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarBusyReader.cs:9", "backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:10", "backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:15", "backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:37"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarBusyRulesTests.cs:7", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:12"], "ucs": ["UC-85a", "UC-85c"]}, "BR-421": {"text": "A search covers at most 10 people besides the finder; the finder may also count their own calendar, which does not take one of the 10 places. Duration is 15 minutes to 8 hours (default 2 hours) and the date range at most 31 days.", "applies": ["UC-85a"], "rationale": "SCRUM-137 / ADR-0058 — search limits: people, duration, date range", "enforced": "Calendar Sharing", "code": [], "test": [], "ucs": ["UC-85a"]}, "BR-422": {"text": "Slots fall Monday to Friday, 08:00–17:00 excluding the 12:00–13:00 lunch break, and never start in the past. A slot keeps a gap of 0–4 hours (default 30 minutes) both before and after every busy period. Start times are then rounded up to a step of 5 minutes to 2 hours (default 30 minutes): a meeting ending 09:10 with a 30-minute gap and a 30-minute step gives 10:00 as the earliest start.", "applies": ["UC-85a"], "rationale": "SCRUM-137 / ADR-0058 — working hours, buffer and start-time rounding", "enforced": "Calendar Sharing", "code": [], "test": [], "ucs": ["UC-85a"]}, "BR-423": {"text": "Each ordered pair of a calendar owner and a viewer has at most one Pending (Chờ đồng ý) or Effective (Đang hiệu lực) share, and nobody shares with themselves. The direction counts: while A views B’s calendar, B may still ask for or receive a share of A’s calendar.", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e"], "rationale": "SCRUM-142 — at most one pending or effective share per owner–viewer pair", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareCloser.cs:28", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:408", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:445", "backend/TrustCabinet.Infrastructure/Configurations/CalendarShareConfiguration.cs:20", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:24", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:47", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:96", "backend/TrustCabinet.Domain/Entities/CalendarShare.cs:8", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:14"], "test": ["tests/TrustCabinet.Web.Tests/DatabaseModelTests.cs:591", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareEndpointTests.cs:87"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85a"]}, "BR-424": {"text": "A share stops for good (Stopped — Đã dừng) as soon as the viewer is no longer a Meeting Organizer or either account is deactivated (UC-06c); a temporary lock after wrong passwords does not count. Only an Effective share stops: a Pending invitation is kept, the asked person can only decline it, and accepting it is refused while the sender’s account is deactivated (MSG468). A stopped share stays listed as stopped and reveals no hours. Becoming a Meeting Organizer again or reactivating the account does not restart it; viewing again needs a new share.", "applies": ["UC-06c", "UC-08", "UC-11", "UC-84c", "UC-85c"], "rationale": "SCRUM-142 — a share stops for good and never restarts; PO 09/11/2026 Q-A, Q-C", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/Access/RolePermissionService.cs:174", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareCloser.cs:13", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareNotifications.cs:58", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharePeople.cs:8", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharePeople.cs:28", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareStopper.cs:8", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:381", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:396", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingServiceCollectionExtensions.cs:8", "backend/TrustCabinet.Infrastructure/CalendarSharing/SharedCalendarService.cs:13", "backend/TrustCabinet.Infrastructure/Users/UserService.cs:232", "backend/TrustCabinet.Infrastructure/Users/UserService.cs:337", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:141", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:154", "backend/TrustCabinet.Domain/Entities/CalendarShare.cs:16", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:15", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:27", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:38"], "test": ["tests/TrustCabinet.Web.Tests/Access/CapabilityGateTests.cs:56", "tests/TrustCabinet.Web.Tests/Access/RoleEndpointsTests.cs:60", "tests/TrustCabinet.Web.Tests/Access/RolePermissionEndpointsTests.cs:68", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareStopTests.cs:11", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:13", "tests/TrustCabinet.Web.Tests/Users/UserEndpointsTests.cs:69", "tests/TrustCabinet.Web.Tests/Users/UserTestDoubles.cs:396"], "ucs": ["UC-06c", "UC-08", "UC-11", "UC-12c", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85c"]}, "BR-425": {"text": "A share counts only until its end date. After it, the share and any pending request or pending change on it are no longer listed, give no hours and cannot be acted on (MSG450). There is no job, no extra status and no notification. Viewing the hours again needs a new share.", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85c"], "rationale": "SCRUM-142 — a share closes itself after its end date; PO 09/11/2026 Q-B", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Web/Program.cs:93", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareCloser.cs:28", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareStopper.cs:11", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareStopper.cs:23", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:27", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:98", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:381", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:391", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:407", "backend/TrustCabinet.Infrastructure/CalendarSharing/SharedCalendarService.cs:13", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:256", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:7", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:31", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:12", "backend/TrustCabinet.Domain/Entities/CalendarShare.cs:30", "backend/TrustCabinet.Domain/Enums/CalendarSharingEnums.cs:15"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareEndpointTests.cs:406", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareRulesTests.cs:7", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareRulesTests.cs:123", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareStopTests.cs:56", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:13"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85c"]}, "BR-426": {"text": "Every share step — request, accept, decline, change, withdraw, end and stop — is audited and notifies the other side; a stop notifies both sides. A share that stops counting after its end date is not audited and notifies no one.", "applies": ["UC-06c", "UC-08", "UC-11", "UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e"], "rationale": "SCRUM-142 — every share step is audited and notified; PO 09/11/2026 Q-B", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareCloser.cs:13", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareNotifications.cs:8", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareNotifications.cs:58", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:241", "backend/TrustCabinet.Domain/Enums/PlatformEnums.cs:25"], "test": [], "ucs": ["UC-06c", "UC-08", "UC-11", "UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e"]}, "BR-427": {"text": "Shared views and search results show only busy, free, unknown or not-shared. They never show a meeting title, location, attendee list or sensitivity level. Whose hours are busy may be shown only from the finder’s own invite list.", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-85a", "UC-85c"], "rationale": "SCRUM-137 / ADR-0058 — shared views show only busy, free, unknown or not-shared", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarBusyReader.cs:9", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarShareNotifications.cs:9", "backend/TrustCabinet.Infrastructure/CalendarSharing/SharedCalendarService.cs:12", "backend/TrustCabinet.Domain/CalendarSharing/CalendarBusyRules.cs:6", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:5", "backend/TrustCabinet.Domain/Entities/CalendarShare.cs:9", "frontend/src/types/calendarSharing.ts:3", "frontend/src/features/calendarSharing/SharedWeek.tsx:75"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:13", "tests/TrustCabinet.Web.Tests/CalendarSharing/SharedWeekEndpointTests.cs:73"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-85a", "UC-85c"]}, "BR-428": {"text": "A slot that overlaps an undisclosed Secret meeting still allows a draft. The recheck before saving uses the same shared data as the search and produces no distinct error, warning, notification or audit because a Secret meeting overlaps. The find page always shows one fixed sentence that only shared calendars are counted and invitees may still be busy.", "applies": ["UC-14", "UC-85a", "UC-85b"], "rationale": "SCRUM-137 / ADR-0058 — a slot over an undisclosed meeting still allows a draft", "enforced": "Calendar Sharing", "code": [], "test": [], "ucs": ["UC-14", "UC-85a", "UC-85b"]}, "BR-429": {"text": "A meeting created from a slot starts in Draft: the first listed invitee becomes Chair, the rest become Member and the finder becomes Secretary. It follows the normal approval flow. Creating a meeting does not check attendee conflicts.", "applies": ["UC-14", "UC-85b"], "rationale": "SCRUM-137 / ADR-0058 — a meeting from a slot starts in Draft with default roles", "enforced": "Calendar Sharing", "code": [], "test": [], "ucs": ["UC-14", "UC-85b"]}, "BR-430": {"text": "Only a Meeting Organizer may request a share, receive a direct share, view shared calendars, find slots or create a draft from a slot; any active internal account may own a calendar and share it. The Chia sẻ lịch page is open to every active internal account; its “Shared with me” list, asking for a share, the weekly view and find-a-time need the Meeting Organizer right (MSG448). Losing the right keeps the “I share to” list.", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85a", "UC-85b", "UC-85c"], "rationale": "SCRUM-142 / ADR-0058 — who may share, view and find; PO 10/11/2026 (L8)", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharePeople.cs:8", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:28", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:43", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:72", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:77", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:197", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:114", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:43", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:113", "backend/TrustCabinet.Domain/Entities/CalendarShare.cs:16"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareEndpointTests.cs:475", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareEndpointTests.cs:490", "tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareRulesTests.cs:141"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d", "UC-84e", "UC-84f", "UC-85a", "UC-85b", "UC-85c"]}, "BR-431": {"text": "A share’s date range is valid when the start date is not after the end date, the end date is today or later, and the range covers at most 365 days counting both ends. A new share (UC-84a, UC-84b) starts today or later; a changed range of an Effective share (UC-84d) may keep its original start date. A range the owner shortens when accepting (UC-84c) must lie within the requested range.", "applies": ["UC-84a", "UC-84b", "UC-84c", "UC-84d"], "rationale": "SCRUM-142 — a valid share date range", "enforced": "Calendar Sharing", "code": ["backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:202", "backend/TrustCabinet.Infrastructure/CalendarSharing/CalendarSharingService.cs:232", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:7", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:12", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:57", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:63", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:69", "backend/TrustCabinet.Domain/CalendarSharing/CalendarShareRules.cs:78", "backend/TrustCabinet.Domain/CalendarSharing/CalendarSharingContracts.cs:45", "frontend/src/features/calendarSharing/ShareDialogs.tsx:63", "frontend/src/features/calendarSharing/shareFormat.ts:3", "frontend/src/features/calendarSharing/shareFormat.ts:75"], "test": ["tests/TrustCabinet.Web.Tests/CalendarSharing/CalendarShareRulesTests.cs:7"], "ucs": ["UC-84a", "UC-84b", "UC-84c", "UC-84d"]}, "BR-432": {"text": "Every signed-in internal user may view and export the meeting report; a Guest may not. The figures count only the Meetings the user may read under the Meeting list rules — for a System Admin as for anyone else.", "applies": ["UC-70a", "UC-70b"], "rationale": "SCRUM-38 — \"chỉ tính trên các cuộc họp người xem có quyền truy cập\"; D1, D2", "enforced": "", "code": ["backend/TrustCabinet.Web/Endpoints/ReportEndpoints.cs:7", "backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:14", "frontend/src/components/AppSidebar.tsx:23", "frontend/src/lib/routes.ts:50", "frontend/src/features/reports/ReportsPage.tsx:31"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:41", "tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:143", "tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:329"], "ucs": ["UC-70a", "UC-70b"]}, "BR-433": {"text": "A report period is a whole number of calendar months, in Vietnam time. The start month must not be after the end month, and the period covers at most 24 months. By default it is the 12 months ending with the current month.", "applies": ["UC-70a", "UC-70b"], "rationale": "SCRUM-38 — số cuộc họp theo tháng", "enforced": "", "code": ["backend/TrustCabinet.Domain/Reports/ReportContracts.cs:6", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:38", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:97", "frontend/src/api/reports.ts:6", "frontend/src/features/reports/reportFormat.ts:3", "frontend/src/features/reports/reportFormat.ts:9", "frontend/src/features/reports/reportFormat.ts:20", "frontend/src/features/reports/reportFormat.ts:46"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:35"], "ucs": ["UC-70a", "UC-70b"]}, "BR-434": {"text": "A Meeting belongs to the month of its planned start. It is counted under its current status and its sensitivity; Cancelled Meetings are counted too.", "applies": ["UC-70a", "UC-70b"], "rationale": "SCRUM-38 — theo tháng, theo trạng thái, theo mức mật", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:65"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:57"], "ucs": ["UC-70a", "UC-70b"]}, "BR-435": {"text": "The attendance rate of an Ended Meeting is the number of invitees marked present divided by its current internal participants and its Guests whose invitation was not revoked. A Meeting where nobody was marked present or absent is left out. The average attendance rate is the mean of those rates.", "applies": ["UC-70a", "UC-70b"], "rationale": "SCRUM-38 — tỷ lệ tham dự trung bình", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:72", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:71", "frontend/src/types/report.ts:16"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:118"], "ucs": ["UC-70a", "UC-70b"]}, "BR-436": {"text": "The minutes turnaround of an Ended Meeting is the time from its actual end to the first issue of its minutes; corrections issued later do not count. A Meeting whose minutes are not issued yet is left out. The average turnaround is the mean of those times.", "applies": ["UC-70a", "UC-70b"], "rationale": "SCRUM-38 — thời gian trung bình từ khi kết thúc họp tới khi ban hành biên bản", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:72", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:81", "frontend/src/types/report.ts:20"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:104"], "ucs": ["UC-70a", "UC-70b"]}, "BR-437": {"text": "The report shows only counts, rates and averages. It never shows the title, participants or content of a Meeting, on the page or in the exported file.", "applies": ["UC-70a", "UC-70b"], "rationale": "Cuộc họp Mật — số liệu tổng hợp không được thành đường vòng để đọc cuộc họp", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:15", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:85", "frontend/src/types/report.ts:5", "frontend/src/features/reports/ReportsPage.tsx:34"], "test": ["tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:70", "tests/TrustCabinet.Web.Tests/Reports/ReportEndpointTests.cs:262"], "ucs": ["UC-70a", "UC-70b"]}, "BR-438": {"text": "An exported report is an Excel file holding exactly the figures of UC-70a for the same period, computed at the time of export. Every export is recorded in the audit log with the user, the period and the time.", "applies": ["UC-70b"], "rationale": "SCRUM-38 — xuất Excel; tệp mang số liệu ra khỏi hệ thống", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Reports/MeetingReportXlsx.cs:12", "backend/TrustCabinet.Infrastructure/Reports/ReportService.cs:43", "backend/TrustCabinet.Domain/Audit/AuditEventCatalog.cs:118", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:261", "backend/TrustCabinet.Domain/Reports/ReportContracts.cs:111", "frontend/src/api/reports.ts:11"], "test": [], "ucs": ["UC-70b"]}, "BR-439": {"text": "A search by name, or by name or email, ignores letter case and Vietnamese diacritics, so “chu toa” finds “Chủ Toạ” and “d” finds “đ”. Every other character, including % and _, is matched as typed. This applies to the Meeting list search and to the list of eligible Meeting Approvers.", "applies": ["UC-17", "UC-18"], "rationale": "SCRUM-148, SCRUM-150 – E2E run 09/11/2026", "enforced": "Meeting Management", "code": [], "test": [], "ucs": ["UC-17", "UC-18"]}, "BR-440": {"text": "Only a signed-in user whose role holds the User administration permission may view the audit log. The audit log is read-only: no function of the application changes or deletes an audit entry.", "applies": ["UC-13"], "rationale": "SCRUM-16 — chỉ quản trị viên; chỉ ghi thêm", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/TrustCabinetDbContext.cs:85", "backend/TrustCabinet.Web/Endpoints/AuditLogEndpoints.cs:6", "backend/TrustCabinet.Domain/Audit/IAuditLogQueryService.cs:39"], "test": ["tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:19", "tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:92"], "ucs": ["UC-13"]}, "BR-441": {"text": "Each audit entry shows when it happened, who acted, the event, the object acted on, the IP address of the request and the details recorded with it. The actor is a user account, a Guest — shown with the invited name and email — or the system when no person acted.", "applies": ["UC-13"], "rationale": "SCRUM-16, SCRUM-123 — dòng do Khách tạo không hiện là hệ thống", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:13", "backend/TrustCabinet.Domain/Audit/IAuditLogQueryService.cs:5", "frontend/src/types/auditLog.ts:3", "frontend/src/features/audit/AuditEntrySheet.tsx:7"], "test": ["tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:115"], "ucs": ["UC-13"]}, "BR-442": {"text": "Audit entries are listed newest first. They may be narrowed by a period, by actor (one user account, Guests, or the system), by event type and by a keyword matched against the object and the recorded details. A period is valid when its start is not after its end.", "applies": ["UC-13"], "rationale": "SCRUM-16 — lọc nhật ký", "enforced": "Audit", "code": ["backend/TrustCabinet.Web/Endpoints/AuditLogEndpoints.cs:64", "backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:13", "backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:70", "backend/TrustCabinet.Domain/Audit/IAuditLogQueryService.cs:9"], "test": [], "ucs": ["UC-13"]}, "BR-443": {"text": "The audit log shows only what was recorded with each entry. It does not show the Meeting, document or minutes an entry is about, and viewing it gives the System Admin no access to them.", "applies": ["UC-13"], "rationale": "SCRUM-16 — Quản trị không có quyền đọc thêm cuộc họp", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:14", "backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:71", "frontend/src/types/auditLog.ts:22", "frontend/src/features/audit/AuditLogPage.tsx:85"], "test": ["tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:134", "tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:200"], "ucs": ["UC-13"]}, "BR-444": {"text": "Each successful sign-in, and each failed sign-in to an existing account, is recorded in the audit log with the sign-in method and, for a failure, the reason. A failed sign-in names the account it was attempted on as the actor. A password or a token is never recorded. A Guest's successful verification is recorded as well.", "applies": ["UC-01", "UC-02", "UC-04"], "rationale": "SCRUM-16 — ghi lại đăng nhập", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:66", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:253", "backend/TrustCabinet.Infrastructure/GuestAccess/GuestAccessService.cs:147", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:190", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:196", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:203"], "test": ["tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:74", "tests/TrustCabinet.Web.Tests/Authentication/AuthenticationServiceTests.cs:32", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:63", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:171", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:206", "tests/TrustCabinet.Web.Tests/GuestAccess/GuestCallRoomTests.cs:57", "tests/TrustCabinet.Web.Tests/GuestAccess/GuestVerificationTests.cs:207"], "ucs": ["UC-01", "UC-02", "UC-04"]}, "BR-445": {"text": "Each entry of a Meeting's lifecycle history — its creation, each change of its status including a cancellation made by the system, and each rescheduling or change of organizer — is also recorded in the audit log with who made it, the status before and after and the reason given.", "applies": ["UC-14", "UC-15", "UC-18", "UC-19", "UC-20", "UC-21", "UC-22", "UC-75"], "rationale": "SCRUM-16 — ghi lại chuyển trạng thái cuộc họp", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/TrustCabinetDbContext.cs:64", "backend/TrustCabinet.Infrastructure/TrustCabinetDbContext.cs:101", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:221"], "test": ["tests/TrustCabinet.Web.Tests/Audit/AuditLogEndpointTests.cs:19", "tests/TrustCabinet.Web.Tests/Participants/ChairHandoverEndpointTests.cs:93"], "ucs": ["UC-14", "UC-15", "UC-18", "UC-19", "UC-20", "UC-21", "UC-22", "UC-75"]}, "BR-446": {"text": "Each issue of minutes, including a correction, is recorded in the audit log with who issued it.", "applies": ["UC-64"], "rationale": "SCRUM-16 — ghi lại ban hành biên bản", "enforced": "Audit", "code": ["backend/TrustCabinet.Infrastructure/Summaries/MinutesService.cs:216", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:206"], "test": ["tests/TrustCabinet.Web.Tests/Summaries/MinutesApprovalEndpointTests.cs:284"], "ucs": ["UC-64"]}}, "msgs": {"MSG01": {"type": "Redirect to sign-in", "context": "Common – Session Renewal", "content": "Your session has expired. Please sign in again.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:32", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:136", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:288", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:61", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:5", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:20"], "test": ["tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:161", "tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:277"], "ucs": ["UC-01"]}, "MSG02": {"type": "Redirect to sign-in", "context": "Common – Session Renewal", "content": "Your account is currently unavailable. Please contact your administrator for assistance.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:27", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:33", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:77", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:126", "backend/ <script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = id => parseInt(id.replace(/\D/g, ''), 10);

const ucStatus = uc => !uc.cov.br ? '' : uc.cov.test === uc.cov.br ? 't' : uc.cov.code ? 'c' : 'n';

function link(text) {
  return esc(text).replace(/\b(BR-\d{1,3}|MSG\d{2,3}|UC-\d{2,3}[a-z]?)\b/g, m => {
    const id = normId(m), kind = id.startsWith('BR') ? 'br' : id.startsWith('MSG') ? 'msg' : 'uc';

    const cls = kind !== 'uc' && r && !hasCode(r) ? ' nocode' : '';

  });
}
const vsc = ref => { const [p, l] = ref.split(/:(?=\d+$)/); return `vscode://file/${D.root}/${p}:${l}`; };
function refs(list, cls) {
  if (!list.length) return '<div class="empty">chưa có</div>';
  return `<div class="refs">${list.map(r => `<a class="${cls}" href="${vsc(r)}" title="Mở trong VS Code">${esc(r)}</a>`).join('')}</div>`;
}

/* ---------- inspector ---------- */
function inspect(id) {
  state.sel = id; const el = $('#insp');
  if (!id) { el.innerHTML = '<div class="empty">Bấm vào chip <span class="chip br">BR-nn</span> hoặc <span class="chip msg">MSGnn</span> trong luồng để xem luật, thông báo và code liên quan.</div>'; return; }

  for (const m of uc.msg) { const r = D.msgs[m]; if (!r) continue;
    r.code.forEach(x => (files[x.split(':')[0]] ||= {code: [], test: [], ids: new Set()}, files[x.split(':')[0]].code.push(x), files[x.split(':')[0]].ids.add(m)));
    r.test.forEach(x => (files[x.split(':')[0]] ||= {code: [], test: [], ids: new Set()}, files[x.split(':')[0]].test.push(x), files[x.split(':')[0]].ids.add(m))); }
  const fileRows = Object.entries(files).sort((a, b) => b[1].ids.size - a[1].ids.size).map(([p, v]) => {
    const first = (v.code[0] || v.test[0]);
    return `<tr><td class="refs"><a class="${v.test.length && !v.code.length ? 't' : 'c'}" href="${vsc(first)}">${esc(p)}</a></td><td>${[...v.ids].map(i => link(i)).join(' ')}</td></tr>`;
  }).join('');
  return `<div class="sub">${esc(f ? f.id + ' · ' + f.name : '')}${uc.parent ? ` · thuộc ${link(uc.parent)}` : ''}</div>
  <h2><span class="chip uc">${id}</span> ${esc(uc.name)}</h2>
  <div class="facts"><div>Tác nhân chính: <b>${esc(uc.actors || '—')}</b></div><div>Phụ: <b>${esc(uc.secondary || '—')}</b></div>
   <div>Report 3 dòng <b>${uc.line}</b></div></div>
  <div class="cov"><span>${c.br} BR</span><div class="bar"><i class="a" style="width:${pt}%"></i><i class="b" style="width:${pc - pt}%"></i></div>
   <span><span class="badge t">${c.test} test</span> <span class="badge c">${c.code} code</span></span></div>
  <div class="box">${link(uc.desc || '')}</div>
  ${uc.pre && uc.pre.length ? `<h3>Điều kiện tiên quyết</h3><div class="box"><ul class="bul">${uc.pre.map(x => `<li>${link(x)}</li>`).join('')}</ul></div>` : ''}
  ${flows(uc.normal, 'nf', 'Luồng chính')}${flows(uc.alts, 'af', 'Luồng thay thế')}${flows(uc.exs, 'ex', 'Luồng ngoại lệ')}
  ${uc.post && uc.post.length ? `<h3>Kết quả sau cùng</h3><div class="box"><ul class="bul">${uc.post.map(x => `<li>${link(x)}</li>`).join('')}</ul></div>` : ''}
  ${Object.entries(uc.extra || {}).map(([k, v]) => `<h3>${esc(k)}</h3><div class="box">${link(v)}</div>`).join('')}
  <h3>Luật nghiệp vụ (${uc.br.length})</h3>
  <table><tr><th>BR</th><th>Luật</th><th>Dấu vết</th></tr>${uc.br.map(b => { const r = D.rules[b];
    return `<tr class="row" data-k="${b}"><td>${link(b)}</td><td>${r ? esc(r.text) : '<i>không có trong Phụ lục V.1</i>'}</td>
    <td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`; }).join('')}</table>
  <h3>Thông báo (${uc.msg.length})</h3>
  <table><tr><th>MSG</th><th>Nội dung</th><th>Dấu vết</th></tr>${uc.msg.map(m => { const r = D.msgs[m];
    return `<tr class="row" data-k="${m}"><td>${link(m)}</td><td>${r ? esc(r.content) : '<i>không có trong Phụ lục V.2</i>'}</td>
    <td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`; }).join('')}</table>
  <h3>File code/test đụng tới UC này (${Object.keys(files).length})</h3>
  ${fileRows ? `<table><tr><th>File</th><th>Trích dẫn</th></tr>${fileRows}</table>` : '<div class="box">Chưa file nào trích BR/MSG của UC này.</div>'}`;
}

function viewHome() {
  const rows = D.features.map(f => {
    const us = f.ucs.map(u => D.ucs[u]);
    const br = new Set(us.flatMap(u => u.br)); const t = [...br].filter(b => hasTest(D.rules[b])).length, c = [...br].filter(b => hasCode(D.rules[b])).length;
    return `<tr><td><b>${f.id}</b></td><td>${esc(f.name)}</td><td>${us.map(u => `<a class="chip uc" href="#uc/${u.id}" title="${esc(u.name)}">${u.id}</a>`).join(' ')}</td><td>${br.size}</td><td>${c}</td><td>${t}</td></tr>`;
  }).join('');
  const all = Object.values(D.rules), un = all.filter(r => !hasCode(r) && !hasTest(r)).length;
  return `<h2>Bản đồ nghiệp vụ</h2>
  <p class="sub">${Object.keys(D.ucs).length} use case · ${all.length} luật nghiệp vụ · ${Object.keys(D.msgs).length} thông báo. ${un} luật chưa có code/test nào trích dẫn.</p>
  <p class="sub">Ảnh chụp ngày ${esc(D.generated || '?')}: cột “có code/có test” đọc từ mã nguồn lúc sinh, sẽ lệch khi có PR code merge sau đó — chạy lại <code>python scripts/sync_reports.py</code> để làm mới.</p>
  <div class="box"><b>Cách đọc.</b> Chọn một use case bên trái, đọc luồng chính trước, rồi rẽ nhánh. Bấm chip <span class="chip br">BR-nn</span> / <span class="chip msg">MSGnn</span>
  để xem luật, thông báo và dòng code/test cạnh bên. Chấm xanh = mọi BR của UC có test; vàng = có code; đỏ = chưa có dấu vết. Muốn đổi nghiệp vụ: tìm BR, xem file code, sửa cả hai.</div>
  <h3>Theo tính năng</h3><table><tr><th>FE</th><th>Tên</th><th>Use case</th><th>BR</th><th>có code</th><th>có test</th></tr>${rows}</table>`;
}

function viewBR() {
  const q = state.q;
  let list = Object.entries(D.rules).filter(([id, r]) => matches((id + ' ' + r.text + ' ' + r.ucs.join(' ')).toLowerCase(), q));
  if (state.cov !== 'all') list = list.filter(([, r]) => status(r) === state.cov);
  list.sort((a, b) => num(a[0]) - num(b[0]));
  const btn = (k, t) => `<button data-cov="${k}" class="${state.cov === k ? 'on' : ''}">${t}</button>`;
  return `<h2>Luật nghiệp vụ</h2><div class="filters">${btn('all', 'Tất cả')}${btn('t', 'Có test')}${btn('c', 'Chỉ có code')}${btn('n', 'Chưa có dấu vết')}</div>
  <div class="sub">${list.length} luật</div>
  <table><tr><th>BR</th><th>Luật</th><th>UC</th><th>Dấu vết</th></tr>${list.map(([id, r]) => `<tr class="row" data-k="${id}"><td>${link(id)}</td><td>${esc(r.text)}</td><td>${r.ucs.map(u => link(u)).join(' ')}</td><td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`).join('')}</table>`;
}
function viewMSG() {
  const q = state.q;
  const list = Object.entries(D.msgs).filter(([id, r]) => matches((id + ' ' + r.content + ' ' + r.context).toLowerCase(), q)).sort((a, b) => num(a[0]) - num(b[0]));
  return `<h2>Thông báo hệ thống</h2><div class="sub">${list.length} thông báo</div>
  <table><tr><th>MSG</th><th>Loại</th><th>Nội dung</th><th>UC</th><th>Dấu vết</th></tr>${list.map(([id, r]) => `<tr class="row" data-k="${id}"><td>${link(id)}</td><td>${esc(r.type)}</td><td>${esc(r.content)}</td><td>${r.ucs.map(u => link(u)).join(' ')}</td><td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`).join('')}</table>`;
}

/* ---------- routing ---------- */
function render() {
  const [tab, id] = (location.hash.slice(1) || 'home').split('/');
  state.tab = tab === 'br' || tab === 'msg' ? tab : tab === 'uc' ? 'uc' : 'home'; state.id = id || null;
  $('#tabs').innerHTML = [['home', 'Tổng quan'], ['br', 'Luật (BR)'], ['msg', 'Thông báo (MSG)']]
    .map(([k, t]) => `<a href="#${k}" class="${state.tab === k || (k === 'home' && state.tab === 'uc') ? 'on' : ''}">${t}</a>`).join('');
  $('#main').innerHTML = state.tab === 'uc' ? viewUC(id) : state.tab === 'br' ? viewBR() : state.tab === 'msg' ? viewMSG() : viewHome();
  renderSide();
  if (state.tab === 'br' && id && D.rules[id]) inspect(id); else inspect(state.sel && document.querySelector(`.chip[data-k="${state.sel}"]`) ? state.sel : null);
  $('#main').scrollTop = 0;
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); const row = e.target.closest('tr.row'); const fb = e.target.closest('[data-cov]');
  if (fb) { state.cov = fb.dataset.cov; $('#main').innerHTML = viewBR(); return; }
  if (chip) { const k = chip.dataset.k; if (!k) return;
    if (k.startsWith('UC')) { location.hash = '#uc/' + k; return; } e.preventDefault(); inspect(k); return; }
  if (row) inspect(row.dataset.k);
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); const keep = state.sel; render(); if (keep) inspect(keep); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
