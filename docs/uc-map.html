onse. Please try again.” The use case ends unsuccessfully."}]}, {"id": "EX-4", "title": "Different response after answering", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the invitee has already answered and submits a different response. (BR-106)"}, {"n": 2, "text": "The recorded response and response time remain unchanged. The system displays MSG285 – “You have already answered this invitation. Your answer cannot be changed.” The use case ends unsuccessfully."}]}, {"id": "EX-5", "title": "Chair cannot respond", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is the Chair of the Meeting. (BR-105)"}, {"n": 2, "text": "No response is recorded; the Chair's response is not displayed, and an answer given earlier as another role is not reset. (BR-115) The system displays MSG286 – “The Chair runs the Meeting, so no attendance confirmation is needed.” The use case ends unsuccessfully."}]}], "br": ["BR-96", "BR-104", "BR-105", "BR-106", "BR-115", "BR-148", "BR-156", "BR-321"], "msg": ["MSG105", "MSG106", "MSG107", "MSG108", "MSG154", "MSG285", "MSG286"], "cov": {"br": 8, "code": 1, "test": 0}}, "UC-30": {"id": "UC-30", "name": "View Participant Response Status", "feature": "FE-06", "line": 1546, "extra": {}, "parent": null, "actors": "Secretary, Chair, Participant, Guest", "secondary": "None", "desc": "Allows authorized internal participants and verified Guests to view the current invitation responses of the Meeting, shown as a label beside each invitee's name.", "pre": ["PRE-1: The Meeting is Published or a later status that remains readable. A Guest can read it only while the Meeting is Published or InProgress. (BR-181)", "PRE-2: The actor can currently view the Meeting."], "post": ["POST-1: The responses of current invitees are displayed as labels beside their names. The Chair and an invitee who has not answered have no label. No totals are shown.", "POST-2: No data is changed."], "normal": [{"id": "", "title": "View Participant Response Status", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Participants tab of an accessible Meeting."}, {"n": 2, "text": "The system checks that the actor may view the Meeting. (BR-181)"}, {"n": 3, "text": "The system displays each current invitee’s name and email (a Guest actor sees names only, apart from their own email) with a label for the response given, Accepted or Declined; an invitee who has not answered and the Chair have no label. No totals by status are shown."}, {"n": 4, "text": "No data is changed."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Responses are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor lacks current Meeting access."}, {"n": 2, "text": "The system does not disclose response identities or responses and returns the generic not-found result required for inaccessible Meeting data. The use case ends unsuccessfully. (BR-121)"}]}, {"id": "EX-2", "title": "Responses cannot be retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot retrieve the current response data."}, {"n": 2, "text": "No partial response list is presented as complete. The system displays MSG95 – “Unable to load meeting participants. Please try again.”"}]}], "br": ["BR-121", "BR-181"], "msg": ["MSG95"], "cov": {"br": 2, "code": 1, "test": 1}}, "UC-31": {"id": "UC-31", "name": "Record Attendance", "feature": "FE-06", "line": 1557, "extra": {}, "parent": null, "actors": "Secretary", "secondary": "None", "desc": "Allows the assigned Secretary to record or revise attendance for one or more selected current internal participants or Guests while the Meeting is InProgress.", "pre": ["PRE-1: The actor is an active current assigned Secretary.", "PRE-2: The Meeting is InProgress. (BR-170)"], "post": ["POST-1: Submitted people have Present or Absent saved with the recording Secretary and save time.", "POST-2: Unsubmitted people retain their saved value or remain unmarked; Invitation Responses are unchanged.", "POST-3: All submitted changes succeed together or none are saved. Attendance completeness never gates End Meeting. (BR-116, BR-171, BR-172, BR-178)"], "normal": [{"id": "", "title": "Record Attendance", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens Attendance for an InProgress Meeting: the Attendance column of the participant table on the Meeting detail page, or the Attendance panel in the online meeting room."}, {"n": 2, "text": "The system displays current internal participants and Guests with saved attendance; never-recorded people remain unmarked. Each person’s attendance carries its own version. No Present/Absent totals are shown. (BR-172)"}, {"n": 3, "text": "The Secretary selects Present or Absent for one or more people and submits only those entries."}, {"n": 4, "text": "The system rechecks current authority, Meeting status, submitted people’s current membership, that each submitted person’s attendance version is still current, and each submitted value. Omitted people are not treated as validation errors. (BR-170–BR-172)"}, {"n": 5, "text": "The system saves all submitted changes together, records the Secretary and save time, preserves every omitted person’s saved or unmarked value, and displays MSG147 – “Meeting attendance saved successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Revise saved attendance", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Secretary changes the saved attendance for one or more current people."}, {"n": 2, "text": "The system applies the same validation and atomic-save rules at Steps 4–5. (BR-172)"}]}, {"id": "AF-2", "title": "Record the full roster", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Secretary selects every current internal participant and Guest."}, {"n": 2, "text": "The system applies the same validation and atomic-save rules at Steps 4–5. A full-roster submission is optional; it is not required to save attendance or end the Meeting. (BR-172)"}]}], "exs": [{"id": "EX-1", "title": "Submitted attendance value is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, a submitted value is not Present or Absent."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG148 – “Select Present or Absent for each submitted participant or Guest.” The Secretary corrects the value and resumes at Step 3."}]}, {"id": "EX-2", "title": "Meeting is no longer InProgress", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting changed from InProgress before the submission was saved."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG149 – “Attendance can only be recorded while the meeting is in progress.” The use case ends unsuccessfully."}]}, {"id": "EX-3", "title": "Secretary is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the active current assigned Secretary."}, {"n": 2, "text": "No submitted change is saved. The system denies the operation under current authorization; existing attendance remains unchanged. The use case ends unsuccessfully."}]}, {"id": "EX-4", "title": "A submitted person is no longer current or their attendance has changed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, one or more submitted internal participants were removed, the Guest invitation was revoked, or another Secretary changed the person’s attendance after the roster was displayed."}, {"n": 2, "text": "No submitted change is saved and no unsaved selection is kept. The system displays MSG151 – “The participant or attendance data has changed. Please reload and review before saving.” The system reloads the roster and the Secretary selects again, resuming at Step 2. Unrelated new roster entries, and changes to a person’s role or invitation response, do not invalidate the submission. (BR-172)"}]}, {"id": "EX-5", "title": "Attendance cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot persist all submitted changes."}, {"n": 2, "text": "Attendance is never saved in part. If the connection was lost while saving, the outcome cannot be confirmed."}, {"n": 3, "text": "The system displays MSG150 – “Unable to confirm the attendance save result. Please reload the data before trying again.” The Secretary reloads attendance to see what was saved. The use case ends unsuccessfully."}]}, {"id": "EX-6", "title": "Attendance cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the attendance of the Meeting."}, {"n": 2, "text": "No attendance is changed. The system displays MSG289 – “Unable to load attendance data.” The failed load is not presented as an empty or unmarked roster. The use case ends unsuccessfully."}]}], "br": ["BR-116", "BR-170", "BR-171", "BR-172", "BR-178"], "msg": ["MSG147", "MSG148", "MSG149", "MSG150", "MSG151", "MSG289"], "cov": {"br": 5, "code": 0, "test": 0}}, "UC-73": {"id": "UC-73", "name": "Hand Over Chair to Another Participant", "feature": "FE-06", "line": 1570, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the current Chair to give the Chair role to another internal participant in one step, for example before leaving the Meeting. The system changes both roles together: the selected participant becomes Chair and the former Chair becomes Member. The Chair does not need to change his or her own role separately.", "pre": ["PRE-1: The actor is signed in and is the current Chair of the Meeting.", "PRE-2: The Meeting is Published or InProgress. (BR-126)"], "post": ["POST-1: The selected participant is the Chair and the former Chair is a Member, saved together. (BR-169)", "POST-2: The Meeting still has exactly one Chair and its required Secretary. System Roles, Invitation Responses, attendance and recorded ballots remain unchanged. (BR-126, BR-169)", "POST-3: The new Chair is notified in the application. The former Chair, who made the change, is not notified in the application but still receives the email. (BR-92, BR-322)", "POST-4: A role change takes effect in the online room without the people rejoining, when the room is open; it is not blocked while the Meeting is in progress. (BR-329)"], "normal": [{"id": "", "title": "Hand Over Chair to Another Participant", "notes": [], "steps": [{"n": 1, "text": "The Chair opens the Meeting participant list and selects Change role on the row of the participant who will receive the Chair role."}, {"n": 2, "text": "The system displays the Meeting Roles as a list of options, each with a short description of what the role allows. The Chair option appears only for a current active internal participant who is neither a Guest nor the current Secretary. (BR-295)"}, {"n": 3, "text": "The Chair selects the Chair option and selects Hand over Chair. The system asks once more, stating that the Chair will become a Member and no longer run the Meeting, and the Chair confirms."}, {"n": 4, "text": "The system rechecks that the actor is still the current Chair, the Meeting is Published or InProgress, and the selected person can still receive the Chair role. (BR-126, BR-295)"}, {"n": 5, "text": "The system changes the selected participant to Chair and the former Chair to Member in the same save. (BR-169)"}, {"n": 6, "text": "The system notifies the new Chair in the application. The former Chair, who made the change, is not notified in the application but still receives the email. A notification failure does not undo the saved change. (BR-92, BR-322)"}, {"n": 7, "text": "The system displays MSG257 – \"Chair role handed over successfully.\" The former Chair stays in the Meeting as a Member and may leave the meeting room. (BR-296)"}]}], "alts": [{"id": "AF-1", "title": "No participant can receive the Chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting has no current active internal participant other than the Chair and the Secretary."}, {"n": 2, "text": "The system offers the Chair option on no participant's row and displays no message. No role changes. MSG258 is returned by the API but is not displayed on the screen."}, {"n": 3, "text": "The use case ends."}]}, {"id": "AF-2", "title": "Chair does not confirm the hand-over", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair chooses Cancel in the confirmation."}, {"n": 2, "text": "No role changes. The role options stay open and the flow resumes at Step 3."}]}], "exs": [{"id": "EX-1", "title": "Selected participant can no longer receive the Chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected person was removed from the Meeting, became the Secretary or is no longer an active internal user. (BR-295)"}, {"n": 2, "text": "No role is changed. The system displays MSG259 – \"The selected participant can no longer receive the Chair role. Select another participant.\""}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-2", "title": "Hand-over is no longer permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Chair, or the Meeting is no longer Published or InProgress."}, {"n": 2, "text": "No role is changed. The system displays MSG260 – \"You can no longer hand over the Chair role for this meeting.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Hand-over cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot save both role changes."}, {"n": 2, "text": "Both people keep their previous roles; no notification is sent. The system displays MSG102 – \"Unable to update the meeting role. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "The participant list has changed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the participant list changed after it was opened."}, {"n": 2, "text": "No role is changed. The system displays MSG275 – “The participant list has changed. Please reload and try again.”"}, {"n": 3, "text": "The Chair reloads and resumes at Step 2."}]}], "br": ["BR-92", "BR-126", "BR-169", "BR-295", "BR-296", "BR-322", "BR-329"], "msg": ["MSG102", "MSG257", "MSG258", "MSG259", "MSG260", "MSG275"], "cov": {"br": 7, "code": 0, "test": 0}}, "UC-32": {"id": "UC-32", "name": "View Meeting Documents", "feature": "FE-07", "line": 1585, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-32a": {"id": "UC-32a", "name": "View Meeting Documents", "feature": "FE-07", "line": 1587, "extra": {}, "parent": "UC-32", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to browse the documents currently attached to one Meeting. Guest document access follows Participant rules. (BR-181, BR-205)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected Meeting exists and the user can currently view the Meeting. (BR-181, BR-275, BR-153, BR-155, BR-157)"], "post": ["POST-1: Only currently attached documents available to the user are displayed.", "POST-2: Meeting documents, personal libraries and Meeting status remain unchanged."], "normal": [{"id": "", "title": "View Meeting Documents", "notes": [], "steps": [{"n": 1, "text": "The user opens the Documents tab of the selected Meeting."}, {"n": 2, "text": "The system checks the user's current permission to view the Meeting, including the current invitation for a Guest. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. A Guest with a verified, current invitation may read the documents while the Meeting is Published or InProgress (UC-04); once the Meeting has ended, the Guest can no longer open them. (BR-181, BR-275)"}, {"n": 3, "text": "The system displays the Meeting documents grouped by Agenda Item, in agenda order, with their names, file types, the people who added them and comment counts. A document linked to several Agenda Items appears under each of them; a document linked to no Agenda Item and to no Vote appears as a general Meeting document, and a document linked to a Vote is listed in the Vote grouping only. Removed documents are excluded. Agenda Items with no documents are listed as well, so a document can still be attached to them (UC-33b). The list refreshes by itself when the system announces that the Meeting's document list has changed. After the Meeting ends, documents and comments are read-only. (BR-211, BR-277, BR-280, BR-282)"}, {"n": 4, "text": "The user reviews the displayed groups or empty result, and may switch to another grouping or finish viewing. Selecting a document opens UC-32c."}]}], "alts": [{"id": "AF-1", "title": "View by Vote or general documents", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses to view the documents attached to Votes, or the general Meeting documents. The Vote grouping lists, in the order they were created, the Votes the user can see that have documents; a Draft Vote is shown only to the current Chair and Secretary. (BR-253)"}, {"n": 2, "text": "The system displays the documents attached to each Vote, each marked Read once the user has confirmed reading it, or Not read while the user can still confirm it as a voter of an Open Vote in an InProgress Meeting (UC-74); or it displays the general documents, which are the documents linked to no Agenda Item and to no Vote, because a document of a Vote is listed in the Vote grouping only. (BR-280, BR-291)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-2", "title": "No documents to display", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting has no currently attached documents, or the grouping chosen in AF-1 has no documents."}, {"n": 2, "text": "The system displays an empty result and explains that no documents are available for the current grouping."}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-3", "title": "View documents from the online meeting room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the user is in the online meeting room of an InProgress Meeting and opens the room's Documents panel instead of the Documents tab."}, {"n": 2, "text": "The system applies the same access check and displays the same documents, starting with the current Agenda Item: the server marks which Item is current and the panel places it first, leaving the order the server returns unchanged. The Votes that have documents follow the Agenda Items. Adding, linking and removing documents are not offered in the panel. (BR-275, BR-316)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow; selecting a document opens UC-32c without leaving the room. (BR-315)"}]}], "exs": [{"id": "EX-1", "title": "Meeting documents are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the user can no longer view the Meeting, including removal of a participant or revocation or expiry of a Guest invitation."}, {"n": 2, "text": "No document names or contents are disclosed. No Meeting information is changed. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Document list cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot retrieve the available document list."}, {"n": 2, "text": "No Meeting information is changed. The system displays MSG157 – “Unable to load the document list. Please try again.”; the failed load is not presented as an empty list."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-153", "BR-155", "BR-157", "BR-181", "BR-205", "BR-211", "BR-253", "BR-275", "BR-277", "BR-280", "BR-282", "BR-291", "BR-315", "BR-316"], "msg": ["MSG156", "MSG157"], "cov": {"br": 14, "code": 12, "test": 7}}, "UC-32c": {"id": "UC-32c", "name": "Preview Meeting Document", "feature": "FE-07", "line": 1598, "extra": {}, "parent": "UC-32", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to read a Meeting document online and download the same file when permitted. Comments are covered separately in UC-35. A Guest with a verified, current invitation may read and download documents while the Meeting is Published or InProgress (UC-04), but not after the Meeting has ended. (BR-181, BR-188)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected document is currently attached to the Meeting and the user can currently view the Meeting. (BR-181, BR-211, BR-275, BR-153, BR-155, BR-157)"], "post": ["POST-1: The selected document is displayed for online reading; in AF-1, the user also receives the permitted download.", "POST-2: The file content, its Meeting association and its comments remain unchanged.", "POST-3: When the user reaches the last page of a Vote document in the viewer, the viewer enables read confirmation in UC-74; reaching the last page is not stored on its own. (BR-290)"], "normal": [{"id": "", "title": "Preview Meeting Document", "notes": [], "steps": [{"n": 1, "text": "The user selects a document in the Meeting Documents tab, the documents of an Agenda Item, or the Documents panel of the online meeting room."}, {"n": 2, "text": "The system checks current permission to view the Meeting and that the document is still attached to this Meeting. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. (BR-181, BR-211, BR-275)"}, {"n": 3, "text": "The system opens the document viewer and displays the file name, its content and the Meeting sensitivity, which the screen takes from the Meeting details. A viewer opened from the online meeting room opens separately, so the user stays in the room. For a Secret Meeting, the system records the view in the audit log before it sends the file; if that entry cannot be written, no content is sent and EX-2 applies. (BR-315, BR-318)"}, {"n": 4, "text": "The user reads the document. When the user scrolls to the last page of a Vote document opened from that Vote, the viewer offers read confirmation through UC-74. (BR-290) After the Meeting ends, the document and comments are read-only. Downloading remains available when the Meeting is not Secret. (BR-188, BR-282) Known risk: for a Secret Meeting only Download is blocked. Viewing still delivers the original file to the browser, so a technically skilled user can save it; each view is recorded in the audit log. (BR-188, BR-318)"}]}], "alts": [{"id": "AF-1", "title": "Download the document", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses Download for a Meeting that is not Secret. For a Guest the Download button is hidden when the Meeting is Secret, and the server refuses the request as well."}, {"n": 2, "text": "The system rechecks current access, that the document remains attached and the current Meeting sensitivity. (BR-181, BR-211, BR-188, BR-275)"}, {"n": 3, "text": "The system provides the same uploaded file to the user. (BR-183, BR-216, BR-318)"}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Document is no longer accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, or during the access check in AF-1, the document was removed, the user can no longer view the Meeting, or the document is linked only to a Draft Vote and to no Agenda Item and the actor is not the current Chair or Secretary. (BR-275)"}, {"n": 2, "text": "No further document content or download is provided. The file and Meeting remain unchanged. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Preview cannot be displayed", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot display the selected file."}, {"n": 2, "text": "The document remains attached and its content is unchanged. The system displays MSG158 – “Unable to display the document. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Download is prohibited", "notes": [], "steps": [{"n": 1, "text": "During Step 2 of AF-1, the Meeting is Secret, including when its sensitivity changed after the viewer opened."}, {"n": 2, "text": "No download is provided. The document remains unchanged. The system displays MSG159 – “Secret Meeting documents can only be viewed online and cannot be downloaded.” (BR-188)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow for online reading."}]}, {"id": "EX-4", "title": "Download cannot be provided", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-1, the system cannot provide the file."}, {"n": 2, "text": "The file and its Meeting association remain unchanged. The system displays MSG160 – “Unable to download the document. Please try again.”"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "EX-5", "title": "Stored file is missing", "notes": [], "steps": [{"n": 1, "text": "At Step 3, or at Step 3 of AF-1, the document is still attached to the Meeting but its file is no longer in storage."}, {"n": 2, "text": "Nothing is changed. The system displays MSG382 – “The file of this document is no longer in storage and cannot be opened. Please contact the administrator.” and does not offer to try again."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "The browser cannot display the file", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the file was received but the viewer cannot render it, because it is damaged or in a format the viewer does not support."}, {"n": 2, "text": "The document remains unchanged. The system displays MSG383 – “The browser cannot display this file. It may be damaged or in an unsupported format.” and does not offer to try again. Download remains available when the Meeting is not Secret."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-153", "BR-155", "BR-157", "BR-181", "BR-183", "BR-188", "BR-211", "BR-216", "BR-275", "BR-282", "BR-290", "BR-315", "BR-318"], "msg": ["MSG156", "MSG158", "MSG159", "MSG160", "MSG382", "MSG383"], "cov": {"br": 13, "code": 12, "test": 7}}, "UC-33": {"id": "UC-33", "name": "Manage Meeting Documents", "feature": "FE-07", "line": 1609, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-33a": {"id": "UC-33a", "name": "Add Document to Meeting", "feature": "FE-07", "line": 1611, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to add one or more documents from their own personal library or computer to a Meeting in one submission; files from the computer are added one at a time. Linking documents to Agenda Items is handled separately in UC-33b. (BR-184, BR-209, BR-286)", "pre": ["PRE-1: The actor is signed in and is the current Chair or Secretary of the selected Meeting.", "PRE-2: The actor can currently view the Meeting. (BR-184, BR-195)", "PRE-3: The Meeting has not ended. (BR-185, BR-195)"], "post": ["POST-1: All submitted documents appear in the Meeting as general documents, with their names copied at addition and the actor and addition time recorded. (BR-197, BR-276, BR-286)", "POST-2: Selected personal-library documents stay unchanged. Files uploaded from the computer are also available in the uploader's personal library. (BR-194, BR-210)", "POST-3: A removed document added again is a new addition without its previous comments. (BR-212, BR-276, BR-284)", "POST-4: Each file uploaded from the computer is added as a whole or not at all, and a file that cannot be added does not stop the other files. Documents chosen from the personal library are added together or none are. Existing documents and Meeting status remain unchanged. (BR-286)"], "normal": [{"id": "", "title": "Add Documents from Personal Library", "notes": [], "steps": [{"n": 1, "text": "The Chair or Secretary opens Meeting Documents and chooses Add Documents."}, {"n": 2, "text": "The system offers selection from the actor's personal library or upload from the computer."}, {"n": 3, "text": "The actor selects one or more documents from their own library and submits them together."}, {"n": 4, "text": "The system checks the current Chair or Secretary, Meeting access and status, and ownership and availability of every selected document. It checks that none is already attached to this Meeting. (BR-184, BR-193, BR-195, BR-209)"}, {"n": 5, "text": "The system adds all selected documents to the Meeting under their current names and records who added them and when. Personal-library documents stay unchanged; readded documents do not recover old comments. If any addition fails, none of the submitted additions are saved. (BR-197, BR-276, BR-284, BR-286)"}, {"n": 6, "text": "The system refreshes the document list, shows the number added and displays MSG161 – “Documents added to the Meeting successfully.”."}]}], "alts": [{"id": "AF-1", "title": "Upload files from the computer", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor selects one or more files from the computer. The browser queues them and sends them one at a time, each as its own submission. The 10-file and 200 MB limits apply to the files chosen at once. (BR-286, BR-319)"}, {"n": 2, "text": "Before reading any file, the system performs the authority, Meeting access and status checks from Step 4 of the Main Flow. An actor who is not the current Chair or Secretary receives MSG162 whatever the files are. (BR-184, BR-195)"}, {"n": 3, "text": "The system checks that the submission has at most 10 files totalling at most 200 MB, and that every file is no larger than 50 MB and is a valid PDF or DOCX: its extension is .pdf or .docx and matches its actual content. It identifies any file that fails validation. (BR-187, BR-214, BR-215, BR-319)"}, {"n": 4, "text": "The system checks that the file fits within the 10 GB storage limit of the whole system. It then adds the file to the Meeting and the uploader's personal library together, recording for a PDF the number of pages the system counted. A newly created or recreated Meeting folder uses the Meeting title and planned start date in Vietnam time; an existing folder is reused. (BR-192, BR-194, BR-210, BR-226, BR-227, BR-228, BR-286, BR-333)"}, {"n": 5, "text": "If the file cannot be added, it is added to neither place and EX-5 applies; the other files in the queue continue. A file that fails the checks of Step 3 follows EX-3 instead. Otherwise, the flow resumes at Step 6 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the actor can still view the Meeting but is no longer its current Chair or Secretary."}, {"n": 2, "text": "None of the submitted documents are added. The system displays MSG162 – “You no longer have permission to add documents to this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Library selection is missing or unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, no document was selected, or any selected document is unavailable or does not belong to the actor."}, {"n": 2, "text": "None are added. The system identifies the unavailable selections within the actor's library and displays MSG249 – “Select one or more available documents from your personal library.”."}, {"n": 3, "text": "The actor revises the selection. The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-3", "title": "Uploaded file is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-1, no file was received, the request is not a valid file upload, or one or more files are empty, exceed 50 MB each, are not valid PDF/DOCX files, or carry a file name that cannot be used: the name is empty, longer than 255 characters, or contains control or invisible formatting characters. The extension must be .pdf or .docx and must match the file's content, and a PDF must open without a password and contain at least one page, which the system checks by reading its structure in a separate process. (BR-187, BR-214, BR-215)"}, {"n": 2, "text": "None of the submitted documents are added to the Meeting or personal library. The system identifies the invalid files and displays MSG164 – “Select valid PDF or DOCX files, each no larger than 50 MB.”."}, {"n": 3, "text": "The actor removes or replaces those files. The flow resumes at Step 1 of AF-1."}]}, {"id": "EX-4", "title": "Document is already attached", "notes": [], "steps": [{"n": 1, "text": "At Step 4, one or more selected library documents are already attached to this Meeting. Separate uploads with the same name or content remain different documents. (BR-193, BR-229)"}, {"n": 2, "text": "None of the submitted additions are saved. The system identifies the already attached documents and displays MSG165 – “One or more selected documents are already attached to the Meeting.”."}, {"n": 3, "text": "The actor revises the selection. The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-5", "title": "Addition cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 5 or Step 4 of AF-1, the system cannot complete one or more additions."}, {"n": 2, "text": "No document from this submission is added to the Meeting or newly added to the personal library. Existing documents remain unchanged. The system displays MSG166 – “Unable to add the documents. No documents were added. Please try again.”. (BR-194, BR-286)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the Meeting has ended, including while the actor was ere uploaded. Please contact an administrator.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-10", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the Meeting has been cancelled (BR-299), including while the actor was selecting or uploading files."}, {"n": 2, "text": "None of the submitted documents are added. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-187", "BR-192", "BR-193", "BR-194", "BR-195", "BR-197", "BR-209", "BR-210", "BR-212", "BR-214", "BR-215", "BR-226", "BR-227", "BR-228", "BR-229", "BR-276", "BR-284", "BR-286", "BR-299", "BR-319", "BR-333"], "msg": ["MSG161", "MSG162", "MSG164", "MSG165", "MSG166", "MSG172", "MSG174", "MSG249", "MSG288", "MSG346", "MSG349"], "cov": {"br": 23, "code": 22, "test": 6}}, "UC-33b": {"id": "UC-33b", "name": "Attach Documents to Agenda Item", "feature": "FE-07", "line": 1622, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to attach one or more documents to an Agenda Item of the Meeting before the Meeting ends. Documents may be chosen from the Meeting documents, uploaded from the computer or chosen from My Documents; documents not yet in the Meeting are added to it and attached in the same save. (BR-304) It is reached from the paperclip on the Agenda Item row of the Meeting Content tab, the same menu used for a Draft Vote (UC-76a).", "pre": ["PRE-1: The actor is signed in, can currently view the Meeting and is its current Chair or Secretary. (BR-184)", "PRE-2: The selected Agenda Item belongs to the Meeting. (BR-278)", "PRE-3: The Meeting has not ended. Pending, InProgress and Done Agenda Items are all eligible. (BR-185, BR-279)"], "post": ["POST-1: The selected documents are attached to the Agenda Item; their links to other Items remain unchanged. (BR-277) y."}, {"n": 2, "text": "Nothing is attached. The system displays MSG240 – “You no longer have permission to link documents in this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Document is no longer in the Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a selected document is no longer attached to this Meeting."}, {"n": 2, "text": "Nothing is attached. The system displays MSG170 – “This document is no longer attached to the Meeting. Refresh the document list.”"}, {"n": 3, "text": "The flow resumes at Step 3."}]}, {"id": "EX-3", "title": "Agenda Item is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Agenda Item no longer exists in this Meeting. (BR-278)"}, {"n": 2, "text": "Nothing is attached. The system displays MSG242 – “Select an available Agenda Item in this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Document is already attached", "notes": [], "steps": [{"n": 1, "text": "At Step 5, one or more selected documents are already attached to the Item, including by another user after selection."}, {"n": 2, "text": "Nothing is attached and no duplicate is created. The system displays MSG243 – “One or more selected documents are already attached to the Agenda Item.”"}, {"n": 3, "text": "The flow resumes at Step 4."}]}, {"id": "EX-5", "title": "Change cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot complete the change."}, {"n": 2, "text": "All links, the Meeting documents and their comments remain unchanged. The system displays MSG244 – “Unable to link the document. No links were changed. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 5, or the corresponding check in AF-1 or AF-2, the Meeting has ended. (BR-185)"}, {"n": 2, "text": "Nothing is added or attached. The system displays MSG247 – “Document links cannot be changed after the Meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "Meeting is unavailable", "notes": [], "steps": [{"n": 1, "text": "Before displaying or saving, the Meeting cannot be accessed."}, {"n": 2, "text": "No document or Item information is disclosed and nothing is attached. The system displays MSG174 – “This Meeting is not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-8", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 5, or the corresponding check in AF-1 or AF-2, the Meeting has been cancelled (BR-299)."}, {"n": 2, "text": "Nothing is added or attached. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-187", "BR-193", "BR-194", "BR-209", "BR-210", "BR-214", "BR-215", "BR-276", "BR-277", "BR-278", "BR-279", "BR-280", "BR-286", "BR-299", "BR-304", "BR-319", "BR-333"], "msg": ["MSG164", "MSG165", "MSG166", "MSG170", "MSG174", "MSG238", "MSG240", "MSG242", "MSG243", "MSG244", "MSG247", "MSG249", "MSG288", "MSG346", "MSG349"], "cov": {"br": 19, "code": 18, "test": 7}}, "UC-33c": {"id": "UC-33c", "name": "Remove Document from Meeting", "feature": "FE-07", "line": 1633, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to remove a Meeting document before the Meeting ends, regardless of Minutes existence or Agenda Item status. Removal affects every Agenda Item link in this Meeting. (BR-184, BR-185, BR-279, BR-281)", "pre": ["PRE-1: The actor is signed in and is the current Chair or Secretary of the Meeting. (BR-184)", "PRE-2: The selected document is currently attached to this Meeting.", "PRE-3: The actor can currently view the Meeting and the Meeting has not ended. (BR-184, BR-185)"], "post": ["POST-1: The document no longer appears in this Meeting's current document list o ized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Chair or Secretary. (BR-184)"}, {"n": 2, "text": "No document is removed and comments remain unchanged. The system displays MSG169 – “You no longer have permission to remove documents from this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Document is no longer attached", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected document is no longer currently attached to this Meeting."}, {"n": 2, "text": "No further removal or comment change is made. The system displays MSG170 – “This document is no longer attached to the Meeting. Refresh the document list.”"}, {"n": 3, "text": "The use case ends; the actor may refresh the list through UC-32a."}]}, {"id": "EX-4", "title": "Removal cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot complete the removal."}, {"n": 2, "text": "The document remains attached and its comments remain unchanged; no successful removal is recorded. The system displays MSG171 – “Unable to remove the document. It remains attached to the Meeting. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Meeting is unavailable", "notes": [], "steps": [{"n": 1, "text": "Before displaying or completing the removal, the selected Meeting cannot be accessed."}, {"n": 2, "text": "No document is removed and comments remain unchanged. The system displays MSG174 – “This Meeting is not accessible.” without disclosing whether the Meeting exists."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting has been cancelled (BR-299), including when it was cancelled after the confirmation was displayed."}, {"n": 2, "text": "The document remains attached and its comments remain unchanged. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-197", "BR-211", "BR-212", "BR-231", "BR-279", "BR-281", "BR-284", "BR-299"], "msg": ["MSG167", "MSG169", "MSG170", "MSG171", "MSG174", "MSG248", "MSG349"], "cov": {"br": 10, "code": 9, "test": 2}}, "UC-33d": {"id": "UC-33d", "name": "Detach Document from Agenda Item", "feature": "FE-07", "line": 1644, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to detach one document from an Agenda Item before the Meeting ends. The document stays in the Meeting; removing it from the Meeting is UC-33c.", "pre": ["PRE-1: The actor is signed in, can currently view the Meeting and is its current Chair or Secretary. (BR-184)", "PRE-2: The document is attached to the selected Agenda Item of the same Meeting. (BR-278)", "PRE-3: The Meeting has not ended. Pending, InProgress and Done Agenda Items are all eligible. (BR-185, BR-279)"], "post": ["POST-1: Only the selected link is removed; the document remains in the Meeting and any other Agenda Item links remain unchanged. With no links left, it is a general Meeting document. (BR-280)", "POST-2: The document, its comments and its other Agenda Item links remain unchanged."], "normal": [{"id": "", "title": "Detach Document from Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The actor selects a document attached to an Agenda Item, chooses Detach and confirms."}, {"n": 2, "text": "The system rechecks current Meeting access, the Chair or Secretary assignment, that the Meeting has not ended, that the document is still in the Meeting, that the Item belongs to the Meeting, and that the link still exists. (BR-184, BR-185, BR-277, BR-278, BR-279)"}, {"n": 3, "text": "The system removes only that link; the document stays in the Meeting with its other links unchanged, or becomes a general Meeting document when no links remain. (BR-280)"}, {"n": 4, "text": "The system refre vailable.”"}, {"n": 3, "text": "The user returns to the library root. The flow resumes at Step 4 of the Main Flow."}]}], "br": ["BR-204", "BR-219", "BR-242", "BR-251"], "msg": ["MSG175", "MSG176"], "cov": {"br": 4, "code": 2, "test": 0}}, "UC-34b": {"id": "UC-34b", "name": "View a Locked Account’s Personal Library", "feature": "FE-07", "line": 1666, "extra": {}, "parent": "UC-34", "actors": "System Admin", "secondary": "None", "desc": "Allows a System Admin to read, without changing anything, the folders and documents in the personal library of a locked account, for example to recover Meeting materials after the owner has left the organization. Every read is recorded in the audit log. The Admin does not see the files of Secret Meetings. (BR-242, BR-334, BR-335)", "pre": ["PRE-1: The System Admin is signed in and has the capability to manage users.", "PRE-2: The selected account exists and is locked. The library of an active account is private to its owner. (BR-242, BR-334)"], "post": ["POST-1: The System Admin has seen the folders and documents of the locked account’s library that BR-334 allows. Nothing in the library has changed. (BR-334)", "POST-2: Each read has an audit entry stating who read, whose library, which folder or document and when. (BR-335)"], "normal": [{"id": "", "title": "View a Locked Account’s Personal Library", "notes": [], "steps": [{"n": 1, "text": "The System Admin opens the user list. Each row displays an action button 'View personal library' [Xem kho tài liệu]. For an active account, the button remains visible but is disabled with a tooltip explaining that personal libraries of active accounts are private to their owners. The System Admin chooses View personal library on a locked account."}, {"n": 2, "text": "The system rechecks the System Admin’s capability and that the account is still locked, and that the selected folder, if any, is in that library and is not hidden by BR-334. (BR-334)"}, {"n": 3, "text": "The system records an audit entry for the read before showing anything. (BR-335)"}, {"n": 4, "text": "The system displays the folders and documents of the account’s library at the root, read-only: no upload, rename, move, delete, search or file-type filtering is offered. It leaves out the files of Secret Meetings and each such Meeting’s upload folder with its subfolders. If a navigated folder is deleted or belongs to a Secret meeting, the view automatically falls back to the library root of that locked account. (BR-334)"}, {"n": 5, "text": "The System Admin opens a folder. The system repeats Steps 2 and 3 for that read and displays the folder’s contents."}]}], "alts": [{"id": "AF-1", "title": "Read a document", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or 5, the System Admin chooses a document to preview or download."}, {"n": 2, "text": "The system repeats the checks of Step 2, opens the file, records an audit entry naming the document and only then returns the file read-only. (BR-334, BR-335)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Library is not available or account reactivated", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the account is no longer locked (or was reactivated while viewing), or the selected folder or document does not exist in that library or is hidden by BR-334."}, {"n": 2, "text": "Nothing is shown. The system displays MSG175 – “This personal-library item is not available.” and navigates back to the user list if the account was reactivated, or returns to the library root if a folder was deleted or hidden."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Library cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or 4, the system cannot record the audit entry or cannot load the library. (BR-335)"}, {"n": 2, "text": "Nothing is shown. The system displays MSG176 – “Unable to load your personal document library. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Document cannot be opened", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-1, the file cannot be read or the audit entry cannot be recorded. (BR-335)"}, {"n": 2, "text": "Nothing is returned. The system displays MSG158 – “Unable to display the document. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Stored file is missing", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-1, the document is listed but its file is no longer in storage."}, {"n": 2, "text": "Nothing is returned. The system displays MSG382 – “The file of this document is no longer in storage and cannot be opened. Please contact the administrator.” and does not offer to try again."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-242", "BR-334", "BR-335"], "msg": ["MSG158", "MSG175", "MSG176", "MSG382"], "cov": {"br": 3, "code": 1, "test": 0}}, "UC-35": {"id": "UC-35", "name": "Comment on Meeting Document", "feature": "FE-07", "line": 1677, "extra": {}, "parent": null, "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a user who can view a Meeting document to read its comments and add a comment before the Meeting ends. After the Meeting ends, the document and comments are read-only. (BR-249, BR-282)", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a current valid invitation. (BR-153, BR-155, BR-157)", "PRE-2: The document is currently in the Meeting and the user can view that Meeting. (BR-275)", "PRE-3: The Meeting has not ended. (BR-282)"], "post": ["POST-1: The new comment is displayed with its author and posting time, and the comment count is updated. (BR-250)", "POST-2: Existing comments and the document remain unchanged."], "normal": [{"id": "", "title": "Comment on Meeting Document", "notes": [], "steps": [{"n": 1, "text": "The user opens a Meeting document y root", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the user selects the library root instead of another folder."}, {"n": 2, "text": "The moved folder becomes a first-level folder; its subfolders remain subject to the depth limit. (BR-191)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Folder is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected folder is missing or no longer belongs to the user."}, {"n": 2, "text": "No folder or contained item moves. The system displays MSG175 – “This personal-library item is not available.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Destination is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the destination was deleted or does not belong to the user. (BR-219, BR-242)"}, {"n": 2, "text": "No folder or contained item moves. The system displays MSG179 – “The selected destination folder is not available in your personal library.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-3", "title": "Destination is the same folder or one of its subfolders", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the destination is the folder itself or one of its subfolders. (BR-222)"}, {"n": 2, "text": "No folder or contained item moves. The system displays MSG193 – “A folder cannot be moved into itself or one of its descendants.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-4", "title": "Resulting depth exceeds the limit", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the moved folder or one of its subfolders would be deeper than level five. (BR-191)"}, {"n": 2, "text": "No folder or contained item moves. The system displays MSG189 – “Folders cannot be nested more than five levels deep.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-5", "title": "Operation cannot be completed", "notes": [], "step
