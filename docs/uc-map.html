.", "applies": ["UC-01", "UC-02", "UC-06c", "UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02", "UC-06c", "UC-07"]}, "BR-04": {"text": "A user without active system access or the required active role/permission must not be allowed to access the system.", "applies": ["UC-01", "UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02"]}, "BR-05": {"text": "Identity information returned by Google must be successfully verified before it can be used for authentication.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-06": {"text": "A Google-authenticated email may be used to sign in only when it is linked to an existing internal user account.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-07": {"text": "Signing in with Google must not automatically create a new internal user account.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-08": {"text": "User permissions are determined by the system and must not be selected manually during the sign-in process.", "applies": ["UC-01", "UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02"]}, "BR-09": {"text": "After a successful sign-out, the current authentication state must no longer grant access to protected system functions. The user must authenticate again before protected functions can be accessed.", "applies": ["UC-03"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-03"]}, "BR-10": {"text": "Sensitive authentication information, including passwords, password hashes, reset credentials, and authentication tokens, must not be displayed in User Management.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-11": {"text": "List views must support pagination when the number of records exceeds the configured page size.", "applies": ["UC-05", "UC-17", "UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-05", "UC-17", "UC-66"]}, "BR-12": {"text": "When a search or filter returns no matching records, the system must display an appropriate no-results message instead of treating the result as a system error.", "applies": ["UC-05", "UC-17"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-05", "UC-17"]}, "BR-13": {"text": "Username and email must each be unique across user accounts.", "applies": ["UC-06a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a"]}, "BR-14": {"text": "All mandatory user-account information must be provided and valid before an account can be created or updated.", "applies": ["UC-06a", "UC-06b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a", "UC-06b"]}, "BR-15": {"text": "A newly created user account must have Active status by default.", "applies": ["UC-06a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a"]}, "BR-16": {"text": "Successful administrative changes to user accounts or role-permission configuration must be recorded in the audit log.", "applies": ["UC-06a", "UC-06b", "UC-06c", "UC-07", "UC-11", "UC-12a", "UC-12b", "UC-12c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a", "UC-06b", "UC-06c", "UC-07", "UC-11", "UC-12a", "UC-12b", "UC-12c"]}, "BR-17": {"text": "General user-account updates may modify Full Name, Job Title, and Contact Information. Email, System Role, and password credentials must be managed separately.", "applies": ["UC-06b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06b"]}, "BR-18": {"text": "When a user account is deactivated, all active authenticated sessions for that account must be terminated.", "applies": ["UC-06c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06c"]}, "BR-19": {"text": "Deactivating a user account must not delete historical records associated with that user.", "applies": ["UC-06c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06c"]}, "BR-20": {"text": "A password-reset link must have a limited validity period and must not be reusable after a successful password reset.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-21": {"text": "An administrator must not be able to view a user's existing password.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-22": {"text": "Password reset may only be initiated for an account that is eligible to use password-based authentication.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-23": {"text": "A role-permission configuration may contain only permissions defined by the system and must satisfy the system's permission-configuration rules before it can be applied.", "applies": ["UC-11"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-11"]}, "BR-24": {"text": "All required meeting information must be provided before a meeting can be created. Planned End Time must be after Planned Start Time.", "applies": ["UC-14"], "rationale": "", "enforced": "", "code": ["frontend/src/features/meetings/MeetingForm.tsx:138"], "test": [], "ucs": ["UC-14", "UC-15"]}, "BR-25": {"text": "Planned Start Time and Planned End Time are required meeting-level schedule fields; each Meeting represents one sitting.", "applies": ["UC-14", "UC-15", "UC-16", "UC-17", "UC-18", "UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-14", "UC-15", "UC-16", "UC-17", "UC-18", "UC-20"]}, "BR-26": {"text": "A newly created meeting must have Draft status.", "applies": ["UC-14"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-14"]}, "BR-27": {"text": "Meeting information may be edited in Draft or Rejected; in Published, the Meeting Organizer may reschedule only times or location.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:26"], "test": [], "ucs": ["UC-15"]}, "BR-28": {"text": "Updating meeting information must not implicitly change the meeting lifecycle status.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15"]}, "BR-29": {"text": "A user may access a meeting only when the user has an authorized relationship with that meeting as its Meeting Organizer, assigned Meeting Approver, Chair, Secretary, or Participant. Authentication alone does not grant access to a meeting.", "applies": ["UC-16", "UC-17", "UC-26", "UC-27", "UC-30", "UC-32a", "UC-37", "UC-68"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:70", "frontend/src/features/calendar/CalendarFilter.tsx:26", "frontend/src/features/calendar/useSchedule.ts:23"], "test": [], "ucs": ["UC-16", "UC-17", "UC-26", "UC-27", "UC-30", "UC-32a", "UC-37", "UC-52a", "UC-52b", "UC-68"]}, "BR-30": {"text": "The Meeting list offers fixed time choices. Today and This week match a Meeting whose own planned start/end interval overlaps that day or week in the viewer's time zone. Not yet held matches a Meeting whose planned start time is later than the current time; Already held matches a Meeting whose planned start time is the current time or earlier, so a Meeting in progress counts as Already held.", "applies": ["UC-17"], "rationale": "SCRUM-18 (PR #111) — fixed time choices as in AI-eCabinet", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingRepository.cs:32", "frontend/src/types/meeting.ts:173", "frontend/src/features/calendar/useSchedule.ts:22"], "test": ["tests/TrustCabinet.Web.Tests/Meetings/MeetingRepositoryTests.cs:1515"], "ucs": ["UC-17"]}, "BR-31": {"text": "When multiple search or filter criteria are applied, a record must satisfy all applicable criteria to appear in the result.", "applies": ["UC-05", "UC-17"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-05", "UC-17"]}, "BR-32": {"text": "The meeting list must support sorting, and the current search, filter, and sorting criteria must be preserved when navigating between pages.", "applies": ["UC-17"], "rationale": "", "enforced": "", "code": ["frontend/src/features/meetings/listParams.ts:15"], "test": [], "ucs": ["UC-17"]}, "BR-33": {"text": "Meeting approval submission requires all mandatory information including the planned schedule and Draft or Rejected status.", "applies": ["UC-18"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-18"]}, "BR-34": {"text": "Submitting a Draft or Rejected Meeting for approval changes its status to WaitingApproval. General Meeting information cannot be edited until an approval decision is made. This restriction does not apply to Agenda Management: the assigned Secretary may create, update, delete and reorder Agenda Items under BR-65, BR-68 and BR-74.", "applies": ["UC-15", "UC-18", "UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-18", "UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-35": {"text": "For each approval cycle, an eligible Meeting Approver must be assigned. If no eligible approver is available, submission cannot proceed: the Meeting remains Draft or Rejected, its existing assignment and history are unchanged, and no submission notification is issued. Only the currently assigned Meeting Approver with the required permission may approve or reject the Meeting.", "applies": ["UC-18", "UC-19"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-18", "UC-19"]}, "BR-36": {"text": "Approving a meeting changes its status from WaitingApproval to Approved. Rejecting a meeting changes its status from WaitingApproval to Rejected. A rejection reason is mandatory.", "applies": ["UC-19"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-19"]}, "BR-37": {"text": "Only an authorized Meeting Organizer may publish a meeting that is in Approved status and satisfies the publication readiness requirements. Publishing changes the meeting status from Approved to Published and initiates participant invitations.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-38": {"text": "Every meeting lifecycle transition must have a history record containing at least the acting user, timestamp, action and resulting status; a rejection also includes its reason. For submission, approval, rejection and publication, the corresponding assignment, decision, status and history must be completed together. If any part cannot be completed, all previous Meeting information and history remain unchanged, no new notification or invitation is issued, and the action is not reported as successful. Existing history must never be changed or removed.", "applies": ["UC-18", "UC-19", "UC-20", "UC-21", "UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-18", "UC-19", "UC-20", "UC-21", "UC-22", "UC-75"]}, "BR-39": {"text": "After successful publication, current internal participants other than the user who published the Meeting must be notified in the application, and all current internal participants must be sent invitation emails. Each external Guest with a current invitation must receive a separate email invitation to verify their invited email address and access only that Meeting. Invitation delivery must not delay confirmation of publication.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-40": {"text": "If an invitation notification or email cannot be delivered, the system must retry delivery. The Meeting remains Published; delivery failure does not undo successful publication.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-41": {"text": "Meeting publication scope is strictly limited to meetings in Approved status and cannot be bypassed by direct state manipulation.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-42": {"text": "All participant invitation notifications must include a direct link to the published meeting details and attached materials.", "applies": ["UC-20", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a"]}, "BR-43": {"text": "System logging must track the queuing and delivery status of all asynchronous invitation messages for auditability.", "applies": ["UC-20", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a"]}, "BR-44": {"text": "Re-publishing or updating invitation delivery for an already published meeting requires explicit organizer action and creates a distinct lifecycle record.", "applies": ["UC-15", "UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-20"]}, "BR-45": {"text": "The system creates an in-app notification for the intended recipient when they are invited to a meeting, when a meeting they are involved in is approaching its start time.", "applies": ["UC-20", "UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-66"]}, "BR-46": {"text": "Notifications are saved for later viewing. If the recipient is connected, a new notification and the unread count are updated in real time without a page reload.", "applies": ["UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-47": {"text": "A user may retrieve, open, or change the read status of only notifications belonging to that user's account.", "applies": ["UC-67a", "UC-67b", "UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-67a", "UC-67b", "UC-68"]}, "BR-48": {"text": "The notification bell shows how many of the current user's notifications are unread.", "applies": ["UC-66", "UC-67b", "UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66", "UC-67b", "UC-68"]}, "BR-49": {"text": "Opening the notification list does not mark any notification as read.", "applies": ["UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-50": {"text": "Marking an already-read notification as read leaves its status unchanged and does not reduce the unread count again.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-68"]}, "BR-51": {"text": "Mark All as Read applies to all notifications belonging to the current recipient that are unread when the request is processed, including notifications not displayed on the current page.", "applies": ["UC-67b"], "rationale": "", "enforced": "", "code": ["frontend/src/features/notifications/NotificationsProvider.tsx:126"], "test": [], "ucs": ["UC-67b"]}, "BR-52": {"text": "A meeting notification links to its corresponding target. Opening the link must check the recipient’s current access permission and must not reveal protected content when access is denied.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-68"]}, "BR-53": {"text": "Selecting a notification to open its target attempts to mark the notification as read. Failure to save the read status does not block opening an authorized target.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": ["frontend/src/features/notifications/NotificationsProvider.tsx:136"], "test": [], "ucs": ["UC-68"]}, "BR-62": {"text": "A Meeting Planned End Time must be later than Planned Start Time.", "applies": ["UC-14", "UC-15", "UC-18"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:50", "frontend/src/features/meetings/MeetingForm.tsx:129", "frontend/src/features/meetings/MeetingForm.tsx:138"], "test": [], "ucs": ["UC-14", "UC-15", "UC-18"]}, "BR-64": {"text": "Each Agenda Item belongs directly to one Meeting. Reordering is within that Meeting.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26", "UC-77"]}, "BR-65": {"text": "Only the active assigned Secretary may create, update, delete or reorder Agenda Items while the Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress. Chair-only execution actions remain governed by BR-69.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-66": {"text": "An Agenda Item requires a Title. Presenter and Description are optional; attached documents must belong to the Meeting.", "applies": ["UC-23a", "UC-23b"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-67": {"text": "A new Agenda Item is always Pending and is appended after the last existing position, including while the Meeting is InProgress. Existing Item positions are not changed.", "applies": ["UC-23a"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a"]}, "BR-68": {"text": "The Title, Presenter and Description of an Agenda Item may be edited in any execution status while Agenda Management is permitted. Editing does not change its execution status, actual times, position or the Meeting lifecycle.", "applies": ["UC-23b"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23b"]}, "BR-69": {"text": "Only the current Chair may set or complete the current Agenda Item while Meeting is InProgress.", "applies": ["UC-24", "UC-25"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-70": {"text": "Any Pending Agenda Item may be started, whatever its position. Starting it changes Pending to InProgress; completing the current Item changes InProgress to Done. The Item status must be checked again when the change is saved.", "applies": ["UC-24", "UC-25"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-71": {"text": "At most one Agenda Item of a Meeting may be InProgress at a time. Concurrent requests must not start two Items; an unsuccessful request leaves the Agenda unchanged.", "applies": ["UC-24"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-24"]}, "BR-72": {"text": "Starting and completing an Agenda Item record its actual start and end times. The Chair may complete the current Item at any time. Completion does not automatically start another Item or end the Meeting. An Item must be started before it can be completed, and only an Item that has not been started can be deleted; a started or Done Item cannot be deleted.", "applies": ["UC-24", "UC-25"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order); PO 25/10/2026", "enforced": "", "code": [], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-73": {"text": "After an Agenda change is successfully saved, the complete Agenda is automatically refreshed for authorized users currently viewing the same Meeting. This applies to creation, editing, deletion, reordering, setting the current Item, completing an Item and completing the current Item when the Meeting ends. Refreshing must respect current Meeting access; an unsuccessful change must not be shown as a successful update.", "applies": ["UC-22", "UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-22", "UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26", "UC-77"]}, "BR-74": {"text": "Agenda Management is permitted in Draft, WaitingApproval, Rejected, Approved, Published or InProgress, including while approval is pending and while the Meeting is running. It is locked in Ended and subsequent lifecycle states. The server rechecks status and Secretary assignment when saving.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-75": {"text": "Rescheduling a Published Meeting requires a planned start time later than the current time.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:32", "frontend/src/features/meetings/MeetingForm.tsx:138"], "test": [], "ucs": ["UC-15"]}, "BR-76": {"text": "Rescheduling a Published Meeting must notify all current invitees: internal invitees in the application, except whoever rescheduled (BR-322), and each invited Guest by email. Delivery failures do not undo the change.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingRepository.cs:133", "backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:264"], "test": [], "ucs": ["UC-15"]}, "BR-78": {"text": "When a Meeting in Draft, Rejected or Approved has no current Secretary, the Meeting Organizer may assign exactly one active internal user as Secretary, including after an earlier Secretary was removed or changed role. No additional viewing permissions are granted by this recovery assignment; the Organizer gains no other roster-management authority. WaitingApproval remains read-only. (BR-79, BR-80, BR-122) An existing active Member may be assigned Secretary without creating a duplicate participant or resetting response/attendance.", "applies": ["UC-28a"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-79": {"text": "Current assigned Secretaries manage the Meeting roster while its status permits. The Meeting Organizer may assign a Secretary only when no current Secretary exists in Draft, Rejected or Approved, whether initially or to restore the assignment. This exception does not permit other role, permission or removal actions.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-80": {"text": "Participant management is allowed only while the Meeting is Draft, Rejected, Approved, Published, or InProgress.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-81": {"text": "An internal participant must reference an active internal user account.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-82": {"text": "An internal user may appear at most once as a current participant in the same Meeting.", "applies": ["UC-27", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a"]}, "BR-83": {"text": "Internal users are selected individually, and one or more users may be added in one submission. Organisational-unit invitations are not supported. (BR-168)", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-84": {"text": "External Guests are represented by meeting-specific Guest invitations rather than internal Meeting Participant records.", "applies": ["UC-27", "UC-28a", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28c"]}, "BR-85": {"text": "Each current internal participant has exactly one Meeting Role: Chair, Secretary, or Member.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-86": {"text": "A participant's Meeting Role is independent of the user's system Role.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-87": {"text": "An external Guest cannot satisfy a required Chair or Secretary role.", "applies": ["UC-20", "UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-21"]}, "BR-88": {"text": "A newly added internal participant or external Guest invitation starts with Pending Invitation Response and no response time.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-90": {"text": "When an internal participant is added to a Published or InProgress Meeting, the participant is notified through the applicable invitation channels.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-91": {"text": "When an external Guest is invited to a Published or InProgress Meeting, the invitation is delivered by email.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-92": {"text": "Changing a meeting role or additional meeting permissions in a Published or InProgress Meeting notifies every affected participant. Replacing the Chair notifies both people (the previous and the new Chair), except that the person making the change is not notified in the application (BR-322); for example, a Chair reassigning their own role notifies only the new assignee. Notification failure does not cancel saved changes. (BR-94, BR-169)", "applies": ["UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-93": {"text": "Removing an internal participant or revoking a Guest invitation from a Published or InProgress Meeting notifies the affected invitee through the applicable channel.", "applies": ["UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-94": {"text": "Failure to deliver a participant or Guest notification does not undo an otherwise successful roster change.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-95": {"text": "A participant-removal or Guest-revocation notification must not contain a protected meeting-access link.", "applies": ["UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-96": {"text": "Changing a meeting role or additional meeting permissions does not change the participant’s invitation response or attendance.", "applies": ["UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-29"]}, "BR-97": {"text": "Removing a current internal participant ends the access and additional permissions granted through that assignment. Independent valid access relationships remain effective.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37"]}, "BR-100": {"text": "Revoking an external Guest invitation revokes access granted by that Guest relationship.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37"]}, "BR-101": {"text": "After a roster or Guest-access relationship changes, room-entry eligibility must be re-evaluated; a connected user is disconnected only when no valid room-entry relationship remains.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37"]}, "BR-102": {"text": "Removing or revoking a roster entry after publication preserves its Invitation Response and Attendance evidence as historical data.", "applies": ["UC-27", "UC-28c", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28c", "UC-30"]}, "BR-103": {"text": "Historical or revoked roster records are excluded from the current roster, current access checks, and required-role counts.", "applies": ["UC-27", "UC-28c", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28c", "UC-30"]}, "BR-104": {"text": "Only the owner of a current invitation may respond to that invitation.", "applies": ["UC-29"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-105": {"text": "Current internal participants and external Guests may respond only Accepted or Declined. The Chair does not respond because the Chair runs the Meeting. Responding does not transfer or change any Meeting Role.", "applies": ["UC-29"], "rationale": "PO 21/10/2026 — Chair does not respond", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-106": {"text": "Each invitation is answered once while the Meeting is Published or InProgress. After an Accepted or Declined response is recorded it cannot be changed; submitting the same response again is not an error and changes nothing.", "applies": ["UC-29"], "rationale": "PO 21/10/2026 — answer once, as in AI-eCabinet", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-115": {"text": "The Invitation Response and its response time are recorded once for each current invitation; an invitation that is not answered stays Pending. The Chair's response is not displayed, even when the Chair answered earlier as another role; changing a member's role does not reset the response.", "applies": ["UC-29", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-30"]}, "BR-116": {"text": "Invitation Response and Attendance are independent; Accepted does not mean the invitee attended the Meeting.", "applies": ["UC-29", "UC-30", "UC-31"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-30", "UC-31"]}, "BR-117": {"text": "Roster and invitation-response information is accessible only to users whose relationship with the Meeting permits that information.", "applies": ["UC-16", "UC-27", "UC-29", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-27", "UC-29", "UC-30"]}, "BR-118": {"text": "An active assigned Secretary may read the Meeting before publication; WaitingApproval is read-only for roster management.", "applies": ["UC-16", "UC-17", "UC-27", "UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-17", "UC-27", "UC-28a", "UC-28b", "UC-28c"]}, "BR-119": {"text": "A Chair or Member assignment alone does not grant meeting-read access before the Meeting is Published.", "applies": ["UC-16", "UC-17"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-17"]}, "BR-120": {"text": "An external Guest receives access only to the Meeting to which that Guest was invited.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-37"]}, "BR-121": {"text": "A user who is not authorized to access a Meeting must not receive its roster or invitation-response information.", "applies": ["UC-27", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-30"]}, "BR-122": {"text": "Draft, Rejected and Approved Meetings may temporarily have no current Secretary. In these statuses the Organizer can assign a Secretary when none remains under BR-78. Published and InProgress Meetings must retain at least one current Secretary, or replace the last Secretary together with the same successful roster change. WaitingApproval roster changes remain prohibited; publication and start still require active Secretary assignments under BR-125 and BR-127.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-123": {"text": "A Meeting may have at most one current Chair at a time.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-124": {"text": "Publishing a Meeting requires exactly one current Chair whose internal account is active.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-125": {"text": "Publishing a Meeting requires at least one current Secretary whose internal account is active.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-126": {"text": "A Published or InProgress Meeting must retain its current Chair. From publication onward, the Chair role changes only when the current Chair hands it over through UC-73; the Secretary and the Meeting Organizer cannot replace the Chair, except that the Secretary may replace the Chair when the Chair's account is locked. (BR-169, BR-295)", "applies": ["UC-28b", "UC-28c", "UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair; PO 23/10/2026 — Secretary replaces the Chair only when the Chair's account is locked", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-28c", "UC-73"]}, "BR-127": {"text": "Starting a Meeting requires exactly one current Chair and at least one current Secretary whose internal accounts are active.", "applies": ["UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-129": {"text": "Invitation responses do not change readiness requirements for the assigned active Chair and Secretary when publishing or starting a Meeting.", "applies": ["UC-20", "UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-21"]}, "BR-130": {"text": "Only an active current Chair assigned to the Meeting may explicitly start or end that Meeting.", "applies": ["UC-21", "UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21", "UC-22"]}, "BR-131": {"text": "A Meeting may be started only while it is Published.", "applies": ["UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-132": {"text": "A Meeting may be ended only while it is InProgress.", "applies": ["UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-22"]}, "BR-143": {"text": "When a Meeting becomes Ended, its Online Meeting Room stops accepting joins and disconnects currently connected users.", "applies": ["UC-22", "UC-37"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Calls/CallRoomService.cs:189"], "test": [], "ucs": ["UC-22", "UC-37"]}, "BR-148": {"text": "An external Guest is invited using a name and email without an internal account. After email verification, the Guest provides a self-declared display name and optional job title for this Meeting. The invited name remains invitation evidence; only control of the email is verified. (BR-180)", "applies": ["UC-27", "UC-28a", "UC-29"], "rationale": "PO 13/10/2026", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-29"]}, "BR-149": {"text": "Within one Meeting, a Guest email may have at most one current Guest invitation.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-150": {"text": "A Guest cannot hold an internal Meeting Role, including Chair or Secretary.", "applies": ["UC-28a", "UC-37"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-37"]}, "BR-151": {"text": "A Guest invitation must not be created when the same email is already represented by a current internal participant of that Meeting.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-152": {"text": "External Guest access requires a secure, meeting-specific invitation.", "applies": ["UC-20", "UC-28a", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a", "UC-29", "UC-37"]}, "BR-153": {"text": "An external Guest must verify control of the invited email before Guest access is established.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-04", "UC-20", "UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-154": {"text": "External Guest access is limited to the invited Meeting.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-37"]}, "BR-155": {"text": "External Guest access expires according to the configured validity period.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-156": {"text": "External Guest access does not require an internal account login.", "applies": ["UC-28a", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a", "UC-29", "UC-37"]}, "BR-157": {"text": "Revoking an external Guest invitation immediately invalidates access granted by that invitation.", "applies": ["UC-28c", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28c", "UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-158": {"text": "Only the Meeting Organizer may reschedule a Published Meeting; only planned times or location may change.", "applies": ["UC-15"], "rationale": "PO 09/10/2026", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:263", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:26", "frontend/src/types/meeting.ts:50", "frontend/src/features/meetings/MeetingForm.tsx:204"], "test": [], "ucs": ["UC-15"]}, "BR-159": {"text": "Ending a Meeting neither requires nor automatically closes its Votes and preserves previously recorded ballots.", "applies": ["UC-22"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-22", "UC-56"]}, "BR-160": {"text": "Only the current Chair may open a Draft Vote, and only while its Meeting is InProgress.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-161": {"text": "The current Chair may record Passed, NotPassed or Deferred, with an optional note, for a Closed and tallied Vote while its Meeting is InProgress or Ended.", "applies": ["UC-52b", "UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-57"]}, "BR-162": {"text": "When a new Meeting is created, Planned Start Time must be later than the current time.", "applies": ["UC-14"], "rationale": "PO Q7 / BF-02", "enforced": "Meeting / Voting / Minutes services", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:31", "frontend/src/features/meetings/MeetingForm.tsx:138"], "test": ["tests/TrustCabinet.Web.Tests/Meetings/MeetingEndpointsTests.cs:126"], "ucs": ["UC-14"]}, "BR-163": {"text": "Online/Hybrid Meetings use the internal TrustCabinet Online Meeting Room. Online Link is managed by the system as part of Online Meeting Room functionality and may be empty until generated. Users cannot enter or modify it during Meeting creation, editing or rescheduling. Link generation is outside Create Meeting and Update Meeting.", "applies": ["UC-14", "UC-15"], "rationale": "PO Q4 / BF-02", "enforced": "Meeting / Voting / Minutes services", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:44", "frontend/src/types/meeting.ts:95"], "test": [], "ucs": ["UC-14", "UC-15"]}, "BR-164": {"text": "Starting a Meeting creates an in-app notification for its currently invited internal participants; notification failure does not roll back the successful Meeting start. The Chair who pressed Start is not notified in the application (BR-322).", "applies": ["UC-21"], "rationale": "PO Q11 / BF-03", "enforced": "Meeting / Voting / Minutes services", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-165": {"text": "A ballot may be cast only while the Meeting is InProgress, the Vote is Open and the voter retains current Meeting access.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-55", "UC-56"]}, "BR-166": {"text": "When designated minutes signers request revision or minutes content changes after signing begins, previous signatures on the earlier content version are invalidated and the revised version requires a new signing cycle. Only the assigned Secretary may finalize and seal the completed minutes after all designated signers sign.", "applies": ["UC-60", "UC-61", "UC-62", "UC-64", "UC-65"], "rationale": "PO / BF-04", "enforced": "Meeting / Voting / Minutes services", "code": [], "test": [], "ucs": ["UC-60", "UC-61", "UC-62", "UC-64", "UC-65"]}, "BR-167": {"text": "User account list sorting must use an allowed sort field/order, and current search/filter/sort criteria are preserved across pages.", "applies": ["UC-05"], "rationale": "UC-05 user-list acceptance criteria", "enforced": "User Management", "code": [], "test": [], "ucs": ["UC-05"]}, "BR-168": {"text": "A submission adding multiple internal Meeting Participants must be saved as one indivisible roster change. If any selected account, assigned Meeting Role or additional Meeting Permission is invalid, no account in the submitted batch may be added. Invitation dispatch occurs only after a successful roster save; delivery errors follow BR-94.", "applies": ["UC-28a"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-169": {"text": "Replacing or handing over the Chair changes the outgoing Chair to Member and the incoming current internal participant to Chair together. The final list must retain the required Secretary and Chair. If either change fails, both people keep their previous roles.", "applies": ["UC-28b", "UC-73"], "rationale": "FE-06 revision, 12/10/2026; PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-170": {"text": "Only an active current assigned Secretary may save or revise official attendance while the Meeting is InProgress. For each current internal participant or current Guest, the only official saved attendance values are Present or Absent.", "applies": ["UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-171": {"text": "A person whose attendance has not been recorded remains unmarked. An unmarked person must not be counted as Absent. Only Present and Absent may be saved as official attendance.", "applies": ["UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-172": {"text": "Attendance may be saved or revised for one or more selected current internal participants or Guests without covering the full roster. Every submitted entry must identify a current person and contain Present or Absent; omitted entries retain their saved or unmarked value. All submitted changes succeed together or none are saved, with the responsible Secretary and save time. Revalidate submitted entries and current authority/status when saving; unrelated roster additions do not require attendance for those people. Each person’s attendance has its own version, which changes only when that attendance changes, not when the person’s role or invitation response changes; a submission carrying an out-of-date version is rejected as a whole, nothing is saved, and the Secretary reloads and selects again — unsaved selections are not kept (ADR-0025). Attendance completeness never prevents End Meeting.", "applies": ["UC-31"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-173": {"text": "Each current internal participant has exactly one meeting role: Chair, Secretary or Member. Each role provides predefined permissions for that Meeting. Meeting roles and additional meeting permissions are independent of the person’s system role.", "applies": ["UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30"]}, "BR-174": {"text": "A current assigned Secretary may grant additional Meeting permissions to current internal participants and current Guest invitations, supplementing the permissions already provided by their Meeting role. View meeting participants and View invitation responses are examples, not an exhaustive list. The available permission catalogue and role-to-permission grant matrix remain to be specified; this rule does not invent either. Grants apply to this Meeting only and do not change system roles or internal Meeting roles. Guest-specific exclusions remain under BR-181.", "applies": ["UC-27", "UC-28a", "UC-28b", "UC-30"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28b", "UC-30"]}, "BR-175": {"text": "Only a current assigned Secretary may grant, change or revoke individual additional Meeting permissions while roster management is permitted. An internal participant retains their existing Meeting role; a Guest retains Guest access without acquiring an internal role. Organizer Secretary initialization/recovery does not itself grant permission-management authority.", "applies": ["UC-28a", "UC-28b"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-176": {"text": "Before publication, a Chair, Member or Guest cannot view the invited participant roster or invitation responses. From Published onward, Chair has both views by default and Secretary access follows existing rules; a current Member or verified current Guest needs the matching additional permission. View Invitation Responses includes names and emails in response rows but does not grant roster browsing/search. Responses are shown as a label beside each name; there are no totals, and the Chair has no label. The connected-room list in UC-40 is available to connected Members and Guests without either additional grant.", "applies": ["UC-27", "UC-30"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-30"]}, "BR-177": {"text": "Internal Meeting role changes and individual additional-permission changes are saved consistently. Effective Meeting permissions combine role defaults and valid additional grants; changing a role does not by itself require discarding compatible grants. Removed assignments and revoked Guest invitations immediately lose their grants and access, while historical evidence is retained. Published/InProgress changes follow existing notifications.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-178": {"text": "Official attendance must be recordable and retrievable for both current internal Meeting Participant records and current external Guest invitations. An attendance record includes the saved status, the responsible Secretary and the save time; historical evidence is retained when a published Meeting's participant or Guest is removed/revoked.", "applies": ["UC-28c", "UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28c", "UC-31"]}, "BR-179": {"text": "Retired on 13/10/2026 by PO decision. Attendance completeness is not a prerequisite for ending a Meeting. This ID must not be reused.", "applies": ["UC-22", "UC-31"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-22", "UC-31"]}, "BR-180": {"text": "After verifying the invited email, a Guest provides a display name and job title for presentation in the Meeting. These are self-declared information; only control of the invited email is verified. Changing display information does not change the invitation identity or the invited email. Required-field rules and detailed profile validation are not finalized here.", "applies": ["UC-04", "UC-27", "UC-37", "UC-40"], "rationale": "PO 13/10/2026", "enforced": "Guest participation / Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-04", "UC-27", "UC-28a", "UC-37", "UC-40"]}, "BR-181": {"text": "A Guest has the same participation rights as a Participant within the invited Meeting.", "applies": ["UC-04", "UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30", "UC-31", "UC-32a", "UC-32c", "UC-35", "UC-37", "UC-42", "UC-52a", "UC-52b", "UC-55"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Guest participation / Meeting Participant Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:93"], "test": [], "ucs": ["UC-04", "UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30", "UC-31", "UC-32a", "UC-32c", "UC-35", "UC-37", "UC-42", "UC-52a", "UC-52b", "UC-55", "UC-74"]}, "BR-182": {"text": "Inviting a Guest into a Confidential or Secret Meeting displays a clear inline warning that the Guest will receive Member participation and Meeting-document access. Invitation creation uses the ordinary invite flow; no extra confirmation or separate sensitivity approval flow is required. Record the inviting Secretary, Meeting sensitivity and invitation time for accountability.", "applies": ["UC-28a"], "rationale": "PO 13/10/2026", "enforced": "Guest participation / Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-183": {"text": "An uploaded file's content cannot be changed.", "applies": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-34", "UC-36", "UC-71"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:167", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:85", "frontend/src/features/documents/DocumentViewerPage.tsx:31"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentEndpointsTests.cs:55", "tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:306"], "ucs": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-34", "UC-36", "UC-71", "UC-71b"]}, "BR-184": {"text": "Only the current Chair or Secretary may add or remove Meeting documents or their Agenda Item links.", "applies": ["UC-33a", "UC-33b", "UC-33c", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:257", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:61", "frontend/src/features/documents/DocumentsPanel.tsx:36"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-76a", "UC-76b"]}, "BR-185": {"text": "Meeting documents and their Agenda Item links cannot be added or removed after the Meeting ends.", "applies": ["UC-23b", "UC-33a", "UC-33b", "UC-33c", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:257"], "test": [], "ucs": ["UC-23b", "UC-33a", "UC-33b", "UC-33c", "UC-33d"]}, "BR-186": {"text": "Deleting a personal-library document does not remove the document from Meetings.", "applies": ["UC-33c", "UC-71a"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:236", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:89", "frontend/src/api/library.ts:69"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:529"], "ucs": ["UC-33c", "UC-71a"]}, "BR-187": {"text": "Only PDF and DOCX documents may be uploaded.", "applies": ["UC-33a", "UC-36"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:269", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:78"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36", "UC-76a"]}, "BR-188": {"text": "Documents of a Secret Meeting may be read online but not downloaded.", "applies": ["UC-32c"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:168", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:248", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:123", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:98", "frontend/src/features/documents/DocumentTags.tsx:31"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:207", "tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:646"], "ucs": ["UC-32c"]}, "BR-189": {"text": "The current Chair or the current Secretary may delete a Draft Vote while its Meeting is Approved, Published or InProgress. An Open or Closed Vote cannot be deleted.", "applies": ["UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53"]}, "BR-190": {"text": "The eligible-voter list and count are fixed when the Vote opens, using the selected meeting roles and valid Meeting access. Attendance does not determine eligibility.", "applies": ["UC-54", "UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-53", "UC-54", "UC-55"]}, "BR-191": {"text": "Personal-library folders may be nested at most five levels deep.", "applies": ["UC-34", "UC-36", "UC-71b", "UC-71c", "UC-72a", "UC-72b", "UC-72c", "UC-72d"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:149", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:20", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:15", "frontend/src/features/documents/DocumentsPage.tsx:39"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:190"], "ucs": ["UC-34", "UC-36", "UC-71b", "UC-71c", "UC-72a", "UC-72b", "UC-72c", "UC-72d"]}, "BR-192": {"text": "An automatically created Meeting folder is named “<Meeting title> – dd/mm/yyyy”, using the Meeting planned start date in Vietnam time.", "applies": ["UC-33a"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:54", "frontend/src/types/document.ts:72", "frontend/src/features/documents/AddDocumentsDialog.tsx:57", "frontend/src/features/documents/DocumentsPage.tsx:127", "frontend/src/features/uploads/uploadsContext.ts:19"], "test": [], "ucs": ["UC-33a", "UC-72d"]}, "BR-193": {"text": "The same uploaded file may have only one active attachment in a Meeting.", "applies": ["UC-33a", "UC-33c"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:300", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:35", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:110"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-33c", "UC-76a"]}, "BR-194": {"text": "A direct upload creates both the Meeting document and the personal-library document, or creates neither.", "applies": ["UC-33a"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:106", "frontend/src/api/documents.ts:32", "frontend/src/features/documents/AddDocumentsDialog.tsx:57"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-76a"]}, "BR-195": {"text": "The current Chair or Secretary may add documents from the time they can view the Meeting until it ends.", "applies": ["UC-33a"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:257", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:61"], "test": [], "ucs": ["UC-33a"]}, "BR-197": {"text": "Each Meeting-document addition or removal records who performed it and when.", "applies": ["UC-33a", "UC-33c"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:180"], "test": [], "ucs": ["UC-33a", "UC-33c"]}, "BR-199": {"text": "A Secretary may grant a Guest the additional Meeting permissions available to an internal Participant.", "applies": ["UC-28b", "UC-32a", "UC-32c"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-28b", "UC-32a", "UC-32c"]}, "BR-200": {"text": "Additional permissions cannot override Guest restrictions or the prohibition on downloading Secret Meeting documents.", "applies": ["UC-28b", "UC-32a", "UC-32c"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-28b", "UC-32a", "UC-32c"]}, "BR-201": {"text": "A Guest receives no system Role.", "applies": ["UC-04", "UC-28a"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-04", "UC-28a"]}, "BR-202": {"text": "Retired on 18/10/2026: delegated attendance was removed (decision D4, BR-105), so there is no delegated authority to restrict. This ID must not be reused.", "applies": ["UC-28b"], "rationale": "Council review 1 — delegation removed", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-28b"]}, "BR-203": {"text": "A Guest cannot moderate a Meeting room.", "applies": ["UC-41"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-41"]}, "BR-204": {"text": "A Guest cannot use a personal document library.", "applies": ["UC-34", "UC-36", "UC-71", "UC-72"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-34", "UC-36", "UC-71", "UC-71a", "UC-71b", "UC-71c", "UC-72", "UC-72a", "UC-72b", "UC-72c", "UC-72d"]}, "BR-205": {"text": "Meeting documents have no separate sharing option for Guests.", "applies": ["UC-32a", "UC-32c", "UC-33a"], "rationale": "ADR-0016 / PO 13/10/2026 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-33a"]}, "BR-206": {"text": "Uploaded documents have no versions.", "applies": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-36"]}, "BR-208": {"text": "Changing document content requires uploading a new file and replacing the old Meeting document.", "applies": ["UC-33a", "UC-33c", "UC-36"], "rati
