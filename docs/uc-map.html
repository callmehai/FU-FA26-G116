R-139)"}, {"n": 3, "text": "The revision is unchanged. The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Revision is not readable by the actor", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the actor is neither the current Chair nor the current Secretary and asks for a draft, a revision waiting for approval, a returned revision or a correction that is not issued yet. (BR-139)"}, {"n": 2, "text": "The system answers as if the revision did not exist and discloses nothing about it."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting is not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the actor may no longer read it."}, {"n": 2, "text": "The system answers as if the Meeting did not exist and discloses nothing about its minutes."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Minutes are Secret and download requested", "notes": [], "steps": [{"n": 1, "text": "At Step 6 or AF-3 Step 2, the Meeting is Secret. (BR-132)"}, {"n": 2, "text": "No file is delivered; the minutes are read on the screen only. The system displays MSG405 – “The minutes of a Secret meeting cannot be downloaded.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-131", "BR-132", "BR-135", "BR-136", "BR-137", "BR-138", "BR-139"], "msg": ["MSG405"], "cov": {"br": 7, "code": 6, "test": 5}}, "UC-70": {"id": "UC-70", "name": "Generate Meeting Minutes", "feature": "FE-12", "line": 2362, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or the current Secretary to build the draft of the minutes from the one fixed template and the Meeting's records, using the meeting's current AI draft, reviewed or not, for sections I–III when there is one. (BR-130)", "pre": ["PRE-1: The actor is signed in and is the current Chair or the current Secretary of the Meeting. (BR-131)", "PRE-2: The Meeting has Ended. (BR-131)", "PRE-3: No minutes exist yet, or the latest revision is a draft or was returned by the Chair. (BR-135, BR-136)"], "post": ["POST-1: A draft of the minutes exists, filled from the Meeting's records.", "POST-2: Building again replaces the whole content of the draft, including every correction.", "POST-3: No other Meeting record is changed."], "normal": [{"id": "", "title": "Generate Meeting Minutes", "notes": [], "steps": [{"n": 1, "text": "The actor asks to build the draft of the minutes."}, {"n": 2, "text": "The system checks the assignment, the Meeting status and that no minutes exist yet or the latest revision is a draft or was returned. (BR-131, BR-135, BR-136)"}, {"n": 3, "text": "The system fills the fixed template from the Meeting's records — time, place, attendance, Chair, Secretary, agenda with the recorded conclusions, and the results and conclusions of closed votes — and fills sections I–III from the Meeting's current AI draft when there is one. (BR-130)"}, {"n": 4, "text": "The system saves the draft with its revision number and displays MSG395 – “Minutes draft created.”"}]}], "alts": [{"id": "AF-1", "title": "Build again over an existing draft", "notes": [], "steps": [{"n": 1, "text": "At Step 1, a draft or a returned revision already exists."}, {"n": 2, "text": "The system warns that every correction will be replaced and asks for confirmation."}, {"n": 3, "text": "The actor confirms and the flow resumes at Step 2 of the Normal Flow."}]}, {"id": "AF-2", "title": "No AI draft", "notes": [], "steps": [{"n": 1, "text": "At Step 3, no AI draft exists yet, or the AI has not finished writing it."}, {"n": 2, "text": "The system leaves blanks where the Secretary must write."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-3", "title": "AI draft not yet reviewed", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting's AI draft exists but has not been reviewed."}, {"n": 2, "text": "The system uses the draft as it is, marks the minutes as built from an unreviewed draft and offers the way to review it (UC-61)."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-4", "title": "AI draft changed after the minutes were built", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the AI draft was made again or corrected after the minutes were built, or appeared after minutes built without one."}, {"n": 2, "text": "The system shows that the minutes are out of date and offers to build them again as in AF-1."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is neither the current Chair nor the current Secretary. (BR-131)"}, {"n": 2, "text": "No draft is built. The system displays MSG397 – “Only the Chair or Secretary may write the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting has not ended", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting has not Ended. (BR-131)"}, {"n": 2, "text": "No draft is built. The system displays MSG398 – “The minutes can be written only after the meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "A draft already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a draft exists and the actor did not ask to replace it."}, {"n": 2, "text": "Nothing is built and the existing draft stays as it is. The system displays MSG399 – “This meeting already has a minutes draft.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-130", "BR-131", "BR-135", "BR-136"], "msg": ["MSG395", "MSG397", "MSG398", "MSG399"], "cov": {"br": 4, "code": 3, "test": 2}}, "UC-71": {"id": "UC-71", "name": "Edit Meeting Minutes", "feature": "FE-12", "line": 2373, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or the current Secretary to correct the content of the minutes draft, see the paper as it will print, save it, and download the same content as a Word or PDF file.", "pre": ["PRE-1: The actor is signed in and is the current Chair or the current Secretary of the Meeting. (BR-131)", "PRE-2: The latest revision of the minutes is a draft or was returned by the Chair; a correction draft counts. (BR-135, BR-136)"], "post": ["POST-1: The corrected text is saved with the new time it was saved.", "POST-2: No other revision or Meeting record is changed.", "POST-3: Downloading a Word or PDF file leaves the draft unchanged."], "normal": [{"id": "", "title": "Edit Meeting Minutes", "notes": [], "steps": [{"n": 1, "text": "The actor opens the minutes draft and chooses to edit it."}, {"n": 2, "text": "The system shows the content in an editor next to the paper preview built from the same content; the preview follows the text as the actor types."}, {"n": 3, "text": "The actor corrects the text and saves it."}, {"n": 4, "text": "The system checks that the revision is still a draft or was returned, that the content is valid and that nobody has saved since the actor read it. (BR-135, BR-136)"}, {"n": 5, "text": "The system saves the content with the new save time and displays MSG396 – “Minutes saved.”"}]}], "alts": [{"id": "AF-1", "title": "Download the minutes as a Word file", "notes": [], "steps": [{"n": 1, "text": "At Step 1 or after saving, the actor downloads the minutes as a Word file. The current Chair and Secretary may download any revision; everyone else who may read the Meeting an issued or superseded one. (BR-139)"}, {"n": 2, "text": "The system checks that the actor may download that revision and that the Meeting is not Secret, and delivers the Word file built from the same content. (BR-132)"}, {"n": 3, "text": "The revision is unchanged. The use case ends."}]}, {"id": "AF-2", "title": "Download the minutes as a PDF file", "notes": [], "steps": [{"n": 1, "text": "At Step 1 or after saving, the actor downloads the minutes as a PDF file, with the same rights as in AF-1. (BR-139)"}, {"n": 2, "text": "The system checks that the actor may download that revision and that the Meeting is not Secret, and delivers the PDF file built from the same content. (BR-132)"}, {"n": 3, "text": "The revision is unchanged. The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Someone else saved first", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the draft was saved by another person after the actor read it."}, {"n": 2, "text": "Nothing is overwritten. The system displays MSG401 – “The minutes were just changed by someone else. Reload to see the latest version.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}, {"id": "EX-2", "title": "Content is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the content is empty, longer than 300,000 characters or not well formed."}, {"n": 2, "text": "Nothing is saved. The system displays MSG402 – “The minutes content is invalid.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-3", "title": "Minutes can no longer be changed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the revision is waiting for approval or has been issued."}, {"n": 2, "text": "Nothing is saved. The system displays MSG400 – “The minutes have been submitted or issued and can no longer be changed.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-131", "BR-132", "BR-135", "BR-136", "BR-139"], "msg": ["MSG396", "MSG400", "MSG401", "MSG402"], "cov": {"br": 5, "code": 4, "test": 3}}, "UC-72": {"id": "UC-72", "name": "Submit Meeting Minutes for Approval", "feature": "FE-12", "line": 2384, "extra": {}, "parent": null, "actors": "Secretary", "secondary": "Chair (notified)", "desc": "Allows the current Secretary to send the finished minutes to the current Chair for approval. From then on nobody can correct or rebuild the revision until the Chair approves or returns it. The Secretary cannot take back a revision once it is waiting for approval (out of scope). (BR-135, BR-136)", "pre": ["PRE-1: The actor is signed in and is the current Secretary of the Meeting. (BR-135, BR-136)", "PRE-2: The Meeting has Ended. (BR-135, BR-136)", "PRE-3: The latest revision of the minutes is a draft or was returned by the Chair. (BR-135, BR-136)"], "post": ["POST-1: The revision is waiting for approval, with who submitted it and when.", "POST-2: The revision can no longer be corrected or rebuilt.", "POST-3: The current Chair is notified.", "POST-4: The Meeting status is unchanged. (BR-137, BR-138)", "POST-5: If the submission fails, nothing changes and nobody is notified."], "normal": [{"id": "", "title": "Submit Meeting Minutes for Approval", "notes": [], "steps": [{"n": 1, "text": "The actor opens the minutes, chooses to submit them for approval and confirms."}, {"n": 2, "text": "The system checks the assignment, that the Meeting has Ended, that the latest revision is a draft or was returned, and that it is the copy the actor read. (BR-135, BR-136)"}, {"n": 3, "text": "The system marks the revision as waiting for approval, records who submitted it and when, and notifies the current Chair."}, {"n": 4, "text": "The system displays MSG424 – “Minutes submitted to the Chair for approval.”"}]}], "alts": [{"id": "AF-1", "title": "Places are still left blank", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the text still holds “……” where the Secretary was to write."}, {"n": 2, "text": "The system warns that some places are still blank and asks for confirmation; blanks do not block the submission."}, {"n": 3, "text": "The actor confirms and the flow resumes at Step 2 of the Normal Flow."}]}, {"id": "AF-2", "title": "Submit again after the Chair returned the minutes", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the latest revision was returned; the system shows the Chair's reason with the minutes. (BR-135, BR-136)"}, {"n": 2, "text": "The actor corrects the text (UC-71) or submits it unchanged."}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is the current Chair, not the Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is the current Chair but not the current Secretary. (BR-135, BR-136)"}, {"n": 2, "text": "The revision stays as it is. The system displays MSG425 – “Only the Secretary may submit the minutes for approval.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting has not ended", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is still InProgress. (BR-135, BR-136)"}, {"n": 2, "text": "The revision stays a draft. The system displays MSG426 – “The minutes can be submitted only after the meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Revision was already submitted or issued", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the latest revision is waiting for approval or has been issued."}, {"n": 2, "text": "Nothing changes. The system displays MSG400 – “The minutes have been submitted or issued and can no longer be changed.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-135", "BR-136", "BR-137", "BR-138"], "msg": ["MSG400", "MSG424", "MSG425", "MSG426"], "cov": {"br": 4, "code": 4, "test": 4}}, "UC-73": {"id": "UC-73", "name": "Approve and Issue Meeting Minutes", "feature": "FE-12", "line": 2395, "extra": {}, "parent": null, "actors": "Chair", "secondary": "Secretary, and everyone who may read the issued minutes (notified)", "desc": "Allows the current Chair to approve the minutes waiting for approval. Approval issues them at once: they are locked, the people who may read the Meeting are notified, and the issue is recorded in the audit log. (BR-135, BR-136, BR-137, BR-138, BR-010)", "pre": ["PRE-1: The actor is signed in and is the current Chair of the Meeting. (BR-135, BR-136)", "PRE-2: The latest revision of the minutes is waiting for approval."], "post": ["POST-1: The revision is issued, with who approved it and when, and can never be changed again. (BR-137, BR-138)", "POST-2: When the revision corrects an earlier issued one, the earlier one is marked superseded and stays readable. (BR-137, BR-138)", "POST-3: Everyone who may read the issued minutes except the Chair who issued them is notified. (BR-139)", "POST-4: The issue is recorded in the audit log with who issued it. (BR-010)", "POST-5: The Meeting stays Ended. (BR-137, BR-138)"], "normal": [{"id": "", "title": "Approve and Issue Meeting Minutes", "notes": [], "steps": [{"n": 1, "text": "The actor opens the minutes waiting for approval, from the notification or the Meeting, and reads them as they will be printed."}, {"n": 2, "text": "The actor chooses to approve and issue them and confirms."}, {"n": 3, "text": "The system checks the assignment, that the revision is still waiting for approval and that it is the copy the actor read. (BR-135, BR-136)"}, {"n": 4, "text": "The system marks the revision as issued and records who approved it and when. (BR-137, BR-138)"}, {"n": 5, "text": "The system records the issue in the audit log with who issued it. (BR-010)"}, {"n": 6, "text": "The system notifies everyone who may read the issued minutes, except the Chair who issued them and Guests, in the application and by email; a correction states its number. (BR-139)"}, {"n": 7, "text": "The system displays MSG427 – “Minutes approved and issued.”"}]}], "alts": [{"id": "AF-1", "title": "Issue a correction", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the revision corrects an earlier issued revision."}, {"n": 2, "text": "The system marks the earlier revision as superseded; it stays readable in the list of revisions. (BR-137, BR-138)"}, {"n": 3, "text": "The flow resumes at Step 5 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is the current Secretary, not the Chair", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor is the current Secretary but not the current Chair. (BR-135, BR-136)"}, {"n": 2, "text": "The revision stays as it is. The system displays MSG428 – “Only the Chair may approve or return the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Minutes are not waiting for approval", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the revision is a draft, was returned, or has already been issued."}, {"n": 2, "text": "Nothing changes. The system displays MSG429 – “These minutes are not waiting for approval.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Minutes changed after the actor opened them", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the revision is not the copy the actor read."}, {"n": 2, "text": "Nothing is issued. The system displays MSG401 – “The minutes were just changed by someone else. Reload to see the latest version.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}], "br": ["BR-010", "BR-135", "BR-136", "BR-137", "BR-138", "BR-139"], "msg": ["MSG401", "MSG427", "MSG428", "MSG429"], "cov": {"br": 6, "code": 6, "test": 6}}, "UC-74": {"id": "UC-74", "name": "Return Meeting Minutes for Revision", "feature": "FE-12", "line": 2406, "extra": {}, "parent": null, "actors": "Chair", "secondary": "Secretary (notified)", "desc": "Allows the current Chair to send the minutes waiting for approval back to the Secretary with a reason, so the Secretary can correct them and submit them again. Each return keeps only its own reason. (BR-135, BR-136)", "pre": ["PRE-1: The actor is signed in and is the current Chair of the Meeting. (BR-135, BR-136)", "PRE-2: The latest revision of the minutes is waiting for approval."], "post": ["POST-1: The revision is returned, with the reason, who returned it and when. (BR-135, BR-136)", "POST-2: The reason of this return replaces the reason of an earlier one. (BR-135, BR-136)", "POST-3: The current Chair and the current Secretary can correct the revision again and the Secretary can submit it again. (BR-135, BR-136)", "POST-4: The current Secretary is notified. If the return fails, nothing changes and nobody is notified."], "normal": [{"id": "", "title": "Return Meeting Minutes for Revision", "notes": [], "steps": [{"n": 1, "text": "The actor chooses to return the minutes waiting for approval."}, {"n": 2, "text": "The system asks for the reason; the actor enters it and confirms."}, {"n": 3, "text": "The system checks the assignment, that the revision is still waiting for approval, that it is the copy the actor read and that the reason is not empty and within 2,000 characters. (BR-135, BR-136)"}, {"n": 4, "text": "The system marks the revision as returned and records the reason, who returned it and when; the reason of any earlier return is replaced. (BR-135, BR-136)"}, {"n": 5, "text": "The system notifies the current Secretary."}, {"n": 6, "text": "The system displays MSG430 – “Minutes returned to the Secretary.”"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Actor is the current Secretary, not the Chair", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor is the current Secretary but not the current Chair. (BR-135, BR-136)"}, {"n": 2, "text": "The revision stays as it is. The system displays MSG428 – “Only the Chair may approve or return the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Minutes are not waiting for approval", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the revision is a draft, was returned, or has been issued."}, {"n": 2, "text": "Nothing changes. The system displays MSG429 – “These minutes are not waiting for approval.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Reason is missing or too long", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the reason is empty or longer than 2,000 characters. (BR-135, BR-136)"}, {"n": 2, "text": "Nothing changes. The system displays MSG431 – “Enter a reason for returning the minutes, up to 2,000 characters.”"}, {"n ed or superseded) but is neither the current Chair nor the current Secretary. (BR-131, BR-139)"}, {"n": 2, "text": "No revision is created. The system displays MSG397 – “Only the Chair or Secretary may write the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Selected revision is not issued", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the selected revision is a draft, waiting for approval, returned, or superseded by a later issued revision. (BR-137, BR-138)"}, {"n": 2, "text": "No revision is created. The system displays MSG433 – “Only issued minutes can be corrected.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "A correction is already in progress", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the selected revision is issued, but a later revision correcting it has not been issued yet, or a second actor starts a correction of the same revision at the same moment. (BR-137, BR-138)"}, {"n": 2, "text": "No second revision is created. The system displays MSG434 – “A correction of these minutes is already in progress.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-131", "BR-137", "BR-138", "BR-139"], "msg": ["MSG397", "MSG432", "MSG433", "MSG434"], "cov": {"br": 4, "code": 4, "test": 3}}, "UC-76": {"id": "UC-76", "name": "View Notifications", "feature": "FE-13", "line": 2430, "extra": {}, "parent": null, "actors": "System Admin, Member, Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authenticated user to view their list of in-app notifications and check the unread notification count.", "pre": ["PRE-1: The user is authenticated in the system."], "post": ["POST-1: The system displays the user's notifications and unread badge count.", "POST-2: Opening the notification list does not change any notification’s read status."], "normal": [{"id": "", "title": "View Notifications", "notes": [], "steps": [{"n": 1, "text": "The user selects the notification bell fro ernal account. (BR-149, BR-150)"], "post": ["POST-1: The actor sees the figures of the chosen period, computed only from the Meetings the actor may read. (BR-149, BR-150)", "POST-2: The manager figures show no meeting title, participant or content. In the queried table, a row grouped by person or by meeting shows only the person’s name or the meeting code and title — only for meetings the actor may read — and never the meeting content; a Guest appears by name only, without email. (BR-152)", "POST-3: Nothing in the system is changed."], "normal": [{"id": "", "title": "View Reports & Statistics", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Reports page."}, {"n": 2, "text": "The system selects the 12 months ending with the current month and the default table with its default grouping."}, {"n": 3, "text": "The system checks the period and the actor's choice of table, grouping, ordering, number of groups and filters."}, {"n": 4, "text": "The system counts the Meetings the actor may read whose planned start falls within the period and shows them per month, by status and by sensitivity, with the average attendance rate, the average meeting duration in minutes and the average time from the end of a Meeting to the issue of its minutes, each with the number of Meetings it is based on. (BR-149, BR-150, BR-151)"}, {"n": 5, "text": "The system shows the chosen table with only what the actor may see, grouped, ordered and limited to the chosen top groups, with a Total row. (BR-151, BR-153)"}]}], "alts": [{"id": "AF-1", "title": "Choose another period", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or after Step 5, the actor chooses a start month and an end month."}, {"n": 2, "text": "The flow resumes at Step 3 of the Normal Flow with that period."}]}, {"id": "AF-2", "title": "No Meeting in the period", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor may read no Meeting whose planned start falls within the period."}, {"n": 2, "text": "The system , Secretary, Participant", "secondary": "N/A", "desc": "Allows the actor to download the table shown on the page for the chosen period as an Excel file, to keep it or to work on it outside the system. The file is named bao-cao-<table>_<from>_<to>.xlsx. (BR-010)", "pre": ["PRE-1: The actor is signed in with an internal account. (BR-149, BR-150)", "PRE-2: The actor is on the Reports page with a period and a table chosen. (UC-79a)"], "post": ["POST-1: The actor receives an Excel file holding the same table as the page for that period and that query, with its Total row, computed at the time of export. (BR-010)", "POST-2: The file holds no meeting content; rows grouped by person or by meeting follow the same rule as UC-79a POST-2. (BR-152)", "POST-3: The export is recorded with the actor, the table, the grouping, the filters, the period and the time. (BR-010)"], "normal": [{"id": "", "title": "Export Report", "notes": [], "steps": [{"n": 1, "text": "The actor selects Export to Excel."}, {"n": 2, "text": "The system checks the period and the choices of the table shown."}, {"n": 3, "text": "The system builds the Excel file of that table with its Total row and records the export. (BR-152, BR-010)"}, {"n": 4, "text": "The actor receives the file."}]}], "alts": [{"id": "AF-1", "title": "No Meeting in the period", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor may read no Meeting in the period."}, {"n": 2, "text": "The file is still built, with zero counts and no averages."}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "The period is not valid", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the period is not valid."}, {"n": 2, "text": "No file is built. The system displays MSG463 – “The report period is invalid. Choose up to 24 months, with the start month not after the end month.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The report choice is not valid", "notes": [], "s e internal account different from the actor, that no Pending or Effective share of the owner’s calendar to the actor exists (else EX-2) and that the range is valid (else EX-3). A range is valid when it starts today or later, does not end before it starts and covers at most 365 days counting both ends. (BR-140, BR-141, BR-142, BR-143)"}, {"n": 3, "text": "The system saves the Pending share, records it in the audit log and notifies the owner. (BR-010) The system displays MSG435 – “Calendar share request sent.” The owner answers in UC-80c."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Requester has no right to create meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer a Member. (BR-140, BR-141)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG448 – “Only a Member can do this.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "A share already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a Pending or Effective share of the owner’s calendar to the actor already exists. (BR-142, BR-143)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG449 – “There is already a pending or effective share with this person.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Range is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the date range is invalid."}, {"n": 2, "text": "Nothing is saved. The system displays MSG443 – “The date range is invalid.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-010", "BR-140", "BR-141", "BR-142", "BR-143"], "msg": ["MSG435", "MSG443", "MSG448", "MSG449"], "cov": {"br": 5, "code": 5, "test": 5}}, "UC-80b": {"id": "UC-80b", "name": "Share Calendar Directly", "feature": "FE-15", "line": 2517, "extra": {}, "parent": "UC-80", "actors": "User — the calendar owner (every active internal account)", "secondary": "Member — the recipient", "desc": "Allows a calendar owner to share working hours directly with a Member, always at Level 1. The recipient answers in UC-80c; the recipient asks for Level 2 through UC-80d after accepting. (BR-140, BR-141, BR-142, BR-143)", "pre": ["PRE-1: The actor is signed in with an active internal account. (BR-140, BR-141)", "PRE-2: No share of the actor’s calendar to the recipient is Pending or Effective. (BR-142, BR-143)"], "post": ["POST-1: A Pending share at Level 1 exists and the recipient is notified. (BR-140, BR-141, BR-010)", "POST-2: No meeting content of the owner is disclosed either way. (BR-140, BR-141)"], "normal": [{"id": "", "title": "Share Calendar Directly", "notes": [], "steps": [{"n": 1, "text": "The actor chooses a recipient who is a Member and a date range; the level is always Level 1."}, {"n": 2, "text": "The system checks the recipient (active account, still a Member — else EX-1), that no Pending or Effective share of the actor’s calendar to the recipient exists (else EX-2) and that the range is valid (else EX-3). A range is valid when it starts today or later, does not end before it starts and covers at most 365 days counting both ends. (BR-140, BR-141, BR-142, BR-143)"}, {"n": 3, "text": "The system saves the Pending share at Level 1, records it in the audit log and notifies the recipient. (BR-010) The system displays MSG441 – “Calendar shared. Waiting for acceptance.” The recipient answers in UC-80c."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Recipient cannot receive a share", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the recipient is not a Member or is not active."}, {"n": 2, "text": "Nothing is saved. The system displays MSG455 – “This person cannot receive a calendar share.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "A share already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a Pending or Effective share of the actor’s calendar to the recipient already exists. (BR-142, BR-143)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG449 – “There is already a pending or effective share with this person.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Range is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the date range is invalid."}, {"n": 2, "text": "Nothing is saved. The system displays MSG443 – “The date range is invalid.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-010", "BR-140", "BR-141", "BR-142", "BR-143"], "msg": ["MSG441", "MSG443", "MSG449", "MSG455"], "cov": {"br": 5, "code": 5, "test": 5}}, "UC-80c": {"id": "UC-80c", "name": "Respond to Calendar Share", "feature": "FE-15", "line": 2528, "extra": {}, "parent": "UC-80", "actors": "User — the asked side (the calendar owner, for a UC-80a request or a UC-80d change; the receiving Member, for a UC-80b direct share)", "secondary": "The sender (receives a notification about the answer)", "desc": "Allows the asked person to accept or decline a calendar share request, a direct share or a pending change. Accepting a UC-80a request may lower the level or shorten the range. A Pending request whose sender’s account is deactivated can only be declined (BR-142, BR-143). (BR-140, BR-141, BR-142, BR-143, BR-010)", "pre": ["PRE-1: The actor is the asked side of a Pending share or pending change.", "PRE-2: The share or change is still Pending. (BR-142, BR-143)"], "post": ["POST-1: The share is Effective with the chosen level/range, or closed, or kept as it was for a declined change; the sender is notified in every case. (BR-010)", "POST-2: No meeting content of the owner is disclosed either way. (BR-140, BR-141)", "POST-3: Shares of other people stay invisible: asking about them discloses nothing about the other share or account."], "normal": [{"id": "", "title": "Respond to Calendar Share", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Pending request, from the notification or the list of shares, and sees who sent it, the level and the date range."}, {"n": 2, "text": "The system checks that the actor is the asked er range may keep the share's original start date and still covers at most 365 days counting both ends."}, {"n": 2, "text": "The system saves the pending change, audits and notifies the owner. MSG454 – “Calendar share change request sent.” The use case ends; the owner’s answer is UC-80c."}]}], "alts": [{"id": "AF-1", "title": "The owner lowers the level or changes the dates", "notes": [], "steps": [{"n": 1, "text": "At any time on an Effective share, the owner chooses a lower level or a new date range, even while the viewer has a change pending; that change stays pending and the owner still answers it in UC-80c."}, {"n": 2, "text": "The system applies it at once, audits and notifies the viewer. MSG442 – “Calendar share updated.”"}]}], "exs": [{"id": "EX-1", "title": "Actor is not one of the two people", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor is not one of the two people of this share."}, {"n": 2, "text": "Nothing changes and nothing about the share or account is disclosed."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Change is not allowed", "notes": [], "steps": [{"n": 1, "text": "At Step 1 (or AF-1 Step 1), the share is not Effective, or its end date has passed (BR-142, BR-143), or — at Step 1 only — the viewer already has a change pending. (BR-142, BR-143)"}, {"n": 2, "text": "Nothing changes. The system displays MSG450 – “This action is not allowed in the current state of the share.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Range is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 1 (or AF-1 Step 1), the new date range is invalid."}, {"n": 2, "text": "Nothing changes. The system displays MSG443 – “The date range is invalid.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow, or at Step 1 of AF-1."}]}], "br": ["BR-010", "BR-140", "BR-141", "BR-142", "BR-143"], "msg": ["MSG442", "MSG443", "MSG450", "MSG454"], "cov": {"br": 5, "code": 5, "test": 5}}, "UC-80e": {"i en the viewer lost the Member right, otherwise that the share no longer exists. The use case ends."}]}, {"id": "AF-4", "title": "A share changes while viewing", "notes": [], "steps": [{"n": 1, "text": "While the actor views either list, someone answers, changes or ends a share with the actor."}, {"n": 2, "text": "The actor sees the change without reloading the page."}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "exs": [], "br": ["BR-140", "BR-141", "BR-142", "BR-143"], "msg": ["MSG439"], "cov": {"br": 4, "code": 4, "test": 4}}, "UC-81": {"id": "UC-81", "name": "Find Meeting Time", "feature": "FE-15", "line": 2572, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-81a": {"id": "UC-81a", "name": "Find Meeting Time Slots", "feature": "FE-15", "line": 2574, "extra": {}, "parent": "UC-81", "actors": "Member (will become the Secretary of the meeting created in UC-81b)", "secondary": "User — the invitees (a person who has not shared is shown as not sharing)", "desc": "Allows a Member to find slots where everyone invited is free, using only shared calendars. From anyone shown “Calendar not shared”, the finder may start UC-80a. (BR-140, BR-141, BR-144, BR-145, BR-146, BR-147, BR-148)", "pre": ["PRE-1: The actor is signed in as a Member. (BR-140, BR-141)"], "post": ["POST-1: The actor sees common slots by day, or — when none fits everyone — the slots with the most people free and who is busy. Attendee names come from the actor’s own invite list; no meeting titles, locations, attendee lists or sensitivity levels are shown. (BR-144, BR-145, BR-140, BR-141)", "POST-2: Days outside a share and people who never shared show “unknown” / “Calendar not shared”, never free. (BR-144, BR-145)"], "normal": [{"id": "", "title": "Find Meeting Time Slots", "notes": [], "steps": [{"n": 1, "text": "The actor opens the meeting-time search and enters the invitees (at most 10 people besides the actor, optionally counting the actor's own calendar), the duration (15 minutes to 8 hours), the date range (starting today, no more than 365 days ahead and at most 31 days long), the weekdays, the working hours with a lunch break, the buffer kept around every busy period (0 to 4 hours) and the rounding step for start times (5 minutes to 2 hours)."}, {"n": 2, "text": "The system checks the search values."}, {"n": 3, "text": "The system builds each invitee's busy hours from the Effective shares of that invitee's calendar to the actor, at shared levels only, adds the actor's own Meetings when the actor asked to be counted, keeps the buffer around every busy period and never proposes a start time in the past; days outside a share are unknown. (BR-140, BR-141, BR-142, BR-143, BR-144, BR-145, BR-146, BR-147)"}, {"n": 4, "text": "The system lists the common slots by day."}]}], "alts": [{"id": "AF-1", "title": "No slot fits everyone", "notes": [], "steps": [{"n": 1, "text": "At Step 4, no slot fits all invitees."}, {"n": 2, "text": "The system shows the slots with the most people free, with who is busy, per day. MSG445 – “No time slot fits everyone. Showing the slots with the most people free.”"}]}], "exs": [{"id": "EX-1", "title": "Search parameters are invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the search values are outside the limits of Step 1 (too many people, bad duration, range over 31 days, bad hours/buffer/step)."}, {"n": 2, "text": "Nothing is searched. The system displays MSG444 – “The meeting-time search is invalid. Check the highlighted fields.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}, {"id": "EX-2", "title": "Actor has no right to create meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer a Member."}, {"n": 2, "text": "Nothing is searched. The system displays MSG448 – “Only a Member can do this.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-140", "BR-141", "BR-142", "BR-143", "BR-144", "BR-145", "BR-146", "BR-147", "BR-148"], "msg": ["MSG444", "MSG445", "MSG448"], "cov": {"br": 9, "code": 9, "test": 9}}, "UC-81b": {"id": "UC-81b", "name": "Create Draft Meeting from Slot", "feature": "FE-15", "line": 2585, "extra": {}, "parent": "UC-81", "actors": "Member (the finder in UC-81a, will become the Secretary of the created meeting)", "secondary": "User — the invitees in the chosen slot", "desc": "Allows a Member to create a Draft meeting from a slot found in UC-81a, reusing the UC-13 creation flow. A slot that overlaps an undisclosed Secret meeting still allows a draft; the recheck before saving uses the same shared data. (BR-148)", "pre": ["PRE-1: The actor is signed in as a Member. (BR-140, BR-141)", "PRE-2: The actor has just found the slot in UC-81a."], "post": ["POST-1: A chosen slot creates a Draft meeting through UC-13 (MSG29) with the first listed person as Chair, the rest as Member and the actor as Secretary; it follows the normal approval flow.", "POST-2: No signal — no distinct error, warning, notification or audit — differs only because a Secret meeting overlaps. (BR-148)"], "normal": [{"id": "", "title": "Create Draft Meeting from Slot", "notes": [], "steps": [{"n": 1, "text": "The actor chooses a slot; the system opens the meeting form filled in with the slot and the invitees."}, {"n": 2, "text": "The actor confirms; the system checks the slot again against the same shared data as the UC-81a search, never against undisclosed meetings. (BR-148)"}, {"n": 3, "text": "The system creates the Draft meeting through the creation steps of UC-13: the first listed invitee becomes Chair, the others Members and the actor Secretary. A value UC-13 rejects, such as a start time that has passed since the search, follows UC-13 EX-1."}, {"n": 4, "text": "The system displays MSG29 – “Meeting created successfully.” The meeting follows the normal approval flow."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Slot is no longer free", "notes": [], "steps": [{"n": 1, "t ng starts in Draft; its planned start is later than now and its planned end is later than its planned start.", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:43", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:39", "frontend/src/features/meetings/MeetingForm.tsx:178", "frontend/src/features/meetings/MeetingForm.tsx:187", "frontend/src/features/meetings/MeetingForm.tsx:187"], "test": ["tests/TrustCabinet.Web.Tests/Meetings/MeetingEndpointsTests.cs:129"], "ucs": ["UC-13", "UC-14", "UC-17"]}, "BR-014": {"text": "Meeting information can be edited only in Draft or Rejected; editing does not change the status.", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:34"], "test": [], "ucs": ["UC-14"]}, "BR-015": {"text": "For a Published Meeting, only the Member who created it changes the schedule or the location; the new start must be later than now.", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:34", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:40", "backend/TrustCabinet.Application/Meetings/MeetingService.cs:270", "frontend/src/types/meeting.ts:49", "frontend/src/features/meetings/MeetingForm.tsx:187", "frontend/src/features/meetings/MeetingForm.tsx:269"], "test": [], "ucs": ["UC-14"]}, "BR-016": {"text": "Only the Member who created the Meeting, its Approver, the Chair, the Secretary or a participant of a Meeting can access that Meeting.", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:63", "frontend/src/features/calendar/CalendarFilter.tsx:27", "frontend/src/features/calendar/useSchedule.ts:23"], "test": [], "ucs": ["UC-15", "UC-16", "UC-26", "UC-29", "UC-30b", "UC-32", "UC-62a", "UC-62b", "UC-78"]}, "BR-017": {"text": "The participant list and the invitation responses are shown only to people who can view the Meeting.", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:63", "frontend/src/features/calendar/CalendarFilter.tsx:27", "frontend/src/features/calendar/useSchedule.ts:23"], "test": [], "u s read-only.", "code": [], "test": [], "ucs": ["UC-30a", "UC-30b", "UC-30c"]}, "BR-038": {"text": "An internal participant is an active account and appears at most once in a Meeting.", "code": [], "test": [], "ucs": ["UC-30a"]}, "BR-039": {"text": "Each participant has exactly one meeting role, Chair, Secretary or Member, independent of their system role.", "code": [], "test": [], "ucs": ["UC-30a"]}, "BR-040": {"text": "A Meeting has at most one Chair; a Published or InProgress Meeting always has a Chair and at least one Secretary.", "code": [], "test": [], "ucs": ["UC-30a", "UC-30b", "UC-30c"]}, "BR-041": {"text": "Before publication, the Secretary assigns or changes the Chair.", "code": [], "test": [], "ucs": ["UC-30b", "UC-30c", "UC-34"]}, "BR-042": {"text": "From publication, only the current Chair hands the Chair role to an active internal participant who is not a Secretary, and the former Chair becomes a Member; if the Chair is deactivated, the Secretary may replace them.", "code": [], "test": [], "ucs": ["UC-30b", "UC-30c", "UC-34"]}, "BR-043": {"text": "A role change does not change the invitation response or the attendance; response and attendance are independent of each other.", "code": [], "test": [], "ucs": ["UC-30b", "UC-31", "UC-33"]}, "BR-044": {"text": "Removing a participant or revoking a Guest invitation ends the access gained through that relationship; other independent access remains.", "code": [], "test": [], "ucs": ["UC-30a", "UC-30c", "UC-35a", "UC-35b", "UC-38", "UC-43"]}, "BR-045": {"text": "The responses and attendance of a removed person are kept as history and do not count towards the current list, access or role counts.", "code": [], "test": [], "ucs": ["UC-29", "UC-30c"]}, "BR-046": {"text": "Only the invitee answers an invitation, only Accepted or Declined, once, while the Meeting is Published or InProgress, and cannot change it; the Chair does not answer.", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-047": {"text": "An invitation not yet answered counts as attending.", "code": [], "test": [], "ucs": ["UC-16", "UC-23a", "UC-23b", "UC-31"]}, "BR-048": {"text": "Declining only hides the Meeting from that person's calendar; it does not change their role or access, including reading documents.", "code": [], "test": [], "ucs": ["UC-16", "UC-23a", "UC-23b", "UC-31"]}, "BR-049": {"text": "A Guest is a meeting-specific invitation, not an internal participant.", "code": [], "test": [], "ucs": ["UC-30a", "UC-31"]}, "BR-050": {"text": "A Guest has no system role and cannot be the Chair or a Secretary.", "code": [], "test": [], "ucs": ["UC-30a", "UC-31"]}, "BR-051": {"text": "Within one Meeting an email has at most one Guest invitation, and no Guest invitation is made for the email of an internal participant.", "code": [], "test": [], "ucs": ["UC-30a", "UC-31"]}, "BR-052": {"text": "A Guest enters through their own invitation, only into that Meeting, without an internal account.", "code": ["backend/TrustCabinet.Domain/Entities/GuestSession.cs:6", "frontend/src/components/NotFound.tsx:12", "frontend/src/features/guest/GuestMeetingPage.tsx:43", "frontend/src/features/guest/GuestPage.tsx:40"], "test": [], "ucs": ["UC-04", "UC-19", "UC-29", "UC-30a", "UC-31", "UC-43"]}, "BR-053": {"text": "A Guest must prove control of the invited email address.", "code": ["backend/TrustCabinet.Domain/Audit/AuditRuleTypes.cs:90", "backend/TrustCabinet.Domain/Entities/GuestVerificationChallenge.cs:6", "backend/TrustCabinet.Application/Email/EmailTemplates.cs:112", "backend/TrustCabinet.Application/GuestAccess/GuestAccessOptions.cs:24", "backend/TrustCabinet.Application/Retention/RetentionOptions.cs:27"], "test": [], "ucs": ["UC-04", "UC-19", "UC-30a", "UC-30c", "UC-31", "UC-35a", "UC-35b", "UC-38", "UC-43"]}, "BR-054": {"text": "Guest access lasts 12 hours from verification without extension, and ends earlier on sign-out, invitation revocation or the end of the Meeting.", "code": ["backend/TrustCabinet.Domain/Audit/AuditRuleTy d deletes collected samples, only of people who consented, and asks the person at each collection.", "code": [], "test": [], "ucs": ["UC-56a", "UC-56b", "UC-56c", "UC-56d", "UC-56e", "UC-57a", "UC-57b", "UC-57c", "UC-57d"]}, "BR-120": {"text": "Speaker suggestions compare only consenting people on the current list, are shown only to the Secretary, never suggest a Guest, and are assigned only to people on the list.", "code": [], "test": [], "ucs": ["UC-54a", "UC-55b", "UC-56b", "UC-56c"]}, "BR-121": {"text": "Audio and voice samples are processed inside the system and never sent to an outside service.", "code": [], "test": [], "ucs": ["UC-54a", "UC-56b", "UC-56c", "UC-57b"]}, "BR-122": {"text": "The combined recording is only for listening and downloading, and is never transcribed.", "code": [], "test": [], "ucs": ["UC-51a", "UC-54a"]}, "BR-123": {"text": "The system fills in a name when a voice clearly matches a consenting person on the current list.", "code": [], "test": [], "ucs": ["UC-54a", "UC-55b", "UC-56b", "UC-56c"]}, "BR-124": {"text": "Only people who consented to notice version 1.2 or later have names filled in automatically, others are only suggested; collection on someone's behalf needs version 1.4.", "code": [], "test": [], "ucs": ["UC-56a", "UC-56b", "UC-57b"]}, "BR-125": {"text": "When transcription runs again, hand-assigned names, corrected text and moved sentences carry over to the matching sentence or voice.", "code": [], "test": [], "ucs": ["UC-52a", "UC-52d", "UC-54a", "UC-55a", "UC-55b"]}, "BR-126": {"text": "Only the Chair or the Secretary requests, edits and reviews the AI draft, only when the Meeting is Ended and has at least one recorded sentence.", "code": [], "test": [], "ucs": ["UC-58", "UC-59", "UC-60", "UC-61"]}, "BR-127": {"text": "Other people read the AI draft only after it has been reviewed.", "code": [], "test": [], "ucs": ["UC-58", "UC-59", "UC-60", "UC-61"]}, "BR-128": {"text": "The AI writes only from the meeting record; it does const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function refs(list, cls) {

}

function inspect(id) {

  const list = Object.entries(D.msgs).filter(([id, r]) => matches((id + ' ' + r.content + ' ' + r.context).toLowerCase(), q)).sort((a, b) => num(a[0]) - num(b[0]));
  return `<h2>Thông báo hệ thống</h2><div class="sub">${list.length} thông báo</div>
  <table><tr><th>MSG</th><th>Loại</th><th>Nội dung</th><th>UC</th><th>Dấu vết</th></tr>${list.map(([id, r]) => `<tr class="row" data-k="${id}"><td>${link(id)}</td><td>${esc(r.type)}</td><td>${esc(r.content)}</td><td>${r.ucs.map(u => link(u)).join(' ')}</td><td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`).join('')}</table>`;
}

/* ---------- routing ---------- */
function render() {
  const [tab, id] = (location.hash.slice(1) || 'home').split('/');
  state.tab = tab === 'br' || tab === 'msg' ? tab : tab === 'uc' ? 'uc' : 'home'; state.id = id || null;
  $('#tabs').innerHTML = [['home', 'Tổng quan'], ['br', 'Luật (BR)'], ['msg', 'Thông báo (MSG)']]
    .map(([k, t]) => `<a href="#${k}" class="${state.tab === k || (k === 'home' && state.tab === 'uc') ? 'on' : ''}">${t}</a>`).join('');
  $('#main').innerHTML = state.tab === 'uc' ? viewUC(id) : state.tab === 'br' ? viewBR() : state.tab === 'msg' ? viewMSG() : viewHome();
  renderSide();
  if (state.tab === 'br' && id && D.rules[id]) inspect(id); else inspect(state.sel && document.querySelector(`.chip[data-k="${state.sel}"]`) ? state.sel : null);
  $('#main').scrollTop = 0;
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); const row = e.target.closest('tr.row'); const fb = e.target.closest('[data-cov]');
  if (fb) { state.cov = fb.dataset.cov; $('#main').innerHTML = viewBR(); return; }
  if (chip) { const k = chip.dataset.k; if (!k) return;
    if (k.startsWith('UC')) { location.hash = '#uc/' + k; return; } e.preventDefault(); inspect(k); return; }
  if (row) inspect(row.dataset.k);
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); const keep = state.sel; render(); if (keep) inspect(keep); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
