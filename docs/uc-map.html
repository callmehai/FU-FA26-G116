"The actor opens the Participants tab of an accessible Meeting."}, {"n": 2, "text": "The system checks that the actor may view responses. (BR-176)"}, {"n": 3, "text": "The system displays each current invitee’s name and email with a label for the response given, Accepted or Declined; an invitee who has not answered and the Chair have no label. No totals by status are shown. Response-view permission includes identity in response rows but does not grant roster browsing or search. (BR-103, BR-115, BR-176, BR-321)"}, {"n": 4, "text": "The actor reviews the responses."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Responses are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor lacks current Meeting access or permission to view invitation responses."}, {"n": 2, "text": "The system does not disclose response identities or responses and returns the generic not-found result required for inaccessible Meeting data. The use case ends unsuccessfully. (BR-121)"}]}, {"id": "EX-2", "title": "Responses cannot be retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot retrieve the current response data."}, {"n": 2, "text": "No partial response list is presented as complete. The system displays MSG95 – “Unable to load meeting participants. Please try again.”"}, {"n": 3, "text": "The use case ends unsuccessfully; the actor may retry by reopening the Participants tab."}]}], "br": ["BR-103", "BR-115", "BR-121", "BR-176", "BR-321"], "msg": ["MSG95"], "cov": {"br": 5, "code": 0, "test": 0}}, "UC-31": {"id": "UC-31", "name": "Record Attendance", "feature": "FE-06", "line": 1406, "extra": {}, "parent": null, "actors": "Secretary", "secondary": "None", "desc": "Allows the assigned Secretary to record or revise attendance for one or more selected current internal participants or Guests while the Meeting is InProgress.", "pre": ["PRE-1: The actor is an active current assigned Secretary.", "PRE-2: The Meeting is InProgress. (BR-170)"], "post": ["POST-1: Submitted people have Present or Absent saved with the recording Secretary and save time.", "POST-2: Unsubmitted people retain their saved value or remain unmarked; Invitation Responses are unchanged.", "POST-3: All submitted changes succeed together or none are saved. Attendance completeness never gates End Meeting. (BR-116, BR-171, BR-172, BR-178)"], "normal": [{"id": "", "title": "Record Attendance", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens Attendance for an InProgress Meeting: the Attendance column of the participant table on the Meeting detail page, or the Attendance panel in the online meeting room."}, {"n": 2, "text": "The system displays current internal participants and Guests with saved attendance; never-recorded people remain unmarked. Each person’s attendance carries its own version. No Present/Absent totals are shown. (BR-172)"}, {"n": 3, "text": "The Secretary selects Present or Absent for one or more people and submits only those entries."}, {"n": 4, "text": "The system rechecks current authority, Meeting status, submitted people’s current membership, that each submitted person’s attendance version is still current, and each submitted value. Omitted people are not treated as validation errors. (BR-170–BR-172)"}, {"n": 5, "text": "The system saves all submitted changes together, records the Secretary and save time, preserves every omitted person’s saved or unmarked value, and displays MSG147 – “Meeting attendance saved successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Revise saved attendance", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Secretary changes the saved attendance for one or more current people."}, {"n": 2, "text": "The system applies the same validation and atomic-save rules at Steps 4–5. (BR-172)"}]}, {"id": "AF-2", "title": "Record the full roster", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Secretary selects every current internal participant and Guest."}, {"n": 2, "text": "The system applies the same validation and atomic-save rules at Steps 4–5. A full-roster submission is optional; it is not required to save attendance or end the Meeting. (BR-172)"}]}], "exs": [{"id": "EX-1", "title": "Submitted attendance value is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, a submitted value is not Present or Absent."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG148 – “Select Present or Absent for each submitted participant or Guest.” The Secretary corrects the value and resumes at Step 3."}]}, {"id": "EX-2", "title": "Meeting is no longer InProgress", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting changed from InProgress before the submission was saved."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG149 – “Attendance can only be recorded while the meeting is in progress.” The use case ends unsuccessfully."}]}, {"id": "EX-3", "title": "Secretary is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the active current assigned Secretary."}, {"n": 2, "text": "No submitted change is saved. The system denies the operation under current authorization; existing attendance remains unchanged. The use case ends unsuccessfully."}]}, {"id": "EX-4", "title": "A submitted person is no longer current or their attendance has changed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, one or more submitted internal participants were removed, the Guest invitation was revoked, or another Secretary changed the person’s attendance after the roster was displayed."}, {"n": 2, "text": "No submitted change is saved and no unsaved selection is kept. The system displays MSG151 – “The participant or attendance data has changed. Please reload and review before saving.” The system reloads the roster and the Secretary selects again, resuming at Step 2. Unrelated new roster entries, and changes to a person’s role or invitation response, do not invalidate the submission. (BR-172)"}]}, {"id": "EX-5", "title": "Attendance cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot persist all submitted changes."}, {"n": 2, "text": "Attendance is never saved in part. If the connection was lost while saving, the outcome cannot be confirmed."}, {"n": 3, "text": "The system displays MSG150 – “Unable to confirm the attendance save result. Please reload the data before trying again.” The Secretary reloads attendance to see what was saved. The use case ends unsuccessfully."}]}, {"id": "EX-6", "title": "Attendance cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the attendance of the Meeting."}, {"n": 2, "text": "No attendance is changed. The system displays MSG289 – “Unable to load attendance data.” The failed load is not presented as an empty or unmarked roster. The use case ends unsuccessfully."}]}], "br": ["BR-116", "BR-170", "BR-171", "BR-172", "BR-178"], "msg": ["MSG147", "MSG148", "MSG149", "MSG150", "MSG151", "MSG289"], "cov": {"br": 5, "code": 0, "test": 0}}, "UC-73": {"id": "UC-73", "name": "Hand Over Chair to Another Participant", "feature": "FE-06", "line": 1419, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the current Chair to give the Chair role to another internal participant in one step, for example before leaving the Meeting. The system changes both roles together: the selected participant becomes Chair and the former Chair becomes Member. The Chair does not need to change his or her own role separately.", "pre": ["PRE-1: The actor is signed in and is the current Chair of the Meeting.", "PRE-2: The Meeting is Published or InProgress. (BR-126)"], "post": ["POST-1: The selected participant is the Chair and the former Chair is a Member, saved together. (BR-169)", "POST-2: The Meeting still has exactly one Chair and its required Secretary. System Roles, Invitation Responses, attendance and recorded ballots remain unchanged. (BR-126, BR-169)", "POST-3: The new Chair is notified in the application. The former Chair, who made the change, is not notified in the application but still receives the email. (BR-92, BR-322)"], "normal": [{"id": "", "title": "Hand Over Chair to Another Participant", "notes": [], "steps": [{"n": 1, "text": "The Chair opens the Meeting participant list and selects Change role on the row of the participant who will receive the Chair role."}, {"n": 2, "text": "The system displays the Meeting Roles as a list of options, each with a short description of what the role allows. The Chair option appears only for a current active internal participant who is neither a Guest nor the current Secretary. (BR-295)"}, {"n": 3, "text": "The Chair selects the Chair option and confirms with Hand over Chair."}, {"n": 4, "text": "The system rechecks that the actor is still the current Chair, the Meeting is Published or InProgress, and the selected person can still receive the Chair role. (BR-126, BR-295)"}, {"n": 5, "text": "The system changes the selected participant to Chair and the former Chair to Member in the same save. (BR-169)"}, {"n": 6, "text": "The system notifies the new Chair in the application. The former Chair, who made the change, is not notified in the application but still receives the email. A notification failure does not undo the saved change. (BR-92, BR-322)"}, {"n": 7, "text": "The system displays MSG257 – \"Chair role handed over successfully.\" The former Chair stays in the Meeting as a Member and may leave the meeting room. (BR-296)"}]}], "alts": [{"id": "AF-1", "title": "No participant can receive the Chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting has no current active internal participant other than the Chair and the Secretary."}, {"n": 2, "text": "The system offers the Chair option on no participant's row and displays no message. No role changes. MSG258 is returned by the API but is not displayed on the screen."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Selected participant can no longer receive the Chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected person was removed from the Meeting, became the Secretary or is no longer an active internal user. (BR-295)"}, {"n": 2, "text": "No role is changed. The system displays MSG259 – \"The selected participant can no longer receive the Chair role. Select another participant.\""}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-2", "title": "Hand-over is no longer permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Chair, or the Meeting is no longer Published or InProgress."}, {"n": 2, "text": "No role is changed. The system displays MSG260 – \"You can no longer hand over the Chair role for this meeting.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Hand-over cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot save both role changes."}, {"n": 2, "text": "Both people keep their previous roles; no notification is sent. The system displays MSG102 – \"Unable to update the meeting role. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-92", "BR-126", "BR-169", "BR-295", "BR-296", "BR-322"], "msg": ["MSG102", "MSG257", "MSG258", "MSG259", "MSG260"], "cov": {"br": 6, "code": 0, "test": 0}}, "UC-32": {"id": "UC-32", "name": "View Meeting Documents", "feature": "FE-07", "line": 1434, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-32a": {"id": "UC-32a", "name": "View Meeting Documents", "feature": "FE-07", "line": 1436, "extra": {}, "parent": "UC-32", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to browse the documents currently attached to one Meeting. Guest document access follows Participant rules. (BR-181, BR-205)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected Meeting exists and the user can currently view the Meeting. (BR-181, BR-275, BR-153, BR-155, BR-157)"], "post": ["POST-1: Only currently attached documents available to the user are displayed.", "POST-2: Meeting documents, personal libraries and Meeting status remain unchanged."], "normal": [{"id": "", "title": "View Meeting Documents", "notes": [], "steps": [{"n": 1, "text": "The user opens the Documents tab of the selected Meeting."}, {"n": 2, "text": "The system checks the user's current permission to view the Meeting, including the current invitation for a Guest. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. Guest access through a verified invitation belongs to UC-04 and is not built in this version. (BR-181, BR-275, BR-200)"}, {"n": 3, "text": "The system displays the Meeting documents grouped by Agenda Item, in agenda order, with their names, file types, the people who added them and comment counts. A document linked to several Agenda Items appears under each of them; a document with no Agenda Item link appears as a general Meeting document. Removed documents are excluded. Agenda Items with no documents are listed as well, so a document can still be attached to them (UC-33b). The list refreshes by itself when the system announces that the Meeting's document list has changed. After the Meeting ends, documents and comments are read-only. (BR-211, BR-277, BR-280, BR-282)"}, {"n": 4, "text": "The user reviews the displayed groups or empty result, and may switch to another grouping or finish viewing. Selecting a document opens UC-32c."}]}], "alts": [{"id": "AF-1", "title": "View by Vote or general documents", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses to view the documents attached to Votes, or the general Meeting documents. The Vote grouping is the target and is not built in this version: it appears when a document can be attached to a Vote (UC-74, SCRUM-96)."}, {"n": 2, "text": "The system displays the documents attached to each Vote of the Meeting, with the user's read confirmation for each, or only the documents with no Agenda Item link. (BR-280, BR-291)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-2", "title": "No documents to display", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting has no currently attached documents, or the grouping chosen in AF-1 has no documents."}, {"n": 2, "text": "The system displays an empty result and explains that no documents are available for the current grouping."}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-3", "title": "View documents from the online meeting room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the user is in the online meeting room of an InProgress Meeting and opens the room's Documents panel instead of the Documents tab."}, {"n": 2, "text": "The system applies the same access check and displays the same documents, starting with the current Agenda Item: the server marks which Item is current and the panel places it first, leaving the order the server returns unchanged. Adding, linking and removing documents are not offered in the panel. (BR-275, BR-316)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow; selecting a document opens UC-32c without leaving the room. (BR-315)"}]}], "exs": [{"id": "EX-1", "title": "Meeting documents are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the user can no longer view the Meeting, including removal of a participant or revocation or expiry of a Guest invitation."}, {"n": 2, "text": "No document names or contents are disclosed. No Meeting information is changed. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Document list cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot retrieve the available document list."}, {"n": 2, "text": "No Meeting information is changed. The system displays MSG157 – “Unable to load the document list. Please try again.”; the failed load is not presented as an empty list."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-153", "BR-155", "BR-157", "BR-181", "BR-200", "BR-205", "BR-211", "BR-275", "BR-277", "BR-280", "BR-282", "BR-291", "BR-315", "BR-316"], "msg": ["MSG156", "MSG157"], "cov": {"br": 14, "code": 8, "test": 4}}, "UC-32c": {"id": "UC-32c", "name": "Preview Meeting Document", "feature": "FE-07", "line": 1447, "extra": {}, "parent": "UC-32", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to read a Meeting document online and download the same file when permitted. Comments are covered separately in UC-35. Guest access through a verified invitation belongs to UC-04 and is not built in this version. (BR-181, BR-188)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected document is currently attached to the Meeting and the user can currently view the Meeting. (BR-181, BR-211, BR-275, BR-153, BR-155, BR-157)"], "post": ["POST-1: The selected document is displayed for online reading; in AF-1, the user also receives the permitted download.", "POST-2: The file content, its Meeting association and its comments remain unchanged.", "POST-3: When the user reaches the last page in the viewer, the system records it for that user and document; this enables read confirmation in UC-74. This recording is not built in this version: it belongs to UC-74 (SCRUM-96). (BR-290)"], "normal": [{"id": "", "title": "Preview Meeting Document", "notes": [], "steps": [{"n": 1, "text": "The user selects a document in the Meeting Documents tab, the documents of an Agenda Item, or the Documents panel of the online meeting room."}, {"n": 2, "text": "The system checks current permission to view the Meeting and that the document is still attached to this Meeting. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. (BR-181, BR-211, BR-275, BR-200)"}, {"n": 3, "text": "The system opens the document viewer and displays the file name, its content and the Meeting sensitivity, which the screen takes from the Meeting details. A viewer opened from the online meeting room opens separately, so the user stays in the room. For a Confidential or Secret Meeting, the system records the view in the audit log before it sends the file; if that entry cannot be written, no content is sent and EX-2 applies. (BR-315, BR-318)"}, {"n": 4, "text": "The user reads the document. When the user scrolls to the last page, the system records it and, for a Vote document, offers read confirmation through UC-74; that recording is not built in this version (UC-74, SCRUM-96). (BR-290) After the Meeting ends, the document and comments are read-only. Downloading remains available when the Meeting is not Secret. (BR-188, BR-282) Known risk: for a Secret Meeting only Download is blocked. Viewing still delivers the original file to the browser, so a technically skilled user can save it; each view is recorded in the audit log. (BR-188, BR-318)"}]}], "alts": [{"id": "AF-1", "title": "Download the document", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses Download for a Meeting that is not Secret."}, {"n": 2, "text": "The system rechecks current access, that the document remains attached and the current Meeting sensitivity. (BR-181, BR-211, BR-188, BR-275, BR-200)"}, {"n": 3, "text": "The system provides the same uploaded file to the user and, for a Confidential Meeting, records the download in the audit log. (BR-183, BR-216, BR-318)"}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Document is no longer accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, or during the access check in AF-1, the document was removed or the user can no longer view the Meeting."}, {"n": 2, "text": "No further document content or download is provided. The file and Meeting remain unchanged. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Preview cannot be displayed", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot display the selected file."}, {"n": 2, "text": "The document remains attached and its content is unchanged. The system displays MSG158 – “Unable to display the document. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Download is prohibited", "notes": [], "steps": [{"n": 1, "text": "During Step 2 of AF-1, the Meeting is Secret, including when its sensitivity changed after the viewer opened."}, {"n": 2, "text": "No download is provided. The document remains unchanged. The system displays MSG159 – “Secret Meeting documents can only be viewed online and cannot be downloaded.” (BR-188)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow for online reading."}]}, {"id": "EX-4", "title": "Download cannot be provided", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-1, the system cannot provide the file."}, {"n": 2, "text": "The file and its Meeting association remain unchanged. The system displays MSG160 – “Unable to download the document. Please try again.”"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "br": ["BR-153", "BR-155", "BR-157", "BR-181", "BR-183", "BR-188", "BR-200", "BR-211", "BR-216", "BR-275", "BR-282", "BR-290", "BR-315", "BR-318"], "msg": ["MSG156", "MSG158", "MSG159", "MSG160"], "cov": {"br": 14, "code": 9, "test": 5}}, "UC-33": {"id": "UC-33", "name": "Manage Meeting Documents", "feature": "FE-07", "line": 1458, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-33a": {"id": "UC-33a", "name": "Add Document to Meeting", "feature": "FE-07", "line": 1460, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to add one or more documents from their own personal library or computer to a Meeting in one submission; files from the computer are added one at a time. Linking documents to Agenda Items is handled separately in UC-33b. (BR-184, BR-209, BR-286)", "pre": ["PRE-1: The actor is signed in and is the current Chair or Secretary of the selected Meeting.", "PRE-2: The actor can currently view the Meeting. (BR-184, BR-195)", "PRE-3: The Meeting has not ended. (BR-185, BR-195)"], "post": ["POST-1: All submitted documents appear in the Meeting as general documents, with their names copied at addition and the actor and addition time recorded. (BR-197, BR-276, BR-286)", "POST-2: Selected personal-library documents stay unchanged. Files uploaded from the computer are also available in the uploader's personal library. (BR-194, BR-210)", "POST-3: A removed document added again is a new addition without its previous comments. (BR-212, BR-276, BR-284)", "POST-4: Each file uploaded from the computer is added as a whole or not at all, and a file that cannot be added does not stop the other files. Documents chosen from the personal library are added together or none are. Existing documents and Meeting status remain unchanged. (BR-286)"], "normal": [{"id": "", "title": "Add Documents from Personal Library", "notes": [], "steps": [{"n": 1, "text": "The Chair or Secretary opens Meeting Documents and chooses Add Documents."}, {"n": 2, "text": "The system offers selection from the actor's personal library or upload from the computer."}, {"n": 3, "text": "The actor selects one or more documents from their own library and submits them together."}, {"n": 4, "text": "The system checks the current Chair or Secretary, Meeting access and status, and ownership and availability of every selected document. It checks that none is already attached to this Meeting. (BR-184, BR-193, BR-195, BR-209)"}, {"n": 5, "text": "The system adds all selected documents to the Meeting under their current names and records who added them and when. Personal-library documents stay unchanged; readded documents do not recover old comments. If any addition fails, none of the submitted additions are saved. (BR-197, BR-276, BR-284, BR-286)"}, {"n": 6, "text": "The system refreshes the document list, shows the number added and displays MSG161 – “Documents added to the Meeting successfully.”."}]}], "alts": [{"id": "AF-1", "title": "Upload files from the computer", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor selects one or more files from the computer. The browser queues them and sends them one at a time, each as its own submission. The 10-file and 200 MB limits apply to the files chosen at once. (BR-286, BR-319)"}, {"n": 2, "text": "Before reading any file, the system performs the authority, Meeting access and status checks from Step 4 of the Main Flow. An actor who is not the current Chair or Secretary receives MSG162 whatever the files are. (BR-184, BR-195)"}, {"n": 3, "text": "The system checks that the submission has at most 10 files totalling at most 200 MB, and that every file is no larger than 50 MB and is a valid PDF or DOCX: its extension is .pdf or .docx and matches its actual content. It identifies any file that fails validation. (BR-187, BR-214, BR-215, BR-319)"}, {"n": 4, "text": "The system checks that the file fits within the 10 GB storage limit of the whole system. It then adds the file to the Meeting and the uploader's personal library together. A newly created or recreated Meeting folder uses the Meeting title and planned start date in Vietnam time; an existing folder is reused. (BR-192, BR-194, BR-210, BR-226, BR-227, BR-228, BR-286, BR-333)"}, {"n": 5, "text": "If the file cannot be added, it is added to neither place and EX-5 applies; the other files in the queue continue. A file that fails the checks of Step 3 follows EX-3 instead. Otherwise, the flow resumes at Step 6 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the actor can still view the Meeting but is no longer its current Chair or Secretary."}, {"n": 2, "text": "None of the submitted documents are added. The system displays MSG162 – “You no longer have permission to add documents to this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Library selection is missing or unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, no document was selected, or any selected document is unavailable or does not belong to the actor."}, {"n": 2, "text": "None are added. The system identifies the unavailable selections within the actor's library and displays MSG249 – “Select one or more available documents from your personal library.”."}, {"n": 3, "text": "The actor revises the selection. The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-3", "title": "Uploaded file is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-1, no file was received, the request is not a valid file upload, or one or more files are empty, exceed 50 MB each, are not valid PDF/DOCX files, or carry a file name that cannot be used: the name is empty, longer than 255 characters, or contains control or invisible formatting characters. The extension must be .pdf or .docx and must match the file's content, and a PDF must begin with its PDF header. (BR-187, BR-214, BR-215)"}, {"n": 2, "text": "None of the submitted documents are added to the Meeting or personal library. The system identifies the invalid files and displays MSG164 – “Select valid PDF or DOCX files, each no larger than 50 MB.”."}, {"n": 3, "text": "The actor removes or replaces those files. The flow resumes at Step 1 of AF-1."}]}, {"id": "EX-4", "title": "Document is already attached", "notes": [], "steps": [{"n": 1, "text": "At Step 4, one or more selected library documents are already attached to this Meeting. Separate uploads with the same name or content remain different documents. (BR-193, BR-229)"}, {"n": 2, "text": "None of the submitted additions are saved. The system identifies the already attached documents and displays MSG165 – “One or more selected documents are already attached to the Meeting.”."}, {"n": 3, "text": "The actor revises the selection. The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-5", "title": "Addition cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 5 or Step 4 of AF-1, the system cannot complete one or more additions."}, {"n": 2, "text": "No document from this submission is added to the Meeting or newly added to the personal library. Existing documents remain unchanged. The system displays MSG166 – “Unable to add the documents. No documents were added. Please try again.”. (BR-194, BR-286)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the Meeting has ended, including while the actor was selecting or uploading files. (BR-195)"}, {"n": 2, "text": "None of the submitted documents are added. The system displays MSG172 – “Documents cannot be added after the Meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "Meeting is unavailable", "notes": [], "steps": [{"n": 1, "text": "Before displaying or completing the addition, including at Step 2 of AF-1, the Meeting cannot be accessed: it does not exist, it is hidden from the actor, or the actor held the Chair or Secretary role but can no longer view the Meeting."}, {"n": 2, "text": "No Meeting information is disclosed and no submitted documents are added. The system displays MSG174 – “This Meeting is not accessible.” The message is the same whether the Meeting is hidden or does not exist, and an actor who can no longer view the Meeting receives MSG174, not MSG162."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-8", "title": "Upload exceeds the submission limit", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-1, the actor submits more than 10 files, or the files total more than 200 MB, including when the declared size of the request already exceeds the limit. (BR-319)"}, {"n": 2, "text": "None of the submitted documents are added to the Meeting or personal library. When the declared size is already over the limit, the system rejects the submission without receiving the files. The system displays MSG288 – “Upload up to 10 files at a time, no larger than 200 MB in total.”."}, {"n": 3, "text": "The actor removes some files. The flow resumes at Step 1 of AF-1."}]}, {"id": "EX-9", "title": "System storage is full", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, adding the submitted files would take the total storage of all documents in the system above 10 GB. (BR-333)"}, {"n": 2, "text": "None of the submitted documents are added to the Meeting or personal library. The system displays MSG346 – “The system’s document storage is full. No documents were uploaded. Please contact an administrator.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-10", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 4, or at Step 2 of AF-1, the Meeting has been cancelled (BR-299), including while the actor was selecting or uploading files."}, {"n": 2, "text": "None of the submitted documents are added. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-187", "BR-192", "BR-193", "BR-194", "BR-195", "BR-197", "BR-209", "BR-210", "BR-212", "BR-214", "BR-215", "BR-226", "BR-227", "BR-228", "BR-229", "BR-276", "BR-284", "BR-286", "BR-299", "BR-319", "BR-333"], "msg": ["MSG161", "MSG162", "MSG164", "MSG165", "MSG166", "MSG172", "MSG174", "MSG249", "MSG288", "MSG346", "MSG349"], "cov": {"br": 23, "code": 22, "test": 5}}, "UC-33b": {"id": "UC-33b", "name": "Attach Documents to Agenda Item", "feature": "FE-07", "line": 1471, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to attach one or more documents to an Agenda Item of the Meeting before the Meeting ends. Documents may be chosen from the Meeting documents, uploaded from the computer or chosen from My Documents; documents not yet in the Meeting are added to it and attached in the same save. (BR-304)", "pre": ["PRE-1: The actor is signed in, can currently view the Meeting and is its current Chair or Secretary. (BR-184)", "PRE-2: The selected Agenda Item belongs to the Meeting. (BR-278)", "PRE-3: The Meeting has not ended. Pending, InProgress and Done Agenda Items are all eligible. (BR-185, BR-279)"], "post": ["POST-1: The selected documents are attached to the Agenda Item; their links to other Items remain unchanged. (BR-277)", "POST-2: Documents uploaded from the computer or chosen from My Documents are also added to the Meeting; uploaded files are also added to the uploader's personal library. A file uploaded from the computer is added and attached on its own, and a file that fails does not stop the others; if a document chosen from My Documents cannot be added or attached, none of that selection is added or attached. (BR-194, BR-286, BR-304)", "POST-3: Document contents and comments remain unchanged."], "normal": [{"id": "", "title": "Attach Documents to Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The actor selects an Agenda Item and chooses Add document."}, {"n": 2, "text": "The system offers three sources: Meeting documents, Upload from computer and My Documents. (BR-304)"}, {"n": 3, "text": "The actor chooses Meeting documents. The system lists the Meeting documents not yet attached to this Agenda Item."}, {"n": 4, "text": "The actor selects one or more documents and confirms."}, {"n": 5, "text": "The system rechecks current Meeting access, the Chair or Secretary assignment, that the Meeting has not ended, that the Item belongs to the Meeting, and that every selected document is still in the Meeting and not yet attached to the Item. (BR-184, BR-185, BR-277, BR-278, BR-279)"}, {"n": 6, "text": "The system attaches all selected documents to the Item together; if any cannot be saved, none is attached. (BR-304)"}, {"n": 7, "text": "The system refreshes the Agenda Item documents and displays MSG238 – “Documents attached to the Agenda Item successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Upload from computer", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor chooses Upload from computer and selects one or more files. The browser queues them and sends them one at a time, each as its own submission. (BR-286)"}, {"n": 2, "text": "The system checks the submission has at most 10 files totalling at most 200 MB and every file is a valid PDF or DOCX no larger than 50 MB, and performs the checks of Step 5 that do not concern existing Meeting documents. (BR-184, BR-185, BR-187, BR-214, BR-215, BR-319)"}, {"n": 3, "text": "The system checks that the file fits within the 10 GB storage limit of the whole system, then adds it to the Meeting and to the uploader's personal library, and attaches it to the Agenda Item, in the same save. (BR-194, BR-210, BR-286, BR-304, BR-333)"}, {"n": 4, "text": "If the file is invalid or cannot be added or attached, it is not added or attached and the other files in the queue continue; the system displays MSG164, MSG288, MSG346 or MSG166 as in UC-33a EX-3, EX-8, EX-9 and EX-5. Otherwise, the flow resumes at Step 7."}]}, {"id": "AF-2", "title": "Choose from My Documents", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor chooses My Documents and selects one or more documents from his or her personal library."}, {"n": 2, "text": "The system checks that each document belongs to the actor, is available and is not already in the Meeting, and performs the remaining checks of Step 5. (BR-184, BR-185, BR-193, BR-209)"}, {"n": 3, "text": "The system adds the documents to the Meeting and attaches them to the Agenda Item in the same save. Personal-library documents stay unchanged. (BR-276, BR-286, BR-304)"}, {"n": 4, "text": "If any document cannot be added or attached, nothing is added or attached; the system displays MSG249, MSG165 or MSG166 as in UC-33a EX-2, EX-4 and EX-5. A document already in the Meeting is attached through Step 3. Otherwise, the flow resumes at Step 7."}]}], "exs": [{"id": "EX-1", "title": "Actor is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor is no longer the current Chair or Secretary."}, {"n": 2, "text": "Nothing is attached. The system displays MSG240 – “You no longer have permission to link documents in this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Document is no longer in the Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a selected document is no longer attached to this Meeting."}, {"n": 2, "text": "Nothing is attached. The system displays MSG170 – “This document is no longer attached to the Meeting. Refresh the document list.”"}, {"n": 3, "text": "The flow resumes at Step 3."}]}, {"id": "EX-3", "title": "Agenda Item is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Agenda Item no longer exists in this Meeting. (BR-278)"}, {"n": 2, "text": "Nothing is attached. The system displays MSG242 – “Select an available Agenda Item in this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Document is already attached", "notes": [], "steps": [{"n": 1, "text": "At Step 5, one or more selected documents are already attached to the Item, including by another user after selection."}, {"n": 2, "text": "Nothing is attached and no duplicate is created. The system displays MSG243 – “One or more selected documents are already attached to the Agenda Item.”"}, {"n": 3, "text": "The flow resumes at Step 4."}]}, {"id": "EX-5", "title": "Change cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot complete the change."}, {"n": 2, "text": "All links, the Meeting documents and their comments remain unchanged. The system displays MSG244 – “Unable to link the document. No links were changed. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 5, or the corresponding check in AF-1 or AF-2, the Meeting has ended. (BR-185)"}, {"n": 2, "text": "Nothing is added or attached. The system displays MSG247 – “Document links cannot be changed after the Meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "Meeting is unavailable", "notes": [], "steps": [{"n": 1, "text": "Before displaying or saving, the Meeting cannot be accessed."}, {"n": 2, "text": "No document or Item information is disclosed and nothing is attached. The system displays MSG174 – “This Meeting is not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-8", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 5, or the corresponding check in AF-1 or AF-2, the Meeting has been cancelled (BR-299)."}, {"n": 2, "text": "Nothing is added or attached. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-187", "BR-193", "BR-194", "BR-209", "BR-210", "BR-214", "BR-215", "BR-276", "BR-277", "BR-278", "BR-279", "BR-286", "BR-299", "BR-304", "BR-319", "BR-333"], "msg": ["MSG164", "MSG165", "MSG166", "MSG170", "MSG174", "MSG238", "MSG240", "MSG242", "MSG243", "MSG244", "MSG247", "MSG249", "MSG288", "MSG346", "MSG349"], "cov": {"br": 18, "code": 17, "test": 4}}, "UC-33c": {"id": "UC-33c", "name": "Remove Document from Meeting", "feature": "FE-07", "line": 1482, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to remove a Meeting document before the Meeting ends, regardless of Minutes existence or Agenda Item status. Removal affects every Agenda Item link in this Meeting. (BR-184, BR-185, BR-279, BR-281)", "pre": ["PRE-1: The actor is signed in and is the current Chair or Secretary of the Meeting. (BR-184)", "PRE-2: The selected document is currently attached to this Meeting.", "PRE-3: The actor can currently view the Meeting and the Meeting has not ended. (BR-184, BR-185)"], "post": ["POST-1: The document no longer appears in this Meeting's current document list or any of its Agenda Items and is no longer available through this attachment. (BR-281)", "POST-2: Its comments remain in the removal history and do not return if the document is added again; personal-library documents and documents in other Meetings remain unchanged. (BR-212, BR-231, BR-197, BR-281, BR-284)", "POST-3: The actor and removal time are recorded. Meeting lifecycle status is unchanged."], "normal": [{"id": "", "title": "Remove Document from Meeting", "notes": [], "steps": [{"n": 1, "text": "The Chair or Secretary selects an attached document and chooses Remove from Meeting."}, {"n": 2, "text": "The system displays a confirmation naming the document and explaining that it will leave this Meeting's list, while its comments remain as history and personal-library documents and other Meetings are unaffected."}, {"n": 3, "text": "The actor confirms removal."}, {"n": 4, "text": "The system rechecks the current Chair or Secretary assignment, that the document is still attached, that the actor can currently view the Meeting and that the Meeting has not ended. Minutes existence and Agenda Item status do not block removal. (BR-184, BR-185, BR-279)"}, {"n": 5, "text": "The system removes the document from this Meeting's current list and every Agenda Item in this Meeting, preserves its comments as history and records the actor and removal time. (BR-211, BR-212, BR-231, BR-197, BR-281, BR-284)"}, {"n": 6, "text": "The system displays MSG167 – “Document removed from the Meeting successfully.”"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting has ended, including when it ended after the confirmation was displayed. (BR-185)"}, {"n": 2, "text": "The document remains attached and its comments remain unchanged. The system displays MSG248 – “Documents cannot be removed after the Meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Actor is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Chair or Secretary. (BR-184)"}, {"n": 2, "text": "No document is removed and comments remain unchanged. The system displays MSG169 – “You no longer have permission to remove documents from this Meeting.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Document is no longer attached", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected document is no longer currently attached to this Meeting."}, {"n": 2, "text": "No further removal or comment change is made. The system displays MSG170 – “This document is no longer attached to the Meeting. Refresh the document list.”"}, {"n": 3, "text": "The use case ends; the actor may refresh the list through UC-32a."}]}, {"id": "EX-4", "title": "Removal cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot complete the removal."}, {"n": 2, "text": "The document remains attached and its comments remain unchanged; no successful removal is recorded. The system displays MSG171 – “Unable to remove the document. It remains attached to the Meeting. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Meeting is unavailable", "notes": [], "steps": [{"n": 1, "text": "Before displaying or completing the removal, the selected Meeting cannot be accessed."}, {"n": 2, "text": "No document is removed and comments remain unchanged. The system displays MSG174 – “This Meeting is not accessible.” without disclosing whether the Meeting exists."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting has been cancelled (BR-299), including when it was cancelled after the confirmation was displayed."}, {"n": 2, "text": "The document remains attached and its comments remain unchanged. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-184", "BR-185", "BR-197", "BR-211", "BR-212", "BR-231", "BR-279", "BR-281", "BR-284", "BR-299"], "msg": ["MSG167", "MSG169", "MSG170", "MSG171", "MSG174", "MSG248", "MSG349"], "cov": {"br": 10, "code": 9, "test": 2}}, "UC-33d": {"id": "UC-33d", "name": "Detach Document from Agenda Item", "feature": "FE-07", "line": 1493, "extra": {}, "parent": "UC-33", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to detach one document from an Agenda Item before the Meeting ends. The document stays in the Meeting; removing it from the Meeting is UC-33c.", "pre": ["PRE-1: The actor is signed in, can currently view the Meeting and is its current Chair or Secretary. (BR-184)", "PRE-2: The document is attached to the selected Agenda Item of the same M xt": "The flow resumes at Step 5 of the Main Flow."}]}, {"id": "AF-2", "title": "Empty library or no matching documents", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or Step 5, no documents match the location and criteria."}, {"n": 2, "text": "The system displays an empty result without treating it as a loading failure."}, {"n": 3, "text": "The flow resumes at Step 5 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Library cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, Step 3 or Step 5, the system cannot retrieve the library."}, {"n": 2, "text": "No library or Meeting information changes. The system displays MSG176 – “Unable to load your personal document library. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Selected folder is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the folder was deleted or is no longer available in the user's library."}, {"n": 2, "text": "No information changes. The system displays MSG175 – “This personal-library item is not available.”"}, {"n": 3, "text": "The user returns to the library root. The flow resumes at Step 4 of the Main Flow."}]}], "br": ["BR-204", "BR-219", "BR-242", "BR-251"], "msg": ["MSG175", "MSG176"], "cov": {"br": 4, "code": 2, "test": 0}}, "UC-34b": {"id": "UC-34b", "name": "View a Locked Account’s Personal Library", "feature": "FE-07", "line": 1515, "extra": {}, "parent": "UC-34", "actors": "System Admin", "secondary": "None", "desc": "Allows a System Admin to read, without changing anything, the folders and documents in the personal library of a locked account, for example to recover Meeting materials after the owner has left the organization. Every read is recorded in the audit log. The Admin does not see the files of Confidential or Secret Meetings. (BR-242, BR-334, BR-335)", "pre": ["PRE-1: The System Admin is signed in and has the capability to manage users.", "PRE-2: The selected account exists and is locked. The library of an active account is private to its owner. (BR-242, BR-334)"], "post": ["POST-1: The System Admin has seen the folders and documents of the locked account’s library that BR-334 allows. Nothing in the library has changed. (BR-334)", "POST-2: Each read has an audit entry stating who read, whose library, which folder or document and when. (BR-335)"], "normal": [{"id": "", "title": "View a Locked Account’s Personal Library", "notes": [], "steps": [{"n": 1, "text": "The System Admin opens the user list. Each row displays an action button 'View personal library' [Xem kho tài liệu]. For an active account, the button remains visible but is disabled with a tooltip explaining that personal libraries of active accounts are private to their owners. The System Admin chooses View personal library on a locked account."}, {"n": 2, "text": "The system rechecks the System Admin’s capability and that the account is still locked, and that the selected folder, if any, is in that library and is not hidden by BR-334. (BR-334)"}, {"n": 3, "text": "The system records an audit entry for the read before showing anything. (BR-335)"}, {"n": 4, "text": "The system displays the folders and documents of the account’s library at the root, read-only: no upload, rename, move, delete, search or file-type filtering is offered. It leaves out the files of Confidential or Secret Meetings and each such Meeting’s upload folder with its subfolders. If a navigated folder is deleted or belongs to a Confidential/Secret meeting, the view automatically falls back to the library root of that locked account. (BR-334)"}, {"n": 5, "text": "The System Admin opens a folder. The system repeats Steps 2 and 3 for that read and displays the folder’s contents."}]}], "alts": [{"id": "AF-1", "title": "Read a document", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or 5, the System Admin chooses a document to preview or download."}, {"n": 2, "text": "The system repeats the checks of Step 2, opens the file, records an audit entry naming the document and only then returns the file read-only. (BR-334, BR-335)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Library is not available or account reactivated", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the account is no longer locked (or was reactivated while viewing), or the selected folder or document does not exist in that library or is hidden by BR-334."}, {"n": 2, "text": "Nothing is shown. The system displays MSG175 – “This personal-library item is not available.” and navigates back to the user list if the account was reactivated, or returns to the library root if a folder was deleted or hidden."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Library cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or 4, the system cannot record the audit entry or cannot load the library. (BR-335)"}, {"n": 2, "text": "Nothing is shown. The system displays MSG176 – “Unable to load your personal document library. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Document cannot be opened", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-1, the file cannot be read or the audit entry cannot be recorded. (BR-335)"}, {"n": 2, "text": "Nothing is returned. The system displays MSG158 – “Unable to display the document. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-242", "BR-334", "BR-335"], "msg": ["MSG158", "MSG175", "MSG176"], "cov": {"br": 3, "code": 1, "test": 0}}, "UC-35": {"id": "UC-35", "name": "Comment on Meeting Document", "feature": "FE-07", "line": 1526, "extra": {}, "parent": null, "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a user who can view a Meeting document to read its comments and add a comment before the Meeting ends. After the Meeting ends, the documen Comments are read-only after the Meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Comment exceeds length limit", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the comment text exceeds 4,000 characters."}, {"n": 2, "text": "No comment is saved. The system displays MSG348 – “The text is longer than allowed.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-7", "title": "Meeting is cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 4, the Meeting has been cancelled (BR-299), including when it was cancelled while the user was writing."}, {"n": 2, "text": "No comment is added. Existing comments remain available for reading. The system displays MSG349 – “This meeting was cancelled and can no longer be modified.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-153", "BR-155", "BR-157", "BR-246", "BR-248", "BR-249", "BR-250", "BR-275", "BR-282", "BR-299", "BR-317"], "msg": ["MSG156", "MSG199", "MSG200", "MSG202", "MSG204", "MSG251", "MSG348", "MSG349"], "cov": {"br": 11, "code": 6, "test": 0}}, "UC-36": {"id": "UC-36", "name": "Upload Document to Personal Library", "feature": "FE-07", "line": 1537, "extra": {}, "parent": null, "actors": "Internal user", "secondary": "None", "desc": "Allows an internal user to upload one or more PDF or DOCX files to the selected location in their personal library. Uploading to the library does not add them to a Meeting. (BR-286)", "pre": ["PRE-1: The internal user is signed in.", "PRE-2: The operation concerns the user's own personal library. Guest has no personal library. (BR-204, BR-242)"], "post": ["POST-1: Each uploaded file is available as a separate document at the selected library location. (BR-229, BR-286)", "POST-2: A file that cannot be added is not added at all, and does not stop the other files. Existing library documents and Meeting documents remain unchanged. (BR-286)"], "normal": [{"id": "", "title": "Upload Documents t ss rules. (BR-29, BR-181, BR-274)"], "post": ["POST-1: The actor sees only Votes that the actor is authorized to view.", "POST-2: No Vote, ballot or conclusion is changed."], "normal": [{"id": "", "title": "View Meeting Votes", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Voting area of a Meeting."}, {"n": 2, "text": "The system checks current viewing permission; the current Chair or Secretary may access Vote preparation in Approved without gaining access to other restricted Meeting records. (BR-29, BR-181, BR-274)"}, {"n": 3, "text": "The system lists the Votes belonging to this Meeting and excludes Draft Votes unless the actor is the current Chair or the current Secretary. Displayed counts include only visible Votes. (BR-253, BR-285)"}, {"n": 4, "text": "The system displays each visible Vote with its content, ballot type and status. Open Votes show turnout; Closed Votes offer View result and show any recorded conclusion. No Agenda Item is selected or displayed as Vote ownership. (BR-260, BR-285)"}, {"n": 5, "text": "The actor browses the Votes. Selecting a Vote continues to UC-52b – View Vote Status."}]}], "alts": [{"id": "AF-1", "title": "No visible Votes", "notes": [], "steps": [{"n": 1, "text": "At Step 3, no Vote is visible to the actor, including when only Draft Votes restricted to the Chair and Secretary exist."}, {"n": 2, "text": "The system displays MSG207 – \"No votes to display.\" without revealing hidden Draft Votes."}, {"n": 3, "text": "No data changes. The use case ends successfully."}]}], "exs": [{"id": "EX-1", "title": "Meeting votes are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the actor no longer has permission to view its Votes, including after Guest invitation expiry or revocation."}, {"n": 2, "text": "The system displays MSG205 – \"Meeting votes are not accessible.\" and does not reveal Vote information."}, {"n": 3, "text": "No data changes. The use case ends."}]}, {"id": "EX-2", "title": "Votes cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3, current access is valid but the system cannot retrieve the Votes."}, {"n": 2, "text": "The system displays MSG206 – \"Unable to load the meeting votes. Please try again.\""}, {"n": 3, "text": "No data changes. The use case ends."}]}], "br": ["BR-29", "BR-181", "BR-253", "BR-260", "BR-274", "BR-285"], "msg": ["MSG205", "MSG206", "MSG207"], "cov": {"br": 6, "code": 2, "test": 0}}, "UC-52b": {"id": "UC-52b", "name": "View Vote Status", "feature": "FE-11", "line": 1739, "extra": {}, "parent": "UC-52", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to view the configuration of a visible Draft Vote, the turnout of an Open Vote, or the tally and any Chair conclusion of a Closed Vote. Viewing a result does not change that result.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor has current permission to view the Meeting's Votes. The current Chair or Secretary may access Vote preparation in Approved; other Meeting records follow their own access rules. (BR-29, BR-181, BR-274)", "PRE-3: The selected Vote belongs to that Meeting and is visible to the actor. Draft visibility is restricted to the current Chair and the current Secretary. (BR-253)"], "post": ["POST-1: The current Vote status and the information allowed for its ballot type are displayed.", "POST-2: No Vote, ballot or conclusion is changed."], "normal": [{"id": "", "title": "View Open Vote Status", "notes": [], "steps": [{"n": 1, "text": "The actor selects an Open Vote from the Meeting Voting area."}, {"n": 2, "text": "The system verifies current Vote viewing permission and that the Vote is visible to the actor. (BR-29, BR-181, BR-253, BR-274)"}, {"n": 3, "text": "The system displays its Meeting, content, options, public or secret ballot type, selected roles, opening time, the fixed eligible-voter count and its Vote documents. (BR-288) (BR-190, BR-285)"}, {"n": 4, "text": "The system displays the number of ballots recorded against that fixed count. While the Vote is Open, individual choices and results per option are not displayed. (BR-260)"}, {"n": 5, "text": "The system updates turnout as ballots are recorded. For a secret Vote, the update does not identify the person who just voted or link that person to a choice. (BR-259)"}, {"n": 6, "text": "If the Meeting has ended while the Vote remains Open, the system shows that no further ballots are accepted; the recorded turnout remains viewable. (BR-165)"}]}], "alts": [{"id": "AF-1", "title": "View a Draft Vote", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the current Chair or Secretary selects a Draft Vote."}, {"n": 2, "text": "The system applies Step 2, then displays its saved content, options, ballot type, selected roles and Vote documents. No eligible-voter list has been fixed and no ballots exist yet. (BR-190, BR-253)"}, {"n": 3, "text": "The use case ends successfully without changing the Draft Vote."}]}, {"id": "AF-2", "title": "View a Closed Vote", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor selects View result for a Closed Vote, including a Vote with a recorded conclusion."}, {"n": 2, "text": "The system applies Step 2, then displays opening and closing times, the fixed eligible count, recorded-ballot count and tally per option. Percentages use the ballots cast; with no ballots, counts are zero and no percentage is shown. (BR-261)"}, {"n": 3, "text": "For a public Vote, the system also displays each eligible voter's choice or that the person did not vote. For a secret Vote, it displays only totals and no voter-choice links. (BR-259, BR-273)"}, {"n": 4, "text": "The system displays any saved Chair conclusion and optional note, or states that a conclusion has not yet been recorded. The system does not determine the conclusion from the tally. (BR-161, BR-263)"}, {"n": 5, "text": "The use case ends successfully without changing the result."}]}], "exs": [{"id": "EX-1", "title": "Vote is not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting or Vote is unavailable, access has been lost, or the actor attempts to view a Draft Vote without being the current Chair or Secretary."}, {"n": 2, "text": "The system displays MSG205 – \"Meeting votes are not accessible.\" without revealing the Vote."}, {"n": 3, "text": "No data changes. The use case ends."}]}, {"id": "EX-2", "title": "Status or result cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or in AF-1/AF-2, current access is valid but the system cannot retrieve the status or result."}, {"n": 2, "text": "The system displays MSG208 – \"Unable to load the vote status or result. Please try again.\""}, {"n": 3, "text": "The Vote, ballots and conclusion remain unchanged. The use case ends."}]}], "br": ["BR-29", "BR-161", "BR-165", "BR-181", "BR-190", "BR-253", "BR-259", "BR-260", "BR-261", "BR-263", "BR-273", "BR-274", "BR-285", "BR-288"], "msg": ["MSG205", "MSG208"], "cov": {"br": 14, "code": 2, "test": 0}}, "UC-53": {"id": "UC-53", "name": "Create / Configure Vote", "feature": "FE-11", "line": 1750, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or the current Secretary to prepare a Vote draft and to configure or delete an existing draft. Draft preparation is allowed before the Meeting starts, while it is Approved or Published, and during InProgress. Only the current Chair may proceed from the form to opening the Vote during the Meeting (UC-54). Each Vote belongs to the Meeting and is not linked to an Agenda Item. Vote documents are attached and detached through UC-76. (BR-160, BR-285)", "pre": ["PRE-1: The actor is signed in and is the current authorized Chair or Secretary of the Meeting.", "PRE-2: The Meeting is Approved, Published or InProgress. (BR-252)", "PRE-3: For editing or deletion, the selected Vote is Draft and belongs to this Meeting. (BR-254, BR-189)"], "post": ["POST-1: Saving a draft creates or updates a Draft Vote; deleting removes only the selected Draft Vote.", "POST-2: Opening through UC-54 instead creates or updates an Open Vote and fixes its eligible-voter list. It does not also produce a separate saved draft.", "POST-3: Other Votes, previously recorded ballots and conclusions remain unchanged."], "normal": [{"id": "", "title": "Create Vote Draft", "notes": [], "steps": [{"n": 1, "text": "The actor selects Create Vote in the Meeting Voting area."}, {"n": 2, "text": "The system checks that the actor is the current Chair or Secretary and the permitted Meeting status, then displays a form for content, options, public or secret ballot type and eligible meeting roles. No Agenda Item is requested. (BR-252, BR-285) It defaults to Public, the options Agree / Disagree / Abstain and all four roles selected. (BR-257)"}, {"n": 3, "text": "The actor enters the content, defines and orders the options, chooses the ballot type and selects one or more eligible roles."}, {"n": 4, "text": "The actor selects Save draft."}, {"n": 5, "text": "The system verifies the current Chair or Secretary and Meeting status, required content, at least two distinct non-empty options, a valid ballot type and at least one role. (BR-252, BR-255, BR-256, BR-257, BR-272)"}, {"n": 6, "text": "The system saves the Vote as Draft under the Meeting. It does not open voting or fix the eligible-voter list. (BR-190, BR-253)"}, {"n": 7, "text": "The system displays MSG210 – \"Vote draft created successfully.\" and the saved Draft Vote."}]}], "alts": [{"id": "AF-1", "title": "Configure an existing Draft Vote", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor selects Edit on a Draft Vote."}, {"n": 2, "text": "The system checks current access, the current Chair or Secretary and permitted Meeting status and that the Vote is still Draft, then displays its saved content, options, ballot type and roles. The actor changes them and selects Save draft. (BR-252, BR-253, BR-254)"}, {"n": 3, "text": "The system performs Step 5 and verifies that the Vote is still Draft. (BR-254)"}, {"n": 4, "text": "The system updates that draft and displays MSG211 – \"Vote draft updated successfully.\" No voting is opened. The use case ends successfully."}]}, {"id": "AF-2", "title": "Delete a Draft Vote", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor selects Delete on a Draft Vote and confirms."}, {"n": 2, "text": "The system verifies the current Chair or Secretary, the permitted Meeting status and that the Vote is still Draft. (BR-189)"}, {"n": 3, "text": "The system removes only that Draft Vote and displays MSG212 – \"Vote draft deleted successfully.\""}, {"n": 4, "text": "No other Vote, ballot or conclusion changes. The use case ends successfully."}]}, {"id": "AF-3", "title": "Open immediately", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or in the edit form in AF-1, the current Chair selects Open vote while the Meeting is InProgress instead of Save draft. Open vote is not offered to the Secretary. (BR-160)"}, {"n": 2, "text": "The content and choices are already shown in that form; selecting Open vote confirms opening. The system continues with UC-54 AF-1 without a separate draft-save step or another confirmation."}, {"n": 3, "text": "The use case ends with the UC-54 outcome. On failure, the entered information stays in the form for correction; no new draft or draft changes are saved."}]}], "exs": [{"id": "EX-1", "title": "Invalid Vote information", "notes": [], "steps": [{"n": 1, "text": "At Step 5 or during validation in AF-1, content, options, ballot type or roles are invalid. (BR-255, BR-256, BR-257, BR-272)"}, {"n": 2, "text": "The system displays MSG209 – \"Invalid vote information. Check the highlighted fields.\" with the invalid fields identified.  or completing the action, the Meeting or Vote is unavailable or the actor no longer has access. A Draft Vote is not disclosed to anyone other than the current Chair and the current Secretary. (BR-253)"}, {"n": 2, "text": "The system displays MSG205 – \"Meeting votes are not accessible.\" without revealing hidden Vote information. No Vote, ballot or conclusion is changed."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-160", "BR-189", "BR-190", "BR-252", "BR-253", "BR-254", "BR-255", "BR-256", "BR-257", "BR-272", "BR-285"], "msg": ["MSG205", "MSG209", "MSG210", "MSG211", "MSG212", "MSG213", "MSG214", "MSG215", "MSG216"], "cov": {"br": 11, "code": 0, "test": 0}}, "UC-54": {"id": "UC-54", "name": "Open Vote", "feature": "FE-11", "line": 1761, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the current Chair to open a valid Vote during an InProgress Meeting. Opening fixes the eligible-voter list and count. Only one Vote may be Open in a Meeting at a time.", "pre": ["PRE-1: The actor is signed in and is the current authorized Chair of the Meeting.", "PRE-2: The Meeting is InProgress. (BR-160)", "PRE-3: The selected Vote belongs to this Meeting and is Draft, or the Chair is opening a new Vote from the form in UC-53. (BR-285)", "PRE-4: No other Vote in the Meeting is Open. (BR-266)"], "post": ["POST-1: The Vote is Open with its opening time recorded.", "POST-2: Its eligible-voter list and count are fixed from the selected roles at opening. (BR-190)", "POST-3: Eligible voters can submit one ballot while the Meeting remains InProgress and the Vote remains Open."], "normal": [{"id": "", "title": "Open Vote", "notes": [], "steps": [{"n": 1, "text": "The Chair selects Open on a Draft Vote."}, {"n": 2, "text": "The system checks current access to the Vote, then displays its content, ballot type, options and selected roles for confirmation."}, {"n": 3, "text": "The Chair confirms opening."}, {"n": 4, "text": "The system checks the cu ends unsuccessfully."}]}], "br": ["BR-48", "BR-49"], "msg": ["MSG39", "MSG40"], "cov": {"br": 2, "code": 0, "test": 0}}, "UC-67": {"id": "UC-67", "name": "Mark Notifications as Read", "feature": "FE-13", "line": 1876, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-67a": {"id": "UC-67a", "name": "Mark Notification as Read", "feature": "FE-13", "line": 1878, "extra": {}, "parent": "UC-67", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authenticated user to mark a specific unread notification as read, updating its status.", "pre": ["PRE-1: The user is authenticated in the system.", "PRE-2: The user has at least one unread notification."], "post": ["POST-1: The selected notification status is changed to Read.", "POST-2: The unread count reflects the latest saved notification statuses."], "normal": [{"id": "", "title": "Mark Notification as Read", "notes": [], "steps": [{"n": 1, "text": "The user views their notification list."}, {"n": 2, "text": "The user selects \"Mark as Read\" for a notification."}, {"n": 3, "text": "The system verifies that the notification belongs to the user's account. (BR-47)"}, {"n": 4, "text": "The system marks the notification as read."}, {"n": 5, "text": "The system displays the notification as read and shows the updated unread count."}]}], "alts": [], "exs": [], "br": ["BR-47"], "msg": [], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-67b": {"id": "UC-67b", "name": "Mark All Notifications as Read", "feature": "FE-13", "line": 1889, "extra": {}, "parent": "UC-67", "actors": "System Admin, Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows a user to mark all of their unread notifications as read.", "pre": ["PRE-1: The user is signed in."], "post": ["POST-1: All notifications belonging to the user's account that were unread when the request was processed are
