tes": [], "steps": [{"n": 1, "text": "At Step 4, a submitted value is not Present or Absent."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG148 – “Select Present or Absent for each submitted participant or Guest.” The Secretary corrects the value. The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-2", "title": "Meeting is no longer in progress", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting changed from InProgress before the submission was saved."}, {"n": 2, "text": "No submitted change is saved. The system displays MSG149 – “Attendance can only be recorded while the meeting is in progress.” The use case ends."}]}, {"id": "EX-3", "title": "Secretary is no longer authorized", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the active current assigned Secretary."}, {"n": 2, "text": "No submitted change is saved. The system denies the operation under current authorization; existing attendance remains unchanged. The use case ends."}]}], "br": ["BR-043", "BR-056", "BR-057"], "msg": ["MSG147", "MSG148", "MSG149"], "cov": {"br": 3, "code": 0, "test": 0}}, "UC-34": {"id": "UC-34", "name": "Hand Over Chair to Another Participant", "feature": "FE-06", "line": 1572, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the current Chair to give the Chair role to another internal participant in one step, for example before leaving the Meeting. The system changes both roles together: the selected participant becomes Chair and the former Chair becomes Member. The Chair does not need to change his or her own role separately.", "pre": ["PRE-1: The actor is signed in and is the current Chair of the Meeting.", "PRE-2: The Meeting is Published or InProgress. (BR-041, BR-042)"], "post": ["POST-1: The selected participant is the Chair and the former Chair is a Member, saved together. (BR-041, BR-042)", "POST-2: The Meeting still has exactly one Chair and its required Secretary. System Roles, Invitation Responses, attendance and recorded ballots remain unchanged. (BR-041, BR-042)", "POST-3: The new Chair is notified in the application. The former Chair, who made the change, is not notified in the application but still receives the email. (BR-035)", "POST-4: A role change takes effect in the online room without the people rejoining, when the room is open; it is not blocked while the Meeting is in progress."], "normal": [{"id": "", "title": "Hand Over Chair to Another Participant", "notes": [], "steps": [{"n": 1, "text": "The Chair opens the Meeting participant list and chooses to change the role of the participant who will receive the Chair role."}, {"n": 2, "text": "The system displays the Meeting Roles, each with a short description of what the role allows. The Chair role is offered only for a current active internal participant who is neither a Guest nor the current Secretary. (BR-041, BR-042)"}, {"n": 3, "text": "The Chair selects the Chair role and chooses Hand over Chair. The system asks once more, stating that the Chair will become a Member and no longer run the Meeting, and the Chair confirms."}, {"n": 4, "text": "The system rechecks that the actor is still the current Chair, the Meeting is Published or InProgress, and the selected person can still receive the Chair role. (BR-041, BR-042)"}, {"n": 5, "text": "The system changes the selected participant to Chair and the former Chair to Member in the same save. (BR-041, BR-042)"}, {"n": 6, "text": "The system notifies the new Chair in the application. The former Chair, who made the change, is not notified in the application but still receives the email. (BR-035)"}, {"n": 7, "text": "The system displays MSG257 – \"Chair role handed over successfully.\" The former Chair stays in the Meeting as a Member and may leave the meeting room. (BR-041, BR-042)"}]}], "alts": [{"id": "AF-1", "title": "No participant can receive the Chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting has no current active internal participant other than the Chair and the Secretary."}, {"n": 2, "text": "The system offers the Chair role for no participant. No role changes."}, {"n": 3, "text": "The use case ends."}]}, {"id": "AF-2", "title": "Chair does not confirm the hand-over", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair does not confirm."}, {"n": 2, "text": "No role changes and the flow resumes at Step 3 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Selected participant can no longer receive the chair role", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected person was removed from the Meeting, became the Secretary or is no longer an active internal user. (BR-041, BR-042)"}, {"n": 2, "text": "No role is changed. The system displays MSG259 – \"The selected participant can no longer receive the Chair role. Select another participant.\""}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "EX-2", "title": "Hand-over is no longer permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Chair, or the Meeting is no longer Published or InProgress."}, {"n": 2, "text": "No role is changed. The system displays MSG260 – \"You can no longer hand over the Chair role for this meeting.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-035", "BR-041", "BR-042"], "msg": ["MSG257", "MSG259", "MSG260"], "cov": {"br": 3, "code": 0, "test": 0}}, "UC-35": {"id": "UC-35", "name": "View Meeting Documents", "feature": "FE-07", "line": 1587, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-35a": {"id": "UC-35a", "name": "View Meeting Documents", "feature": "FE-07", "line": 1589, "extra": {}, "parent": "UC-35", "actors": "System Admin, Member, Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to browse the documents currently attached to one Meeting. Guest document access follows Participant rules. (BR-055)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected Meeting exists and the user can currently view the Meeting. (BR-055, BR-079, BR-080, BR-053, BR-054, BR-044)"], "post": ["POST-1: Only currently attached documents available to the user are displayed.", "POST-2: Meeting documents, personal libraries and Meeting status remain unchanged."], "normal": [{"id": "", "title": "View Meeting Documents", "notes": [], "steps": [{"n": 1, "text": "The user opens the documents of the selected Meeting."}, {"n": 2, "text": "The system checks the user's current permission to view the Meeting, including the current invitation for a Guest. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. A Guest with a verified, current invitation may read the documents while the Meeting is Published or InProgress (UC-04); once the Meeting has ended, the Guest can no longer open them. (BR-055, BR-079, BR-080)"}, {"n": 3, "text": "The system displays the Meeting documents grouped by Agenda Item, in agenda order, with their names, file types, the people who added them and comment counts. A document linked to several Agenda Items appears under each of them; a document linked to no Agenda Item and to no Vote appears as a general Meeting document, and a document linked to a Vote is listed in the Vote grouping only. Removed documents are excluded. Agenda Items with no documents are listed as well, so a document can still be attached to them (UC-36b). Changes to the document list appear without reloading. After the Meeting ends, documents and comments are read-only. (BR-074, BR-075, BR-076, BR-079, BR-080)"}, {"n": 4, "text": "The user reviews the displayed groups or empty result, and may switch to another grouping or finish viewing. Selecting a document opens UC-35b."}]}], "alts": [{"id": "AF-1", "title": "View by Vote or general documents", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses to view the documents attached to Votes, or the general Meeting documents. The Vote grouping lists, in the order they were created, the Votes the user can see that have documents; a Draft Vote is shown only to the current Chair and Secretary. (BR-086, BR-087)"}, {"n": 2, "text": "The system displays the documents attached to each Vote, each marked Read once the user has confirmed reading it, or Not read while the user can still confirm it as a voter of an Open Vote in an InProgress Meeting (UC-42); or it displays the general documents, which are the documents linked to no Agenda Item and to no Vote, because a document of a Vote is listed in the Vote grouping only."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-2", "title": "No documents to display", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting has no currently attached documents, or the grouping chosen in AF-1 has no documents."}, {"n": 2, "text": "The system displays an empty result and explains that no documents are available for the current grouping."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-3", "title": "View documents from the online meeting room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the user is in the online meeting room of an InProgress Meeting and opens the documents there."}, {"n": 2, "text": "The system applies the same access check and displays the same documents, starting with the current Agenda Item, then the other Items and the Votes that have documents. Documents cannot be added, linked or removed from the room. (BR-079, BR-080)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow; selecting a document opens UC-35b without leaving the room."}]}], "exs": [{"id": "EX-1", "title": "Meeting documents are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the user can no longer view the Meeting, including removal of a participant or revocation or expiry of a Guest invitation."}, {"n": 2, "text": "No document names or contents are disclosed. No Meeting information is changed. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-044", "BR-053", "BR-054", "BR-055", "BR-074", "BR-075", "BR-076", "BR-079", "BR-080", "BR-086", "BR-087"], "msg": ["MSG156"], "cov": {"br": 11, "code": 9, "test": 5}}, "UC-35b": {"id": "UC-35b", "name": "Preview Meeting Document", "feature": "FE-07", "line": 1600, "extra": {}, "parent": "UC-35", "actors": "System Admin, Member, Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to read a Meeting document online and download the same file when permitted. Comments are covered separately in UC-38. A Guest with a verified, current invitation may read and download documents while the Meeting is Published or InProgress (UC-04), but not after the Meeting has ended. (BR-055, BR-081)", "pre": ["PRE-1: The internal user is signed in, or the Guest has a valid verified invitation for this Meeting.", "PRE-2: The selected document is currently attached to the Meeting and the user can currently view the Meeting. (BR-055, BR-074, BR-075, BR-076, BR-079, BR-080, BR-053, BR-054, BR-044)"], "post": ["POST-1: The selected document is displayed for online reading; in AF-1, the user also receives the permitted download.", "POST-2: The file content, its Meeting association and its comments remain unchanged.", "POST-3: When the user reaches the last page of a Vote document, reading can be confirmed in UC-42."], "normal": [{"id": "", "title": "Preview Meeting Document", "notes": [], "steps": [{"n": 1, "text": "The user selects a document of the Meeting, of an Agenda Item, or in the online meeting room."}, {"n": 2, "text": "The system checks current permission to view the Meeting and that the document is still attached to this Meeting. Anyone who can currently view the Meeting may read its documents; there is no separate document-reading permission. (BR-055, BR-074, BR-075, BR-076, BR-079, BR-080)"}, {"n": 3, "text": "The system opens the document over the current page and displays its name, its content and the Meeting sensitivity; the user stays on the page and, in the online meeting room, in the call. For a Secret Meeting, every view is recorded in the audit log, and a view that cannot be recorded is not shown. (BR-010)"}, {"n": 4, "text": "The user reads the document. When the user reaches the last page of a Vote document opened from that Vote, reading can be confirmed through UC-42. After the Meeting ends, the document and comments are read-only. Downloading remains available when the Meeting is not Secret. (BR-081, BR-079, BR-080)"}]}], "alts": [{"id": "AF-1", "title": "Download the document", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the user chooses Download for a Meeting that is not Secret; downloading is not offered for a Secret Meeting."}, {"n": 2, "text": "The system rechecks current access, that the document remains attached and the current Meeting sensitivity. (BR-055, BR-074, BR-075, BR-076, BR-081, BR-079, BR-080)"}, {"n": 3, "text": "The system provides the same uploaded file to the user. (BR-068, BR-010)"}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Document is no longer accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, or during the access check in AF-1, the document was removed, the user can no longer view the Meeting, or the document is linked only to a Draft Vote and to no Agenda Item and the actor is not the current Chair or Secretary. (BR-079, BR-080)"}, {"n": 2, "text": "No further document content or download is provided. The file and Meeting remain unchanged. The system displays MSG156 – “Meeting documents are not accessible.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Download requested for a Secret Meeting", "notes": [], "steps": [{"n": 1, "text": "During Step 2 of AF-1, the Meeting is Secret, including when its sensitivity changed after the viewer opened."}, {"n": 2, "text": "No download is provided. The document remains unchanged. The system displays MSG159 – “Secret Meeting documents can only be viewed online and cannot be downloaded.” (BR-081)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow for online reading."}]}, {"id": "EX-3", "title": "The stored file no longer exists", "notes": [], "steps": [{"n": 1, "text": "At Step 3, or at Step 3 of AF-1, the document is still attached to the Meeting but its file is no longer in storage."}, {"n": 2, "text": "Nothing is changed. The system displays MSG382 – “The file of this document is no longer in storage and cannot be opened. Please contact the administrator.” and does not offer to try again."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-010", "BR-044", "BR-053", "BR-054", "BR-055", "BR-068", "BR-074", "BR-075", "BR-076", "BR-079", "BR-080", "BR-081"], "msg": ["MSG156", "MSG159", "MSG382"], "cov": {"br": 12, "code": 10, "test": 6}}, "UC-36": {"id": "UC-36", "name": "Manage Meeting Documents", "feature": "FE-07", "line": 1611, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-36a": {"id": "UC-36a", "name": "Add Document to Meeting", "feature": "FE-07", "line": 1613, "extra": {}, "parent": "UC-36", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to add one or more documents from their own personal library or computer to a Meeting in one submission; files from the computer are added one at a time. Linking documents to Agenda Items is handled separately in UC-36b. (BR-070, BR-071, BR-072, BR-073)", "pre": ["PRE-1: The actor is signed in and is the current Chair or Secretary of the selected Meeting.", "PRE-2: The actor can currently view the Meeting. (BR-070, BR-071)", "PRE-3: The Meeting has not ended. (BR-070, BR-071)"], "post": ["POST-1: All submitted documents appear in the Meeting as general documents, with their names copied at addition and the actor and addition time recorded.", "POST-2: Selected personal-library documents stay unchanged. Files uploaded from the computer are also available in the uploader's personal library. (BR-072, BR-073)", "POST-3: A removed document added again is a new addition without its previous comments. (BR-074, BR-075, BR-076)", "POST-4: Each file uploaded from the computer is added as a whole or not at all, and a file that cannot be added does not stop the other files. Documents chosen from the personal library are added together or none are. Existing documents and Meeting status remain unchanged."], "normal": [{"id": "", "title": "Add Documents from Personal Library", "notes": [], "steps": [{"n": 1, "text": "The Chair or Secretary opens the Meeting documents and chooses Add Documents."}, {"n": 2, "text": "The system offers selection from the actor's personal library or upload from the computer."}, {"n": 3, "text": "The actor selects one or more documents from their own library and submits them."}, {"n": 4, "text": "The system checks the current Chair or Secretary, Meeting access and status, and that every selected document belongs to the actor, is available and is not already attached to this Meeting. (BR-070, BR-071, BR-072, BR-073)"}, {"n": 5, "text": "The system adds all selected documents to the Meeting under their current names and records who added them and when; either all are added or none is. Personal-library documents stay unchanged; a document added again does not recover old comments. (BR-011, BR-074, BR-075, BR-076)"}, {"n": 6, "text": "The system shows the number added and displays MSG161 – “Documents added to the Meeting successfully.”."}]}], "alts": [{"id": "AF-1", "title": "Upload files from en the folders and documents of the deactivated account’s library that BR-085 allows. Nothing in the library has changed. (BR-085)", "POST-2: Each read has an audit entry stating who read, whose library, which folder or document and when. (BR-011)"], "normal": [{"id": "", "title": "View a Deactivated Account’s Personal Library", "notes": [], "steps": [{"n": 1, "text": "The System Admin opens the user list and chooses to view the personal library of a deactivated account. The library of an active account cannot be opened. (BR-085)"}, {"n": 2, "text": "The system rechecks the System Admin’s capability and that the account is still deactivated, and that the selected folder, if any, is in that library and is not hidden by BR-085. (BR-085)"}, {"n": 3, "text": "The system records the read in the audit log before showing anything. (BR-011)"}, {"n": 4, "text": "The system displays the folders and documents of the account’s library at the root, read-only. The files of Secret Meetings and each such Meeting’s upload folder with its subfolders are left out. (BR-085)"}, {"n": 5, "text": "The System Admin opens a folder. The system repeats Steps 2 and 3 for that read and displays the folder’s contents."}]}], "alts": [{"id": "AF-1", "title": "Read a document", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or 5, the System Admin chooses a document to preview or download."}, {"n": 2, "text": "The system repeats the checks of Step 2, opens the file, records an audit entry naming the document and only then returns the file read-only. (BR-085, BR-011)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Account is missing or is not deactivated", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the account is no longer deactivated (or was reactivated while viewing), or the selected folder or document does not exist in that library or is hidden by BR-085."}, {"n": 2, "text": "Nothing is shown. The system displays MSG175 – “Thi  folder is missing or no longer belongs to the user."}, {"n": 2, "text": "No folder is deleted. The system displays MSG175 – “This personal-library item is not available.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Folder contains a document or subfolder", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the folder contains a document or subfolder, including an item added after confirmation was displayed. (BR-084)"}, {"n": 2, "text": "The folder and its contents remain unchanged. The system displays MSG196 – “Only an empty folder can be deleted.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-055", "BR-083", "BR-084"], "msg": ["MSG175", "MSG196", "MSG197"], "cov": {"br": 3, "code": 3, "test": 1}}, "UC-42": {"id": "UC-42", "name": "Confirm Document Read", "feature": "FE-07", "line": 1782, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person who may vote to confirm that he or she has read a document linked to a Vote of the Meeting, after reaching its last page. The confirmation is required before casting a ballot in UC-65. It records that the person confirmed reading, not how carefully the document was read.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor can currently view the Meeting, the document is attached to the Meeting and linked to a Vote of that Meeting, and the actor is on the eligible-voter list of an Open Vote linked to that document. (BR-055, BR-079, BR-080, BR-091)", "PRE-3: The actor has opened the document in the viewer through UC-35b."], "post": ["POST-1: A read confirmation for the actor and the document is recorded with the confirmation time.", "POST-2: The confirmation counts for every Vote of the Meeting that links the same document and cannot be withdrawn.", "POST-3: No ballot, Vote or document content changes, and the confirmation is not linked to any ballot choice. (BR-096, BR-097)"], "normal": [{"id": "", "title": "Confirm Document Read", "notes": [], "steps": [{"n": 1, "text": "From the Vote documents or the Meeting documents, the actor opens a Vote document through UC-35b."}, {"n": 2, "text": "The actor reads the document through to its last page."}, {"n": 3, "text": "Once the last page is reached, the system lets the actor confirm reading."}, {"n": 4, "text": "The actor confirms reading."}, {"n": 5, "text": "The system rechecks current Meeting access, that the document is still attached to the Meeting and linked to a Vote, and that the actor reached the last page. (BR-055, BR-079, BR-080)"}, {"n": 6, "text": "The system records the read confirmation with the actor, the document and the confirmation time. (BR-096, BR-097)"}, {"n": 7, "text": "The system displays MSG253 – \"Document read confirmed.\" and shows the document as read. When every document of an Open Vote is confirmed, the actor may cast a ballot in UC-65. (BR-094, BR-095)"}]}], "alts": [{"id": "AF-1", "title": "Document already confirmed", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor has already confirmed reading this document, including for another Vote of the Meeting that links it."}, {"n": 2, "text": "The system shows the document as read with the time of the existing confirmation, and does not offer confirmation again."}, {"n": 3, "text": "The use case ends without a new confirmation."}]}], "exs": [{"id": "EX-1", "title": "Last page not reached", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or Step 5, the actor has not reached the last page, including when the viewer was closed before the last page."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG254 – \"Scroll to the last page of the document before confirming that you have read it.\""}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "EX-2", "title": "Document or Meeting is no longer accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor can no longer view the Meeting, or the document is no longer attached to the Meeting or linked to a Vote."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG156 – \"Meeting documents are not accessible.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Not an eligible voter, or no Open Vote remains", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor is not on the fixed eligible-voter list of any Open Vote linked to this document. Or no Vote linked to this document is Open any more."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG224 – \"You are not eligible to cast a ballot in this vote.\" When no Open Vote remains, the system displays MSG225 – “This vote is no longer accepting ballots.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-055", "BR-079", "BR-080", "BR-091", "BR-094", "BR-095", "BR-096", "BR-097"], "msg": ["MSG156", "MSG224", "MSG225", "MSG253", "MSG254"], "cov": {"br": 8, "code": 8, "test": 6}}, "UC-43": {"id": "UC-43", "name": "Join Meeting Room", "feature": "FE-08", "line": 1795, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person who currently holds access to an In Progress Online or Hybrid Meeting to check the camera and microphone in the lobby and enter its online meeting room. Joining does not start or change the Meeting. A person who opens the room before the Meeting starts waits in the lobby until it starts.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation. (BR-052, BR-053, BR-054, BR-044, BR-055)", "PRE-2: The Meeting is In Progress and its mode is Online or Hybrid. (BR-025, BR-055)", "PRE-3: The actor holds a current participant assignment of the Meeting, or a valid Guest invitation for it. Being the Member who created the Meeting or its Approver alone is not enough. (BR-044, BR-100)", "PRE-4: Fewer than 50 people are connected to the room."], "post": ["POST-1: The actor is in the meeting room and appears in the Participants panel of everyone in the room. (BR-101)", "POST-2: The Meeting lifecycle, its roster, its roles and its attendance are unchanged; presence in the room is never recorded as attendance. (BR-101)", "POST-3: The actor stays in the room until leaving (UC-44) or until the Meeting ends.", "POST-4: A Guest who joins from two devices is in the room twice, and revoking the invitation removes both. The Guest's confirmation of the recording notice is recorded in the audit log."], "normal": [{"id": "", "title": "Join Meeting Room", "notes": [], "steps": [{"n": 1, "text": "On the Meeting detail of an In Progress Online or Hybrid Meeting, the actor chooses to join the online room."}, {"n": 2, "text": "The system checks that the actor may still view the Meeting, that it is In Progress, that it has an online room and that the actor may enter the room. (BR-044, BR-025, BR-100)"}, {"n": 3, "text": "The system opens the Meeting Lobby with a camera preview; the microphone is on and the camera is off by default. When recording applies to the Meeting, the lobby tells the actor that the meeting is recorded for the minutes and that the actor's own speech is recorded while the microphone is on. (UC-45a, UC-53)"}, {"n": 4, "text": "The actor checks the preview and may choose other devices (UC-45d) or turn the microphone or camera on or off (UC-45a, UC-45b)."}, {"n": 5, "text": "The actor chooses to join the room. A Guest first confirms the recording notice, and the system records that confirmation in the audit log."}, {"n": 6, "text": "The system checks again that the actor may enter the room and lets the actor in with the actor's current Meeting Role. (BR-100)"}, {"n": 7, "text": "The system shows the online meeting room with the people already in it; no separate success message is displayed. (UC-46)"}]}], "alts": [{"id": "AF-1", "title": "Rejoin after a lost connection", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor returns to the room after the connection was lost while the Meeting is still In Progress."}, {"n": 2, "text": "The system offers to rejoin; no new room and no new Meeting are created. (BR-101)"}, {"n": 3, "text": "The flow resumes at Step 6 of the Normal Flow."}]}, {"id": "AF-2", "title": "Join from a Guest invitation", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Guest continues from the verified invitation instead of the Meeting detail."}, {"n": 2, "text": "The system checks the invitation and that the Meeting is In Progress. (BR-052, BR-053, BR-054, BR-044, BR-055)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-3", "title": "Opened before the Meeting starts", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is Published and has not been started."}, {"n": 2, "text": "The system shows the waiting lobby with MSG117 – “The meeting room opens only while the meeting is in progress.” and does not let the actor join yet. (BR-025)"}, {"n": 3, "text": "When the Chair or the Secretary starts the Meeting (UC-20), the lobby opens and the flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-4", "title": "The browser blocks audio playback", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the browser does not play sound until the actor interacts with the page."}, {"n": 2, "text": "The system displays MSG338 – “The browser is blocking audio playback.” and asks the actor to allow sound."}, {"n": 3, "text": "The actor allows sound and the flow resumes at Step 7 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Meeting has ended or was cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the Meeting has ended, including while the actor was in the lobby, or it was cancelled. (BR-028)"}, {"n": 2, "text": "The actor does not enter the room. When the Meeting has ended, the system displays MSG331 – “The meeting has ended, the meeting room is closed.” and offers a way back to the Meeting page (BR-025); a Guest sees the end screen of UC-04 instead. When the Meeting was cancelled, the system displays MSG350 – “The meeting was cancelled, so the meeting room does not open.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting is held in person", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting mode is In Person, so it has no online room."}, {"n": 2, "text": "No lobby is opened. The system displays MSG280 – “This meeting is held in person, so it has no online meeting room.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The Guest session ended while waiting or joining", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the Guest session expired."}, {"n": 2, "text": "The Guest does not enter the room, the Meeting data is removed from the screen and the Guest returns to the verification screen with MSG378 – “The guest session has ended.” The invitation is still valid, so the Guest may verify again; when the invitation was revoked, UC-04 applies instead."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Recording notice not confirmed", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Guest has not confirmed the recording notice."}, {"n": 2, "text": "The Guest does not enter the room. The system displays MSG380 – “Confirm that you have read the recording notice before joining the meeting room.”"}, {"n": 3, "text": "The flow resumes at Step 5 of the Normal Flow."}]}], "br": ["BR-025", "BR-028", "BR-044", "BR-052", "BR-053", "BR-054", "BR-055", "BR-100", "BR-101"], "msg": ["MSG117", "MSG280", "MSG331", "MSG338", "MSG350", "MSG378", "MSG380"], "cov": {"br": 9, "code": 6, "test": 1}}, "UC-44": {"id": "UC-44", "name": "Leave Meeting Room", "feature": "FE-08", "line": 1806, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person connected to the online meeting room to disconnect. Leaving never changes the Meeting lifecycle: the Meeting stays In Progress for everyone else, and the person may join again while it is In Progress. Only the Chair ends the Meeting, through UC-21.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of the Meeting. (UC-43)", "PRE-3: The Meeting is In Progress."], "post": ["POST-1: The actor is disconnected and no longer appears in the Participants panel. (BR-101)", "POST-2: The Meeting stays In Progress with its roster, roles, attendance and recorded ballots unchanged. (BR-101)", "POST-3: The actor may join again through UC-43 while the Meeting is In Progress."], "normal": [{"id": "", "title": "Leave Meeting Room", "notes": [], "steps": [{"n": 1, "text": "The actor chooses to leave the room."}, {"n": 2, "text": "The system asks the actor to confirm, reminding that the meeting continues with the others and that the actor can rejoin while it is in progress."}, {"n": 3, "text": "The actor confirms."}, {"n": 4, "text": "The system disconnects the actor, stops the camera and microphone and shows the Meeting detail."}, {"n": 5, "text": "The Meeting stays In Progress for everyone still connected; no separate success message is displayed. (BR-101)"}]}], "alts": [{"id": "AF-1", "title": "Stay in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor chooses to stay."}, {"n": 2, "text": "No connection is closed and the flow resumes at Step 1 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Meeting has ended while in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Chair ended the Meeting (UC-21) and the room closed."}, {"n": 2, "text": "The actor is disconnected and cannot rejoin. The system displays MSG331 – “The meeting has ended, the meeting room is closed.” A Guest sees the end screen of UC-04 instead."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Same account joined elsewhere", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor joins the room from another tab or device."}, {"n": 2, "text": "The earlier connection is closed and displays MSG329 – “You joined this room from another tab or device, so this tab left the room.” It may rejoin, which closes the newer connection in turn."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Actor is no longer on the participant list", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor was removed from the roster or the Guest invitation was revoked while connected."}, {"n": 2, "text": "The actor is disconnected and cannot rejoin. The system displays MSG330 – “You are no longer on the participant list of this meeting room.” A Guest whose invitation was revoked sees the end screen of UC-04 instead."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-101"], "msg": ["MSG329", "MSG330", "MSG331"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-45": {"id": "UC-45", "name": "Manage Meeting Room Controls", "feature": "FE-08", "line": 1817, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-45a": {"id": "UC-45a", "name": "Manage Microphone", "feature": "FE-08", "line": 1819, "extra": {}, "parent": "UC-45", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to turn his or her own microphone on or off. It changes only that person's microphone: turning another person's microphone off is UC-47. While recording applies to the Meeting, the actor's own speech is recorded while the microphone is on (AF-2). For the Secretary of a Hybrid Meeting the microphone is the room microphone, so turning it on or off turns the room recording on or off (UC-52a).", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is in the Meeting Lobby or connected to the meeting room of an In Progress Meeting. (UC-43)", "PRE-3: The browser reports at least one microphone."], "post": ["POST-1: The actor's microphone is on or off as chosen, for that actor only.", "POST-2: The on/off state is remembered for the next visit on that device.", "POST-3: No other person's audio, the Meeting lifecycle and attendance are unchanged.", "POST-4: While recording applies to the Meeting, a microphone that is on means the actor’s own speech is recorded for the minutes; turning it off stops it. (AF-2, UC-53, BR-113)"], "normal": [{"id": "", "title": "Manage Microphone", "notes": [], "steps": [{"n": 1, "text": "The actor turns his or her microphone on or off in the lobby or in the room."}, {"n": 2, "text": "The system turns the microphone on or off and shows the new state to the actor and to everyone in the room; no separate message is displayed. (UC-46)"}, {"n": 3, "text": "The system remembers the new state for the next visit on this device."}]}], "alts": [{"id": "AF-1", "title": "Choose another microphone", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor chooses another microphone through UC-45d."}, {"n": 2, "text": "The system switches to that microphone, keeps the on/off state and remembers the device."}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "AF-2", "title": "Speech recorded while the microphone is on", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor turns the microphone on in an Online or Hybrid Meeting that is In Progress. This applies to a Guest with a valid invitation as well, once the Guest has confirmed the recording notice. It does not apply to the Secretary of a Hybrid Meeting, whose microphone records the whole room (UC-52a). (BR-107, BR-113, BR-111, BR-112)"}, {"n": 2, "text": "While the microphone is on, the system records the actor’s speech sentence by sentence as text, with its time and the actor’s name. (BR-113)"}, {"n": 3, "text": "A sentence that repeats a neighbouring person’s speech picked up by the actor’s microphone is marked as overlapping, not hidden."}, {"n": 4, "text": "The actor can review, play and delete his or her saved sentences in My Recorded Speech (UC-53); they are kept for the retention period. (BR-110, BR-113)"}, {"n": 5, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Browser blocks the microphone", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser has not granted microphone permission."}, {"n": 2, "text": "The microphone stays off and the actor stays in the room and can still hear everyone. The system displays MSG334 – “The browser is blocking the {device}. Click the lock icon beside the address bar, choose Allow and reload the page. You can still join the room to listen.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}, {"id": "EX-2", "title": "No microphone is available", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the browser reports no microphone, or the chosen microphone was disconnected."}, {"n": 2, "text": "The microphone cannot be chosen and the actor can still join the room to listen. The system displays MSG335 – “No {device} was found on this computer.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Meeting cannot be recorded now", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-2, the Meeting is held in person, has not started, or ended more than 7 days ago. (BR-107)"}, {"n": 2, "text": "The sentence is not kept. The system displays MSG320 – “In-person meetings do not record per-mic speech, or the meeting is no longer running.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-107", "BR-110", "BR-111", "BR-112", "BR-113"], "msg": ["MSG320", "MSG334", "MSG335"], "cov": {"br": 5, "code": 2, "test": 1}}, "UC-45b": {"id": "UC-45b", "name": "Manage Camera", "feature": "FE-08", "line": 1830, "extra": {}, "parent": "UC-45", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to turn his or her own camera on or off. It changes only that person's camera.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is in the Meeting Lobby or connected to the meeting room of an In Progress Meeting. (UC-43)", "PRE-3: The browser reports at least one camera."], "post": ["POST-1: The actor's camera is on or off as chosen, for that actor only; the camera is off when the actor first joins.", "POST-2: The on/off state is remembered for the next visit on that device.", "POST-3: No other person's video, the Meeting lifecycle and attendance are unchanged."], "normal": [{"id": "", "title": "Manage Camera", "notes": [], "steps": [{"n": 1, "text": "The actor turns his or her camera on or off in the lobby or in the room."}, {"n": 2, "text": "The system turns the camera on or off; while it is off, everyone in the room sees the actor's initials instead of a video image. No separate message is displayed. (UC-46)"}, {"n": 3, "text": "The system remembers the new state for the next visit on this device."}]}], "alts": [{"id": "AF-1", "title": "Choose another camera", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor chooses another camera through UC-45d."}, {"n": 2, "text": "The system switches to that camera, keeps the on/off state and remembers the device."}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "The browser blocks the camera", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser has not granted camera permission."}, {"n": 2, "text": "The camera stays off and the actor stays in the room with audio. The system displays MSG334 – “The browser is blocking the camera. Click the lock e actor that he or she is presenting to everyone."}, {"n": 4, "text": "The actor stops sharing."}, {"n": 5, "text": "The system ends the presentation and returns everyone to the video grid; no separate message is displayed."}]}], "alts": [{"id": "AF-1", "title": "Someone else starts presenting", "notes": [], "steps": [{"n": 1, "text": "At Step 3, while the actor is presenting, another person starts a share."}, {"n": 2, "text": "The system stops the actor's presentation and keeps the new one."}, {"n": 3, "text": "The system displays MSG340 – “{name} started presenting, so your screen share was stopped.” and the flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-2", "title": "The device cannot share a screen", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the device cannot share a screen."}, {"n": 2, "text": "The system does not offer screen sharing; watching another person present still works."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Sharing cannot start", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the share cannot start."}, {"n": 2, "text": "Nothing is shared and the stage stays as it was. The system displays MSG341 – “Unable to share your screen. Please try again.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}], "br": [], "msg": ["MSG340", "MSG341"], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-45d": {"id": "UC-45d", "name": "Choose Audio and Video Devices", "feature": "FE-08", "line": 1852, "extra": {}, "parent": "UC-45", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to choose which microphone, speaker and camera the browser uses. The choice applies to that person's browser on that device only: it changes no Meeting setting and is not stored with the Meeting.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE- mes at Step 1 of the Normal Flow."}]}, {"id": "EX-2", "title": "The device cannot be opened", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the browser cannot open the chosen device for another reason."}, {"n": 2, "text": "The previous device stays in use and the actor can still join the room to listen. The system displays MSG337 – “Unable to open the {device}. Check the permission at the lock icon beside the address bar. You can still join the room to listen.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}], "br": [], "msg": ["MSG335", "MSG337"], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-46": {"id": "UC-46", "name": "View Meeting Room Participants", "feature": "FE-08", "line": 1863, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the room to see who is connected at that moment, with each person's Meeting Role, who is speaking and whose microphone is off. It shows the room, not the roster: someone who has not joined, or has left, is not listed.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of an In Progress Meeting. (UC-43)"], "post": ["POST-1: The panel lists everyone connected at that moment, ordered by Meeting Role and then by name.", "POST-2: The list follows people joining, leaving, speaking, muting (UC-47) and changing role (UC-34) while it is open. (BR-101, BR-102)", "POST-3: Presence in the list is not attendance and changes no stored data. (BR-101)"], "normal": [{"id": "", "title": "View Meeting Room Participants", "notes": [], "steps": [{"n": 1, "text": "The actor opens the list of people in the room."}, {"n": 2, "text": "The system shows the number of people currently connected."}, {"n": 3, "text": "The system lists each connected person with name, Meeting Role, whether the person is speaking and the microphone state erson."}, {"n": 3, "text": "The system checks that the actor is still the current Chair and that the target is still in the room with the microphone on. (BR-102)"}, {"n": 4, "text": "The system mutes the target's microphone for everyone in the room. (BR-102)"}, {"n": 5, "text": "The system displays MSG342 – “Muted the microphone of {name}.” to the Chair, and MSG339 – “The Chair has muted your microphone. You can turn it back on when you need to speak.” to the target."}]}], "alts": [{"id": "AF-1", "title": "The target turns the microphone on again", "notes": [], "steps": [{"n": 1, "text": "After Step 4, the target turns the microphone on through UC-45a."}, {"n": 2, "text": "The microphone is on again and everyone sees it; the Chair may mute again. (BR-102)"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is no longer the chair", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair role was handed over through UC-34, so the actor is no longer the Chair. (BR-102)"}, {"n": 2, "text": "No microphone is muted. The system displays MSG123 – “Only the Chair can mute another person's microphone.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting is no longer in progress", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting ended."}, {"n": 2, "text": "No microphone is muted. The system displays MSG117 – “The meeting room opens only while the meeting is in progress.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Target is no longer in the room or has no microphone on", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the target left, was disconnected or turned the microphone off."}, {"n": 2, "text": "No microphone is muted. The system displays MSG282 – “This person is no longer in the room or has no microphone on.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow."}]}], "br": ["BR-102"], "msg": ["MSG117", "MSG123", "MSG282 ised hands in order, invite one person at a time to speak and close each turn. Raising a hand does not turn any microphone on or off: the invited person turns his or her own microphone on (UC-45a). The requests are kept with the Meeting as a record of who spoke and for how long; they are not tasks.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of an In Progress Meeting. (UC-43)", "PRE-3: To invite, reorder or close a turn, the actor is the current Chair of the Meeting. (BR-104, BR-105, BR-106)"], "post": ["POST-1: A raised hand is queued behind the earlier ones, or the hand is lowered. (BR-104, BR-105, BR-106)", "POST-2: An invited person is the only one holding the floor until the turn is closed; the invitation and the start and end of the turn are kept with the Meeting. (BR-104, BR-105, BR-106)", "POST-3: Microphones, Meeting Roles, attendance and the Meeting lifecycle are unchanged. (BR-102, BR-101)"], "normal": [{"id": "", "title": "Register to Speak", "notes": [], "steps": [{"n": 1, "text": "The actor raises a hand. When an agenda item is under discussion, the request is linked to it."}, {"n": 2, "text": "The system checks that the actor is in the room, that the Meeting is In Progress and that the actor has no open request, then puts the request at the end of the queue and shows the raised hand to everyone in the room. (UC-46, BR-104, BR-105, BR-106)"}, {"n": 3, "text": "The Chair sees the queue of raised hands in order, with each person’s name and the time of the request."}, {"n": 4, "text": "The Chair invites a person to speak, usually the first in the queue. (BR-104, BR-105, BR-106)"}, {"n": 5, "text": "The system marks the request as invited and shows the person that it is his or her turn."}, {"n": 6, "text": "The person turns the microphone on (UC-45a) and starts speaking; the system marks the turn as speaking and keeps its start xt": "At Step 4, or when reordering, declining or closing another person’s turn, the actor is not the current Chair, for instance because the Chair role was handed over through UC-34. (BR-104, BR-105, BR-106)"}, {"n": 2, "text": "Nothing is changed. The system displays MSG457 – “Only the current Chair may run the speaking turns.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Actor is not in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the actor is not connected to the meeting room."}, {"n": 2, "text": "No request is created or changed. The system displays MSG458 – “You must be in the meeting room to register to speak.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Someone already holds the floor", "notes": [], "steps": [{"n": 1, "text": "At Step 4, another person is already invited or speaking. (BR-104, BR-105, BR-106)"}, {"n": 2, "text": "Nobody is invited. The system displays MSG459 – “Someone is already invited or speaking. Close that turn first.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-6", "title": "The request has changed", "notes": [], "steps": [{"n": 1, "text": "At any step, the request is no longer in a state that allows the action, for instance it was lowered, finished or not yet invited."}, {"n": 2, "text": "Nothing is changed. The system displays MSG460 – “This speaking request has changed. Reload the list.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "br": ["BR-101", "BR-102", "BR-104", "BR-105", "BR-106"], "msg": ["MSG117", "MSG457", "MSG458", "MSG459", "MSG460"], "cov": {"br": 5, "code": 2, "test": 2}}, "UC-51": {"id": "UC-51", "name": "View & Play Meeting Recordings", "feature": "FE-09", "line": 1920, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-51a": {"id": "UC-51a", "name": "View Meeting Recordings", "feature": "FE-09", "line": 1922, "extra": {}, "paren ], "msg": [], "cov": {"br": 7, "code": 4, "test": 1}}, "UC-51b": {"id": "UC-51b", "name": "Play Meeting Recording", "feature": "FE-09", "line": 1933, "extra": {}, "parent": "UC-51", "actors": "Chair, Secretary, Participant", "secondary": "None", "desc": "Allows a person who currently holds a Chair, Secretary or Participant assignment of a Meeting to listen to a room recording, the combined recording or to a single recorded sentence.", "pre": ["PRE-1: The actor is viewing the recordings of a Meeting in which the actor currently holds a Chair, Secretary or Participant assignment. (UC-51a, BR-111, BR-112)", "PRE-2: The recording or the sentence has not been erased or deleted."], "post": ["POST-1: The audio plays for the actor. Nothing is saved to the actor's device and the record is not changed.", "POST-2: Only the Chair and the Secretary can play a sentence excluded from the record. (BR-114, BR-115)"], "normal": [{"id": "", "title": "Play Meeting Recording", "notes": [], "steps": [{"n": 1, "text": "The actor selects Play on a room recording, the combined recording or on a recorded sentence."}, {"n": 2, "text": "The system checks that the actor currently holds a Chair, Secretary or Participant assignment and may hear this item. (BR-111, BR-112, BR-114, BR-115)"}, {"n": 3, "text": "The system plays the recording, or the chosen sentence, from its beginning."}, {"n": 4, "text": "The actor can pause, move to another position, change the volume and change the playback speed. While playing, the words being said are highlighted."}]}], "alts": [{"id": "AF-1", "title": "Play an excluded sentence", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor is the current Chair or Secretary and selects a sentence excluded from the record."}, {"n": 2, "text": "The system confirms that the actor is the Chair or the Secretary and allows the playback. (BR-114, BR-115)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor no longer has access, or recording not Available", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer on the roster, or the sentence is excluded from the record and the actor is neither the Chair nor the Secretary. (BR-111, BR-112, BR-114, BR-115)"}, {"n": 2, "text": "Nothing plays and the system answers as if the audio did not exist."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-111", "BR-112", "BR-114", "BR-115"], "msg": [], "cov": {"br": 4, "code": 2, "test": 0}}, "UC-51c": {"id": "UC-51c", "name": "Download Meeting Recording", "feature": "FE-09", "line": 1944, "extra": {}, "parent": "UC-51", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to download a room recording or the combined recording to the computer as an MP3 file.", "pre": ["PRE-1: The actor is signed in and currently holds the Chair or Secretary assignment of the Meeting. (BR-111, BR-112)", "PRE-2: The Meeting is not Secret. (BR-111, BR-112)", "PRE-3: The recording is Available, not Erased."], "post": ["POST-1: An MP3 file is saved on the actor's device.", "POST-2: The download is recorded in the audit log. (BR-111, BR-112)"], "normal": [{"id": "", "title": "Download Meeting Recording", "notes": [], "steps": [{"n": 1, "text": "The actor selects Download on an available room recording or the combined recording."}, {"n": 2, "text": "The system checks that the actor is the current Chair or Secretary and that the Meeting is not Secret. (BR-111, BR-112)"}, {"n": 3, "text": "The system records the download in the audit log. (BR-111, BR-112)"}, {"n": 4, "text": "The system delivers the recording as an MP3 file."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is a Participant, not the Chair or the Secretary. (BR-111, BR-112)"}, {"n": 2, "text": "No file is delivered and nothing is logged. The system displays MSG355 – 2, "text": "If this is the first take of the Meeting's room recording, the system asks the Secretary to confirm that attendees were informed and nobody objected, and to enter the purpose of the recording (optional). (BR-109)"}, {"n": 3, "text": "The Secretary confirms."}, {"n": 4, "text": "The system checks the Secretary's role, the format and the status of the Meeting and that the room microphone is not on elsewhere, opens a new take and keeps the time of the confirmation and the purpose. (BR-107, BR-108, BR-109)"}, {"n": 5, "text": "The room sound is recorded while the microphone is on. Everyone viewing the Meeting's recordings sees the Recording indicator, and the recording card stays visible on the Secretary's other pages."}, {"n": 6, "text": "The Secretary turns the room microphone off."}, {"n": 7, "text": "The system saves the take into the Meeting's room recording and displays MSG363 – “Room recording take saved.” The Recording indicator disappears and the recording is transcribed. (UC-54a)"}]}], "alts": [{"id": "AF-1", "title": "Hybrid meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Meeting is Hybrid."}, {"n": 2, "text": "The Secretary turns on his or her microphone in the online meeting room. For the Secretary of a Hybrid Meeting that microphone is the room microphone, so the room has one switch and no separate recording card. (UC-45a)"}, {"n": 3, "text": "Turning that microphone off later, including when the Chair turns the Secretary's microphone off in the online room, turns the room microphone off and saves the take as in Steps 6–7."}, {"n": 4, "text": "If the online meeting room cannot be used, the recording card on the Meeting page is the switch, as for an In-person Meeting."}, {"n": 5, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "AF-2", "title": "Reopening the Meeting while a take is open on this device", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Secretary closed the page or the browser while the room microphone was on and opens the Meeting again on the same device."}, {"n": 2, "text": "The system offers Continue recording or Save recorded part."}, {"n": 3, "text": "If the Secretary continues, the recording carries on in the same take and the flow resumes at Step 5 of the Normal Flow."}, {"n": 4, "text": "If the Secretary saves the recorded part, the flow resumes at Step 7 of the Normal Flow."}]}, {"id": "AF-3", "title": "Take left open on another device", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the system shows that the room is still being recorded on another device."}, {"n": 2, "text": "The Secretary chooses to stop the recording on the other device."}, {"n": 3, "text": "The system saves the part recorded on the other device as a take, so that it is transcribed. (BR-108)"}, {"n": 4, "text": "The flow resumes at Step 1 of the Normal Flow, on this device."}]}, {"id": "AF-4", "title": "Later take of the same Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting already has a room recording, so an earlier take of it already received the confirmation."}, {"n": 2, "text": "The system does not ask again. If that room recording was erased (UC-52e), the confirmation is asked again. (BR-109)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-5", "title": "No speech in the take", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the take received no sound at all."}, {"n": 2, "text": "The system discards the take and leaves the recording unchanged. It displays MSG365 – “Microphone detected no speech; take was not saved.”"}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Confirmation missing or information invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the confirmation is missing or the recording information is incomplete."}, {"n": 2, "text": "No take is opened. The system displays MSG291 – “Invalid recording information.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "EX-2", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or Step 7, the actor is not the current Secretary. (BR-108)"}, {"n": 2, "text": "No take is opened or saved. The system displays MSG295 – “Only the meeting Secretary may manage recordings.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Meeting is not in progress", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting is not In Progress. (BR-107)"}, {"n": 2, "text": "No take is opened. The system displays MSG359 – “Room microphone can only be turned on while the meeting is in progress.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Room microphone is on at another device", "notes": [], "steps": [{"n": 1, "text": "At Step 4, a take of the Meeting is still open on another device."}, {"n": 2, "text": "No take is opened. The system displays MSG360 – “Room microphone is currently active on another device.” The Secretary may stop that recording first (AF-3)."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Take already saved", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the take was already saved by another action, for instance from another device."}, {"n": 2, "text": "Nothing is added. The system displays MSG362 – “This recording take has been closed and cannot accept additional audio.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-107", "BR-108", "BR-109", "BR-125"], "msg": ["MSG291", "MSG295", "MSG359", "MSG360", "MSG362", "MSG363", "MSG365"], "cov": {"br": 4, "code": 1, "test": 0}}, "UC-52c": {"id": "UC-52c", "name": "Upload Meeting Audio File", "feature": "FE-09", "line": 1968, "extra": {}, "parent": "UC-52", "actors": "Secretary", "secondary": "None", "desc": "Allows the current Secretary to add an audio file recorded outside the system to the recordings of an In-person Meeting.", "pre": ["PRE-1: The actor is the current Secretary of the Meeting. (BR-108)", "PRE-2: The Meeting is In-person and is In Progress or Ended. (BR-107)"], "post": ["POST-1: The audio file is kept as a recording of its own and is transcribed. Takes recorded with the room microphone are never added to it. (UC-54a)", "POST-2: The confirmation that attendees were informed, with its time and purpose, is kept with the recording, and the upload is recorded in the audit log. (BR-109)"], "normal": [{"id": "", "title": "Upload Meeting Audio File", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects Upload audio file on the recordings of the Meeting."}, {"n": 2, "text": "The Secretary chooses an audio file from the computer."}, {"n": 3, "text": "The Secretary confirms that attendees were informed and nobody objected, and may enter the purpose of the recording. The system reminds the Secretary that the file must have been recorded with the meeting room microphone used for the voice samples. (BR-109)"}, {"n": 4, "text": "The Secretary selects Upload."}, {"n": 5, "text": "The system checks the Secretary's role, the format and the status of the Meeting, the type and the size of the file, and keeps the file. (BR-107, BR-108, BR-109)"}, {"n": 6, "text": "The system shows the file as uploaded and starts its transcription. (UC-54a)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "File or recording information is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the confirmation is missing or the recording information is incomplete."}, {"n": 2, "text": "No file is kept. The system displays MSG291 – “Invalid recording information.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-2", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor is not the current Secretary. (BR-108)"}, {"n": 2, "text": "No file is kept. The system displays MSG295 – “Only the meeting Secretary may manage recordings.”"}, {"n": 3, "text": "The us ipant", "secondary": "None", "desc": "Allows a person who currently holds a Chair, Secretary or Participant assignment to view the transcript of a recording: its state, the text with times and speakers, the dividers between takes and the text corrected by a person. A saved take or an uploaded audio file is transcribed without any action; the Secretary may also run the transcription.", "pre": ["PRE-1: The actor is signed in as an internal user and currently holds a Chair, Secretary or Participant assignment of the Meeting. (BR-111, BR-112)", "PRE-2: The Meeting has a room recording or an uploaded audio file that has not been erased."], "post": ["POST-1: The actor sees the state of the transcript and, once it is Completed, its passages with times, speakers and take dividers.", "POST-2: Suggestions are visible only to the Secretary. A name that is assigned – including one the system filled in by itself – is part of the transcript, so everyone who may read the transcript sees it; only the Secretary may change or clear it. (BR-111, BR-112, BR-120, BR-123)", "POST-3: When the Secretary runs the transcription, the transcript is made again from the whole recording and ends Completed or Failed with the reason; names assigned by hand, corrected text and moved sentences carry over where they still match, and what cannot be matched stays only in the audit log. (BR-121, BR-125, BR-154)"], "normal": [{"id": "", "title": "View Recording Transcript", "notes": [], "steps": [{"n": 1, "text": "The actor selects View transcript on a recording."}, {"n": 2, "text": "The system checks that the actor currently holds a Chair, Secretary or Participant assignment and loads the transcript. (BR-111, BR-112)"}, {"n": 3, "text": "The system shows the state of the transcript: Pending, Processing, Completed or Failed. For a Failed transcript it also shows the reason."}, {"n": 4, "text": "When the transcript is Completed, the system shows each passage with its time and its speaker (Speaker N, or the ting or being transcribed", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-2, the recording is waiting or is being transcribed."}, {"n": 2, "text": "Nothing changes. The system displays MSG301 – “The recording is currently queued or being transcribed and cannot be rerun yet.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-2, the actor is not the current Secretary. (BR-108)"}, {"n": 2, "text": "Nothing changes. The system displays MSG295 – “Only the meeting Secretary may manage recordings.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Combined recording", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of AF-2, the recording is the combined recording of the Meeting. (BR-122)"}, {"n": 2, "text": "Nothing is queued. The system displays MSG479 – “The combined recording is for listening only. Its speech has already been transcribed from the room and per-microphone recordings.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-108", "BR-111", "BR-112", "BR-120", "BR-121", "BR-122", "BR-123", "BR-125", "BR-154"], "msg": ["MSG295", "MSG300", "MSG301", "MSG479"], "cov": {"br": 9, "code": 0, "test": 0}}, "UC-54b": {"id": "UC-54b", "name": "Export Meeting Transcript", "feature": "FE-10", "line": 2027, "extra": {}, "parent": "UC-54", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to export the transcript of a room recording, or the sentences recorded from each person's own microphone, as a text file.", "pre": ["PRE-1: The actor is signed in and currently holds the Chair or Secretary assignment of the Meeting. (BR-111, BR-112)", "PRE-2: The Meeting is not Secret. (BR-111, BR-112)", "PRE-3: For a room recording, its transcript is Completed."], "post": ["POST-1: A text file with the transcript is delivered to the actor; a speaker assigned to a Guest appears under that Gue  "text": "The system applies the name to every passage of that speaker and records the change in the audit log."}, {"n": 5, "text": "The system displays MSG316 – “Speaker assigned.”"}]}], "alts": [{"id": "AF-1", "title": "Several voices of the same person", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the suggestions show that two or more speakers may be the same person."}, {"n": 2, "text": "The Secretary assigns the person to the whole group of speakers in one action, or clears a name the system filled in. (BR-120, BR-123)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-2", "title": "Change the speaker of one sentence", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Secretary selects one sentence of the transcript and chooses another speaker for it."}, {"n": 2, "text": "The Secretary chooses a person on the current roster, a Guest whose invitation is still valid, or any voice of this recording."}, {"n": 3, "text": "The system moves only that sentence to the chosen person's voice, creating a new voice when the person has none yet, and marks the sentence with the Secretary and the time of the move. A voice left with no sentence is hidden. (BR-125)"}, {"n": 4, "text": "The system records the change in the audit log and displays MSG407 – “The speaker of this sentence has been changed.”"}, {"n": 5, "text": "The flow resumes at Step 2 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Person is not on the current roster", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the chosen person is not on the current roster of the Meeting, or the chosen Guest has no current invitation of the Meeting. (BR-120)"}, {"n": 2, "text": "The name is not assigned. The system displays MSG317 – “Assigned person must be on the current meeting roster.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "EX-2", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At S vote results in section III are copied from the closed votes. (BR-128)"], "normal": [{"id": "", "title": "Generate Meeting Summary", "notes": [], "steps": [{"n": 1, "text": "The Chair or the Secretary opens the draft of the Meeting's minutes. (BR-126, BR-127)"}, {"n": 2, "text": "The system checks the current assignment and the Meeting status and shows what a draft would be based on: sentences recorded, voices not yet named, transcripts still running or failed, agenda items and how many were timed, and closed votes. (BR-126, BR-127, BR-128)"}, {"n": 3, "text": "The actor asks for a draft, or for a new one when a draft already exists."}, {"n": 4, "text": "The system accepts the request, keeps the earlier draft readable and displays MSG384 – “The request was sent. The draft appears when the AI has written it.”"}, {"n": 5, "text": "The system writes the three sections from the transcript, the agenda items and the conclusions the Chair recorded; section II follows the agenda items, and the result of each closed vote is copied as recorded, not written by AI. (BR-128)"}, {"n": 6, "text": "The system marks the draft as written by AI, clears any earlier review and shows the draft as soon as it is ready."}]}], "alts": [{"id": "AF-1", "title": "First draft", "notes": [], "steps": [{"n": 1, "text": "At Step 3, no draft exists yet."}, {"n": 2, "text": "The system accepts the request and the flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-2", "title": "Regenerate and replace", "notes": [], "steps": [{"n": 1, "text": "At Step 3, a draft already exists, including a reviewed one."}, {"n": 2, "text": "The system asks the actor to confirm that the new draft will replace the current text and its review."}, {"n": 3, "text": "The actor confirms and the flow resumes at Step 4 of the Normal Flow; the earlier draft stays readable until the new one is ready."}]}, {"id": "AF-3", "title": "No agenda, or items never timed", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Meeting has no agenda, or none of its items was started."}, {"n": 2, "text": "The system writes section II from the whole transcript instead of by agenda item."}, {"n": 3, "text": "The flow resumes at Step 6 of the Normal Flow."}]}, {"id": "AF-4", "title": "Little recorded", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Meeting has only a sentence or two."}, {"n": 2, "text": "The system still writes a draft from what was recorded, rather than inventing content. (BR-128)"}, {"n": 3, "text": "The flow resumes at Step 6 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor may read the Meeting but is neither its current Chair nor its current Secretary. (BR-126, BR-127)"}, {"n": 2, "text": "No request is queued. The system displays MSG385 – “Only the Chair or Secretary may create, edit and review the draft.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The Meeting has not ended", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting has not Ended. (BR-126, BR-127)"}, {"n": 2, "text": "No request is queued. The system displays MSG386 – “A draft can be created only after the meeting has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "A draft is already being written", "notes": [], "steps": [{"n": 1, "text": "At Step 4, a request is waiting or the AI is writing."}, {"n": 2, "text": "The earlier draft stays as it is and no second request is queued. The system displays MSG387 – “The AI is writing the draft, please wait.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-126", "BR-127", "BR-128"], "msg": ["MSG384", "MSG385", "MSG386", "MSG387"], "cov": {"br": 3, "code": 0, "test": 0}}, "UC-59": {"id": "UC-59", "name": "View Meeting Summary", "feature": "FE-10", "line": 2209, "extra": {}, "parent": null, "actors": "Chair, Secretary; every other person who may read the Meeting, once the draft is reviewed", "secondary": "None", "desc": "Allows a person who may read the Meeting to read the AI draft. Until the draft is reviewed only the current Chair and the current Secretary see it; after review the other people who may read the Meeting see it as well, without any control to change it. (BR-126, BR-127)", "pre": ["PRE-1: The internal user is signed in and may read the Meeting.", "PRE-2: For anyone other than the current Chair or the current Secretary, the draft has been reviewed. (BR-126, BR-127)"], "post": ["POST-1: The draft, its state and where each part came from are displayed.", "POST-2: No draft, review or Meeting record is changed."], "normal": [{"id": "", "title": "View Meeting Summary", "notes": [], "steps": [{"n": 1, "text": "The actor opens the minutes of the Meeting; they open only after the Meeting has Ended."}, {"n": 2, "text": "The system checks that the actor may read the Meeting and whether the actor is its current Chair or current Secretary. (BR-126, BR-127)"}, {"n": 3, "text": "The system displays the draft labelled “AI-written — needs review”, its three sections I–III, the time the AI read the transcript and the person who asked for it."}, {"n": 4, "text": "The system shows the review state — who reviewed it and when, and who last corrected it and when — and, for each part of section II, the stretch of the Meeting the part was written from, so the reader can check it against the recording."}, {"n": 5, "text": "While a draft is waiting or being written, the system shows that state; the earlier draft stays readable."}, {"n": 6, "text": "When voices are still unnamed, the current Chair or Secretary may name them from the draft, under the same rules as UC-55b."}]}], "alts": [{"id": "AF-1", "title": "No draft yet", "notes": [], "steps": [{"n": 1, "text": "At Step 3, no draft exists, or none has finished being written."}, {"n": 2, "text": "The system shows an empty state; for the current Chair and Secretary it also shows what a draft would ft."}, {"n": 2, "text": "The system checks the assignment and that a finished draft exists. (BR-126, BR-127)"}, {"n": 3, "text": "The actor confirms."}, {"n": 4, "text": "The system records the reviewer and the time, leaves the text unchanged and displays MSG391 – “Draft approved.”"}, {"n": 5, "text": "From then on everyone who may read the Meeting can read the draft, and the minutes use sections I–III."}]}], "alts": [{"id": "AF-1", "title": "Approve again", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the draft has already been reviewed and has not been corrected since."}, {"n": 2, "text": "The system applies Steps 3–4 again; the later reviewer and time replace the earlier ones."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor may read the Meeting but is neither its current Chair nor its current Secretary. (BR-126, BR-127)"}, {"n": 2, "text": "Nothing is reviewed. The system displays MSG385 – “Only the Chair or Secretary may create, edit and review the draft.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "No finished draft", "notes": [], "steps": [{"n": 1, "text": "At Step 2, no draft has finished being written."}, {"n": 2, "text": "Nothing is reviewed. The system displays MSG390 – “There is no draft to correct or review.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The AI is writing the draft again", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a new draft is being written for this Meeting."}, {"n": 2, "text": "Nothing is reviewed. The system displays MSG387 – “The AI is writing the draft, please wait.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Normal Flow when the draft is ready."}]}], "br": ["BR-126", "BR-127"], "msg": ["MSG385", "MSG387", "MSG390", "MSG391"], "cov": {"br": 2, "code": 0, "test": 0}}, "UC-62": {"id": "UC-62", "name": "View Meeting Votes", "feature": "FE-11", "line": 2246, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-62a": {"id": "UC-62a", "name": "View Meeting Votes", "feature": "FE-11", "line": 2248, "extra": {}, "parent": "UC-62", "actors": "Member, Approver, Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an authorized user to browse the Votes of a Meeting. Draft Votes are visible only to the current Chair and the current Secretary. Open and Closed Votes remain viewable by users with Meeting viewing permission, including after the Meeting ends.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor has current permission to view the Meeting's Votes. The current Chair or Secretary may access Vote preparation in Approved; other Meeting records follow their own access rules. (BR-016, BR-017, BR-055, BR-086, BR-087)"], "post": ["POST-1: The actor sees only Votes that the actor is authorized to view.", "POST-2: No Vote, ballot or conclusion is changed."], "normal": [{"id": "", "title": "View Meeting Votes", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Voting area of a Meeting."}, {"n": 2, "text": "The system checks current viewing permission; the current Chair or Secretary may access Vote preparation in Approved without gaining access to other restricted Meeting records. (BR-016, BR-017, BR-055, BR-086, BR-087)"}, {"n": 3, "text": "The system lists the Votes belonging to this Meeting and excludes Draft Votes unless the actor is the current Chair or the current Secretary. Displayed counts include only visible Votes. (BR-086, BR-087)"}, {"n": 4, "text": "The system displays each visible Vote with its content, ballot type and status. Open Votes show turnout; Closed Votes offer View result and show any recorded conclusion. No Agenda Item is selected or displayed as Vote ownership. (BR-086, BR-087)"}, {"n": 5, "text": "The ac
