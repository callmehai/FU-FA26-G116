<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustCabinet – Bản đồ UC · BR · MSG</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--ink:#1c2430;--muted:#5d6b7c;--line:#dde3ea;--brand:#1f5fbf;--brand-soft:#e8f0fc;
--br:#8a5a00;--br-soft:#fdf1d8;--msg:#0b6b5c;--msg-soft:#dcf3ee;--ok:#1c7a3d;--warn:#a96400;--bad:#b3261e;--code:#f0f3f7}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Be Vietnam Pro",system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand);text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
nav.tabs a{padding:6px 12px;border-radius:6px;color:var(--ink)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
#q{flex:1;max-width:420px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;height:calc(100vh - 51px)}
.app>*{overflow:auto}
aside.side{background:var(--surface);border-right:1px solid var(--line);padding:8px 0}
aside.insp{background:var(--surface);border-left:1px solid var(--line);padding:16px}
main{padding:20px 28px 80px}
.fe{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.uc-link{display:flex;gap:8px;align-items:baseline;padding:5px 14px;color:var(--ink)}
.uc-link.sub{padding-left:30px}
.uc-link:hover{background:var(--bg)}
.uc-link.on{background:var(--brand-soft);color:var(--brand)}
.uc-link b{min-width:50px;font-weight:600}
.uc-link span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.t{background:var(--ok)}.dot.c{background:var(--warn)}.dot.n{background:var(--bad)}
h2{margin:0 0 2px;font-size:20px}
h3{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.facts div{color:var(--muted)}.facts b{color:var(--ink);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
ul.bul{margin:0;padding-left:18px}ul.bul li{margin:3px 0}
.flow{margin:10px 0}
.flow>summary{cursor:pointer;font-weight:600;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.flow[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.flow.ex>summary{border-left:3px solid var(--bad)}
.flow.af>summary{border-left:3px solid var(--warn)}
.flow.nf>summary{border-left:3px solid var(--brand)}
.flow .body{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--surface);padding:6px 14px 10px}
.flow .note{color:var(--muted);font-style:italic;margin:6px 0 2px}
ol.steps{margin:6px 0;padding:0;list-style:none}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--bg)}
ol.steps li:first-child{border-top:0}
ol.steps .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;text-align:center;line-height:22px;font-weight:600}
.chip{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.chip.br{background:var(--br-soft);color:var(--br)}
.chip.msg{background:var(--msg-soft);color:var(--msg)}
.chip.uc{background:var(--brand-soft);color:var(--brand)}
.chip.sel{border-color:currentColor}
.chip.nocode{opacity:.55}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.t{background:#dff3e5;color:var(--ok)}.badge.c{background:#fdf1d8;color:var(--warn)}.badge.n{background:#fbe3e1;color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.refs{font:12px/1.6 ui-monospace,Consolas,monospace}
.refs a{display:block;padding:1px 6px;border-radius:4px;color:var(--ink);background:var(--code);margin:2px 0;overflow-wrap:anywhere}
.refs a.t{border-left:3px solid var(--ok)}.refs a.c{border-left:3px solid var(--brand)}
.insp h4{margin:0 0 4px;font-size:15px}
.insp .lab{margin:14px 0 4px;color:var(--muted);font-size:12px;font-weight:600}
.insp .empty{color:var(--muted)}
.cov{display:flex;gap:8px;align-items:center;margin:8px 0}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .a{background:var(--ok)}.bar .b{background:#8fc9a3}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters button{padding:5px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:inherit;cursor:pointer}
.filters button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
@media(max-width:1100px){.app{grid-template-columns:240px minmax(0,1fr);height:auto}.app>*{overflow:visible}aside.insp{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:700px){.app{grid-template-columns:1fr}aside.side{border-right:0;max-height:240px;overflow:auto}main{padding:16px}}
</style>

uccessfully."}]}], "br": ["BR-16"], "msg": ["MSG19", "MSG20", "MSG21", "MSG26"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-12b": {"id": "UC-12b", "name": "Update Role", "feature": "FE-03", "line": 1099, "extra": {}, "parent": "UC-12", "actors": "System Admin", "secondary": "None", "desc": "Allows the System Admin to change the name and description of a custom role. Predefined roles cannot be renamed; the permissions of any role are configured through UC-11.", "pre": ["PRE-1: The System Admin is authenticated in the system.", "PRE-2: The System Admin is authorized to manage roles.", "PRE-3: At least one custom role exists in the system."], "post": ["POST-1: The name and/or description of the selected role are updated; its permissions and the user accounts holding it remain unchanged.", "POST-2: The change is recorded in the audit log with the values before and after the update.", "POST-3: No user session is terminated; users holding the role see the new name the next time their information is loaded."], "normal": [{"id": "", "title": "Update Role", "notes": [], "steps": [{"n": 1, "text": "The System Admin accesses Role & Permission Management."}, {"n": 2, "text": "The system displays the list of roles."}, {"n": 3, "text": "The System Admin selects “Edit” on a custom role."}, {"n": 4, "text": "The system displays the edit form pre-filled with the current name and description."}, {"n": 5, "text": "The System Admin modifies the name and/or description and submits the form."}, {"n": 6, "text": "The system verifies that the selected role exists and is a custom role."}, {"n": 7, "text": "The system validates the role information using the same rules as UC-12 (name required, at most 64 characters after trimming; description at most 256 characters)."}, {"n": 8, "text": "The system checks that no other role has the same name (case-insensitive). Changing only the letter case of the role’s own name is allowed."}, {"n": 9, "text": "The system saves the updated role."}, {"n": e Saved"}, {"n": 1, "text": "At Step 9 of the Main Flow, the system cannot save the updated role."}, {"n": 2, "text": "The existing role information remains unchanged."}, {"n": 3, "text": "The system displays MSG27 – “Unable to update the role. Please try again.”"}, {"n": 4, "text": "The use case ends unsuccessfully."}]}], "br": ["BR-16"], "msg": ["MSG20", "MSG21", "MSG22", "MSG24", "MSG27"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-12c": {"id": "UC-12c", "name": "Delete Role", "feature": "FE-03", "line": 1110, "extra": {}, "parent": "UC-12", "actors": "System Admin", "secondary": "None", "desc": "Allows the System Admin to delete a custom role that is no longer held by any user account. Predefined roles cannot be deleted.", "pre": ["PRE-1: The System Admin is authenticated in the system.", "PRE-2: The System Admin is authorized to manage roles.", "PRE-3: At least one custom role exists in the system."], "post": ["POST-1: The selected role and its permission assignments are removed from the system.", "POST-2: The deletion, including the role name and the permissions it held, is recorded in the audit log.", "POST-3: No user account and no user session is affected."], "normal": [{"id": "", "title": "Delete Role", "notes": [], "steps": [{"n": 1, "text": "The System Admin accesses Role & Permission Management."}, {"n": 2, "text": "The system displays the list of roles with the number of user accounts holding each role."}, {"n": 3, "text": "The System Admin selects “Delete” on a custom role."}, {"n": 4, "text": "The system displays a confirmation dialog."}, {"n": 5, "text": "The System Admin confirms the deletion."}, {"n": 6, "text": "The system verifies that the selected role exists, is a custom role, and is not held by any user account, including deactivated accounts."}, {"n": 7, "text": "The system deletes the role together with its permission assignments."}, {"n": 8, "text": "The system records the role deletion in the audit log (BR-16)."}, {"n": 9, "text": "The system displays MSG23 – “Role deleted successfully.”"}]}], "alts": [{"id": "", "title": "AF-1: Deletion Cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Main Flow, the System Admin cancels the deletion."}, {"n": 2, "text": "The system closes the confirmation dialog without changing any data."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "", "title": "EX-1: Predefined Role", "notes": [], "steps": [{"n": 1, "text": "At Step 6 of the Main Flow, the system determines that the selected role is a predefined system role."}, {"n": 2, "text": "The system does not delete the role."}, {"n": 3, "text": "The system displays MSG24 – “This is a predefined system role and cannot be renamed or deleted. You can still configure its permissions.”"}, {"n": 4, "text": "The use case ends unsuccessfully. EX-2: Role Still Held by User Accounts"}, {"n": 1, "text": "At Step 6 or Step 7 of the Main Flow, the system determines that one or more user accounts (active or deactivated) still hold the role, including an account assigned to the role while the deletion was in progress."}, {"n": 2, "text": "The system does not delete the role."}, {"n": 3, "text": "The system displays MSG25 – “This role is still held by {n} user account(s). Reassign them to another role before deleting.” in the confirmation dialog, where {n} is the number of user accounts holding the role."}, {"n": 4, "text": "The use case ends unsuccessfully. EX-3: Role Cannot Be Deleted"}, {"n": 1, "text": "At Step 7 of the Main Flow, the system cannot delete the role."}, {"n": 2, "text": "The role and its permission assignments remain unchanged."}, {"n": 3, "text": "The system displays MSG28 – “Unable to delete the role. Please try again.”"}, {"n": 4, "text": "The use case ends unsuccessfully."}]}], "br": ["BR-16"], "msg": ["MSG23", "MSG24", "MSG25", "MSG28"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-13": {"id": "UC-13", "name": "View Audit Log", "feature": "FE-03", "line": 1121, "extra": {}, "parent": null, "actors": "System Admin", "secondary": "None", "desc": "Allows the System Admin to review recorded system events for security, accountability, and operational investigation.", "pre": ["PRE-1: The System Admin is authenticated and has permission to view the audit log."], "post": ["POST-1: The requested audit entries are displayed read-only.", "POST-2: No audit entry is changed by viewing or filtering the log."], "normal": [{"id": "", "title": "View Audit Log", "notes": [], "steps": [{"n": 1, "text": "The System Admin opens Audit Log."}, {"n": 2, "text": "The system retrieves audit entries within the Admin's requested date range and filters."}, {"n": 3, "text": "The system displays entries in reverse chronological order with actor, event, target, time, and outcome where recorded."}, {"n": 4, "text": "The System Admin opens an entry or changes filters/pages the results."}, {"n": 5, "text": "The system displays the matching entries and preserves the read-only state."}]}], "alts": [{"id": "", "title": "ALT-1: If no entries match the filters, the system displays an empty-result message and permits the Admin to revise the filters.", "notes": [], "steps": []}], "exs": [{"id": "", "title": "EX-1: Invalid filter or date-range values: the system identifies the invalid criteria and does not apply them.", "notes": ["EX-2: The audit log cannot be loaded: the system reports the failure and provides a retry action."], "steps": []}], "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-14": {"id": "UC-14", "name": "Create Meeting", "feature": "FE-04", "line": 1134, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "None", "desc": "Allows an authorized Meeting Organizer to create one independent Meeting as a Draft, including its planned schedule, mode, location, confidentiality and its initial participants.", "pre": ["PRE-1: The Meeting Organizer is authenticated.", "PRE-2: The Meeting Organizer is authorized to create meetings."], "post": ["POST-1: A new Meeting exists in Draft status with its planned start and end times.", "POST-2: The creator is recorded as Meeting Organizer.", "POST-3: The selected participants are saved with the Meeting, each with a Pending invitation response; no invitation is sent while the Meeting is Draft. The Meeting may subsequently be prepared and submitted for approval, and a Secretary may still be assigned later through UC-28a. (BR-320)"], "normal": [{"id": "", "title": "Create Meeting", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer selects Create Meeting."}, {"n": 2, "text": "The system displays the new Meeting form as a dialog."}, {"n": 3, "text": "The Organizer enters Meeting Name, Planned Start Time, Planned End Time, Meeting Mode, Location, Confidentiality Level and optional Description, and chooses the initial participants with a Meeting Role for each: exactly one Chair, and optionally a Secretary and Members. (BR-320)"}, {"n": 4, "text": "The Organizer submits the form."}, {"n": 5, "text": "The system checks the required values, confirms Planned Start Time is later than the current time and Planned End Time is later than Planned Start Time, and checks the chosen participants: each is an existing active internal user listed once, with a valid Meeting Role, and exactly one is the Chair. (BR-24, BR-25, BR-62, BR-162, BR-320)"}, {"n": 6, "text": "The system creates exactly one Meeting in Draft status, records the creator and saves the chosen participants with Pending responses, all in the same save. (BR-26, BR-320)"}, {"n": 7, "text": "The system displays MSG29 – \"Meeting created successfully.\""}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Invalid Meeting Information", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a required value is missing/invalid, the planned start is not in the future, or the planned end does not follow the start. (BR-24, BR-62, BR-162)"}, {"n": 2, "text": "The system displays MSG31 – \"Invalid meeting information.\" and highlights the affected fields."}, {"n": 3, "text": "No Meeting is created. The Organizer may correct the inputs and resubmit at Step 4."}]}, {"id": "EX-2", "title": "Meeting Cannot Be Created", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot save the Meeting."}, {"n": 2, "text": "The system displays MSG35 – \"Unable to create the meeting. Please try again.\""}, {"n": 3, "text": "No Meeting is created; the use case ends unsuccessfully."}]}, {"id": "EX-3", "title": "Invalid Participants", "notes": [], "steps": [{"n": 1, "text": "At Step 5, no participant is chosen, a participant is not an existing active internal user or is listed twice, a Meeting Role is invalid, or the choice does not contain exactly one Chair. (BR-320)"}, {"n": 2, "text": "The system displays MSG277 – \"The meeting participant list is not valid.\" and highlights the participant list."}, {"n": 3, "text": "No Meeting is created. The Organizer may correct the participants and resubmit at Step 4."}]}], "br": ["BR-24", "BR-25", "BR-26", "BR-62", "BR-162", "BR-320"], "msg": ["MSG29", "MSG31", "MSG35", "MSG277"], "cov": {"br": 6, "code": 3, "test": 1}}, "UC-15": {"id": "UC-15", "name": "Update Meeting", "feature": "FE-04", "line": 1145, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "None", "desc": "Allows the Meeting Organizer to update Draft/Rejected Meeting information, or to reschedule only the planned times or location when the Meeting is Published.", "pre": ["PRE-1: The Meeting exists and the Meeting Organizer is authenticated and authorized.", "PRE-2: Full Meeting editing is available only in Draft or Rejected. (BR-27)", "PRE-3: If the Meeting is Published, only the Meeting Organizer may invoke Reschedule to change planned times or location. The Meeting must not have started. (BR-27, BR-158)"], "post": ["POST-1: Authorized updates are saved to the Meeting.", "POST-2: Meeting lifecycle and assigned approver are unchanged.", "POST-3: When the schedule of a Published Meeting changes, affected participants are notified, except that the Organizer who rescheduled receives no in-app notification about this own action, and the change is recorded. (BR-76, BR-322)"], "normal": [{"id": "", "title": "Update Meeting", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer opens a Draft or Rejected Meeting and selects Edit."}, {"n": 2, "text": "The system displays the editable Meeting fields."}, {"n": 3, "text": "The Organizer changes the fields and submits."}, {"n": 4, "text": "The system verifies current Meeting status, permissions, required information, and confirms Planned End Time is after Planned Start Time. (BR-24, BR-27, BR-62)"}, {"n": 5, "text": "The system saves the updates without changing Meeting status and shows the success message."}]}], "alts": [{"id": "AF-1", "title": "Reschedule Published Meeting", "notes": ["Entry point: Step 1 of the Main Flow."], "steps": [{"n": 1, "text": "The Meeting Organizer selects Reschedule for a Meeting that is Published and has not started."}, {"n": 2, "text": "The system allows changes only to Planned Start Time, Planned End Time and Location. All other fields are read-only. (BR-27, BR-158)"}, {"n": 3, "text": "The Organizer enters the changes and submits."}, {"n": 4, "text": "The system validates that the new start is in the future and the end follows the start. (BR-62, BR-75)"}, {"n": 5, "text": "The system saves the new schedule, retains Published status, records the change and queues notifications to affected invitees: an in-app notification to every internal invitee except the Organizer who rescheduled, and a reschedule email to each invited Guest. (BR-322) Delivery failure does not roll back the saved change. (BR-38, BR-76, BR-158)"}, {"n": 6, "text": "The system displays MSG138 – \"Meeting rescheduled successfully. Invitees will be notified.\" The use case succeeds."}]}], "exs": [{"id": "EX-1", "title": "Invalid or Unauthorized Update", "notes": [], "steps": [{"n": 1, "text": "The system determines that meeting information is invalid, the Organizer is no longer authorized, or the Meeting status does not permit this edit. (BR-27, BR-62)"}, {"n": 2, "text": "The system does not save any changes and displays the applicable existing validation/error message."}, {"n": 3, "text": "The use case ends unsuccessfully or the Organizer corrects input and retries."}]}, {"id": "EX-2", "title": "Reschedule Not Permitted", "notes": [], "steps": [{"n": 1, "text": "During AF-1 the Meeting is not Published, has already started, its planned start is not in the future, or a field outside the allowed Reschedule set was modified. (BR-27, BR-75, BR-158)"}, {"n": 2, "text": "The system rejects the update; the existing schedule remains unchanged."}, {"n": 3, "text": "The system displays the relevant existing meeting-update error message. The use case ends."}]}, {"id": "EX-3", "title": "Update Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Main Step 5 or AF-1 Step 5 a persistence error occurs."}, {"n": 2, "text": "Existing Meeting data/status remain unchanged and no schedule-update notification is sent."}, {"n": 3, "text": "The system displays the existing update-failure message. The use case ends."}]}], "br": ["BR-24", "BR-27", "BR-38", "BR-62", "BR-75", "BR-76", "BR-158", "BR-322"], "msg": ["MSG138"], "cov": {"br": 8, "code": 6, "test": 0}}, "UC-16": {"id": "UC-16", "name": "View Meeting Details", "feature": "FE-04", "line": 1156, "extra": {}, "parent": null, "actors": "Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows authorized users to view the details of one Meeting, including planned schedule, actual start/end times when available, and meeting-level status. Agenda and other records remain accessible through their corresponding views.", "pre": ["PRE-1: The user is authenticated.", "PRE-2: A meeting has been selected or identified."], "post": ["POST-1: The Meeting Name, planned time range, actual times where available, mode, location, confidentiality, description and lifecycle status are displayed read-only. For a Cancelled Meeting, the cancellation reason, who cancelled it and when are also displayed. (BR-298)", "POST-2: The Meeting is not modified."], "normal": [{"id": "", "title": "View Meeting Details", "notes": [], "steps": [{"n": 1, "text": "The user requests the selected Meeting."}, {"n": 2, "text": "The system verifies that the Meeting exists and the user has access. (BR-29)"}, {"n": 3, "text": "The system retrieves the Meeting information and planned/actual time fields."}, {"n": 4, "text": "The system displays Meeting Name, planned start/end time, actual start/end time when available, Meeting Mode, Location, Confidentiality Level, Description, and Status. For a Cancelled Meeting, it also displays the cancellation reason, who cancelled it and when. (BR-298)"}, {"n": 5, "text": "The user reviews the Meeting details."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting Does Not Exist or Is Not Accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot find the selected meeting or the user is not authorized to view it."}, {"n": 2, "text": "The system does not disclose whether the meeting exists."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting Details Cannot Be Retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the meeting exists and is accessible, but the system cannot retrieve its meeting-level information."}, {"n": 2, "text": "The system displays MSG37 – \"Unable to load meeting details. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-29", "BR-298"], "msg": ["MSG37"], "cov": {"br": 2, "code": 2, "test": 0}}, "UC-17": {"id": "UC-17", "name": "View Meeting List", "feature": "FE-04", "line": 1167, "extra": {}, "parent": null, "actors": "Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authorized user to view and browse only the meetings to which the user has an authorized relationship or assignment. The assigned Secretary can view the Meeting before publication under BR-118. External Guests do not use the internal Meeting list.", "pre": ["PRE-1: The user is authenticated."], "post": ["POST-1: The system displays the list of meetings that the user is authorized to view.", "POST-2: No meeting information is modified."], "normal": [{"id": "", "title": "View Meeting List", "notes": [], "steps": [{"n": 1, "text": "The user selects Meetings from the navigation menu. The system opens the list with the Status filter preset to In Progress; the user may change or clear it."}, {"n": 2, "text": "The system identifies only meetings the user may view under BR-29: meetings created by the user at any status; meetings assigned to the user as Meeting Approver from WaitingApproval onward; and meetings assigned to the user as an active Secretary at any status, including before publication (BR-118); and meetings where the user is assigned as Chair or Member from Published onward. External Guests access only their invited Meeting through UC-04 and do not use this internal list."}, {"n": 3, "text": "The system sorts and displays only those authorized meetings that match the preset or selected criteria, including Cancelled Meetings with their status and Meetings the user has declined. (BR-297, BR-321)"}, {"n": 4, "text": "The user browses the displayed meetings."}]}], "alts": [{"id": "AF-1", "title": "Search Meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Main Flow, the user enters a meeting name in the search field."}, {"n": 2, "text": "The system finds meetings matching the entered search criteria within the meetings available to the user."}, {"n": 3, "text": "The system displays the matching meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-2", "title": "Filter Meetings", "notes": [] l, Rejected, Approved, Published or InProgress, including during the Meeting.", "pre": ["PRE-1: The Secretary is authenticated and assigned to the Meeting.", "PRE-2: The Meeting exists, is in Draft, WaitingApproval, Rejected, Approved, Published or InProgress status and is eligible for agenda planning. (BR-65, BR-74)"], "post": ["POST-1: A Pending Agenda Item is created under the Meeting.", "POST-2: The Agenda Item is ordered within that Meeting and any selected documents belong to the same Meeting.", "POST-3: A Presenter, when set, is a current participant or Guest of the Meeting. (BR-306)"], "normal": [{"id": "", "title": "Create Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens the Meeting Agenda and selects Add Agenda Item."}, {"n": 2, "text": "The Secretary enters Title, Description and an optional Presenter chosen from the current internal participants and Guests of the Meeting, and selects available Meeting documents. (BR-306)"}, {"n": 3, "text": "The system verifies the active Secretary assignment, Meeting status (Draft, WaitingApproval, Rejected, Approved, Published or InProgress), required values, the Presenter and document access. (BR-64, BR-65, BR-66, BR-74, BR-306)"}, {"n": 4, "text": "The system creates the Item as Pending after the last position in the Meeting agenda. Existing Item positions are unchanged. If a Presenter other than the Secretary was set while the Meeting is Published or InProgress, the Presenter is notified; a Secretary who assigns himself or herself is not notified. A Presenter who has declined the Meeting invitation may still be chosen and may still join. (BR-67, BR-307, BR-321, BR-322)"}, {"n": 5, "text": "The system displays MSG60 – \"Agenda item created successfully.\" and automatically refreshes the complete Agenda for authorized users currently viewing it. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Invalid Agenda Item Information", "notes": [], "steps": [{"n": 1, "text": "At Step 3, required values or selected documents are invalid."}, {"n": 2, "text": "No Item is created. The system displays MSG66 – \"Invalid agenda item information.\" with the applicable field messages."}]}, {"id": "EX-2", "title": "Agenda Planning No Longer Permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting no longer permits Agenda planning or the actor is no longer its active assigned Secretary."}, {"n": 2, "text": "No Item is created. The system displays MSG67 – \"The agenda for this meeting can no longer be modified.\""}]}, {"id": "EX-3", "title": "Create Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the system cannot save the Item or its document associations."}, {"n": 2, "text": "The saved Agenda and its order remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG68 – \"Unable to create the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-65", "BR-66", "BR-67", "BR-73", "BR-74", "BR-306", "BR-307", "BR-321", "BR-322"], "msg": ["MSG60", "MSG66", "MSG67", "MSG68"], "cov": {"br": 10, "code": 0, "test": 0}}, "UC-23b": {"id": "UC-23b", "name": "Update Agenda Item", "feature": "FE-05", "line": 1259, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to update the Title, Presenter, Description and document associations of an Agenda Item, whatever its execution status, while Agenda planning is permitted.", "pre": ["PRE-1: The Secretary is authenticated, active and assigned to the Meeting.", "PRE-2: The Item belongs to the Meeting and the Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress. (BR-65, BR-68)", "PRE-3: Title, Presenter, Description and document associations may be changed whether the Item is Pending, InProgress or Done. (BR-68, BR-279)"], "post": ["POST-1: The Item information is updated.", "POST-2: Meeting membership, Item execution status, actual timestamps and Meeting lifecycle remain unchanged.", "POST-3: Authorized users currently viewing the Agenda automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Update Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects an Item and chooses Edit."}, {"n": 2, "text": "The system displays the current Title, Presenter, Description and document associations for editing; the Presenter is chosen from the current internal participants and Guests of the Meeting (BR-306), whatever the Item's execution status. Document links may be added or removed until the Meeting ends through UC-33b and UC-33d. (BR-68, BR-185, BR-277, BR-278, BR-279)"}, {"n": 3, "text": "The Secretary enters permitted changes and submits."}, {"n": 4, "text": "The system rechecks the active Secretary assignment, Meeting status (Draft, WaitingApproval, Rejected, Approved, Published or InProgress), required values, the Presenter and any selected Meeting documents. (BR-65, BR-66, BR-68, BR-74, BR-306)"}, {"n": 5, "text": "The system saves the changes together, preserving execution status, actual timestamps and position. If the Presenter was assigned or changed while the Meeting is Published or InProgress, the new Presenter is notified unless it is the Secretary who made the change; a notification failure does not undo the change. A Presenter who has declined the Meeting invitation may still be chosen and may still join. (BR-68, BR-307, BR-321, BR-322)"}, {"n": 6, "text": "The system displays MSG61 – \"Agenda item updated successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Invalid Agenda Item Information", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the submitted values or documents are invalid."}, {"n": 2, "text": "The Item remains unchanged. The system displays MSG66 with the applicable field messages."}]}, {"id": "EX-2", "title": "Editing No Longer Permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting no longer permits Agenda planning or the actor is no longer its active assigned Secretary."}, {"n": 2, "text": "The Item remains unchanged. The system displays MSG67."}]}, {"id": "EX-3", "title": "Update Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot save the changes."}, {"n": 2, "text": "Item information, document associations, execution status, actual timestamps and order remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG69 – \"Unable to update the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-65", "BR-66", "BR-68", "BR-73", "BR-74", "BR-185", "BR-277", "BR-278", "BR-279", "BR-306", "BR-307", "BR-321", "BR-322"], "msg": ["MSG61", "MSG66", "MSG67", "MSG69"], "cov": {"br": 13, "code": 4, "test": 1}}, "UC-23c": {"id": "UC-23c", "name": "Delete Agenda Item", "feature": "FE-05", "line": 1270, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to delete only a Pending Agenda Item from the Meeting.", "pre": ["PRE-1: The Secretary is authenticated, active and assigned to the Meeting.", "PRE-2: The Item belongs to a Meeting in Draft, WaitingApproval, Rejected, Approved, Published or InProgress. (BR-65, BR-74)", "PRE-3: The Item is Pending (not started). Only not-started Items can be deleted; InProgress and Done Items cannot. (BR-237)"], "post": ["POST-1: The selected Pending Item and its document links are removed. The documents stay in the Meeting and keep links to other Items; a document with no remaining links becomes a general Meeting document. (BR-280, BR-283)", "POST-2: Remaining Item positions and execution data, and the Meeting lifecycle, are unchanged.", "POST-3: Authorized viewers automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Delete Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects a Pending Item, chooses Delete and confirms."}, {"n": 2, "text": "The system verifies the active Secretary assignment, permitted Meeting status, Item membership and that the Item is still Pending. (BR-64, BR-65, BR-237)"}, {"n": 3, "text": "The system removes the Item and its document links, keeps the documents in the Meeting and preserves the remaining Item positions. (BR-283)"}, {"n": 4, "text": "The system displays MSG62 – \"Agenda item deleted successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Agenda Planning No Longer Permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting no longer permits Agenda planning or the actor is no longer its active assigned Secretary."}, {"n": 2, "text": "Nothing is deleted. The system displays MSG67."}]}, {"id": "EX-2", "title": "Agenda Item Has Already Started", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Item is InProgress or Done."}, {"n": 2, "text": "The Item and Agenda order remain unchanged. The system displays MSG142 – \"Only Pending agenda items can be deleted.\""}]}, {"id": "EX-3", "title": "Deletion Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot complete deletion."}, {"n": 2, "text": "The Item and the saved Agenda order remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG70 – \"Unable to delete the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-65", "BR-73", "BR-74", "BR-237", "BR-280", "BR-283"], "msg": ["MSG62", "MSG67", "MSG70", "MSG142"], "cov": {"br": 7, "code": 1, "test": 1}}, "UC-23d": {"id": "UC-23d", "name": "Reorder Agenda Items", "feature": "FE-05", "line": 1281, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to change the order of the Agenda Items within the same Meeting, whatever their execution status; Done Items may also be reordered.", "pre": ["PRE-1: The Secretary is authenticated, active and assigned to the Meeting.", "PRE-2: The Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress and contains at least two Agenda Items. (BR-65, BR-74)"], "post": ["POST-1: The Items of the Meeting are in the requested order.", "POST-2: Item membership, execution status and actual times remain unchanged. (BR-238)", "POST-3: Authorized viewers automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Reorder Agenda Items", "notes": [], "steps": [{"n": 1, "text": "The Secretary changes the relative order of the Agenda Items."}, {"n": 2, "text": "The system verifies the active Secretary assignment, permitted Meeting status and the latest saved Agenda. (BR-65, BR-74)"}, {"n": 3, "text": "The system verifies that each current Item of the Meeting appears exactly once and all Items belong to this Meeting. (BR-64, BR-238)"}, {"n": 4, "text": "The system saves the new order together."}, {"n": 5, "text": "The system displays MSG63 – \"Agenda order updated successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Reordering No Longer Permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting no longer permits Agenda planning or the actor is no longer its active assigned Secretary."}, {"n": 2, "text": "The saved order remains unchanged. The system displays MSG67."}]}, {"id": "EX-2", "title": "Invalid or Outdated Agenda Order", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the request duplicates or omits a current Item, includes an Item from another Meeting, or no longer matches the current Agenda."}, {"n": 2, "text": "No order changes are saved. The system displays MSG143 – \"The agenda order is invalid or out of date. Refresh the agenda and try again.\""}, {"n": 3, "text": "The system refreshes the complete Agenda. The Secretary may revise the order and continue from Step 1."}]}, {"id": "EX-3", "title": "Order Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the system cannot save the requested order."}, {"n": 2, "text": "All Item positions remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG71 – \"Unable to update the agenda order. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-65", "BR-73", "BR-74", "BR-238"], "msg": ["MSG63", "MSG67", "MSG71", "MSG143"], "cov": {"br": 5, "code": 0, "test": 0}}, "UC-24": {"id": "UC-24", "name": "Set Current Agenda Item", "feature": "FE-05", "line": 1292, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the active assigned Chair to start any Pending Agenda Item as the current Item, whatever its position in the Agenda. An Item must be started before it can be finished (UC-25).", "pre": ["PRE-1: The Chair is authenticated, active and assigned to the Meeting.", "PRE-2: The Meeting is InProgress and the selected Item is Pending. (BR-69, BR-70)", "PRE-3: No other Item of the Meeting is InProgress. (BR-71)"], "post": ["POST-1: The Agenda Item becomes InProgress and the current item for that Meeting.", "POST-2: Its actual start time is recorded."], "normal": [{"id": "", "title": "Set Current Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Chair selects a Pending Item and chooses Set as Current."}, {"n": 2, "text": "The system rechecks the active Chair assignment, Meeting InProgress status and that the selected Item belongs to the Meeting and remains Pending. (BR-64, BR-69)"}, {"n": 3, "text": "The system verifies that no other Item is InProgress. The position of the selected Item does not matter. (BR-70, BR-71)"}, {"n": 4, "text": "The system changes the Item to InProgress and records its actual start time together. If competing requests arrive, only one Item may start. (BR-70, BR-71, BR-72)"}, {"n": 5, "text": "The system displays MSG64 – \"Current agenda item updated successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Agenda Item Cannot Become Current", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Chair is no longer active or assigned, the Meeting is not InProgress, or the selected Item does not belong to the Meeting or is not Pending."}, {"n": 2, "text": "The Agenda remains unchanged. The system displays MSG73 – \"This agenda item cannot be set as current.\""}]}, {"id": "EX-2", "title": "Another Agenda Item Is InProgress", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or Step 4, another Item is already InProgress."}, {"n": 2, "text": "The selected Item remains Pending. The system displays MSG72 – \"Another agenda item is already in progress. Complete it before starting another agenda item.\""}]}, {"id": "EX-3", "title": "Current Agenda Item Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the system cannot save the Item status or actual start time."}, {"n": 2, "text": "The selected Item remains Pending; its timestamps and all other Agenda data remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG75 – \"Unable to set the current agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-69", "BR-70", "BR-71", "BR-72", "BR-73"], "msg": ["MSG64", "MSG72", "MSG73", "MSG75"], "cov": {"br": 6, "code": 0, "test": 0}}, "UC-25": {"id": "UC-25", "name": "Complete Agenda Item", "feature": "FE-05", "line": 1303, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the active assigned Chair to complete the current Agenda Item at any time. An Item must have been started (InProgress) before it can be finished; a Pending Item cannot be completed directly.", "pre": ["PRE-1: The Chair is active and assigned to the Meeting.", "PRE-2: The Meeting is InProgress and the selected Agenda Item is currently InProgress."], "post": ["POST-1: The current Item becomes Done with its actual end time.", "POST-2: The Meeting remains InProgress. No next Item starts automatically. (BR-72)", "POST-3: Authorized viewers automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Complete Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Chair selects Complete for the current Item."}, {"n": 2, "text": "The system verifies the active Chair assignment, Meeting InProgress status, Item membership and current InProgress status. (BR-64, BR-69, BR-70, BR-72)"}, {"n": 3, "text": "The system records the actual end time and changes the Item to Done together. (BR-70, BR-72)"}, {"n": 4, "text": "The Meeting stays InProgress with no current Item. The Chair may start any remaining Pending Item through UC-24."}, {"n": 5, "text": "The system displays MSG65 – \"Agenda item completed successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Agenda Item Cannot Be Completed", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Chair is no longer active or assigned, the Meeting is not InProgress, or the Item does not belong to the Meeting or is not its current InProgress Item."}, {"n": 2, "text": "Nothing changes. The system displays MSG74 – \"This agenda item cannot be completed.\""}]}, {"id": "EX-2", "title": "Agenda Item Completion Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot save completion or the actual end time."}, {"n": 2, "text": "The Item remains InProgress with unchanged timestamps. The Meeting remains InProgress. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG76 – \"Unable to complete the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-69", "BR-70", "BR-72", "BR-73"], "msg": ["MSG65", "MSG74", "MSG76"], "cov": {"br": 5, "code": 0, "test": 0}}, "UC-26": {"id": "UC-26", "name": "View Meeting Agenda", "feature": "FE-05", "line": 1314, "extra": {}, "parent": null, "actors": "Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authorized user to view the complete Meeting Agenda and automatically see saved changes while the Agenda remains open.", "pre": ["PRE-1: The user may view the selected Meeting. (BR-29)"], "post": ["POST-1: Agenda title, presenter, order, execution status, recorded actual times and any recorded Item conclusion are shown read-only. (BR-311)", "POST-2: The complete Agenda automatically reflects successful creation, editing, deletion, reordering, Item start/completion and completion of the current Item when the Meeting ends. (BR-73)", "POST-3: Viewing does not modify the Agenda."], "normal": [{"id": "", "title": "View Meeting Agenda", "notes": [], "steps": [{"n": 1, "text": "The user opens the Meeting Agenda tab."}, {"n": 2, "text": "The system verifies Meeting access and retrieves the complete saved Agenda in its current order. (BR-29, BR-64)"}, {"n": 3, "text": "The system shows Item title, presenter, status, order, recorded actual times and any Item conclusion with who last saved it and when. (BR-311)"}, {"n": 4, "text": "While the user continues viewing, the system automatically refreshes the complete Agenda after a successful Agenda change, including changes made by another authorized user. Manual page refresh is not required. (BR-73)"}, {"n": 5, "text": "The system rechecks access before displaying refreshed Agenda data. Failed changes are not shown as successful updates."}]}], "alts": [{"id": "AF-1", "title": "Empty Meeting Agenda", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or Step 4, no Agenda Items exist."}, {"n": 2, "text": "The system displays the empty Agenda state."}, {"n": 3, "text": "While the view remains open, it automatically reflects subsequent saved Agenda changes. The use case succeeds."}]}], "exs": [{"id": "EX-1", "title": "Meeting Not Accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the Meeting does not exist or the user lacks access."}, {"n": 2, "text": "No further Agenda information is disclosed. The use case ends."}]}, {"id": "EX-2", "title": "Meeting Agenda Cannot Be Retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 4, the system cannot retrieve the latest Agenda."}, {"n": 2, "text": "The system displays MSG128 – \"Unable to load the meeting agenda. Please try again.\" A retrieval failure is not displayed as an empty Agenda."}, {"n": 3, "text": "No Agenda data changes; previously displayed information is not presented as the latest saved Agenda. The user may retry."}]}], "br": ["BR-29", "BR-64", "BR-73", "BR-311"], "msg": ["MSG128"], "cov": {"br": 4, "code": 1, "test": 0}}, "UC-77": {"id": "UC-77", "name": "Record Agenda Item Conclusion", "feature": "FE-05", "line": 1325, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to record or update the conclusion of an Agenda Item: what was concluded or agreed for that item. Item conclusions are used when the minutes draft is generated (UC-59). Vote results and conclusions remain recorded through UC-57.", "pre": ["PRE-1: The actor is signed in, can view the Meeting and is its current Chair or Secretary.", "PRE-2: The selected Agenda Item belongs to the Meeting and has been started, that is InProgress or Done; a Pending Item has no conclusion. (BR-64, BR-310)", "PRE-3: The Meeting is InProgress, or Ended and its minutes draft has not yet been generated. (BR-310)"], "post": ["POST-1: The Item has one conclusion, replacing any earlier one, with the actor and time of the last save recorded. (BR-3 uest. The initial participants of a new Meeting are chosen in the Create Meeting form (UC-14); this use case adds people afterwards.", "pre": ["PRE-1: The actor is either a current assigned Secretary (before publication, a current Chair may also add participants), or the Meeting Organizer restoring/initializing a missing Secretary in Draft, Rejected or Approved.", "PRE-2: The Meeting permits roster management. WaitingApproval remains read-only. (BR-78–BR-80, BR-122)"], "post": ["POST-1: The selected internal participants, Guest invitation, or Secretary recovery is saved.", "POST-2: New invitations start with Pending response.", "POST-3: Approved additional Meeting permissions apply to this Meeting only; Guest receives no internal or system Role. (BR-88, BR-150, BR-174)"], "normal": [{"id": "", "title": "Add Internal Participants", "notes": [], "steps": [{"n": 1, "text": "The actor opens participant management for the Meeting."}, {"n": 2, "text": "A current Secretary selects one or more active internal users, assigns the shared Meeting Role and any permitted additional Meeting permissions."}, {"n": 3, "text": "The actor confirms the selection."}, {"n": 4, "text": "The system rechecks actor authority, Meeting status, selected accounts, uniqueness, required roles and permitted grants. (BR-80–BR-85, BR-122, BR-168, BR-174)"}, {"n": 5, "text": "The system saves all selected participants together, initializes Pending responses and arranges invitations when the Meeting is Published or InProgress. No partial batch is saved."}, {"n": 6, "text": "The system displays MSG96 – “Meeting participant added successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Invite external Guest", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Secretary selects Invite Guest and enters the invitation name and email, plus any permitted additional Meeting permissions."}, {"n": 2, "text": "For a Confidential or Secret Meeting, the form displays the inline warning without adding a confirmati h UC-73; the only exception is that the Secretary may replace the Chair when the Chair's account is locked. After publication, the Chair and the Secretary do not swap roles. Before publication, the Chair and the Secretary may both manage participants and roles. To change the Secretary, give the Secretary role to the new person, then change the previous Secretary to Member. (BR-126, BR-294, BR-295)", "pre": ["PRE-1: The actor is a current authorized Secretary or, before publication, a current authorized Chair.", "PRE-2: The Meeting permits participant management, and the selected target is a current internal participant or Guest invitation. (BR-79, BR-80)"], "post": ["POST-1: Approved role or additional-permission changes are saved for this Meeting.", "POST-2: A Chair replacement changes both affected internal Meeting Roles together. System Role and Invitation Response remain unchanged. (BR-96, BR-169, BR-177)"], "normal": [{"id": "", "title": "Manage Meeting Role and Additional Permissions", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens a current participant’s role and additional-permission details."}, {"n": 2, "text": "The system displays the current Meeting Role and additional permissions."}, {"n": 3, "text": "The Secretary changes the internal participant’s Meeting Role or additional permissions, or selects a Guest invitation to change its additional permissions."}, {"n": 4, "text": "The Secretary confirms the changes."}, {"n": 5, "text": "The system rechecks current authority, Meeting status, role constraints and permission grants. Draft, Rejected and Approved may have no Secretary; Published and InProgress must retain or replace the last Secretary in the same save. (BR-122, BR-123, BR-174–BR-177)"}, {"n": 6, "text": "The system saves all requested changes consistently and retains compatible existing grants. Published/InProgress changes trigger the applicable notifications; notification failure does not undo the saved changes."}, {"n": 7, "text": }, {"n": 3, "text": "The invitee selects Accepted or Declined."}, {"n": 4, "text": "The system rechecks invitation ownership, that the actor is not the Chair, Meeting status and response value, and compares the value with any response already recorded. (BR-105, BR-106)"}, {"n": 5, "text": "The system saves the response and response time once."}, {"n": 6, "text": "The system confirms the update with MSG105 – “Meeting invitation response recorded successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Same response submitted again1. At Step 4, the invitee submits the same response that is already recorded.2. The system keeps the recorded response and response time unchanged and displays MSG154 – \"No changes to save.\" The use case ends successfully. (BR-106)", "notes": [], "steps": []}], "exs": [{"id": "EX-1", "title": "Invitation is no longer answerable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting status or invitation state no longer permits a response."}, {"n": 2, "text": "The prior response remains unchanged. For a Guest, email verification and Guest-access failures remain in UC-04."}, {"n": 3, "text": "The system displays MSG107 – “This meeting invitation can no longer be answered.” The use case ends unsuccessfully."}]}, {"id": "EX-2", "title": "Response value is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the submitted value is not Accepted or Declined."}, {"n": 2, "text": "The prior response and response time remain unchanged. The system displays MSG106 – “Invalid meeting invitation response.” The invitee may correct the selection and resume at Step 3."}]}, {"id": "EX-3", "title": "Response cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot persist the response."}, {"n": 2, "text": "The prior response and response time remain unchanged."}, {"n": 3, "text": "The system displays MSG108 – “Unable to save the meeting invitation response. Please try again.” The use case ends unsuccessfully."}
