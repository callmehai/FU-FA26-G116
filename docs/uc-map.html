<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustCabinet – Bản đồ UC · BR · MSG</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--ink:#1c2430;--muted:#5d6b7c;--line:#dde3ea;--brand:#1f5fbf;--brand-soft:#e8f0fc;
--br:#8a5a00;--br-soft:#fdf1d8;--msg:#0b6b5c;--msg-soft:#dcf3ee;--ok:#1c7a3d;--warn:#a96400;--bad:#b3261e;--code:#f0f3f7}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Be Vietnam Pro",system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand);text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
nav.tabs a{padding:6px 12px;border-radius:6px;color:var(--ink)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
#q{flex:1;max-width:420px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;height:calc(100vh - 51px)}
.app>*{overflow:auto}
aside.side{background:var(--surface);border-right:1px solid var(--line);padding:8px 0}
aside.insp{background:var(--surface);border-left:1px solid var(--line);padding:16px}
main{padding:20px 28px 80px}
.fe{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.uc-link{display:flex;gap:8px;align-items:baseline;padding:5px 14px;color:var(--ink)}
.uc-link.sub{padding-left:30px}
.uc-link:hover{background:var(--bg)}
.uc-link.on{background:var(--brand-soft);color:var(--brand)}
.uc-link b{min-width:50px;font-weight:600}
.uc-link span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.t{background:var(--ok)}.dot.c{background:var(--warn)}.dot.n{background:var(--bad)}
h2{margin:0 0 2px;font-size:20px}
h3{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.facts div{color:var(--muted)}.facts b{color:var(--ink);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
ul.bul{margin:0;padding-left:18px}ul.bul li{margin:3px 0}
.flow{margin:10px 0}
.flow>summary{cursor:pointer;font-weight:600;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.flow[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.flow.ex>summary{border-left:3px solid var(--bad)}
.flow.af>summary{border-left:3px solid var(--warn)}
.flow.nf>summary{border-left:3px solid var(--brand)}
.flow .body{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--surface);padding:6px 14px 10px}
.flow .note{color:var(--muted);font-style:italic;margin:6px 0 2px}
ol.steps{margin:6px 0;padding:0;list-style:none}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--bg)}
ol.steps li:first-child{border-top:0}
ol.steps .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;text-align:center;line-height:22px;font-weight:600}
.chip{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.chip.br{background:var(--br-soft);color:var(--br)}
.chip.msg{background:var(--msg-soft);color:var(--msg)}
.chip.uc{background:var(--brand-soft);color:var(--brand)}
.chip.sel{border-color:currentColor}
.chip.nocode{opacity:.55}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.t{background:#dff3e5;color:var(--ok)}.badge.c{background:#fdf1d8;color:var(--warn)}.badge.n{background:#fbe3e1;color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.refs{font:12px/1.6 ui-monospace,Consolas,monospace}
.refs a{display:block;padding:1px 6px;border-radius:4px;color:var(--ink);background:var(--code);margin:2px 0;overflow-wrap:anywhere}
.refs a.t{border-left:3px solid var(--ok)}.refs a.c{border-left:3px solid var(--brand)}
.insp h4{margin:0 0 4px;font-size:15px}
.insp .lab{margin:14px 0 4px;color:var(--muted);font-size:12px;font-weight:600}
.insp .empty{color:var(--muted)}
.cov{display:flex;gap:8px;align-items:center;margin:8px 0}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .a{background:var(--ok)}.bar .b{background:#8fc9a3}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters button{padding:5px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:inherit;cursor:pointer}
.filters button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
@media(max-width:1100px){.app{grid-template-columns:240px minmax(0,1fr);height:auto}.app>*{overflow:visible}aside.insp{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:700px){.app{grid-template-columns:1fr}aside.side{border-right:0;max-height:240px;overflow:auto}main{padding:16px}}
</style>

 The account owner then opens the link and sets a new password without signing in. The current password keeps working until the new one is set.", "pre": ["PRE-1: The System Admin is authenticated in the system.", "PRE-2: The System Admin is authorized to reset user passwords.", "PRE-3: The selected user account exists."], "post": ["POST-1: A password reset link valid for 60 minutes is created for the selected user, and any link sent to that user earlier stops working (BR-20).", "POST-2: A password reset email containing the link is sent to the user's registered email address.", "POST-3: The password reset request is recorded in the audit log (BR-16).", "POST-4: Until the link is used, the user's current password and active sessions remain unchanged.", "POST-5: When the account owner completes the reset, the password is replaced, every active session of that account is ended, the link can no longer be used, and the reset is recorded in the audit log (BR-01, BR-16, BR-20)."], "normal": [{"id": "", "title": "Reset User Password", "notes": [], "steps": [{"n": 1, "text": "The System Admin selects a user account and selects Reset Password."}, {"n": 2, "text": "The system requests confirmation, showing the email address the link will be sent to."}, {"n": 3, "text": "The System Admin confirms the password reset."}, {"n": 4, "text": "The system verifies that the selected account is eligible for password reset: it is active and it signs in with a password (BR-22)."}, {"n": 5, "text": "The system creates a secure password reset request for the selected user (BR-20)."}, {"n": 6, "text": "The system sends a password reset email containing the link to the user's registered email address."}, {"n": 7, "text": "The system makes the new link usable; any link sent to the user earlier stops working (BR-20)."}, {"n": 8, "text": "The system records the password reset request in the audit log (BR-16)."}, {"n": 9, "text": "The system displays MSG13 – “Password reset email sent successfully.” Complete Password Reset The account owner continues the use case from the email. No sign-in is required: the link is the proof of identity."}, {"n": 10, "text": "The user opens the password reset link from the email."}, {"n": 11, "text": "The system displays the new password form."}, {"n": 12, "text": "The user enters the new password and its confirmation and submits them."}, {"n": 13, "text": "The system verifies that the link is valid: it exists, it has not expired, it has not been used, and no newer link has replaced it (BR-20)."}, {"n": 14, "text": "The system validates the new password: it must follow the same password rule as account creation (UC-06) and match its confirmation."}, {"n": 15, "text": "The system marks the link as used, so it cannot be used again (BR-20)."}, {"n": 16, "text": "The system verifies that the account is still eligible: it is active and it signs in with a password (BR-03, BR-22)."}, {"n": 17, "text": "The system replaces the password with the new one (BR-01) and ends every active session of the account (BR-20)."}, {"n": 18, "text": "The system records the completed password reset in the audit log, with the account owner as the actor (BR-16)."}, {"n": 19, "text": "The system displays MSG92 – “Password reset successfully. Please sign in with your new password.” and takes the user to the sign-in page. The user is not signed in automatically."}]}], "alts": [{"id": "", "title": "AF-1: The Browser Is Already Signed In", "notes": [], "steps": [{"n": 1, "text": "At Step 19, the browser used to complete the reset still has a signed-in session (of this or another account)."}, {"n": 2, "text": "The system signs that session out before showing the sign-in page."}, {"n": 3, "text": "If the sign-out succeeds, the flow resumes at Step 19."}, {"n": 4, "text": "If the sign-out cannot be completed, the system still displays MSG92 – “Password reset successfully. Please sign in with your new password.” and also displays MSG06 – “Unable to sign out. Pl : 5, "text": "The system checks the required values, confirms Planned Start Time is later than the current time and Planned End Time is later than Planned Start Time, and checks the chosen participants: each is an existing active internal user listed once, with a valid Meeting Role, and exactly one is the Chair. (BR-24, BR-25, BR-62, BR-162, BR-320)"}, {"n": 6, "text": "The system creates exactly one Meeting in Draft status, records the creator and saves the chosen participants with Pending responses, all in the same save. (BR-26, BR-320)"}, {"n": 7, "text": "The system records the creation in the Meeting's lifecycle history and in the audit log. (BR-445)"}, {"n": 8, "text": "The system displays MSG29 – \"Meeting created successfully.\""}]}], "alts": [{"id": "AF-1", "title": "Create Draft from a found time slot", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer chooses a slot found in UC-85a; the system opens the meeting dialog prefilled with the slot and the invitees."}, {"n": 2, "text": "The Organizer confirms; the system rechecks the slot against the same shared data as the UC-85a search, never against undisclosed meetings. (BR-428)"}, {"n": 3, "text": "The system creates the meeting in Draft through Steps 5–6 of the Main Flow; a value Step 5 rejects, such as a start time that has passed since the search, follows EX-1: the first listed invitee becomes Chair, the rest become Member and the Organizer becomes Secretary; the meeting follows the normal approval flow and attendee conflicts are not checked. (BR-429)"}, {"n": 4, "text": "The system displays MSG29 – “Meeting created successfully.”"}]}], "exs": [{"id": "EX-1", "title": "Invalid Meeting Information", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a required value is missing/invalid, the planned start is not in the future, or the planned end does not follow the start. (BR-24, BR-62, BR-162)"}, {"n": 2, "text": "The system displays MSG31 – \"Invalid meeting information.\" and highlights the affected fields."}, {"n": 3, "text": "No Meeting is created. The Organizer may correct the inputs and resubmit at Step 4."}]}, {"id": "EX-2", "title": "Meeting Cannot Be Created", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot save the Meeting."}, {"n": 2, "text": "The system displays MSG35 – \"Unable to create the meeting. Please try again.\""}, {"n": 3, "text": "No Meeting is created; the use case ends unsuccessfully."}]}, {"id": "EX-3", "title": "Invalid Participants", "notes": [], "steps": [{"n": 1, "text": "At Step 5, no participant is chosen, a participant is not an existing active internal user or is listed twice, a Meeting Role is invalid, or the choice does not contain exactly one Chair. (BR-320)"}, {"n": 2, "text": "The system displays MSG277 – \"The meeting participant list is not valid.\" and highlights the participant list."}, {"n": 3, "text": "No Meeting is created. The Organizer may correct the participants and resubmit at Step 4."}]}], "br": ["BR-24", "BR-25", "BR-26", "BR-62", "BR-162", "BR-320", "BR-428", "BR-429", "BR-445"], "msg": ["MSG29", "MSG31", "MSG35", "MSG277"], "cov": {"br": 9, "code": 4, "test": 2}}, "UC-15": {"id": "UC-15", "name": "Update Meeting", "feature": "FE-04", "line": 1296, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "None", "desc": "Allows the Meeting Organizer to update Draft/Rejected Meeting information, or to reschedule only the planned times or location when the Meeting is Published.", "pre": ["PRE-1: The Meeting exists and the Meeting Organizer is authenticated and authorized.", "PRE-2: Full Meeting editing is available only in Draft or Rejected. (BR-27)", "PRE-3: If the Meeting is Published, only the Meeting Organizer may invoke Reschedule to change planned times or location. The Meeting must not have started. (BR-27, BR-158)"], "post": ["POST-1: Authorized updates are saved to the Meeting.", "POST-2: Meeting lifecycle and assigned approver are unchanged.", "POST-3: When the schedule of a Published Meeting changes, affected participants are notified, except that the Organizer who rescheduled receives no in-app notification about this own action, and the change is recorded. (BR-76, BR-322)", "POST-4: The update is recorded in the audit log with the status before and after. (BR-445)"], "normal": [{"id": "", "title": "Update Meeting", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer opens a Draft or Rejected Meeting and selects Edit."}, {"n": 2, "text": "The system displays the editable Meeting fields."}, {"n": 3, "text": "The Organizer changes the fields and submits."}, {"n": 4, "text": "The system verifies current Meeting status, permissions, required information, and confirms Planned End Time is after Planned Start Time. (BR-24, BR-27, BR-62)"}, {"n": 5, "text": "The system saves the updates without changing Meeting status. (BR-27)"}, {"n": 6, "text": "The system records the update in the audit log, with the status before and after. (BR-445)"}, {"n": 7, "text": "The system shows the success message."}]}], "alts": [{"id": "AF-1", "title": "Reschedule Published Meeting", "notes": ["Entry point: Step 1 of the Main Flow."], "steps": [{"n": 1, "text": "The Meeting Organizer selects Reschedule for a Meeting that is Published and has not started."}, {"n": 2, "text": "The system allows changes only to Planned Start Time, Planned End Time and Location. All other fields are read-only. (BR-27, BR-158)"}, {"n": 3, "text": "The Organizer enters the changes and submits."}, {"n": 4, "text": "The system validates that the new start is in the future and the end follows the start. (BR-62, BR-75)"}, {"n": 5, "text": "The system saves the new schedule, retains Published status, records the change in the Meeting's history and in the audit log (BR-445), and queues notifications to affected invitees: an in-app notification to every internal invitee except the Organizer who rescheduled, and a reschedule email to each invited Guest. (BR-322) Delivery failure does not roll back the saved change. (BR-38, BR-76, BR-158)"}, {"n": 6, "text": "The system displays MSG138 – \"Meeting rescheduled successfully. Invitees will be notified.\" The use case succeeds."}]}, {"id": "AF-2", "title": "Nothing has changed", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Main Flow or Step 3 of AF-1, the Organizer submits without changing any value; spaces added at the start or end of a text value do not count as a change."}, {"n": 2, "text": "Nothing is saved and no notification is sent. The system displays MSG154 – \"No changes to save.\" The use case ends."}]}, {"id": "AF-3", "title": "Planned start has already passed", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Main Flow, the Organizer sets the Planned Start Time of a Draft or Rejected Meeting to a time that has passed, by less than 24 hours."}, {"n": 2, "text": "The system warns that a Meeting not started 24 hours after its planned start is cancelled by the system. (BR-301)"}, {"n": 3, "text": "The Organizer may still submit; the flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Invalid or Unauthorized Update", "notes": [], "steps": [{"n": 1, "text": "The system determines that meeting information is invalid, the Organizer is no longer authorized, or the Meeting status does not permit this edit. (BR-27, BR-62)"}, {"n": 2, "text": "The system does not save any changes and displays the applicable existing validation/error message."}, {"n": 3, "text": "The use case ends unsuccessfully or the Organizer corrects input and retries."}]}, {"id": "EX-2", "title": "Reschedule Not Permitted", "notes": [], "steps": [{"n": 1, "text": "During AF-1 the Meeting is not Published, has already started, its planned start is not in the future, or a field outside the allowed Reschedule set was modified. (BR-27, BR-75, BR-158)"}, {"n": 2, "text": "The system rejects the update; the existing schedule remains unchanged."}, {"n": 3, "text": "The system displays the relevant existing meeting-update error message. The use case ends."}]}, {"id": "EX-3", "title": "Update Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Main Step 5 or AF-1 Step 5 a persistence error occurs."}, {"n": 2, "text": "Existing Meeting data/status remain unchanged and no schedule-update notification is sent."}, {"n": 3, "text": "The system displays the existing update-failure message. The use case ends."}]}, {"id": "EX-4", "title": "Planned start more than 24 hours ago", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Main Flow, the Planned Start Time of a Draft or Rejected Meeting is more than 24 hours in the past."}, {"n": 2, "text": "The update is not submitted, because the system would cancel the Meeting at once (BR-301). The system asks for another start time."}, {"n": 3, "text": "The Organizer corrects the time and resumes at Step 3 of the Main Flow."}]}], "br": ["BR-24", "BR-27", "BR-38", "BR-62", "BR-75", "BR-76", "BR-158", "BR-301", "BR-322", "BR-445"], "msg": ["MSG138", "MSG154"], "cov": {"br": 10, "code": 8, "test": 1}}, "UC-16": {"id": "UC-16", "name": "View Meeting Details", "feature": "FE-04", "line": 1307, "extra": {}, "parent": null, "actors": "Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows authorized users to view the details of one Meeting, including planned schedule, actual start/end times when available, and meeting-level status. Agenda and other records remain accessible through their corresponding views.", "pre": ["PRE-1: The user is authenticated.", "PRE-2: A meeting has been selected or identified."], "post": ["POST-1: The Meeting Name, planned time range, actual times where available, mode, location, confidentiality, description and lifecycle status are displayed read-only. For a Cancelled Meeting, the cancellation reason, who cancelled it and when are also displayed. (BR-298)", "POST-2: The Meeting is not modified."], "normal": [{"id": "", "title": "View Meeting Details", "notes": [], "steps": [{"n": 1, "text": "The user requests the selected Meeting."}, {"n": 2, "text": "The system verifies that the Meeting exists and the user has access. (BR-29)"}, {"n": 3, "text": "The system retrieves the Meeting information and planned/actual time fields."}, {"n": 4, "text": "The system displays Meeting Name, planned start/end time, actual start/end time when available, Meeting Mode, Location, Confidentiality Level, Description, and Status. For a Cancelled Meeting, it also displays the cancellation reason, who cancelled it and when. (BR-298)"}, {"n": 5, "text": "The user reviews the Meeting details."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting Does Not Exist or Is Not Accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot find the selected meeting or the user is not authorized to view it."}, {"n": 2, "text": "The system does not disclose whether the meeting exists."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting Details Cannot Be Retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the meeting exists and is accessible, but the system cannot retrieve its meeting-level information."}, {"n": 2, "text": "The system displays MSG37 – \"Unable to load meeting details. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-29", "BR-298"], "msg": ["MSG37"], "cov": {"br": 2, "code": 2, "test": 0}}, "UC-17": {"id": "UC-17", "name": "View Meeting List", "feature": "FE-04", "line": 1318, "extra": {}, "parent": null, "actors": "Meeting Organizer, Meeting Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authorized user to view and browse only the meetings to which the user has an authorized relationship or assignment. The assigned Secretary can view the Meeting before publication under BR-118. External Guests do not use the internal Meeting list.", "pre": ["PRE-1: The user is authenticated."], "post": ["POST-1: The system displays the list of meetings that the user is authorized to view.", "POST-2: No meeting information is modified."], "normal": [{"id": "", "title": "View Meeting List", "notes": [], "steps": [{"n": 1, "text": "The user selects Meetings from the navigation menu. The system opens the list with the Status filter preset to In Progress; the user may change or clear it."}, {"n": 2, "text": "The system identifies only meetings the user may view under BR-29: meetings created by the user at any status; meetings assigned to the user as Meeting Approver from WaitingApproval onward; and meetings assigned to the user as an active Secretary at any status, including before publication (BR-118); and meetings where the user is assigned as Chair or Member from Published onward. External Guests access only their invited Meeting through UC-04 and do not use this internal list."}, {"n": 3, "text": "The system sorts and displays only those authorized meetings that match the preset or selected criteria, including Cancelled Meetings with their status and Meetings the user has declined. (BR-297, BR-321)"}, {"n": 4, "text": "The user browses the displayed meetings."}]}], "alts": [{"id": "AF-1", "title": "Search Meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Main Flow, the user enters a meeting name in the search field."}, {"n": 2, "text": "The system finds the meetings whose name contains the entered text within the meetings available to the user, ignoring letter case and Vietnamese diacritics. (BR-439)"}, {"n": 3, "text": "The system displays the matching meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-2", "title": "Filter Meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Main Flow, the user selects one or more filter criteria, such as Meeting Status (including Cancelled), Confidentiality Level, or Time. Time offers four fixed choices: Today, This week, Not yet held and Already held; there is no date-range input."}, {"n": 2, "text": "The system applies the selected criteria to the meetings available to the user. Today and This week match a Meeting whose planned start/end time overlaps that day or week in the user's time zone; Not yet held matches a Meeting whose planned start time is later than the current time; Already held matches a Meeting whose planned start time is the current time or earlier, so a Meeting in progress counts as Already held. (BR-30)"}, {"n": 3, "text": "The system displays the matching meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-3", "title": "No Matching Meetings", "notes": [], "steps": [{"n": 1, "text": "The applied search or filter criteria produce no matching meetings within the meetings available to the user."}, {"n": 2, "text": "The system displays an empty meeting list and the message \"No meetings match the filter.\""}, {"n": 3, "text": "The user may change or clear the current search/filter criteria."}]}, {"id": "AF-4", "title": "View Meetings on the Calendar", "notes": [], "steps": [{"n": 1, "text": "At Step 1 of the Main Flow, the user opens the Calendar instead of the list."}, {"n": 2, "text": "The system shows the authorized meetings by week, grouped by status, and omits the Meetings the user has declined through UC-29. (BR-321) The Calendar opens with the Approved, Published and In Progress groups; the user may switch on the other groups. Cancelled Meetings form their own group, which is off by default; when it is switched on, a Cancelled Meeting is shown with its name struck through. (BR-297)"}, {"n": 3, "text": "The user browses the displayed meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Meeting List Cannot Be Retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 3 of the Main Flow, the system cannot retrieve the meeting list."}, {"n": 2, "text": "The system displays MSG38 – \"Unable to load meetings. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Invalid Meeting List Criteria", "notes": [], "steps": [{"n": 1, "text": "The system determines that the selected search, filter, sort, or display criteria are invalid."}, {"n": 2, "text": "The system displays MSG32 – \"Tiêu chí danh sách cuộc họp không hợp lệ.\""}, {"n": 3, "text": "The user may clear or adjust the search/filter criteria."}, {"n": 4, "text": "The use case ends."}]}], "br": ["BR-29", "BR-30", "BR-118", "BR-297", "BR-321", "BR-439"], "msg": ["MSG32", "MSG38"], "cov": {"br": 6, "code": 3, "test": 1}}, "UC-18": {"id": "UC-18", "name": "Submit Meeting for Approval", "feature": "FE-04", "line": 1329, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "None", "desc": "Allows the Meeting Organizer to submit a Draft meeting or resubmit a previously Rejected meeting for review by an assigned Meeting Approver based on the Meeting information and planned schedule.", "pre": ["PRE-1: The Meeting Organizer is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Meeting Organizer is authorized to submit the selected meeting for approval.", "PRE-4: The meeting is in Draft or Rejected status."], "post": ["POST-1: The meeting status is WaitingApproval.", "POST-2: A valid Meeting Approver is assigned to the current approval cycle.", "POST-3: The assigned Meeting Approver is granted access to the meeting for approval purposes.", "POST-4: The submission is recorded in the meeting lifecycle history.", "POST-5: The assigned Meeting Approver is notified of the pending approval request.", "POST-6: The submission and the assigned approver are recorded in the audit log. (BR-445)"], "normal": [{"id": "", "title": "Submit Meeting for Approval", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer selects a Draft meeting and chooses Submit for Approval."}, {"n": 2, "text": "The system verifies that all required Meeting information and planned schedule are complete and valid for approval submission. (BR-25, BR-33, BR-62)"}, {"n": 3, "text": "The system identifies users who are eligible to act as Meeting Approvers."}, {"n": 4, "text": "The system displays the eligible Meeting Approvers with their name and email; the Organizer may search the list by name or email, ignoring letter case and Vietnamese diacritics. (BR-439)"}, {"n": 5, "text": "The Meeting Organizer selects a Meeting Approver."}, {"n": 6, "text": "The system verifies that the selected user is eligible to review the meeting and is not the Meeting Organizer."}, {"n": 7, "text": "The system verifies that the meeting is still in Draft or Rejected status."}, {"n": 8, "text": "The system assigns the selected Meeting Approver to the current approval cycle."}, {"n": 9, "text": "The system changes the meeting status to WaitingApproval."}, {"n": 10, "text": "The system records the submission and assigned approver in the meeting lifecycle history and in the audit log. (BR-445) The assignment, status change, history and audit entry must all be completed together; otherwise EX-4 applies."}, {"n": 11, "text": "The system notifies the assigned Meeting Approver."}, {"n": 12, "text": "The system displays the submission success message."}]}], "alts": [{"id": "AF-1", "title": "Resubmit a Rejected Meeting", "notes": ["Entry Point: Step 1 of the Main Flow."], "steps": [{"n": 1, "text": "The Meeting Organizer selects a meeting in Rejected status."}, {"n": 2, "text": "The Meeting Organizer chooses Resubmit for Approval."}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow. At Step 4, the Meeting Approver of the previous approval cycle is preselected while still eligible; the Organizer may keep or change the selection. The flow completes successfully when the submission requirements are satisfied."}]}], "exs": [{"id": "EX-1", "title": "Incomplete Meeting-Level Information", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system determines that mandatory Meeting information and planned schedule is incomplete."}, {"n": 2, "text": "The system identifies the missing or invalid information."}, {"n": 3, "text": "The meeting remains Draft or Rejected and the use case ends."}]}, {"id": "EX-2", "title": "Meeting Status Not Eligible for Submission", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the system determines that the meeting is not in Draft or Rejected status."}, {"n": 2, "text": "The system displays MSG41 – \"This meeting can no longer be submitted for approval.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Selected Meeting Approver Is Not Eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system determines that the selected user is not eligible to review the meeting or is the Meeting Organizer."}, {"n": 2, "text": "The meeting remains Draft or Rejected and no approval assignment is created."}, {"n": 3, "text": "The flow resumes at Step 5 of the Main Flow so the Meeting Organizer selects another eligible approver."}]}, {"id": "EX-4", "title": "Submission Cannot Be Completed", "notes": [], "steps": [{"n": 1, "text": "At Steps 8–10, the system cannot complete the approval assignment, status change or submission history."}, {"n": 2, "text": "The Meeting, its previous approver assignment and its history remain unchanged. No approval notification is issued and the submission is not reported as successful."}, {"n": 3, "text": "The system displays MSG42 – \"Unable to submit the meeting for approval. Please try again.\""}, {"n": 4, "text": "The use case ends."}]}, {"id": "EX-5", "title": "No Eligible Meeting Approver Available", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system finds no eligible Meeting Approver."}, {"n": 2, "text": "The system displays MSG140 – \"No eligible meeting approver is available. Please contact the administrator.\""}, {"n": 3, "text": "The Meeting remains Draft or Rejected. Its existing approver assignment and history remain unchanged; no new assignment, submission event or approval notification is created."}, {"n": 4, "text": "The use case ends unsuccessfully. The Organizer may try again when an eligible approver becomes available."}]}], "br": ["BR-25", "BR-33", "BR-62", "BR-439", "BR-445"], "msg": ["MSG41", "MSG42", "MSG140"], "cov": {"br": 5, "code": 2, "test": 1}}, "UC-19": {"id": "UC-19", "name": "Review Meeting Approval", "feature": "FE-04", "line": 1340, "extra": {}, "parent": null, "actors": "Meeting Approver", "secondary": "None", "desc": "Allows the Meeting Approver assigned to a meeting approval cycle to review the meeting and decide whether to approve or reject it.", "pre": ["PRE-1: The Meeting Approver is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Meeting Approver is currently assigned to review the selected meeting and is not its Meeting Organizer.", "PRE-4: The meeting is in WaitingApproval status."], "post": ["POST-1: The Meeting Approver's decision is recorded.", "POST-2: If approved, the meeting status is Approved.", "POST-3: If rejected, the meeting status is Rejected.", "POST-4: If rejected, the rejection reason is recorded and available to the Meeting Organizer and assigned Secretary so the Organizer can correct and resubmit the Meeting.", "POST-5: The approval or rejection is recorded in the meeting lifecycle history.", "POST-6: The Meeting Organizer is notified in the application of the approval or rejection; a rejection notification includes the rejection reason. No email is sent for the decision.", "POST-7: The approval or rejection is recorded in the audit log. (BR-445)"], "normal": [{"id": "", "title": "Review Meeting Approval", "notes": [], "steps": [{"n": 1, "text": "The Meeting Approver selects a meeting assigned to them that is awaiting approval."}, {"n": 2, "text": "The system verifies that the current user is the assigned Meeting Approver."}, {"n": 3, "text": "The system displays the meeting information for review."}, {"n": 4, "text": "The Meeting Approver selects Approve."}, {"n": 5, "text": "The system re-verifies that: - the Meeting Approver is still authorized to approve the selected meeting; and - the meeting is still in WaitingApproval status."}, {"n": 6, "text": "The system changes the meeting status from WaitingApproval to Approved."}, {"n": 7, "text": "The system records the approval decision, acting user, and timestamp in the meeting lifecycle history and in the audit log (BR-445), and notifies the Meeting Organizer in the application that the meeting has been approved. The decision, status change, history, audit entry and notification must all be completed together; otherwise EX-3 applies."}, {"n": 8, "text": "The system displays MSG43 – \"Meeting approved successfully.\""}]}], "alts": [{"id": "AF-1", "title": "Reject Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Main Flow, the Meeting Approver selects Reject."}, {"n": 2, "text": "The system requests a rejection reason."}, {"n": 3, "text": "The Meeting Approver enters the rejection reason."}, {"n": 4, "text": "The system trims the rejection reason and validates that it is not empty and does not exceed 1000 characters."}, {"n": 5, "text": "The system re-verifies that: - the Meeting Approver is still authorized to reject the selected meeting; and - the meeting is still in WaitingApproval status."}, {"n": 6, "text": "The system changes the meeting status to Rejected."}, {"n": 7, "text": "The system records the rejection decision, rejection reason, acting user, and timestamp in the meeting lifecycle history and in the audit log (BR-445), and notifies the Meeting Organizer in the application that the meeting has been rejected, including the rejection reason. The decision, reason, status change, history, audit entry and notification must all be completed together; otherwise EX-3 applies."}, {"n": 8, "text": "The rejection reason becomes available to the Meeting Organizer and assigned Secretary so the Organizer can correct and resubmit the Meeting."}, {"n": 9, "text": "The system displays MSG44 – \"Meeting rejected successfully.\""}]}], "exs": [{"id": "EX-1", "title": "Rejection Reason Is Missing", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, the system determines that the trimmed rejection reason is empty. (BR-36)"}, {"n": 2, "text": "The system displays MSG83 – \"Rejection reason is required.\""}, {"n": 3, "text": "The meeting remains in WaitingApproval status."}, {"n": 4, "text": "The Meeting Approver enters a valid rejection reason."}, {"n": 5, "text": "The flow resumes at Step 4 of AF-1."}]}, {"id": "EX-2", "title": "Meeting Is No Longer Awaiting Approval", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Main Flow or Step 5 of AF-1, the system determines that the meeting is no longer in WaitingApproval status."}, {"n": 2, "text": "No approval or rejection decision is applied."}, {"n": 3, "text": "The meeting remains in its current status."}, {"n": 4, "text": "The system displays \"This meeting is no longer awaiting approval.\""}, {"n": 5, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Approval Decision Cannot Be Completed", "notes": [], "steps": [{"n": 1, "text": "At Steps 6–7 of the Main Flow or AF-1, the system cannot complete the approval or rejection decision, resulting status, decision history or Meeting Organizer notification."}, {"n": 2, "text": "The Meeting status, approval assignment, previous decision information and history remain unchanged."}, {"n": 3, "text": "No new approval or rejection decision is recorded, no notification or invitation is issued for the unsuccessful action, and the action is not reported as successful."}, {"n": 4, "text": "The system displays \"Unable to complete the approval decision. Please try again.\""}, {"n": 5, "text": "The use case ends."}]}, {"id": "EX-4", "title": "User Is No Longer Authorized to Review the Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Main Flow or Step 5 of AF-1, the system determines that the Meeting Approver is no longer authorized to approve or reject the selected meeting. (BR-35)"}, {"n": 2, "text": "No approval or rejection decision is applied."}, {"n": 3, "text": "The meeting status remains unchanged."}, {"n": 4, "text": "The system informs the Meeting Approver that they are no longer authorized to review the meeting."}, {"n": 5, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Rejection Reason Is Too Long", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, the trimmed rejection reason exceeds 1000 characters."}, {"n": 2, "text": "The system displays MSG84 – \"Rejection reason must not exceed 1000 characters.\""}, {"n": 3, "text": "The meeting remains in WaitingApproval status."}, {"n": 4, "text": "The Meeting Approver enters a valid rejection reason and the flow resumes at Step 4 of AF-1."}]}], "br": ["BR-35", "BR-36", "BR-445"], "msg": ["MSG43", "MSG44", "MSG83", "MSG84"], "cov": {"br": 3, "code": 1, "test": 1}}, "UC-20": {"id": "UC-20", "name": "Publish Meeting", "feature": "FE-04", "line": 1351, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "None", "desc": "Allows the Meeting Organizer to publish an Approved meeting and initiate invitation delivery to current internal participants and external Guests.", "pre": ["PRE-1: The Meeting Organizer is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Meeting Organizer is authorized to publish the selected meeting.", "PRE-4: The meeting is in Approved status.", "PRE-5: The meeting has exactly one current Chair and at least one current Secretary with active accounts. Invitation responses are not publication prerequisites. (BR-124, BR-125, BR-129)"], "post": ["POST-1: The meeting status is Published.", "POST-2: The publication is recorded in the meeting lifecycle history.", "POST-3: Current internal participants, except the Meeting Organizer who published the meeting, are notified in the application. All current internal participants, including that Meeting Organizer when they are also a participant, are sent invitation emails. Each external Guest with a current invitation is sent a separate email invitation to verify their invited email address and access only this Meeting. Unsuccessful delivery is retried without changing Published status. Successful publication does not mean every invitation has already been received. (BR-39, BR-40, BR-152, BR-153)", "POST-4: The publication is recorded in the audit log. (BR-445)"], "normal": [{"id": "", "title": "Publish Meeting", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer selects an Approved meeting."}, {"n": 2, "text": "The Meeting Organizer selects Publish Meeting."}, {"n": 3, "text": "The system verifies that the Meeting Organizer remains authorized, the meeting is still Approved with a valid planned schedule, exactly one current Chair has an active account, and at least one current Secretary has an active account.  (BR-37, BR-124, BR-125, BR-129)"}, {"n": 4, "text": "The system changes the meeting status from Approved to Published. (BR-37)"}, {"n": 5, "text": "The system records the publication action, acting user, and timestamp in the meeting lifecycle history and in the audit log. (BR-38, BR-445) The Published status, publication history and audit entry must be completed together before invitations are issued; otherwise EX-2 applies."}, {"n": 6, "text": "The system notifies current internal participants in the application, except the Meeting Organizer who published the meeting, and sends invitation emails to all current internal participants, including that Meeting Organizer when they are also a participant. Each external Guest with a current invitation receives a separate email invitation to verify their invited email address and access only this Meeting. Sending invitations does not delay confirmation of publication. If delivery fails, the system retries delivery and the Meeting remains Published. (BR-39, BR-40, BR-152, BR-153, BR-156)"}, {"n": 7, "text": "The system displays MSG45 – \"Meeting published successfully.\""}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting Is No Longer Eligible for Publication", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Main Flow, the system determines that the meeting is no longer Approved, the Meeting Organizer is no longer authorized to publish it, there is not exactly one active current Chair, or there is no active current Secretary. (BR-37, BR-124, BR-125)"}, {"n": 2, "text": "The meeting remains unchanged."}, {"n": 3, "text": "No publication notification or invitation is issued and publication is not reported as successful."}, {"n": 4, "text": "The system displays MSG46 – \"This meeting can no longer be published.\""}, {"n": 5, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting Cannot Be Published", "notes": [], "steps": [{"n": 1, "text": "At Steps 4–5 of the Main Flow, the system cannot complete the Published status or publication history."}, {"n": 2, "text": "The Meeting remains Approved; its previous assignment, decision information and history remain unchanged."}, {"n": 3, "text": "No publication notification or invitation is issued and publication is not reported as successful."}, {"n": 4, "text": "The system displays MSG47 – \"Unable to publish the meeting. Please try again.\""}, {"n": 5, "text": "The use case ends."}]}], "br": ["BR-37", "BR-38", "BR-39", "BR-40", "BR-124", "BR-125", "BR-129", "BR-152", "BR-153", "BR-156", "BR-445"], "msg": ["MSG45", "MSG46", "MSG47"], "cov": {"br": 11, "code": 3, "test": 1}}, "UC-21": {"id": "UC-21", "name": "Start Meeting", "feature": "FE-04", "line": 1362, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the assigned Chair to start one Published Meeting, set the Meeting lifecycle to InProgress and record its actual start time. The Meeting has no subordinate scheduling objects.", "pre": ["PRE-1: The Chair is authenticated and assigned to the selected meeting.", "PRE-2: The selected meeting exists.", "PRE-3: The meeting is Published.", "PRE-4: The meeting has exactly one current Chair and at least one current Secretary with active accounts.  (BR-127)"], "post": ["POST-1: Meeting status is InProgress.", "POST-2: Actual Start Time, acting Chair and immutable lifecycle event timestamp are recorded. (BR-38)", "POST-3: In-app Meeting-start notifications are created for currently invited internal participants, except the Chair who started the Meeting. (BR-164, BR-322)", "POST-4: Online Meeting Room access is governed by the Meeting mode and current status.", "POST-5: The start is recorded in the audit log. (BR-445)"], "normal": [{"id": "", "title": "Start Meeting", "notes": [], "steps": [{"n": 1, "text": "The assigned Chair selects Start Meeting for the Published Meeting."}, {"n": 2, "text": "The system verifies the Chair is active/current, one active current Chair and at least one active Secretary exist, and the Meeting remains Published. (BR-127, BR-130, BR-131)"}, {"n": 3, "text": "The system changes status to InProgress, saves Actual Start Time, and records the lifecycle event and the same entry in the audit log. (BR-38, BR-131, BR-445)"}, {"n": 4, "text": "The system creates in-app notifications for current invited internal participants, except the Chair who pressed Start Meeting (BR-322); a notification delivery problem does not undo a successfully started Meeting. (BR-164)"}, {"n": 5, "text": "The system displays MSG110 – \"Meeting started successfully.\""}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting Cannot Be Started", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the meeting is no longer Published, the Chair is no longer assigned or active, or the required active Chair/Secretary assignments are no longer valid. (BR-127, BR-130, BR-131)"}, {"n": 2, "text": "The meeting remains unchanged."}, {"n": 3, "text": "  each deleted Draft Vote), changes the Meeting to Ended and records Actual End Time, lifecycle history and the same entry in the audit log together. (BR-445) Pending Items remain Pending and Open and Closed Votes and their ballots remain unchanged."}, {"n": 4, "text": "The system closes room access and confirms MSG111 – \"Meeting ended successfully.\""}, {"n": 5, "text": "Voting controls stop accepting ballots because the Meeting is Ended; the Chair may later close outstanding Votes to finalize their tally."}]}], "alts": [{"id": "", "title": "None.", "notes": [], "steps": []}], "exs": [{"id": "EX-1", "title": "Actor or Meeting is not eligible: no end is recorded. MSG114 – \"This meeting cannot be ended.\" The use case ends.", "notes": [], "steps": []}, {"id": "EX-2", "title": "End cannot be saved: previous Meeting and Agenda states/timestamps remain unchanged and room closure is not triggered. MSG116 – \"Unable to end the meeting. Please try again.\" The Chair may retry.", "notes": [], "steps": []}], "br": ["BR-130", "BR-132", "BR-143", "BR-159", "BR-189", "BR-445"], "msg": ["MSG111", "MSG114", "MSG116"], "cov": {"br": 6, "code": 3, "test": 3}}, "UC-75": {"id": "UC-75", "name": "Cancel Meeting", "feature": "FE-04", "line": 1384, "extra": {}, "parent": null, "actors": "Meeting Organizer", "secondary": "Resend Email", "desc": "Allows the Meeting Organizer to cancel a Meeting that will no longer take place, before it starts. A Cancelled Meeting stays in the system as a read-only record with its cancellation reason; it cannot be edited, published or started again. A Meeting that is still not started long after its planned start time is cancelled by the system itself (BR-301).", "pre": ["PRE-1: The actor is signed in and is the Meeting Organizer of the Meeting.", "PRE-2: The Meeting is Draft, WaitingApproval, Rejected, Approved or Published. An InProgress Meeting is ended through UC-22 instead. (BR-297)"], "post": ["POST-1: The Meeting is Cancelled, and the reason, the actor and the cancellation time are recorded in its status history. (BR-38, BR-297, BR-298)", "POST-2: Agenda, participants, documents and Votes are kept read-only, and any pending approval request is closed. (BR-299)", "POST-3: If the Meeting was Published, every invited participant and Guest is notified; if it was awaiting approval, its assigned Meeting Approver is notified. (BR-300)", "POST-4: The cancellation is recorded in the audit log. (BR-445)"], "normal": [{"id": "", "title": "Cancel Meeting", "notes": [], "steps": [{"n": 1, "text": "The Meeting Organizer opens the Meeting details and selects Cancel meeting."}, {"n": 2, "text": "The system displays a confirmation with a required cancellation reason."}, {"n": 3, "text": "The Organizer enters the reason and confirms."}, {"n": 4, "text": "The system rechecks that the actor is the Meeting Organizer, the Meeting is Draft, WaitingApproval, Rejected, Approved or Published, and the reason is not blank and not longer than 1,000 characters. (BR-297, BR-298)"}, {"n": 5, "text": "The system changes the Meeting to Cancelled and records the reason, the actor and the time in the status history and in the audit log together. (BR-38, BR-298, BR-299, BR-445) A pending approval request is closed."}, {"n": 6, "text": "If the Meeting was Published, the system notifies every invited internal participant in the application, except the Organizer who cancelled it, and by email, and every invited Guest by email, including the reason; a person who was never sent the invitation email is not sent a cancellation email, and invitation emails not yet sent for the Meeting are dropped. If the Meeting was WaitingApproval, the system notifies its assigned Meeting Approver in the application that nothing is left to review. In any other status nobody is notified. A notification failure does not undo the cancellation. (BR-300, BR-322)"}, {"n": 7, "text": "The system displays MSG261 – \"Meeting cancelled successfully.\" and shows the Meeting as Cancelled."}]}], "alts": [{"id": "AF-1", "title": "Organizer keeps the Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Organizer chooses Back instead of confirming."}, {"n": 2, "text": "The Meeting and its status remain unchanged. The use case ends."}]}, {"id": "AF-2", "title": "The system cancels an overdue Meeting", "notes": [], "steps": [{"n": 1, "text": "A Meeting that is Draft, WaitingApproval, Rejected, Approved or Published has still not started 24 hours after its planned start time. (BR-301)"}, {"n": 2, "text": "The system changes it to Cancelled with the reason \"Not held as scheduled\" and records System as the actor and the time in the status history and in the audit log together. (BR-38, BR-298, BR-301, BR-445)"}, {"n": 3, "text": "The system notifies the Meeting Organizer in the application. No one else is notified. The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Cancellation reason is missing", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the reason is blank or contains only spaces."}, {"n": 2, "text": "The Meeting is not cancelled. The system displays MSG262 – \"Enter a reason for cancelling the meeting.\""}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-2", "title": "Meeting can no longer be cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting has started, has ended or is already Cancelled. (BR-297)"}, {"n": 2, "text": "The Meeting remains unchanged. The system displays MSG263 – \"This meeting can no longer be cancelled.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Cancellation cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot save the status change and its history together."}, {"n": 2, "text": "The Meeting remains unchanged and no notification is sent. The system displays MSG264 – \"Unable to cancel the meeting. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Cancellation reason is too long", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the reason is longer than 1,000 characters. (BR-298)"}, {"n": 2, "text": "The Meeting is not cancelled. The system displays MSG345 – \"Cancellation reason must not exceed 1000 characters.\""}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-5", "title": "Actor is not the Meeting Organizer", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor can view the Meeting but is not, or is no longer, its Meeting Organizer. (BR-297)"}, {"n": 2, "text": "The Meeting remains unchanged. The system displays MSG85 – \"You do not have permission to perform this action.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-38", "BR-297", "BR-298", "BR-299", "BR-300", "BR-301", "BR-322", "BR-445"], "msg": ["MSG85", "MSG261", "MSG262", "MSG263", "MSG264", "MSG345"], "cov": {"br": 8, "code": 6, "test": 2}}, "UC-23": {"id": "UC-23", "name": "Manage Agenda Items", "feature": "FE-05", "line": 1397, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-23a": {"id": "UC-23a", "name": "Create Agenda Item", "feature": "FE-05", "line": 1399, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to create a new Agenda Item while the Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress, including during the Meeting.", "pre": ["PRE-1: The Secretary is authenticated and assigned to the Meeting.", "PRE-2: The Meeting exists, is in Draft, WaitingApproval, Rejected, Approved, Published or InProgress status and is eligible for agenda planning. (BR-65, BR-74)"], "post": ["POST-1: A Pending Agenda Item is created under the Meeting.", "POST-2: The Agenda Item is ordered within that Meeting. Its document links are added afterwards through UC-33b, and creating an Item never changes another Item's links.", "POST-3: A Presenter, when set, is a current participant or Guest of the Meeting. (BR-306)"], "normal": [{"id": "", "title": "Create Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens the Meeting Agenda and selects Add Agenda Item."}, {"n": 2, "text": "The Secretary enters Title, Description and an optional Presenter chosen from the current internal participants and Guests of the Meeting. The form does not choose documents: they are attached to the Item afterwards through UC-33b. (BR-306)"}, {"n": 3, "text": "The system verifies the active Secretary assignment, Meeting status (Draft, WaitingApproval, Rejected, Approved, Published or InProgress), required values and the Presenter. (BR-64, BR-65, BR-66, BR-74, BR-306)"}, {"n": 4, "text": "The system creates the Item as Pending after the last position in the Meeting agenda. Existing Item positions are unchanged. If a Presenter other than the Secretary was set while the Meeting is Published or InProgress, the Presenter is notified; a Secretary who assigns himself or herself is not notified. A Presenter who has declined the Meeting invitation may still be chosen and may still join. (BR-67, BR-307, BR-321, BR-322)"}, {"n": 5, "text": "The system displays MSG60 – \"Agenda item created successfully.\" and automatically refreshes the complete Agenda for authorized users currently viewing it. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Invalid Agenda Item Information", "notes": [], "steps": [{"n": 1, "text": "At Step 3, required values are invalid."}, {"n": 2, "text": "No Item is created. The system displays MSG66 – \"Invalid agenda item information.\" with the applicable field messages."}]}, {"id": "EX-2", "title": "Agenda Planning No Longer Permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Meeting no longer permits Agenda planning or the actor is no longer its active assigned Secretary."}, {"n": 2, "text": "No Item is created. The system displays MSG67 – \"The agenda for this meeting can no longer be modified.\""}]}, {"id": "EX-3", "title": "Create Cannot Be Saved", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the system cannot save the Item."}, {"n": 2, "text": "The saved Agenda and its order remain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG68 – \"Unable to create the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-65", "BR-66", "BR-67", "BR-73", "BR-74", "BR-306", "BR-307", "BR-321", "BR-322"], "msg": ["MSG60", "MSG66", "MSG67", "MSG68"], "cov": {"br": 10, "code": 1, "test": 0}}, "UC-23b": {"id": "UC-23b", "name": "Update Agenda Item", "feature": "FE-05", "line": 1410, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to update the Title, Presenter and Description of an Agenda Item, whatever its execution status, while Agenda planning is permitted. Document links are not part of this form; they change only through UC-33b and UC-33d.", "pre": ["PRE-1: The Secretary is authenticated, active and assigned to the Meeting.", "PRE-2: The Item belongs to the Meeting and the Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress. (BR-65, BR-68)", "PRE-3: Title, Presenter and Description may be changed whether the Item is Pending, InProgress or Done. (BR-68)"], "post": ["POST-1: The Item information is updated; its document links are unchanged.", "POST-2: Meeting membership, Item execution status, actual timestamps and Meeting lifecycle remain unchanged.", "POST-3: Authorized users currently viewing the Agenda automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Update Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects an Item and chooses Edit."}, {"n": 2, "text": "The system displays the current Title, Presenter and Description for editing; the Item's document links are neither shown nor changed here. They emain unchanged. No successful change is announced to viewers."}, {"n": 3, "text": "The system displays MSG69 – \"Unable to update the agenda item. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-65", "BR-66", "BR-68", "BR-73", "BR-74", "BR-185", "BR-277", "BR-278", "BR-279", "BR-306", "BR-307", "BR-321", "BR-322"], "msg": ["MSG61", "MSG66", "MSG67", "MSG69"], "cov": {"br": 13, "code": 5, "test": 1}}, "UC-23c": {"id": "UC-23c", "name": "Delete Agenda Item", "feature": "FE-05", "line": 1421, "extra": {}, "parent": "UC-23", "actors": "Secretary", "secondary": "None", "desc": "Allows the active assigned Secretary to delete only a Pending Agenda Item from the Meeting.", "pre": ["PRE-1: The Secretary is authenticated, active and assigned to the Meeting.", "PRE-2: The Item belongs to a Meeting in Draft, WaitingApproval, Rejected, Approved, Published or InProgress. (BR-65, BR-74)", "PRE-3: The Item is Pending (not started). Only not-started Items can be deleted; InProgress and Done Items cannot. (BR-237)"], "post": ["POST-1: The selected Pending Item and its document links are removed. The documents stay in the Meeting and keep links to other Items; a document with no remaining links becomes a general Meeting document. (BR-280, BR-283)", "POST-2: Remaining Item positions and execution data, and the Meeting lifecycle, are unchanged.", "POST-3: Authorized viewers automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Delete Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects a Pending Item, chooses Delete and confirms."}, {"n": 2, "text": "The system verifies the active Secretary assignment, permitted Meeting status, Item membership and that the Item is still Pending. (BR-64, BR-65, BR-237)"}, {"n": 3, "text": "The system removes the Item and its document links, keeps the documents in the Meeting and preserves the remaining Item positions. (BR-283)"}, {"n": 4, "text": "The system displays MSG6 r. Please try again.\" The use case ends unsuccessfully."}]}], "br": ["BR-64", "BR-65", "BR-73", "BR-74", "BR-238"], "msg": ["MSG63", "MSG67", "MSG71", "MSG143"], "cov": {"br": 5, "code": 1, "test": 0}}, "UC-24": {"id": "UC-24", "name": "Set Current Agenda Item", "feature": "FE-05", "line": 1443, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the active assigned Chair to start any Pending Agenda Item as the current Item, whatever its position in the Agenda. An Item must be started before it can be finished (UC-25).", "pre": ["PRE-1: The Chair is authenticated, active and assigned to the Meeting.", "PRE-2: The Meeting is InProgress and the selected Item is Pending. (BR-69, BR-70)", "PRE-3: No other Item of the Meeting is InProgress. (BR-71)"], "post": ["POST-1: The Agenda Item becomes InProgress and the current item for that Meeting.", "POST-2: Its actual start time is recorded."], "normal": [{"id": "", "title": "Set Current Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Chair selects a Pending Item and chooses Set as Current."}, {"n": 2, "text": "The system rechecks the active Chair assignment, Meeting InProgress status and that the selected Item belongs to the Meeting and remains Pending. (BR-64, BR-69)"}, {"n": 3, "text": "The system verifies that no other Item is InProgress. The position of the selected Item does not matter. (BR-70, BR-71)"}, {"n": 4, "text": "The system changes the Item to InProgress and records its actual start time together. If competing requests arrive, only one Item may start. (BR-70, BR-71, BR-72)"}, {"n": 5, "text": "The system displays MSG64 – \"Current agenda item updated successfully.\" and automatically refreshes the complete Agenda for authorized viewers. (BR-73)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Agenda Item Cannot Become Current", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Chair is no longer active or assigned, the Meeting is not InProgress, or the selected Item does not belong to the Meeting or is not Pending."}, {"n": 2, "text": "The Agenda remains unchanged. The selected Item is not part of this Meeting, so the system returns the generic not-found result (HTTP 404) and displays no message."}]}, {"id": "EX-2", "title": "Another Agenda Item Is InProgress", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or Step 4, another Item is already InProgress."}, {"n": 2, "text": "The selected Item remains Pending. The system displays MSG72 – “Another agenda item is already in progress. Complete it before starting another agenda item.”"}]}], "br": ["BR-64", "BR-69", "BR-70", "BR-71", "BR-72", "BR-73"], "msg": ["MSG64", "MSG72"], "cov": {"br": 6, "code": 1, "test": 0}}, "UC-25": {"id": "UC-25", "name": "Complete Agenda Item", "feature": "FE-05", "line": 1454, "extra": {}, "parent": null, "actors": "Chair", "secondary": "None", "desc": "Allows the active assigned Chair to complete the current Agenda Item at any time. An Item must have been started (InProgress) before it can be finished; a Pending Item cannot be completed directly.", "pre": ["PRE-1: The Chair is active and assigned to the Meeting.", "PRE-2: The Meeting is InProgress and the selected Agenda Item is currently InProgress."], "post": ["POST-1: The current Item becomes Done with its actual end time.", "POST-2: The Meeting remains InProgress. No next Item starts automatically. (BR-72)", "POST-3: Authorized viewers automatically see the complete updated Agenda. (BR-73)"], "normal": [{"id": "", "title": "Complete Agenda Item", "notes": [], "steps": [{"n": 1, "text": "The Chair selects Complete for the current Item."}, {"n": 2, "text": "The system verifies the active Chair assignment, Meeting InProgress status, Item membership and current InProgress status. (BR-64, BR-69, BR-70, BR-72)"}, {"n": 3, "text": "The system records the actual end time and changes the Item to Done together. (BR-70, BR-72)"}, {"n": 4, "text": "The Meeting stays InProgress with no current Item. ed Item conclusion are shown read-only. (BR-311)", "POST-2: The complete Agenda automatically reflects successful creation, editing, deletion, reordering, Item start/completion and completion of the current Item when the Meeting ends. (BR-73)", "POST-3: Viewing does not modify the Agenda."], "normal": [{"id": "", "title": "View Meeting Agenda", "notes": [], "steps": [{"n": 1, "text": "The user opens the Meeting Agenda tab."}, {"n": 2, "text": "The system verifies Meeting access and retrieves the complete saved Agenda in its current order. (BR-29, BR-64)"}, {"n": 3, "text": "The system shows Item title, presenter, status, order, recorded actual times and any Item conclusion with who last saved it and when. (BR-311)"}, {"n": 4, "text": "While the user continues viewing, the system automatically refreshes the complete Agenda after a successful Agenda change, including changes made by another authorized user. Manual page refresh is not required. (BR-73)"}, {"n": 5, "text": "The system rechecks access before displaying refreshed Agenda data. Failed changes are not shown as successful updates."}]}], "alts": [{"id": "AF-1", "title": "Empty Meeting Agenda", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or Step 4, no Agenda Items exist."}, {"n": 2, "text": "The system displays the empty Agenda state."}, {"n": 3, "text": "While the view remains open, it automatically reflects subsequent saved Agenda changes. The use case succeeds."}]}], "exs": [{"id": "EX-1", "title": "Meeting Not Accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the Meeting does not exist or the user lacks access."}, {"n": 2, "text": "No further Agenda information is disclosed. The use case ends."}]}, {"id": "EX-2", "title": "Meeting Agenda Cannot Be Retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 4, the system cannot retrieve the latest Agenda."}, {"n": 2, "text": "The system displays MSG128 – \"Unable to load the meeting agenda. Please try again.\" A retrieval failure is not displayed as an empty Agenda."}, {"n": 3, "text": "No Agenda data changes; previously displayed information is not presented as the latest saved Agenda. The user may retry."}]}], "br": ["BR-29", "BR-64", "BR-73", "BR-181", "BR-311"], "msg": ["MSG128"], "cov": {"br": 5, "code": 2, "test": 1}}, "UC-77": {"id": "UC-77", "name": "Record Agenda Item Conclusion", "feature": "FE-05", "line": 1476, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to record or update the conclusion of an Agenda Item: what was concluded or agreed for that item. Item conclusions are used when the minutes draft is generated (UC-59). Vote results and conclusions remain recorded through UC-57.", "pre": ["PRE-1: The actor is signed in, can view the Meeting and is its current Chair or Secretary.", "PRE-2: The selected Agenda Item belongs to the Meeting and has been started, that is InProgress or Done; a Pending Item has no conclusion. (BR-64, BR-310)", "PRE-3: The Meeting is InProgress, or Ended and its minutes draft has not yet been generated. (BR-310)"], "post": ["POST-1: The Item has one conclusion, replacing any earlier one, with the actor and time of the last save recorded. (BR-309, BR-311)", "POST-2: Item status, actual times, presenter, documents and position remain unchanged.", "POST-3: Authorized users currently viewing the Agenda automatically see the saved conclusion. (BR-73)"], "normal": [{"id": "", "title": "Record Agenda Item Conclusion", "notes": [], "steps": [{"n": 1, "text": "The actor selects an InProgress or Done Agenda Item and chooses Record conclusion."}, {"n": 2, "text": "The system displays the current conclusion of the Item, if any, for editing."}, {"n": 3, "text": "The actor enters or edits the conclusion and saves."}, {"n": 4, "text": "The system rechecks the Chair or Secretary assignment, the Meeting status and minutes state, the Item status, and that the conclusion is not acks current Meeting access or roster-view permission."}, {"n": 2, "text": "The system does not return or disclose roster data and responds with the generic not-found result required by BR-121. The use case ends unsuccessfully."}]}, {"id": "EX-2", "title": "Roster cannot be retrieved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the roster service or data source cannot return the current roster."}, {"n": 2, "text": "No partial roster is presented as complete. The system displays MSG95 – “Unable to load meeting participants. Please try again.”"}, {"n": 3, "text": "The use case ends unsuccessfully; the actor may retry by reopening the Participants view."}]}], "br": ["BR-103", "BR-117", "BR-121", "BR-176", "BR-180"], "msg": ["MSG95"], "cov": {"br": 5, "code": 1, "test": 0}}, "UC-28": {"id": "UC-28", "name": "Manage Meeting Participants", "feature": "FE-06", "line": 1500, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-28a": {"id": "UC-28a", "name": "Add Meeting Participant", "feature": "FE-06", "line": 1502, "extra": {}, "parent": "UC-28", "actors": "Secretary, Chair", "secondary": "Resend Email", "desc": "Allows a current Secretary to add internal participants or invite a Guest to the Meeting. The initial participants of a new Meeting are chosen in the Create Meeting form (UC-14); this use case adds people afterwards.", "pre": ["PRE-1: The actor is a current assigned Secretary or a current Chair, while the Meeting status permits roster changes.", "PRE-2: The Meeting permits roster management. WaitingApproval remains read-only. (BR-79–BR-80, BR-122)"], "post": ["POST-1: The selected internal participants or Guest invitation is saved.", "POST-2: New invitations start with Pending response.", "POST-3: Guest receives no internal or system Role. (BR-88, BR-150)"], "normal": [{"id": "", "title": "Add Internal Participants", "notes": [], "steps": [{"n": 1, "text": "The actor opens participant management for the Meeting." ir replacement changes both affected internal Meeting Roles together. System Role and Invitation Response remain unchanged. (BR-96, BR-169, BR-177)"], "normal": [{"id": "", "title": "Manage Meeting Role", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens a current participant’s role details."}, {"n": 2, "text": "The system displays the current Meeting Role."}, {"n": 3, "text": "The Secretary changes the internal participant’s Meeting Role."}, {"n": 4, "text": "The Secretary confirms the changes."}, {"n": 5, "text": "The system rechecks current authority, Meeting status, role constraints and required roles. Draft, Rejected and Approved may have no Secretary; Published and InProgress must retain or replace the last Secretary in the same save. (BR-122, BR-123, BR-174–BR-177)"}, {"n": 6, "text": "The system saves all requested changes consistently. Published/InProgress changes trigger the applicable notifications; notification failure does not undo the saved changes."}, {"n": 7, "text": "If no requested change is made, the system displays MSG154 – “No changes to save.” Otherwise it displays MSG100 – “Meeting role updated successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Replace Chair", "notes": [], "steps": [{"n": 1, "text": "At Step 3, while the Meeting is not yet Published, or once it is Published or InProgress and the Chair's account is locked, the Secretary selects a current active internal participant as the new Chair. After publication the selected participant must not be the Secretary. (BR-126, BR-294, BR-295) Before saving, the system asks for confirmation and names the participant who will become a Member."}, {"n": 2, "text": "The system changes the former Chair to Member and the selected participant to Chair in the same save, subject to the current Secretary requirements."}, {"n": 3, "text": "The system notifies the affected participants when required, but never the actor who made the change: a Chair reassigning his or her own role notifies only the new Chair, while a Secretary replacing the Chair notifies both the former and the new Chair. (BR-322) The system displays MSG100 – “Meeting role updated successfully.” The use case ends successfully. (BR-92, BR-122, BR-169)"}]}], "exs": [{"id": "EX-1", "title": "Meeting Role is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the selected Meeting Role is invalid."}, {"n": 2, "text": "No requested change is saved. The system displays MSG101 – “A valid meeting role is required.”"}, {"n": 3, "text": "The Secretary may correct the selection and resume at Step 3."}]}, {"id": "EX-2", "title": "Required Meeting Role would be lost", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the change would violate the Chair/Secretary requirement for the current Meeting status."}, {"n": 2, "text": "No role change is saved. The system displays MSG109 – “The meeting must retain its required Chair and Secretary. Assign a replacement first.” The Secretary may revise the change and resume at Step 3."}]}, {"id": "EX-3", "title": "Actor, target or Meeting is no longer eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Secretary assignment, target relationship or Meeting status changed after the details were opened."}, {"n": 2, "text": "No change is saved. The system displays MSG98 – “The meeting participant list cannot be modified in its current status.” The use case ends unsuccessfully."}]}, {"id": "EX-4", "title": "Actor is not allowed to manage participants", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor can view the Meeting but is not the current Secretary or the current Chair."}, {"n": 2, "text": "No change is saved. The system displays MSG85 – “You do not have permission to perform this action.” The use case ends unsuccessfully."}]}, {"id": "EX-5", "title": "Selected participant is no longer available", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the selected internal participant no longer exists."}, {"n": 2, "text": "No ch t Step 3."}]}, {"id": "EX-10", "title": "Chair handover after publication", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Meeting is Published or InProgress and the current Chair changes their own role through the same request."}, {"n": 2, "text": "The system hands over the Chair role and displays MSG257 – “Chair role handed over successfully.” If no role changed, it displays MSG154 – “No changes to save.”"}]}], "br": ["BR-79", "BR-80", "BR-92", "BR-96", "BR-122", "BR-123", "BR-126", "BR-169", "BR-174", "BR-177", "BR-294", "BR-295", "BR-322"], "msg": ["MSG85", "MSG98", "MSG100", "MSG101", "MSG102", "MSG109", "MSG154", "MSG256", "MSG257", "MSG259", "MSG275"], "cov": {"br": 13, "code": 0, "test": 0}}, "UC-28c": {"id": "UC-28c", "name": "Remove Meeting Participant", "feature": "FE-06", "line": 1524, "extra": {}, "parent": "UC-28", "actors": "Secretary, Chair", "secondary": "None", "desc": "Allows an assigned Secretary to remove a current internal participant or revoke a Guest invitation while preserving required Meeting records.", "pre": ["PRE-1: The actor is a current authorized Secretary or a current authorized Chair, while the Meeting status permits roster changes.", "PRE-2: The Meeting permits participant management. The selected internal participant or Guest invitation is current. (BR-79, BR-80)"], "post": ["POST-1: The selected participant is no longer current, or the Guest invitation is revoked.", "POST-2: Access granted by the removed relationship ends, including every active session of a revoked Guest invitation; independent valid access remains effective. A Guest connected to the online room is disconnected at once when the invitation is revoked; a Guest session that expires or is signed out is removed from the room within 30 seconds. (BR-101, BR-155)", "POST-3: Invitation Response and attendance history are retained. (BR-97, BR-100–BR-103, BR-177)", "POST-4: Agenda Items presented by the removed participant or revoked Guest no longer have a Present e", "desc": "Allows an invitee other than the Chair to confirm in advance whether they will attend, by accepting or declining their own Meeting invitation. The answer is given once and cannot be changed afterwards. The Chair does not respond because the Chair runs the Meeting. (BR-105, BR-106) An invitee of a meeting created from a found time slot (UC-85b) accepts or declines it like any other invitation.", "pre": ["PRE-1: The Meeting is Published or InProgress.", "PRE-2: The actor owns a current invitation and is not the Chair of the Meeting; a Guest has verified access through UC-04. (BR-104–BR-106, BR-148–BR-156)"], "post": ["POST-1: The response and its response time are recorded once and are not changed afterwards.", "POST-2: Meeting Role, attendance and the invitee's access to the Meeting, its documents and its online room are unchanged. A Declined response only hides the Meeting from the invitee's own calendar, and an invitee who has not answered is treated as attending. (BR-96, BR-115, BR-321)"], "normal": [{"id": "", "title": "Respond to Meeting Invitation", "notes": [], "steps": [{"n": 1, "text": "The invitee sees the attendance question at the top of the Meeting detail or on the Meeting card in the calendar list view; a verified Guest sees it at the top of the Guest Meeting page, their only Meeting screen, so there is no separate attendance screen for a Guest. The invitee has not answered yet."}, {"n": 2, "text": "The system identifies the invitee and offers the question only while the invitation has no answer."}, {"n": 3, "text": "The invitee selects Accepted, or selects Declined and confirms it. The confirmation states that the answer is given once and cannot be changed and, for an internal invitee, that the Meeting will no longer appear on their calendar. (BR-106, BR-321)"}, {"n": 4, "text": "The system rechecks invitation ownership, that the actor is not the Chair, Meeting status and response value, and compares the value with any response already rec
