, "frontend/src/types/document.ts:35"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentChangeEndpointsTests.cs:195", "tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:94"], "ucs": ["UC-32a", "UC-32c", "UC-33c"]}, "BR-212": {"text": "Removing a Meeting document preserves its comments as history.", "applies": ["UC-33c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:318"], "test": [], "ucs": ["UC-33a", "UC-33c"]}, "BR-213": {"text": "A file is deleted by periodic cleanup when no personal-library document or active Meeting document uses it.", "applies": ["UC-33c", "UC-71a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/FileStorage.cs:26", "backend/TrustCabinet.Infrastructure/Documents/OrphanFilePurger.cs:11", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:236", "backend/TrustCabinet.Domain/Entities/StoredFile.cs:37"], "test": ["tests/TrustCabinet.Web.Tests/Documents/OrphanFilePurgerTests.cs:10"], "ucs": ["UC-33c", "UC-71a"]}, "BR-214": {"text": "An uploaded document must not exceed 50 MB.", "applies": ["UC-33a", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:269", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:16", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:78", "frontend/src/features/documents/useFileUpload.ts:6"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36", "UC-76a"]}, "BR-215": {"text": "An uploaded document's type is determined from its actual content, and its file extension must be .pdf or .docx and match that content.", "applies": ["UC-33a", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:269", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:78", "backend/TrustCabinet.Domain/Entities/StoredFile.cs:21"], "test": ["tests/TrustCabinet.Web.Tests/Documents/DocumentFixture.cs:143"], "ucs": ["UC-33a", "UC-33b", "UC-36", "UC-76a"]}, "BR-216": {"text": "Uploaded files retain their original format and content.", "applies": ["UC-33a", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:167", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:85", "frontend/src/features/documents/DocumentViewerPage.tsx:31"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentEndpointsTests.cs:55"], "ucs": ["UC-32c", "UC-33a", "UC-36"]}, "BR-219": {"text": "A personal-library folder belongs to one user.", "applies": ["UC-34", "UC-72"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-34", "UC-72", "UC-72a", "UC-72b", "UC-72c", "UC-72d"]}, "BR-220": {"text": "A folder name must not be empty.", "applies": ["UC-72a", "UC-72b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:345"], "test": [], "ucs": ["UC-72a", "UC-72b"]}, "BR-221": {"text": "Folder names need not be unique.", "applies": ["UC-72a", "UC-72b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:118", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:345", "frontend/src/api/library.ts:72"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:143"], "ucs": ["UC-72a", "UC-72b"]}, "BR-222": {"text": "A folder cannot be moved into itself or one of its descendants.", "applies": ["UC-72c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:146", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:17", "frontend/src/features/documents/LibraryDialogs.tsx:122", "frontend/src/features/documents/libraryTree.ts:24"], "test": [], "ucs": ["UC-72c"]}, "BR-223": {"text": "Only an empty folder can be deleted.", "applies": ["UC-72d"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:163", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:19"], "test": [], "ucs": ["UC-72d"]}, "BR-224": {"text": "A user may rename documents in their own personal library.", "applies": ["UC-71b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-71b"]}, "BR-225": {"text": "A user may move personal-library documents only between their own folders or the library root.", "applies": ["UC-71c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-71c"]}, "BR-226": {"text": "The first direct upload creates a personal-library folder for that user and Meeting.", "applies": ["UC-33a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Configurations/FolderConfiguration.cs:13", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:340"], "test": [], "ucs": ["UC-33a"]}, "BR-227": {"text": "Later uploads to the same Meeting reuse its existing personal-library folder, even after it is renamed or moved.", "applies": ["UC-33a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Configurations/FolderConfiguration.cs:13", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:142", "backend/TrustCabinet.Domain/Entities/Folder.cs:21"], "test": [], "ucs": ["UC-33a", "UC-72b", "UC-72c"]}, "BR-228": {"text": "If the Meeting's personal-library folder was deleted, the next direct upload recreates it at the library root, named with the Meeting title and planned start date in Vietnam time.", "applies": ["UC-33a"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:340", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:166"], "test": [], "ucs": ["UC-33a", "UC-72d"]}, "BR-229": {"text": "Separate uploads are different documents, even when their names or contents match.", "applies": ["UC-33a", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:349", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:197"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentEndpointsTests.cs:374"], "ucs": ["UC-33a", "UC-36"]}, "BR-231": {"text": "Removing a Meeting document does not remove it from personal libraries or other Meetings.", "applies": ["UC-33c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-33c"]}, "BR-232": {"text": "Deleting an unused file preserves its history and comments, but its content is no longer available.", "applies": ["UC-33c", "UC-71a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:236", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:89"], "test": [], "ucs": ["UC-33c", "UC-71a"]}, "BR-235": {"text": "Declining a Meeting invitation does not revoke document-reading access.", "applies": ["UC-32a", "UC-32c"], "rationale": "ADR-0006 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-32a", "UC-32c"]}, "BR-236": {"text": "Retired on 18/10/2026 by PO decision of 16/10/2026: merged into BR-68. This ID must not be reused.", "applies": ["UC-23b"], "rationale": "PO 16/10/2026", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23b"]}, "BR-237": {"text": "Only Pending Agenda Items may be deleted.", "applies": ["UC-23c"], "rationale": "Split from former BR-68 — no change to agenda field restrictions", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23c"]}, "BR-238": {"text": "Agenda Items may be reordered whatever their execution status; reordering changes only their positions.", "applies": ["UC-23d"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23d"]}, "BR-239": {"text": "Deleting an Agenda Item preserves the positions of the remaining Items.", "applies": ["UC-23c"], "rationale": "Split from former BR-68 — no change to agenda field restrictions", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23c"]}, "BR-240": {"text": "Retired on 18/10/2026 by PO decision of 16/10/2026: merged into BR-238. This ID must not be reused.", "applies": ["UC-23d"], "rationale": "PO 16/10/2026", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23d"]}, "BR-241": {"text": "Retired on 18/10/2026 by PO decision of 16/10/2026: merged into BR-68. This ID must not be reused.", "applies": ["UC-23b", "UC-23c", "UC-23d"], "rationale": "PO 16/10/2026", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23b", "UC-23c", "UC-23d"]}, "BR-242": {"text": "A user may access only their own personal-library documents and folders.", "applies": ["UC-34", "UC-36", "UC-71a", "UC-71c", "UC-72a", "UC-72d"], "rationale": "ADR-0006 / ADR-0018", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/PersonalLibraryEndpoints.cs:7", "backend/TrustCabinet.Web/Endpoints/PersonalLibraryEndpoints.cs:165", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:14", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:7"], "test": [], "ucs": ["UC-34", "UC-34b", "UC-36", "UC-71a", "UC-71b", "UC-71c", "UC-72a", "UC-72b", "UC-72c", "UC-72d"]}, "BR-245": {"text": "Moving a personal-library document does not change its Meeting attachments.", "applies": ["UC-71c"], "rationale": "ADR-0018", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:227"], "test": [], "ucs": ["UC-71c"]}, "BR-246": {"text": "A comment must not be blank.", "applies": ["UC-35"], "rationale": "Report 3 screen 7.5 — required comment text", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-35"]}, "BR-248": {"text": "A DOCX comment has no page reference.", "applies": ["UC-35"], "rationale": "ADR-0018", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:87", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:25", "frontend/src/types/document.ts:127", "frontend/src/features/documents/CommentsPanel.tsx:16", "frontend/src/features/documents/CommentsPanel.tsx:211"], "test": [], "ucs": ["UC-35"]}, "BR-249": {"text": "Anyone who can view a Meeting document may comment on it before the Meeting ends.", "applies": ["UC-35"], "rationale": "PO 15/10/2026 — read-only after Meeting end", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:12", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:19", "frontend/src/features/documents/CommentsPanel.tsx:15"], "test": [], "ucs": ["UC-35"]}, "BR-250": {"text": "Each comment records its author and posting time.", "applies": ["UC-35"], "rationale": "Report 3 screen 7.5", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-35"]}, "BR-251": {"text": "Personal-library usage details show only Meetings the user may access.", "applies": ["UC-34"], "rationale": "Existing resource confidentiality rule", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:277", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:30", "frontend/src/types/document.ts:85"], "test": [], "ucs": ["UC-34"]}, "BR-252": {"text": "Only the current Chair or the current Secretary may create or configure a Draft Vote while its Meeting is Approved, Published or InProgress.", "applies": ["UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-76a", "UC-76b"]}, "BR-253": {"text": "Only the current Chair and the current Secretary may view Draft Votes in the Meeting.", "applies": ["UC-52a", "UC-52b", "UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57", "UC-76a", "UC-76b"]}, "BR-254": {"text": "The content, options, ballot type and selected roles of an Open or Closed Vote cannot be edited.", "applies": ["UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-255": {"text": "Vote content must not be blank.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-256": {"text": "A Vote must have at least two distinct, non-empty options.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-257": {"text": "The Chair selects one or more eligible meeting roles from Chair, Secretary, Member and Guest; all four roles are selected by default.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-258": {"text": "Each eligible voter may cast at most one ballot in a Vote.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-259": {"text": "A secret Vote records participation without linking a voter to a chosen option; only aggregate results may be disclosed.", "applies": ["UC-52b", "UC-55", "UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-55", "UC-56"]}, "BR-260": {"text": "The status view of an Open Vote shows turnout, without disclosing individual choices or results per option.", "applies": ["UC-52b"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52a", "UC-52b"]}, "BR-261": {"text": "Closing a Vote tallies all recorded ballots per option; each percentage uses ballots cast as its denominator. With no ballots, option counts are zero and percentages are not shown.", "applies": ["UC-52b", "UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-56"]}, "BR-262": {"text": "A recorded Vote conclusion and its note cannot be changed or replaced.", "applies": ["UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-57"]}, "BR-263": {"text": "The Chair determines a Vote conclusion; the system does not infer it from the tally.", "applies": ["UC-56", "UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-56", "UC-57"]}, "BR-264": {"text": "Meeting Minutes include the Vote tally and the conclusion recorded by the Chair.", "applies": ["UC-57", "UC-59"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-57", "UC-59"]}, "BR-265": {"text": "A recorded ballot cannot be changed or withdrawn.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-266": {"text": "A Meeting may have at most one Open Vote at a time.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-54"]}, "BR-267": {"text": "A Vote cannot be opened if no eligible voters are available.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-54"]}, "BR-268": {"text": "Changing a voter's meeting role after opening does not change the fixed eligible-voter list or count.", "applies": ["UC-54", "UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-54", "UC-55"]}, "BR-269": {"text": "Loss of Meeting access prevents new ballots without deleting previously recorded ballots.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-270": {"text": "The current Chair may close and tally an existing Open Vote while its Meeting is InProgress or Ended.", "applies": ["UC-56"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-56"]}, "BR-271": {"text": "A ballot selects exactly one option belonging to its Vote.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-272": {"text": "Each Vote uses either a Public or Secret ballot type.", "applies": ["UC-53", "UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-53", "UC-54"]}, "BR-273": {"text": "After a Public Vote closes, its result shows each eligible voter's recorded choice or that the voter did not vote.", "applies": ["UC-52b"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b"]}, "BR-274": {"text": "The current Chair or the current Secretary may access Vote draft preparation in an Approved Meeting; this does not grant access to other restricted Meeting records.", "applies": ["UC-52a", "UC-52b", "UC-53"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019; PO 16/10/2026 — Secretary may prepare Vote drafts", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52a", "UC-52b", "UC-53"]}, "BR-275": {"text": "Anyone who can view a Meeting can read its documents.", "applies": ["UC-32a", "UC-32c", "UC-35"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Agenda/AgendaService.cs:72", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:12", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:19", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:93", "frontend/src/features/documents/CommentsPanel.tsx:15"], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-35", "UC-74"]}, "BR-276": {"text": "A Meeting document keeps the name copied when it was added to the Meeting; later personal-library renaming does not change that name.", "applies": ["UC-33a", "UC-71b"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:301", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:216", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:110", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:81", "frontend/src/api/library.ts:61"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:484"], "ucs": ["UC-33a", "UC-33b", "UC-71b", "UC-76a"]}, "BR-277": {"text": "One Meeting document may be linked to multiple Agenda Items.", "applies": ["UC-23b", "UC-33b"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:40", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:203", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:41", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:68", "frontend/src/types/document.ts:31", "frontend/src/features/documents/DocumentsPanel.tsx:34"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:94"], "ucs": ["UC-23b", "UC-32a", "UC-33b", "UC-33d"]}, "BR-278": {"text": "A document may be linked only to Agenda Items of the same Meeting.", "applies": ["UC-23a", "UC-23b", "UC-33b", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:39"], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-33b", "UC-33d"]}, "BR-279": {"text": "Pending, InProgress and Done Agenda Items all permit document-link additions and removals until the Meeting ends.", "applies": ["UC-23b", "UC-33b", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:257", "frontend/src/features/documents/DocumentsPanel.tsx:36"], "test": [], "ucs": ["UC-23b", "UC-33b", "UC-33c", "UC-33d"]}, "BR-280": {"text": "Removing one Agenda Item link keeps the document in the Meeting and preserves its other Item links; with no links left, it is a general Meeting document.", "applies": ["UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:40", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:250", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:73", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:132", "frontend/src/api/documents.ts:82", "frontend/src/types/document.ts:42", "frontend/src/features/documents/DocumentsPanel.tsx:34"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentChangeEndpointsTests.cs:351"], "ucs": ["UC-23c", "UC-32a", "UC-33d"]}, "BR-281": {"text": "Removing a document from a Meeting removes it from every Agenda Item of that Meeting.", "applies": ["UC-33c"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:180", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:114", "frontend/src/api/documents.ts:64"], "test": [], "ucs": ["UC-33c"]}, "BR-282": {"text": "Meeting documents and comments are read-only after the Meeting ends.", "applies": ["UC-32a", "UC-32c", "UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:13", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:64", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:12", "frontend/src/features/documents/CommentsPanel.tsx:16"], "test": [], "ucs": ["UC-32a", "UC-32c", "UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35"]}, "BR-283": {"text": "Deleting an Agenda Item removes its document links but keeps the documents in the Meeting.", "applies": ["UC-23c", "UC-32a", "UC-33b", "UC-33d"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-23c", "UC-32a", "UC-33b", "UC-33d"]}, "BR-284": {"text": "Readding a removed Meeting document starts a new addition without its previous comments.", "applies": ["UC-33a", "UC-33c", "UC-35"], "rationale": "PO 15/10/2026 — document follow-up", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/DocumentCommentEndpoints.cs:52", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:13", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:180", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:318", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:114"], "test": ["tests/TrustCabinet.Web.Tests/Documents/DocumentCommentEndpointsTests.cs:179"], "ucs": ["UC-33a", "UC-33c", "UC-35"]}, "BR-285": {"text": "Each Vote belongs to one Meeting and is not linked to an Agenda Item.", "applies": ["UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57"], "rationale": "ADR-0019 / ADR-0020", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-52a", "UC-52b", "UC-53", "UC-54", "UC-55", "UC-56", "UC-57"]}, "BR-286": {"text": "A document chosen from the personal library is added together with the others chosen with it, or not at all. A file uploaded from the computer is added on its own, as a whole or not at all (BR-194), and a file that fails does not stop the other files.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "User confirmation 15/10/2026 — multiple-file upload; changed to per-file upload by PO 27/10/2026 (upload queue, ADR-0033)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/StoredFileWriter.cs:14", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:106", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:77"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36", "UC-76a"]}, "BR-287": {"text": "The current Chair or Secretary may attach one or more documents to a Draft Vote as Vote documents. A Vote may have no Vote documents.", "applies": ["UC-52b", "UC-74", "UC-76a"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-74", "UC-76a", "UC-76b"]}, "BR-288": {"text": "Vote documents can be attached or detached only while the Vote is Draft. The Vote document list is fixed when the Vote opens.", "applies": ["UC-52b", "UC-54", "UC-76a", "UC-76b"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-54", "UC-76a", "UC-76b"]}, "BR-289": {"text": "An eligible voter may cast a ballot only after confirming reading of every Vote document of that Vote.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-55", "UC-74"]}, "BR-290": {"text": "A document read is confirmed only after the user has scrolled to the last page of the document in the viewer and then ticks \"I have read this document\". The system records the user, the document and the confirmation time.", "applies": ["UC-32c", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-32c", "UC-74"]}, "BR-291": {"text": "A read confirmation belongs to one user and one Meeting document. It counts for every Vote of the Meeting that links the same document and cannot be withdrawn.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-32a", "UC-55", "UC-74"]}, "BR-292": {"text": "If a Vote document is removed from the Meeting while the Vote is Open, it no longer counts towards the reading requirement of that Vote.", "applies": ["UC-55"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-55"]}, "BR-293": {"text": "Read confirmations are stored separately from ballots and never reveal or link a voter's choice in a secret Vote.", "applies": ["UC-55", "UC-74"], "rationale": "PO 16/10/2026 — Vote documents and read confirmation", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-55", "UC-74"]}, "BR-294": {"text": "Before the Meeting is Published, the assigned Secretary may assign or replace the Chair.", "applies": ["UC-28b"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b"]}, "BR-295": {"text": "The Chair role may be handed over only to a current active internal participant of the Meeting who is neither a Guest nor the current Secretary, so the Chair and the Secretary do not swap roles. The same rule applies when the Secretary replaces a Chair whose account is locked.", "applies": ["UC-28b", "UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair; PO 23/10/2026 — no swap between Chair and Secretary", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-296": {"text": "After a hand-over, the former Chair remains a Member of the Meeting; leaving the meeting room does not remove him or her from the Meeting.", "applies": ["UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-73"]}, "BR-297": {"text": "A Meeting can be cancelled only by its Meeting Organizer, and only while it is Draft, WaitingApproval, Rejected, Approved or Published. An InProgress or Ended Meeting cannot be cancelled. Cancelled is a final status.", "applies": ["UC-17", "UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:492", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:19", "frontend/src/types/meeting.ts:37"], "test": [], "ucs": ["UC-17", "UC-75"]}, "BR-298": {"text": "Cancelling a Meeting requires a non-blank reason. The reason, the actor and the cancellation time are recorded in the Meeting status history and shown with the Meeting.", "applies": ["UC-16", "UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:59", "backend/TrustCabinet.Domain/Entities/MeetingStatusHistory.cs:42", "backend/TrustCabinet.Domain/Meetings/MeetingContracts.cs:49", "backend/TrustCabinet.Domain/Meetings/MeetingWorkflowContracts.cs:12", "frontend/src/types/meeting.ts:119", "frontend/src/types/meeting.ts:290", "frontend/src/features/meetings/detail/MeetingDetailPage.tsx:383"], "test": [], "ucs": ["UC-16", "UC-75"]}, "BR-299": {"text": "A Cancelled Meeting cannot be edited, submitted, approved, published, rescheduled or started. Its agenda, participants, documents and Votes remain read-only, and any pending approval request is closed.", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:601", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:62", "frontend/src/features/documents/DocumentsPanel.tsx:36"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-33c", "UC-33d", "UC-35", "UC-75"]}, "BR-300": {"text": "When a Published Meeting is cancelled, every invited internal participant is notified in the application and by email, and every invited Guest by email, including the reason. A notification failure does not undo the cancellation.", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Infrastructure/Email/MeetingInvitationEvents.cs:9", "backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:690", "backend/TrustCabinet.Domain/Meetings/IMeetingRepository.cs:49", "backend/TrustCabinet.Domain/Meetings/MeetingReadPolicy.cs:20"], "test": ["tests/TrustCabinet.Web.Tests/Participants/ParticipantDeliveryTests.cs:86"], "ucs": ["UC-75"]}, "BR-301": {"text": "If a Published Meeting has not been started 24 hours after its planned end time, the system cancels it with the reason \"Not held by the planned time\", records System as the actor and notifies its Meeting Organizer. The delay is configurable; the default awaits PO confirmation.", "applies": ["UC-75"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": ["backend/TrustCabinet.Web/MeetingOverdueWorker.cs:6", "backend/TrustCabinet.Web/Program.cs:61", "backend/TrustCabinet.Web/Endpoints/MeetingEndpoints.cs:739", "backend/TrustCabinet.Infrastructure/Meetings/MeetingOverdueService.cs:16", "backend/TrustCabinet.Infrastructure/Meetings/MeetingOverdueService.cs:32", "backend/TrustCabinet.Domain/Entities/Meeting.cs:62", "backend/TrustCabinet.Domain/Entities/MeetingStatusHistory.cs:36", "backend/TrustCabinet.Domain/Enums/MeetingEnums.cs:41", "backend/TrustCabinet.Domain/Meetings/IMeetingOverdueService.cs:4", "backend/TrustCabinet.Domain/Meetings/MeetingWorkflowContracts.cs:11", "frontend/src/types/meeting.ts:125", "frontend/src/types/meeting.ts:265"], "test": [], "ucs": ["UC-75"]}, "BR-302": {"text": "If an InProgress Meeting has not been ended 4 hours after its planned end time, the system ends it, records System as the actor and notifies its Chair and Meeting Organizer. The delay is configurable; the default awaits PO confirmation.", "applies": ["UC-22"], "rationale": "Council review 1 — cancel and overdue Meetings", "enforced": "Meeting Management", "code": [], "test": [], "ucs": ["UC-22"]}, "BR-303": {"text": "The system sends one in-app reminder to each invited active internal participant of a Published Meeting during the 15 minutes before its planned start. If the Meeting is rescheduled, the reminder is sent again for the new start time. Guests do not receive in-app reminders. The lead time is configurable.", "applies": ["UC-66"], "rationale": "Council review 1 — reminder rules; matches the implemented reminder job", "enforced": "Email & In-App Notification", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-304": {"text": "Documents attached to an Agenda Item or a Vote may be chosen from the Meeting documents, uploaded from the computer or chosen from the personal library. Documents not yet in the Meeting are added to it and attached in the same save. All documents submitted together are attached together, or none are.", "applies": ["UC-33b", "UC-76a"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:118", "frontend/src/features/documents/AddDocumentsDialog.tsx:55"], "test": [], "ucs": ["UC-33b", "UC-76a"]}, "BR-305": {"text": "Detaching a document from a Vote keeps the document in the Meeting with its Agenda Item links, comments and read confirmations unchanged.", "applies": ["UC-76b"], "rationale": "Review 18/10/2026 — documents by target (Agenda Item / Vote), three sources", "enforced": "Voting Management", "code": [], "test": [], "ucs": ["UC-76b"]}, "BR-306": {"text": "The Presenter of an Agenda Item is optional; when set, it must be a current internal participant or a current Guest of the same Meeting.", "applies": ["UC-23a", "UC-23b"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-307": {"text": "When a Presenter is assigned or changed while the Meeting is Published or InProgress, the new Presenter is notified: an internal user in the application, a Guest by email including the Meeting title and start time. No in-app notification is created when the assignee is the person making the change (BR-322), for example a Secretary assigning themselves. A Guest who declined the invitation may still be chosen as Presenter and may still join the Meeting: declining is only an advance answer that hides the Meeting from the personal calendar and does not block permissions (BR-321). A notification failure does not undo the change.", "applies": ["UC-23a", "UC-23b"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-308": {"text": "When a participant is removed from the Meeting or a Guest invitation is revoked, the Agenda Items that person presents no longer have a Presenter.", "applies": ["UC-28c"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-309": {"text": "An Agenda Item has at most one conclusion: a non-blank text of at most 2,000 characters. Saving again replaces the earlier conclusion.", "applies": ["UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-77"]}, "BR-310": {"text": "The current Chair or Secretary may record or change an Item conclusion only for an InProgress or Done Item, while the Meeting is InProgress or after it ends until the minutes draft is generated. After that, the conclusion is read-only.", "applies": ["UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-77"]}, "BR-311": {"text": "The system records who last saved an Item conclusion and when, and shows them with the conclusion.", "applies": ["UC-26", "UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-26", "UC-77"]}, "BR-312": {"text": "Meeting Minutes include each Agenda Item with its Presenter and recorded conclusion.", "applies": ["UC-59", "UC-77"], "rationale": "Review 18/10/2026 — Agenda presenter and Item conclusion", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-59", "UC-77"]}, "BR-313": {"text": "A change to a role's permissions applies to the users holding that role from their next action, without ending their active sessions.", "applies": ["UC-11"], "rationale": "SCRUM-105, BA 22/10/2026", "enforced": "Role-Based Access Control", "code": [], "test": [], "ucs": ["UC-11"]}, "BR-314": {"text": "Changing a user's system role applies the new role's permissions to that user from their next action, without ending their active sessions.", "applies": ["UC-08"], "rationale": "SCRUM-105, PO 22/10/2026", "enforced": "Role-Based Access Control", "code": [], "test": [], "ucs": ["UC-08"]}, "BR-315": {"text": "Opening a Meeting document from the online meeting room keeps the user in the room.", "applies": ["UC-32a", "UC-32c"], "rationale": "SCRUM-21, BA 22/10/2026 — ADR-0011, PO approved 22/10/2026", "enforced": "Document Management", "code": ["frontend/src/features/agenda/AgendaPanel.tsx:260", "frontend/src/features/documents/DocumentsPanel.tsx:39", "frontend/src/features/documents/DocumentViewerPage.tsx:35"], "test": [], "ucs": ["UC-32a", "UC-32c"]}, "BR-316": {"text": "The online meeting room offers Meeting documents for reading and commenting only; adding, linking and removing documents are done outside the room.", "applies": ["UC-32a"], "rationale": "SCRUM-21, BA 22/10/2026 — ADR-0011, PO approved 22/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:74", "frontend/src/types/document.ts:38", "frontend/src/features/documents/DocumentsPanel.tsx:38"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:88"], "ucs": ["UC-32a"]}, "BR-317": {"text": "A reply belongs to one top-level comment of the same Meeting document; replies are not nested further.", "applies": ["UC-35"], "rationale": "SCRUM-23, BA 22/10/2026 — PO approved 22/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:79", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:8", "backend/TrustCabinet.Domain/Entities/DocumentComment.cs:8", "frontend/src/types/document.ts:131", "frontend/src/features/documents/CommentsPanel.tsx:16"], "test": [], "ucs": ["UC-35"]}, "BR-318": {"text": "Each view or download of a document of a Confidential or Secret Meeting is recorded in the audit log with the user and time.", "applies": ["UC-32c"], "rationale": "SCRUM-22, PO 13/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:114", "backend/TrustCabinet.Domain/Audit/IAuditService.cs:120", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:98", "frontend/src/features/documents/DocumentViewerPage.tsx:33"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentReadEndpointsTests.cs:186"], "ucs": ["UC-32c"]}, "BR-319": {"text": "One upload from the computer — to a Meeting (UC-33a, UC-33b) or to the personal library (UC-36) — contains at most 10 files with a total size of at most 200 MB.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "PO 22/10/2026 — as in AI-eCabinet; extended to UC-33b and UC-36 by PO 27/10/2026 (SCRUM-58)", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:268", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:17", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:18", "backend/TrustCabinet.Domain/Documents/DocumentFileRules.cs:79", "frontend/src/features/documents/useFileUpload.ts:6"], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36"]}, "BR-320": {"text": "When a Meeting is created, the Organizer chooses 1 to 100 initial participants. Each is an existing active internal user listed once, with the Meeting Role Chair, Secretary or Member, and exactly one participant is the Chair. A Secretary is optional, the Organizer need not be a participant, and Guests cannot be added at creation. The participants are saved with the Meeting in one save, each with a Pending response, and no invitation is sent while the Meeting is Draft.", "applies": ["UC-14"], "rationale": "PO 20/10/2026", "enforced": "Meeting Management", "code": [], "test": [], "ucs": ["UC-14"]}, "BR-321": {"text": "An invitee who has not answered is treated as attending. A Declined response only hides the Meeting from that invitee's own calendar; it does not change the invitee's Meeting Role, access to the Meeting, its documents or its online room, and the Meeting still appears in the Meeting list. The Chair is never hidden, even when an earlier Declined response exists.", "applies": ["UC-17", "UC-29", "UC-30"], "rationale": "PO 21/10/2026 — as in AI-eCabinet", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-17", "UC-23a", "UC-23b", "UC-29", "UC-30"]}, "BR-322": {"text": "No one receives an in-app notification about their own action. Email still goes to the actor too, so their calendar updates.", "applies": ["UC-15", "UC-21", "UC-23a", "UC-23b", "UC-28b", "UC-73"], "rationale": "BA Final Review, PR #136", "enforced": "Email & In-App Notification", "code": [], "test": [], "ucs": ["UC-15", "UC-21", "UC-23a", "UC-23b", "UC-28b", "UC-73"]}, "BR-333": {"text": "The documents of all Meetings and personal libraries together may take at most 10 GB of storage in the whole system. Every stored file not yet purged counts, including a file already deleted from a library or removed from a Meeting that the periodic cleanup has not yet removed (BR-213). There is no limit per user. An upload that would take the total above 10 GB is rejected and none of its files is stored.", "applies": ["UC-33a", "UC-33b", "UC-36"], "rationale": "PO 27/10/2026 (SCRUM-58, ADR-0034)", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-33a", "UC-33b", "UC-36"]}, "BR-334": {"text": "A System Admin may read, but never change, the folders and documents in the personal library of a locked account. The library of an active account stays private to its owner. The Admin never sees the files of a Confidential or Secret Meeting, nor that Meeting’s upload folder and its subfolders, even when the Admin may view the Meeting: those open only under the Meeting’s own rules.", "applies": ["UC-34b"], "rationale": "PO 27/10/2026 (SCRUM-58, ADR-0035)", "enforced": "Document Management", "code": [], "test": [], "ucs": ["UC-34b"]}, "BR-335": {"text": "Every read of a locked account’s library by a System Admin — a folder listing or a document — is written to the audit log with who read, whose library, which item and when. If the entry cannot be saved, the read is refused.", "applies": ["UC-34b"], "rationale": "PO 27/10/2026 (SCRUM-58)", "enforced": "Audit", "code": [], "test": [], "ucs": ["UC-34b"]}}, "msgs": {"MSG01": {"type": "Redirect to sign-in", "context": "Common – Session Renewal", "content": "Your session has expired. Please sign in again.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:32", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:127", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:279", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:61", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:5", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:20"], "test": ["tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:154", "tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:270"], "ucs": ["UC-01"]}, "MSG02": {"type": "Redirect to sign-in", "context": "Common – Session Renewal", "content": "Your account is currently unavailable. Please contact your administrator for assistance.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:27", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:33", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:69", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:115", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:139", "backend/TrustCabinet.Domain/Authentication/GoogleSignInOutcome.cs:8", "backend/TrustCabinet.Domain/Authentication/GoogleSignInOutcome.cs:31", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:5", "backend/TrustCabinet.Domain/Authentication/SignInOutcome.cs:23", "frontend/src/api/auth.ts:10", "frontend/src/features/auth/LoginPage.tsx:19"], "test": ["tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:165", "tests/TrustCabinet.Web.Tests/Authentication/AuthEndpointsTests.cs:286", "tests/TrustCabinet.Web.Tests/Authentication/AuthenticationServiceTests.cs:288", "tests/TrustCabinet.Web.Tests/Authentication/GoogleAuthEndpointTests.cs:176", "tests/TrustCabinet.Web.Tests/Authentication/GoogleAuthEndpointTests.cs:178", "tests/TrustCabinet.Web.Tests/Authentication/GoogleAuthEndpointTests.cs:192", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:199", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:221", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:232"], "ucs": ["UC-01", "UC-02"]}, "MSG03": {"type": "Form error", "context": "UC-02 – Sign in with Google / Exception Flows", "content": "Google sign-in was unsuccessful.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:29", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:34", "backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:304", "backend/TrustCabinet.Infrastructure/Authentication/AuthenticationService.cs:88", "backend/TrustCabinet.Domain/Authentication/GoogleSignInOutcome.cs:19", "frontend/src/features/auth/GoogleSignInButton.tsx:6"], "test": ["tests/TrustCabinet.Web.Tests/Authentication/GoogleAuthEndpointTests.cs:138", "tests/TrustCabinet.Web.Tests/Authentication/GoogleSignInServiceTests.cs:111"], "ucs": ["UC-02"]}, "MSG04": {"type": "Form error", "context": "UC-02 – Sign in with Google / Exception Flows", "content": "Unable to verify your Google account. Please try again.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:28", "backend/TrustCabinet.Domain/Authentication/GoogleSignInOutcome.cs:19"], "test": [], "ucs": ["UC-02"]}, "MSG05": {"type": "Form error", "context": "UC-02 – Sign in with Google / Exception Flows", "content": "This Google account has not been granted access to the system.", "code": ["backend/TrustCabinet.Web/Endpoints/AuthEndpoints.cs:35" <script>
let D;
try { D = JSON.parse(document.getElementById('data').textContent); }
catch (e) {
  document.body.innerHTML = '<p style="max-width:560px;margin:60px auto;font:16px/1.6 system-ui">Đây là file mẫu, chưa có dữ liệu. Chạy <code>python scripts/trace_br.py --html</code> rồi mở <b>docs/uc-map.html</b>.</p>';
  throw e;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = id => parseInt(id.replace(/\D/g, ''), 10);
const normId = id => id.startsWith('BR-') ? 'BR-' + String(num(id)).padStart(2, '0') : id;
let state = {tab: 'uc', id: null, sel: null, q: '', cov: 'all'};

const hasCode = r => r && r.code.length, hasTest = r => r && r.test.length;
const status = r => hasTest(r) ? 't' : hasCode(r) ? 'c' : 'n';
const STATUS_TXT = {t: 'có test', c: 'có code', n: 'chưa có dấu vết'};
const ucStatus = uc => !uc.cov.br ? '' : uc.cov.test === uc.cov.br ? 't' : uc.cov.code ? 'c' : 'n';

function link(text) {
  return esc(text).replace(/\b(BR-\d{1,3}|MSG\d{2,3}|UC-\d{2,3}[a-z]?)\b/g, m => {
    const id = normId(m), kind = id.startsWith('BR') ? 'br' : id.startsWith('MSG') ? 'msg' : 'uc';
    const r = kind === 'br' ? D.rules[id] : kind === 'msg' ? D.msgs[id] : null;
    const tip = r ? esc((r.text || r.content).slice(0, 200)) : kind === 'uc' && D.ucs[id] ? esc(D.ucs[id].name) : 'không có trong Report 3';
    const cls = kind !== 'uc' && r && !hasCode(r) ? ' nocode' : '';
    return `<a class="chip ${kind}${cls}${state.sel === id ? ' sel' : ''}" data-k="${id}" title="${tip}">${m}</a>`;
  });
}
const vsc = ref => { const [p, l] = ref.split(/:(?=\d+$)/); return `vscode://file/${D.root}/${p}:${l}`; };
function refs(list, cls) {
  if (!list.length) return '<div class="empty">chưa có</div>';
  return `<div class="refs">${list.map(r => `<a class="${cls}" href="${vsc(r)}" title="Mở trong VS Code">${esc(r)}</a>`).join('')}</div>`;
}

/* ---------- inspector ---------- */
function inspect(id) {
  state.sel = id; const el = $('#insp');
  if (!id) { el.innerHTML = '<div class="empty">Bấm vào chip <span class="chip br">BR-nn</span> hoặc <span class="chip msg">MSGnn</span> trong luồng để xem luật, thông báo và code liên quan.</div>'; return; }
  if (id.startsWith('BR')) {
    const r = D.rules[id];
    if (!r) { el.innerHTML = `<h4>${id}</h4><p class="empty">Không có trong Phụ lục V.1 của Report 3.</p>`; return; }
    el.innerHTML = `<h4><span class="chip br">${id}</span> <span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></h4>
      <p>${link(r.text)}</p>
      ${r.rationale ? `<div class="lab">Lý do / nguồn</div><div>${esc(r.rationale)}</div>` : ''}
      ${r.enforced ? `<div class="lab">Thực thi bởi</div><div>${esc(r.enforced)}</div>` : ''}
      <div class="lab">Use case áp dụng (${r.ucs.length})</div><div>${r.ucs.map(u => link(u)).join(' ') || '—'}</div>
      <div class="lab">Code (${r.code.length})</div>${refs(r.code, 'c')}
      <div class="lab">Test (${r.test.length})</div>${refs(r.test, 't')}`;
  } else {
    const r = D.msgs[id];
    if (!r) { el.innerHTML = `<h4>${id}</h4><p class="empty">Không có trong Phụ lục V.2 của Report 3.</p>`; return; }
    el.innerHTML = `<h4><span class="chip msg">${id}</span> <span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></h4>
      <p>“${esc(r.content)}”</p><div class="lab">Loại</div><div>${esc(r.type)}</div>
      <div class="lab">Ngữ cảnh</div><div>${esc(r.context)}</div>
      <div class="lab">Use case (${r.ucs.length})</div><div>${r.ucs.map(u => link(u)).join(' ') || '—'}</div>
      <div class="lab">Code (${r.code.length})</div>${refs(r.code, 'c')}
      <div class="lab">Test (${r.test.length})</div>${refs(r.test, 't')}`;
  }
  document.querySelectorAll('.chip.sel').forEach(c => c.classList.remove('sel'));
  document.querySelectorAll(`.chip[data-k="${id}"]`).forEach(c => c.classList.add('sel'));
}

/* ---------- views ---------- */
const FEATURE_OF = {}; D.features.forEach(f => f.ucs.forEach(u => FEATURE_OF[u] = f));
const ucText = uc => JSON.stringify(uc).toLowerCase();
const matches = (hay, q) => !q || q.toLowerCase().split(/\s+/).every(w => hay.includes(w));

function renderSide() {
  const q = state.q;
  let html = '';
  for (const f of D.features) {
    const list = f.ucs.filter(u => matches(ucText(D.ucs[u]), q));
    if (!list.length) continue;
    html += `<div class="fe">${esc(f.id)} · ${esc(f.name)}</div>`;
    for (const u of list) {
      const uc = D.ucs[u], st = ucStatus(uc);
      html += `<a class="uc-link${uc.parent ? ' sub' : ''}${state.tab === 'uc' && state.id === u ? ' on' : ''}" href="#uc/${u}" title="${esc(uc.name)} — BR ${uc.cov.br}, có code ${uc.cov.code}, có test ${uc.cov.test}"><b>${u}</b><span class="nm">${esc(uc.name)}</span><i class="dot ${st}"></i></a>`;
    }
  }
  $('#side').innerHTML = html || '<div class="fe">Không có use case khớp.</div>';
}

function steps(list) {
  return `<ol class="steps">${list.map(s => `<li><span class="n">${s.n}</span><div>${link(s.text)}</div></li>`).join('')}</ol>`;
}
function flows(blocks, kind, label) {
  if (!blocks || !blocks.length) return '';
  return `<h3>${label}</h3>` + blocks.map((b, i) => `<details class="flow ${kind}" ${kind !== 'ex' || blocks.length < 4 ? 'open' : ''}>
    <summary>${esc(b.id ? b.id + ' – ' : '')}${esc(b.title)}</summary><div class="body">
    ${b.notes.map(n => `<div class="note">${link(n)}</div>`).join('')}${steps(b.steps)}</div></details>`).join('');
}

function viewUC(id) {
  const uc = D.ucs[id]; if (!uc) return viewHome();
  const f = D.features.find(x => x.id === uc.feature);
  const c = uc.cov, pc = c.br ? c.code * 100 / c.br : 0, pt = c.br ? c.test * 100 / c.br : 0;
  const files = {};
  for (const b of uc.br) { const r = D.rules[b]; if (!r) continue;

    r.test.forEach(x => (files[x.split(':')[0]] ||= {code: [], test: [], ids: new Set()}, files[x.split(':')[0]].test.push(x), files[x.split(':')[0]].ids.add(b))); }
  for (const m of uc.msg) { const r = D.msgs[m]; if (!r) continue;
    r.code.forEach(x => (files[x.split(':')[0]] ||= {code: [], test: [], ids: new Set()}, files[x.split(':')[0]].code.push(x), files[x.split(':')[0]].ids.add(m)));
    r.test.forEach(x => (files[x.split(':')[0]] ||= {code: [], test: [], ids: new Set()}, files[x.split(':')[0]].test.push(x), files[x.split(':')[0]].ids.add(m))); }
  const fileRows = Object.entries(files).sort((a, b) => b[1].ids.size - a[1].ids.size).map(([p, v]) => {
    const first = (v.code[0] || v.test[0]);
    return `<tr><td class="refs"><a class="${v.test.length && !v.code.length ? 't' : 'c'}" href="${vsc(first)}">${esc(p)}</a></td><td>${[...v.ids].map(i => link(i)).join(' ')}</td></tr>`;
  }).join('');
  return `<div class="sub">${esc(f ? f.id + ' · ' + f.name : '')}${uc.parent ? ` · thuộc ${link(uc.parent)}` : ''}</div>
  <h2><span class="chip uc">${id}</span> ${esc(uc.name)}</h2>
  <div class="facts"><div>Tác nhân chính: <b>${esc(uc.actors || '—')}</b></div><div>Phụ: <b>${esc(uc.secondary || '—')}</b></div>
   <div>Report 3 dòng <b>${uc.line}</b></div></div>
  <div class="cov"><span>${c.br} BR</span><div class="bar"><i class="a" style="width:${pt}%"></i><i class="b" style="width:${pc - pt}%"></i></div>
   <span><span class="badge t">${c.test} test</span> <span class="badge c">${c.code} code</span></span></div>
  <div class="box">${link(uc.desc || '')}</div>
  ${uc.pre && uc.pre.length ? `<h3>Điều kiện tiên quyết</h3><div class="box"><ul class="bul">${uc.pre.map(x => `<li>${link(x)}</li>`).join('')}</ul></div>` : ''}
  ${flows(uc.normal, 'nf', 'Luồng chính')}${flows(uc.alts, 'af', 'Luồng thay thế')}${flows(uc.exs, 'ex', 'Luồng ngoại lệ')}
  ${uc.post && uc.post.length ? `<h3>Kết quả sau cùng</h3><div class="box"><ul class="bul">${uc.post.map(x => `<li>${link(x)}</li>`).join('')}</ul></div>` : ''}
  ${Object.entries(uc.extra || {}).map(([k, v]) => `<h3>${esc(k)}</h3><div class="box">${link(v)}</div>`).join('')}
  <h3>Luật nghiệp vụ (${uc.br.length})</h3>
  <table><tr><th>BR</th><th>Luật</th><th>Dấu vết</th></tr>${uc.br.map(b => { const r = D.rules[b];
    return `<tr class="row" data-k="${b}"><td>${link(b)}</td><td>${r ? esc(r.text) : '<i>không có trong Phụ lục V.1</i>'}</td>
    <td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`; }).join('')}</table>
  <h3>Thông báo (${uc.msg.length})</h3>
  <table><tr><th>MSG</th><th>Nội dung</th><th>Dấu vết</th></tr>${uc.msg.map(m => { const r = D.msgs[m];
    return `<tr class="row" data-k="${m}"><td>${link(m)}</td><td>${r ? esc(r.content) : '<i>không có trong Phụ lục V.2</i>'}</td>
    <td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`; }).join('')}</table>
  <h3>File code/test đụng tới UC này (${Object.keys(files).length})</h3>
  ${fileRows ? `<table><tr><th>File</th><th>Trích dẫn</th></tr>${fileRows}</table>` : '<div class="box">Chưa file nào trích BR/MSG của UC này.</div>'}`;
}

function viewHome() {
  const rows = D.features.map(f => {
    const us = f.ucs.map(u => D.ucs[u]);
    const br = new Set(us.flatMap(u => u.br)); const t = [...br].filter(b => hasTest(D.rules[b])).length, c = [...br].filter(b => hasCode(D.rules[b])).length;
    return `<tr><td><b>${f.id}</b></td><td>${esc(f.name)}</td><td>${us.map(u => `<a class="chip uc" href="#uc/${u.id}" title="${esc(u.name)}">${u.id}</a>`).join(' ')}</td><td>${br.size}</td><td>${c}</td><td>${t}</td></tr>`;
  }).join('');
  const all = Object.values(D.rules), un = all.filter(r => !hasCode(r) && !hasTest(r)).length;
  return `<h2>Bản đồ nghiệp vụ</h2>
  <p class="sub">${Object.keys(D.ucs).length} use case · ${all.length} luật nghiệp vụ · ${Object.keys(D.msgs).length} thông báo. ${un} luật chưa có code/test nào trích dẫn.</p>
  <p class="sub">Ảnh chụp ngày ${esc(D.generated || '?')}: cột “có code/có test” đọc từ mã nguồn lúc sinh, sẽ lệch khi có PR code merge sau đó — chạy lại <code>python scripts/sync_reports.py</code> để làm mới.</p>
  <div class="box"><b>Cách đọc.</b> Chọn một use case bên trái, đọc luồng chính trước, rồi rẽ nhánh. Bấm chip <span class="chip br">BR-nn</span> / <span class="chip msg">MSGnn</span>
  để xem luật, thông báo và dòng code/test cạnh bên. Chấm xanh = mọi BR của UC có test; vàng = có code; đỏ = chưa có dấu vết. Muốn đổi nghiệp vụ: tìm BR, xem file code, sửa cả hai.</div>
  <h3>Theo tính năng</h3><table><tr><th>FE</th><th>Tên</th><th>Use case</th><th>BR</th><th>có code</th><th>có test</th></tr>${rows}</table>`;
}

function viewBR() {
  const q = state.q;
  let list = Object.entries(D.rules).filter(([id, r]) => matches((id + ' ' + r.text + ' ' + r.ucs.join(' ')).toLowerCase(), q));
  if (state.cov !== 'all') list = list.filter(([, r]) => status(r) === state.cov);
  list.sort((a, b) => num(a[0]) - num(b[0]));
  const btn = (k, t) => `<button data-cov="${k}" class="${state.cov === k ? 'on' : ''}">${t}</button>`;
  return `<h2>Luật nghiệp vụ</h2><div class="filters">${btn('all', 'Tất cả')}${btn('t', 'Có test')}${btn('c', 'Chỉ có code')}${btn('n', 'Chưa có dấu vết')}</div>
  <div class="sub">${list.length} luật</div>
  <table><tr><th>BR</th><th>Luật</th><th>UC</th><th>Dấu vết</th></tr>${list.map(([id, r]) => `<tr class="row" data-k="${id}"><td>${link(id)}</td><td>${esc(r.text)}</td><td>${r.ucs.map(u => link(u)).join(' ')}</td><td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`).join('')}</table>`;
}
function viewMSG() {
  const q = state.q;
  const list = Object.entries(D.msgs).filter(([id, r]) => matches((id + ' ' + r.content + ' ' + r.context).toLowerCase(), q)).sort((a, b) => num(a[0]) - num(b[0]));
  return `<h2>Thông báo hệ thống</h2><div class="sub">${list.length} thông báo</div>
  <table><tr><th>MSG</th><th>Loại</th><th>Nội dung</th><th>UC</th><th>Dấu vết</th></tr>${list.map(([id, r]) => `<tr class="row" data-k="${id}"><td>${link(id)}</td><td>${esc(r.type)}</td><td>${esc(r.content)}</td><td>${r.ucs.map(u => link(u)).join(' ')}</td><td><span class="badge ${status(r)}">${STATUS_TXT[status(r)]}</span></td></tr>`).join('')}</table>`;
}

/* ---------- routing ---------- */
function render() {
  const [tab, id] = (location.hash.slice(1) || 'home').split('/');
  state.tab = tab === 'br' || tab === 'msg' ? tab : tab === 'uc' ? 'uc' : 'home'; state.id = id || null;
  $('#tabs').innerHTML = [['home', 'Tổng quan'], ['br', 'Luật (BR)'], ['msg', 'Thông báo (MSG)']]
    .map(([k, t]) => `<a href="#${k}" class="${state.tab === k || (k === 'home' && state.tab === 'uc') ? 'on' : ''}">${t}</a>`).join('');
  $('#main').innerHTML = state.tab === 'uc' ? viewUC(id) : state.tab === 'br' ? viewBR() : state.tab === 'msg' ? viewMSG() : viewHome();
  renderSide();
  if (state.tab === 'br' && id && D.rules[id]) inspect(id); else inspect(state.sel && document.querySelector(`.chip[data-k="${state.sel}"]`) ? state.sel : null);
  $('#main').scrollTop = 0;
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); const row = e.target.closest('tr.row'); const fb = e.target.closest('[data-cov]');
  if (fb) { state.cov = fb.dataset.cov; $('#main').innerHTML = viewBR(); return; }
  if (chip) { const k = chip.dataset.k; if (!k) return;
    if (k.startsWith('UC')) { location.hash = '#uc/' + k; return; } e.preventDefault(); inspect(k); return; }
  if (row) inspect(row.dataset.k);
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); const keep = state.sel; render(); if (keep) inspect(keep); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
