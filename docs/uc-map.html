<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustCabinet – Bản đồ UC · BR · MSG</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--ink:#1c2430;--muted:#5d6b7c;--line:#dde3ea;--brand:#1f5fbf;--brand-soft:#e8f0fc;
--br:#8a5a00;--br-soft:#fdf1d8;--msg:#0b6b5c;--msg-soft:#dcf3ee;--ok:#1c7a3d;--warn:#a96400;--bad:#b3261e;--code:#f0f3f7}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Be Vietnam Pro",system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand);text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
nav.tabs a{padding:6px 12px;border-radius:6px;color:var(--ink)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
#q{flex:1;max-width:420px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;height:calc(100vh - 51px)}
.app>*{overflow:auto}
aside.side{background:var(--surface);border-right:1px solid var(--line);padding:8px 0}
aside.insp{background:var(--surface);border-left:1px solid var(--line);padding:16px}
main{padding:20px 28px 80px}
.fe{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.uc-link{display:flex;gap:8px;align-items:baseline;padding:5px 14px;color:var(--ink)}
.uc-link.sub{padding-left:30px}
.uc-link:hover{background:var(--bg)}
.uc-link.on{background:var(--brand-soft);color:var(--brand)}
.uc-link b{min-width:50px;font-weight:600}
.uc-link span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.t{background:var(--ok)}.dot.c{background:var(--warn)}.dot.n{background:var(--bad)}
h2{margin:0 0 2px;font-size:20px}
h3{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.facts div{color:var(--muted)}.facts b{color:var(--ink);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
ul.bul{margin:0;padding-left:18px}ul.bul li{margin:3px 0}
.flow{margin:10px 0}
.flow>summary{cursor:pointer;font-weight:600;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.flow[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.flow.ex>summary{border-left:3px solid var(--bad)}
.flow.af>summary{border-left:3px solid var(--warn)}
.flow.nf>summary{border-left:3px solid var(--brand)}
.flow .body{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--surface);padding:6px 14px 10px}
.flow .note{color:var(--muted);font-style:italic;margin:6px 0 2px}
ol.steps{margin:6px 0;padding:0;list-style:none}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--bg)}
ol.steps li:first-child{border-top:0}
ol.steps .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;text-align:center;line-height:22px;font-weight:600}
.chip{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.chip.br{background:var(--br-soft);color:var(--br)}
.chip.msg{background:var(--msg-soft);color:var(--msg)}
.chip.uc{background:var(--brand-soft);color:var(--brand)}
.chip.sel{border-color:currentColor}
.chip.nocode{opacity:.55}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.t{background:#dff3e5;color:var(--ok)}.badge.c{background:#fdf1d8;color:var(--warn)}.badge.n{background:#fbe3e1;color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.refs{font:12px/1.6 ui-monospace,Consolas,monospace}
.refs a{display:block;padding:1px 6px;border-radius:4px;color:var(--ink);background:var(--code);margin:2px 0;overflow-wrap:anywhere}
.refs a.t{border-left:3px solid var(--ok)}.refs a.c{border-left:3px solid var(--brand)}
.insp h4{margin:0 0 4px;font-size:15px}
.insp .lab{margin:14px 0 4px;color:var(--muted);font-size:12px;font-weight:600}
.insp .empty{color:var(--muted)}
.cov{display:flex;gap:8px;align-items:center;margin:8px 0}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .a{background:var(--ok)}.bar .b{background:#8fc9a3}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters button{padding:5px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:inherit;cursor:pointer}
.filters button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
@media(max-width:1100px){.app{grid-template-columns:240px minmax(0,1fr);height:auto}.app>*{overflow:visible}aside.insp{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:700px){.app{grid-template-columns:1fr}aside.side{border-right:0;max-height:240px;overflow:auto}main{padding:16px}}
</style>

xt": "The system saves the new role together with its permissions."}, {"n": 8, "text": "The system records the role creation in the audit log (BR-009)."}, {"n": 9, "text": "The system displays MSG19 – “Role created successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Role created without permissions", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the System Admin does not select any permission."}, {"n": 2, "text": "The system accepts an empty permission set; user accounts assigned to this role have the same access as a Member."}, {"n": 3, "text": "The use case continues at Step 5 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Invalid role information", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Normal Flow, the system determines that the name is empty or longer than 64 characters, the description is longer than 256 characters, or a selected permission does not exist."}, {"n": 2, "text": "The system does not save the role."}, {"n": 3, "text": "The system displays MSG20 – “Invalid role information.” and highlights the invalid fields."}, {"n": 4, "text": "The System Admin may correct the information and resubmit; otherwise the use case ends."}]}, {"id": "EX-2", "title": "Role name already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 6 or Step 7 of the Normal Flow, the system determines that another role already uses the same name (case-insensitive)."}, {"n": 2, "text": "The system does not save the role."}, {"n": 3, "text": "The system displays MSG21 – “A role with this name already exists. Please choose a different name.”"}, {"n": 4, "text": "The System Admin may enter a different name and resubmit; otherwise the use case ends."}]}], "br": ["BR-009"], "msg": ["MSG19", "MSG20", "MSG21"], "cov": {"br": 1, "code": 1, "test": 1}}, "UC-11b": {"id": "UC-11b", "name": "Update Role", "feature": "FE-03", "line": 1241, "extra": {}, "parent": "UC-11", "actors": "System Admin", "secondary": "None", "desc": "Allows the System Admin to change the name and description of a custom role. Predefined roles cannot be renamed; the permissions of any role are configured through UC-10.", "pre": ["PRE-1: The System Admin is authenticated in the system.", "PRE-2: The System Admin is authorized to manage roles.", "PRE-3: At least one custom role exists in the system."], "post": ["POST-1: The name and/or description of the selected role are updated; its permissions and the user accounts holding it remain unchanged.", "POST-2: The change is recorded in the audit log with the values before and after the update.", "POST-3: No user session is terminated; users holding the role see the new name the next time their information is loaded."], "normal": [{"id": "", "title": "Update Role", "notes": [], "steps": [{"n": 1, "text": "The System Admin accesses Role & Permission Management."}, {"n": 2, "text": "The system displays the list of roles."}, {"n": 3, "text": "The System Admin selects “Edit” on a custom role."}, {"n": 4, "text": "The system displays the edit form pre-filled with the current name and description."}, {"n": 5, "text": "The System Admin modifies the name and/or description and submits the form."}, {"n": 6, "text": "The system verifies that the selected role exists and is a custom role."}, {"n": 7, "text": "The system validates the role information using the same rules as UC-11 (name required, at most 64 characters after trimming; description at most 256 characters)."}, {"n": 8, "text": "The system checks that no other role has the same name (case-insensitive). Changing only the letter case of the role’s own name is allowed."}, {"n": 9, "text": "The system saves the updated role."}, {"n": 10, "text": "The system records the change in the audit log (BR-009)."}, {"n": 11, "text": "The system displays MSG22 – “Role updated successfully.”"}]}], "alts": [{"id": "AF-1", "title": "No changes submitted", "notes": [], "steps": [{"n": 1, "text": "At Step 7 of the Normal Flow, the system determines that the submitted name and description are identical to the current values."}, {"n": 2, "text": "The system does not modify any data and does not record an audit log entry."}, {"n": 3, "text": "The system displays MSG22 – “Role updated successfully.”"}, {"n": 4, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Role is a predefined role", "notes": [], "steps": [{"n": 1, "text": "At Step 6 of the Normal Flow, the system determines that the selected role is a predefined system role."}, {"n": 2, "text": "The system does not save the changes."}, {"n": 3, "text": "The system displays MSG24 – “This is a predefined system role and cannot be renamed or deleted. You can still configure its permissions.”"}, {"n": 4, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Invalid role information", "notes": [], "steps": [{"n": 1, "text": "At Step 7 of the Normal Flow, the system determines that the role information is invalid."}, {"n": 2, "text": "The system does not save the changes."}, {"n": 3, "text": "The system displays MSG20 – “Invalid role information.” and highlights the invalid fields."}, {"n": 4, "text": "The System Admin may correct the information and resubmit; otherwise the use case ends."}]}, {"id": "EX-3", "title": "Role name already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 8 or Step 9 of the Normal Flow, the system determines that another role already uses the same name (case-insensitive)."}, {"n": 2, "text": "The system does not save the changes."}, {"n": 3, "text": "The system displays MSG21 – “A role with this name already exists. Please choose a different name.”"}, {"n": 4, "text": "The System Admin may enter a different name and resubmit; otherwise the use case ends."}]}], "br": ["BR-009"], "msg": ["MSG20", "MSG21", "MSG22", "MSG24"], "cov": {"br": 1, "code": 1, "test": 1}}, "UC-11c": {"id": "UC-11c", "name": "Delete Role", "feature": "FE-03", "line": 1252, "extra": {}, "parent": "UC-11", "actors": "System Admin", "secondary": "None", "desc": "Allows the System Admin to delete a custom role that is no longer held by any user account. Predefined roles cannot be deleted.", "pre": ["PRE-1: The System Admin is authenticated in the system.", "PRE-2: The System Admin is authorized to manage roles.", "PRE-3: At least one custom role exists in the system."], "post": ["POST-1: The selected role and its permission assignments are removed from the system.", "POST-2: The deletion, including the role name and the permissions it held, is recorded in the audit log.", "POST-3: No user account and no user session is affected.", "POST-4: Deleting a role never restarts a stopped calendar share. Because a role can be deleted only when no account holds it, the deletion itself stops no share; a reassignment that takes the meeting-creation right away is handled in UC-08. (BR-142, BR-143)"], "normal": [{"id": "", "title": "Delete Role", "notes": [], "steps": [{"n": 1, "text": "The System Admin accesses Role & Permission Management."}, {"n": 2, "text": "The system displays the list of roles with the number of user accounts holding each role."}, {"n": 3, "text": "The System Admin selects “Delete” on a custom role."}, {"n": 4, "text": "The system asks for confirmation."}, {"n": 5, "text": "The System Admin confirms the deletion."}, {"n": 6, "text": "The system verifies that the selected role exists, is a custom role, and is not held by any user account, including deactivated accounts."}, {"n": 7, "text": "The system deletes the role together with its permission assignments."}, {"n": 8, "text": "The system records the role deletion in the audit log (BR-009)."}, {"n": 9, "text": "The system displays MSG23 – “Role deleted successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Deletion cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Normal Flow, the System Admin cancels the deletion."}, {"n": 2, "text": "No data is changed."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": ough the entries name their objects."], "normal": [{"id": "", "title": "View Audit Log", "notes": [], "steps": [{"n": 1, "text": "The System Admin opens Audit Log from the Administration menu."}, {"n": 2, "text": "The system checks that the System Admin's role holds the User administration permission. (BR-012)"}, {"n": 3, "text": "The system retrieves the audit entries, newest first, one page at a time."}, {"n": 4, "text": "The system displays, for each entry, the time, the actor (a user account, a Guest or the system), the event, the object and the access address. The object is shown by its name, or only as “Secret meeting” for anything of a Secret meeting."}, {"n": 5, "text": "The System Admin browses the pages; the chosen period and filters are kept across pages."}]}], "alts": [{"id": "AF-1", "title": "Filter the audit log", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the System Admin chooses a period, an actor (a user account, Guests or the system), an event type, or enters a keyword; the keyword matches the object id, the object name — except the name of anything of a Secret meeting — and the recorded details, ignoring case and Vietnamese marks."}, {"n": 2, "text": "The system retrieves the entries that match all the chosen criteria."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-2", "title": "View the details of an entry", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the System Admin selects an entry."}, {"n": 2, "text": "The system displays the details recorded with that entry, read-only; the fields differ between event types."}, {"n": 3, "text": "The flow resumes at Step 5 of the Normal Flow."}]}, {"id": "AF-3", "title": "No entry matches", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow, no audit entry matches the period and filters."}, {"n": 2, "text": "The system displays an empty list and a no-results message."}, {"n": 3, "text": "The System Admin may change the period or the filters; the flow resumes at Step 1 of AF-1."}]}], "exs": [{"id": "EX-1", "title": "The System Admin's role does not hold the User administration permission", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of the Normal Flow, the System Admin's role does not hold the User administration permission, or no longer holds it."}, {"n": 2, "text": "The system returns no audit entry and the Audit Log page is not shown."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The chosen period or filters are not valid", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow, the start of the period is after its end, or a filter value is not valid."}, {"n": 2, "text": "No entry is retrieved. The system displays MSG469 – “The audit log filter is invalid. Check the period and the selected values.”"}, {"n": 3, "text": "The flow resumes at Step 1 of AF-1."}]}], "br": ["BR-012"], "msg": ["MSG469"], "cov": {"br": 1, "code": 1, "test": 1}}, "UC-13": {"id": "UC-13", "name": "Create Meeting", "feature": "FE-04", "line": 1276, "extra": {}, "parent": null, "actors": "Member", "secondary": "None", "desc": "Allows an authorized Member to create one independent Meeting as a Draft, including its planned schedule, mode, location, confidentiality and its initial participants. An Approver can also do this, because the Approver role also holds the create-meeting permission.", "pre": ["PRE-1: The Member is authenticated.", "PRE-2: The Member is authorized to create meetings."], "post": ["POST-1: A new Meeting exists in Draft status with its planned start and end times.", "POST-2: The creator is recorded as Member.", "POST-3: The selected participants are saved with the Meeting, each with a Pending invitation response; no invitation is sent while the Meeting is Draft. The Meeting may subsequently be prepared and submitted for approval, and a Secretary may still be assigned later through UC-30a.", "POST-4: The creation is recorded in the Meeting's lifecycle history and in the audit log. (BR-022, BR-023)"], "normal": [{"id": "", "title": "Create Meeting", "notes": [], "steps": [{"n": 1, "text": "The Member selects Create Meeting."}, {"n": 2, "text": "The system displays the new Meeting form."}, {"n": 3, "text": "The Member enters Meeting Name, Planned Start Time, Planned End Time, Meeting Mode, Location, Confidentiality Level and optional Description, and chooses the initial participants with a Meeting Role for each: exactly one Chair, and optionally a Secretary and Members. For an Online or Hybrid Meeting an external Online Link of at most 1,000 characters may be entered; left blank, the TrustCabinet online meeting room is used."}, {"n": 4, "text": "The Member submits the form."}, {"n": 5, "text": "The system checks the required values and the planned times, and checks the chosen participants: each is an existing active internal user listed once, with a valid Meeting Role, exactly one is the Chair, and the list holds 1 to 100 participants. Guests cannot be added at creation, and the creator need not be a participant. (BR-013)"}, {"n": 6, "text": "The system creates exactly one Meeting in Draft status, records the creator and saves the chosen participants with Pending responses. (BR-013)"}, {"n": 7, "text": "The system records the creation in the Meeting's lifecycle history and in the audit log. (BR-022, BR-023)"}, {"n": 8, "text": "The system displays MSG29 – \"Meeting created successfully.\""}]}], "alts": [{"id": "AF-1", "title": "Create Draft from a found time slot", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Member chooses a time slot found in UC-81a instead."}, {"n": 2, "text": "The Draft Meeting is created through UC-81b, which completes the use case."}]}], "exs": [{"id": "EX-1", "title": "Meeting information is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a required value is missing/invalid, the planned start is not in the future, or the planned end does not follow the start. (BR-013)"}, {"n": 2, "text": "The system displays MSG31 – \"Invalid meeting information.\" and highlights the affected fields."}, {"n": 3, "text": "No Meeting is created. The Member may correct the inputs."}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "EX-2", "title": "Participants are invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 5, no participant is chosen, a participant is not an existing active internal user or is listed twice, a Meeting Role is invalid, or the choice does not contain exactly one Chair."}, {"n": 2, "text": "The system displays MSG277 – \"The meeting participant list is not valid.\" and highlights the participant list."}, {"n": 3, "text": "No Meeting is created. The Member may correct the participants."}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "br": ["BR-013", "BR-022", "BR-023"], "msg": ["MSG29", "MSG31", "MSG277"], "cov": {"br": 3, "code": 3, "test": 3}}, "UC-14": {"id": "UC-14", "name": "Update Meeting", "feature": "FE-04", "line": 1287, "extra": {}, "parent": null, "actors": "Member", "secondary": "None", "desc": "Allows the Member to update Draft/Rejected Meeting information, or to reschedule only the planned times or location when the Meeting is Published. An Approver can also do this, because the Approver role also holds the create-meeting permission.", "pre": ["PRE-1: The Meeting exists and the Member is authenticated and authorized.", "PRE-2: Full Meeting editing is available only in Draft or Rejected. (BR-014)", "PRE-3: If the Meeting is Published, only the Member may invoke Reschedule to change planned times, location or online link. The Meeting must not have started. (BR-015)"], "post": ["POST-1: Authorized updates are saved to the Meeting.", "POST-2: Meeting lifecycle and assigned approver are unchanged.", "POST-3: When the schedule of a Published Meeting changes, the change is recorded and the invitees are notified. (BR-022, BR-023, BR-031, BR-035)"], "normal": [{"id": "", "title": "Update Meeting", "notes": [], "steps": [{"n": 1, "text": "The Member opens a Draft or Rejected Meeting and selects Edit."}, {"n": 2, "text": "The system displays the editable Meeting fields."}, {"n": 3, "text": "The Member changes the fields and submits."}, {"n": 4, "text": "The system verifies current Meeting status, permissions, required information, and confirms Planned End Time is after Planned Start Time. (BR-013, BR-014)"}, {"n": 5, "text": "The system saves the updates without changing Meeting status. (BR-014)"}, {"n": 6, "text": "The system displays MSG30 – “Meeting updated successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Reschedule a published meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 1 of the Normal Flow, the Member selects Reschedule for a Meeting that is Published and has not started."}, {"n": 2, "text": "The system allows changes only to Planned Start Time, Planned End Time, Location and Online Link; all other fields are read-only. (BR-015)"}, {"n": 3, "text": "The Member enters the changes and submits."}, {"n": 4, "text": "The system validates that the new start is in the future and the end follows the start. (BR-013, BR-015)"}, {"n": 5, "text": "The system saves the new schedule, keeps the Meeting Published and records the change in the Meeting's history and in the audit log. (BR-022, BR-023)"}, {"n": 6, "text": "The invitees are notified of the new schedule; the Member who rescheduled receives the email but no in-app notification. A delivery failure does not undo the saved change. (BR-031, BR-032, BR-035)"}, {"n": 7, "text": "The system displays MSG138 – \"Meeting rescheduled successfully. Invitees will be notified.\" The use case ends."}]}, {"id": "AF-2", "title": "Nothing has changed", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow or Step 3 of AF-1, the Member submits without changing any value; spaces added at the start or end of a text value do not count as a change."}, {"n": 2, "text": "Nothing is saved and no notification is sent. The system displays MSG154 – \"No changes to save.\" The use case ends."}]}, {"id": "AF-3", "title": "Planned start has already passed", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow, the Member sets the Planned Start Time of a Draft or Rejected Meeting to a time that has passed, by less than 24 hours."}, {"n": 2, "text": "The system warns that a Meeting not started within 24 hours of its planned start is cancelled. (BR-029)"}, {"n": 3, "text": "The Member may still submit; the flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Invalid or unauthorized update", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the meeting information is invalid, or the Meeting status no longer permits this edit. (BR-013, BR-014)"}, {"n": 2, "text": "The system does not save any changes and displays MSG31 – “Invalid meeting information.” with the field errors, or MSG33 – “This meeting can no longer be edited.” when the status does not permit the edit."}, {"n": 3, "text": "For invalid information, the Member corrects it and the flow resumes at Step 3 of the Normal Flow; otherwise the use case ends."}]}, {"id": "EX-2", "title": "Reschedule not permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, the Meeting is no longer Published or has already started, its planned start is not in the future, or a field outside the allowed Reschedule set was modified. (BR-015)"}, {"n": 2, "text": "The existing schedule remains unchanged. The system displays MSG33 – “This meeting can no longer be edited.” when the Meeting can no longer be rescheduled, or MSG31 – “Invalid meeting information.” with the field errors otherwise."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Planned start is more than 24 hours ago", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow, the Planned Start Time of a Draft or Rejected  and Status. For a Cancelled Meeting, it also displays the cancellation reason, who cancelled it and when."}, {"n": 5, "text": "The user reviews the Meeting details."}]}], "alts": [{"id": "AF-1", "title": "View the status history", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Normal Flow, the user reviews the status history shown beside the Meeting details."}, {"n": 2, "text": "The system shows every recorded status change, oldest first, with its action, resulting status, time and actor. (BR-022, BR-023)"}, {"n": 3, "text": "A rejection reason is shown only to the Member who created the Meeting, its assigned Approver and its current Chair and Secretary; other readers see the same changes without it."}, {"n": 4, "text": "The flow resumes at Step 5 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Meeting details cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the meeting exists and is accessible, but the system cannot retrieve its meeting-level information."}, {"n": 2, "text": "The system displays MSG37 – \"Unable to load meeting details. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Status history cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-1, the system cannot retrieve the status history."}, {"n": 2, "text": "The Meeting details stay displayed. The system displays MSG136 – “Unable to load the meeting workflow data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-016", "BR-017", "BR-022", "BR-023"], "msg": ["MSG37", "MSG136"], "cov": {"br": 4, "code": 4, "test": 2}}, "UC-16": {"id": "UC-16", "name": "View Meeting List", "feature": "FE-04", "line": 1309, "extra": {}, "parent": null, "actors": "Member, Approver, Chair, Secretary, Participant", "secondary": "None", "desc": "Allows an authorized user to view and browse only the meetings to which the user has an authorized relationship or assignment. The assigned Secretary can view the Meeting before publication under BR-030. External Guests do not use the internal Meeting list.", "pre": ["PRE-1: The user is authenticated."], "post": ["POST-1: The system displays the list of meetings that the user is authorized to view.", "POST-2: No meeting information is modified."], "normal": [{"id": "", "title": "View Meeting List", "notes": [], "steps": [{"n": 1, "text": "The user selects Meetings from the navigation menu. The list opens unfiltered, showing every status at any time."}, {"n": 2, "text": "The system selects only the meetings the user may view: those the user created, at any status; those assigned to the user as Approver, from WaitingApproval onward; those where the user is Chair or active Secretary, at any status; and those where the user is a Member, from Published onward. (BR-016, BR-017, BR-030)"}, {"n": 3, "text": "The system displays those meetings, including Cancelled Meetings and Meetings the user has declined, sorted by planned start time, newest first. (BR-028, BR-047, BR-048)"}, {"n": 4, "text": "The user browses the displayed meetings."}]}], "alts": [{"id": "AF-1", "title": "Search meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the user enters a meeting name in the search field."}, {"n": 2, "text": "The system finds the meetings whose name contains the entered text within the meetings available to the user, ignoring letter case and Vietnamese diacritics."}, {"n": 3, "text": "The system displays the matching meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-2", "title": "Filter meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the user selects one or more filter criteria: Meeting Status (including Cancelled), Confidentiality Level, or Time (Today, This week, Not yet held, Already held)."}, {"n": 2, "text": "The system applies the selected criteria to the meetings available to the user. Today and This week match a Meeting whose planned time overlaps that day or week; Not yet held matches a Meeting whose planned start is later than now; Already held matches one whose planned start is now or earlier, so a Meeting in progress counts as Already held."}, {"n": 3, "text": "The system displays the matching meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-3", "title": "No matching meetings", "notes": [], "steps": [{"n": 1, "text": "The applied search or filter criteria produce no matching meetings within the meetings available to the user."}, {"n": 2, "text": "The system displays an empty meeting list and the message \"No meetings match the filter.\""}, {"n": 3, "text": "The user may change or clear the current search/filter criteria; the flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-4", "title": "View meetings on the calendar", "notes": [], "steps": [{"n": 1, "text": "At Step 1 of the Normal Flow, the user opens the Calendar instead of the list."}, {"n": 2, "text": "The system shows the authorized meetings by week, grouped by status, and omits the Meetings the user has declined through UC-31. (BR-047, BR-048) Cancelled Meetings form their own group, hidden by default. (BR-028)"}, {"n": 3, "text": "The user browses the displayed meetings."}, {"n": 4, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Criteria are invalid", "notes": [], "steps": [{"n": 1, "text": "The system determines that the selected search, filter, sort, or display criteria are invalid."}, {"n": 2, "text": "The system displays MSG32 – “The meeting list criteria are invalid.”"}, {"n": 3, "text": "The user may clear or adjust the search/filter criteria."}, {"n": 4, "text": "The use case ends."}]}], "br": ["BR-016", "BR-017", "BR-028", "BR-030", "BR-047", "BR-048"], "msg": ["MSG32"], "cov": {"br": 6, "code": 3, "test": 0}}, "UC-17": {"id": "UC-17", "name": "Submit Meeting for Approval", "feature": "FE-04", "line": 1320, "extra": {}, "parent": null, "actors": "Member", "secondary": "None", "desc": "Allows the Member to submit a Draft meeting or resubmit a previously Rejected meeting for review by an assigned Approver based on the Meeting information and planned schedule. An Approver can also do this, because the Approver role also holds the create-meeting permission.", "pre": ["PRE-1: The Member is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Member is authorized to submit the selected meeting for approval.", "PRE-4: The meeting is in Draft or Rejected status."], "post": ["POST-1: The meeting status is WaitingApproval.", "POST-2: A valid Approver is assigned to the current approval cycle.", "POST-3: The assigned Approver is granted access to the meeting for approval purposes.", "POST-4: The submission is recorded in the meeting lifecycle history.", "POST-5: The assigned Approver is notified of the pending approval request.", "POST-6: The submission and the assigned approver are recorded in the audit log. (BR-022, BR-023)"], "normal": [{"id": "", "title": "Submit Meeting for Approval", "notes": [], "steps": [{"n": 1, "text": "The Member selects a Draft meeting and chooses Submit for Approval."}, {"n": 2, "text": "The system verifies that the Meeting information and planned schedule are complete and valid for submission. (BR-013)"}, {"n": 3, "text": "The system displays the eligible Approvers with their name and email; the Member may search the list by name or email."}, {"n": 4, "text": "The Member selects an Approver and confirms."}, {"n": 5, "text": "The system checks that the Meeting is still Draft or Rejected and that the chosen Approver is still eligible and is not the Member. (BR-018, BR-019)"}, {"n": 6, "text": "The system assigns the Approver, changes the Meeting to WaitingApproval and records the submission in the status history and the audit log. (BR-018, BR-022, BR-023)"}, {"n": 7, "text": "The assigned Approver is notified."}, {"n": 8, "text": "The system displays MSG78 – “Meeting submitted for approval.”"}]}], "alts": [{"id": "AF-1", "title": "Resubmit a rejected meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 1 of the Normal Flow, the Member selects a meeting in Rejected status and chooses Resubmit for Approval."}, {"n": 2, "text": "At Step 3, the Approver of the previous approval cycle is preselected while still eligible; the Member may keep or change the selection."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Incomplete meeting information", "notes": [], "steps": [{"n": 1, "text": "At Step 2, mandatory Meeting information or the planned schedule is incomplete or invalid."}, {"n": 2, "text": "The system displays MSG81 – “The meeting does not have enough information to be submitted for approval.” and identifies the missing or invalid information."}, {"n": 3, "text": "The meeting remains Draft or Rejected and the use case ends."}]}, {"id": "EX-2", "title": "Meeting status not eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system determines that the meeting is not in Draft or Rejected status."}, {"n": 2, "text": "The system displays MSG41 – \"This meeting can no longer be submitted for approval.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "No eligible approver available", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system finds no eligible Approver. (BR-019)"}, {"n": 2, "text": "The system displays MSG140 – \"No eligible meeting approver is available. Please contact the administrator.\""}, {"n": 3, "text": "The Meeting remains Draft or Rejected; no assignment, submission or notification is made."}, {"n": 4, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Chosen Approver is no longer eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the chosen Approver is no longer active, can no longer approve meetings, or is the Member. (BR-019)"}, {"n": 2, "text": "Nothing is changed. The system displays MSG82 – “The approver is not valid or can no longer approve meetings.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "br": ["BR-013", "BR-018", "BR-019", "BR-022", "BR-023"], "msg": ["MSG41", "MSG78", "MSG81", "MSG82", "MSG140"], "cov": {"br": 5, "code": 3, "test": 3}}, "UC-18": {"id": "UC-18", "name": "Review Meeting Approval", "feature": "FE-04", "line": 1331, "extra": {}, "parent": null, "actors": "Approver", "secondary": "None", "desc": "Allows the Approver assigned to a meeting approval cycle to review the meeting and decide whether to approve or reject it.", "pre": ["PRE-1: The Approver is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Approver is currently assigned to review the selected meeting and is not its Member.", "PRE-4: The meeting is in WaitingApproval status."], "post": ["POST-1: The Approver's decision is recorded.", "POST-2: If approved, the meeting status is Approved.", "POST-3: If rejected, the meeting status is Rejected.", "POST-4: If rejected, the rejection reason is recorded and available to the Member and assigned Secretary so the Member can correct and resubmit the Meeting.", "POST-5: The approval or rejection is recorded in the meeting lifecycle history.", "POST-6: The Member is notified in the application of the approval or rejection; a rejection notification includes the rejection reason. No email is sent for the decision.", "POST-7: The approval or rejection is recorded in the audit log. (BR-022, BR-023)"], "normal": [{"id": "", "title": "Review Meeting Approval", "notes": [], "steps": [{"n": 1, "text": "The Approver selects a meeting assigned to them that is awaiting approval."}, {"n": 2, "text": "The system verifies that the current user is the assigned Approver."}, {"n": 3, "text": "The system displays the meeting information for review."}, {"n": 4, "text": "The Approver selects Approve."}, {"n": 5, "text": "The system re-verifies that the Approver may still approve the meeting and that it is still in WaitingApproval status. (BR-019)"}, {"n": 6, "text": "The system changes the meeting status from WaitingApproval to Approved and records the approval, the actor and the time in the status history and in the audit log. (BR-020, BR-022, BR-023)"}, {"n": 7, "text": "The Member is notified in the application that the meeting has been approved."}, {"n": 8, "text": "The system displays MSG43 – \"Meeting approved successfully.\""}]}], "alts": [{"id": "AF-1", "title": "Reject the meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of the Normal Flow, the Approver selects Reject."}, {"n": 2, "text": "The system requests a rejection reason."}, {"n": 3, "text": "The Approver enters the rejection reason."}, {"n": 4, "text": "The system trims the rejection reason and validates that it is not empty and does not exceed 1000 characters. (BR-020)"}, {"n": 5, "text": "The system re-verifies that the Approver may still reject the meeting and that it is still in WaitingApproval status. (BR-019)"}, {"n": 6, "text": "The system changes the meeting status to Rejected and records the rejection, its reason, the actor and the time in the status history and in the audit log. (BR-020, BR-022, BR-023)"}, {"n": 7, "text": "The Member is notified in the application that the meeting has been rejected, with the reason; the reason is also available to the assigned Secretary so the Member can correct and resubmit the Meeting."}, {"n": 8, "text": "The system displays MSG44 – \"Meeting rejected successfully.\""}]}], "exs": [{"id": "EX-1", "title": "Rejection reason is missing", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, the system determines that the trimmed rejection reason is empty. (BR-020)"}, {"n": 2, "text": "The system displays MSG83 – \"Rejection reason is required.\""}, {"n": 3, "text": "The meeting remains in WaitingApproval status."}, {"n": 4, "text": "The Approver enters a valid rejection reason."}, {"n": 5, "text": "The flow resumes at Step 4 of AF-1."}]}, {"id": "EX-2", "title": "Meeting is no longer awaiting approval", "notes": [], "steps": [{"n": 1, "text": "At Step 5 of the Normal Flow or Step 5 of AF-1, the system determines that the meeting is no longer in WaitingApproval status, or the Approver is no longer assigned to it."}, {"n": 2, "text": "No approval or rejection decision is applied; the meeting remains in its current status."}, {"n": 3, "text": "The system displays MSG132 – “The meeting status has changed or no longer allows this action.”"}, {"n": 4, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Rejection reason is too long", "notes": [], "steps": [{"n": 1, "text": "At Step 4 of AF-1, the trimmed rejection reason exceeds 1000 characters."}, {"n": 2, "text": "The system displays MSG84 – \"Rejection reason must not exceed 1000 characters.\""}, {"n": 3, "text": "The meeting remains in WaitingApproval status."}, {"n": 4, "text": "The Approver enters a valid rejection reason and the flow resumes at Step 4 of AF-1."}]}], "br": ["BR-019", "BR-020", "BR-022", "BR-023"], "msg": ["MSG43", "MSG44", "MSG83", "MSG84", "MSG132"], "cov": {"br": 4, "code": 2, "test": 2}}, "UC-19": {"id": "UC-19", "name": "Publish Meeting", "feature": "FE-04", "line": 1342, "extra": {}, "parent": null, "actors": "Member", "secondary": "None", "desc": "Allows the Member to publish an Approved meeting, which invites its current internal participants and its external Guests.", "pre": ["PRE-1: The Member is authenticated.", "PRE-2: The selected meeting exists.", "PRE-3: The Member is authorized to publish the selected meeting.", "PRE-4: The meeting is in Approved status.", "PRE-5: The meeting has exactly one current Chair and at least one current Secretary with active accounts. Invitation responses are not publication prerequisites. (BR-021, BR-024)"], "post": ["POST-1: The meeting status is Published.", "POST-2: The publication is recorded in the meeting lifecycle history and in the audit log. (BR-022, BR-023)", "POST-3: The current internal participants and the Guests with a current invitation are invited; each Guest is invited to verify the invited email address and access only this Meeting. Publication does not wait for the invitations to be delivered, and a delivery failure does not undo it. (BR-031, BR-032, BR-052, BR-053, BR-054)"], "normal": [{"id": "", "title": "Publish Meeting", "notes": [], "steps": [{"n": 1, "text": "The Member selects an Approved meeting."}, {"n": 2, "text": "The Member selects Publish Meeting."}, {"n": 3, "text": "The system verifies that the Member remains authorized, the meeting is still Approved with a valid planned schedule, and it has exactly one active current Chair and at least one active current Secretary. (BR-021, BR-024)"}, {"n": 4, "text": "The system changes the meeting status from Approved to Published and records the publication, the actor and the time in the meeting lifecycle history and in the audit log. (BR-021, BR-022, BR-023)"}, {"n": 5, "text": "The current internal participants are notified in the application and by email, except that the Member who published receives no in-app notification about their own action; each Guest with a current invitation receives an email invitation. (BR-031, BR-035, BR-052, BR-053)"}, {"n": 6, "text": "The system displays MSG45 – \"Meeting published successfully.\""}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Meeting is no longer eligible for publication", "notes": [], "steps": [{"n": 1, "text": "At Step 3 of the Normal Flow, the system determines that the meeting is no longer Approved, the Member is no longer authorized to publish it, there is not exactly one active current Chair, or there is no active current Secretary. (BR-021)"}, {"n": 2, "text": "The meeting remains unchanged."}, {"n": 3, "text": "No publication notification or invitation is issued and publication is not reported as successful."}, {"n": 4, "text": "The system displays MSG46 – \"This meeting can no longer be published.\""}, {"n": 5, "text": "The use case ends."}]}], "br": ["BR-021", "BR-022", "BR-023", "BR-024", "BR-031", "BR-032", "BR-035", "BR-052", "BR-053", "BR-054"], "msg": ["MSG45", "MSG46"], "cov": {"br": 10, "code": 5, "test": 2}}, "UC-20": {"id": "UC-20", "name": "Start Meeting", "feature": "FE-04", "line": 1353, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the assigned Chair or Secretary to start one Published Meeting, set the Meeting lifecycle to InProgress and record its actual start time. The Meeting has no subordinate scheduling objects.", "pre": ["PRE-1: The Chair or the Secretary is authenticated and assigned to the selected meeting.", "PRE-2: The selected meeting exists.", "PRE-3: The meeting is Published.", "PRE-4: The meeting has exactly one current Chair and at least one current Secretary with active accounts.  (BR-024)"], "post": ["POST-1: Meeting status is InProgress.", "POST-2: Actual Start Time and the starter (Chair or Secretary) are recorded in the status history and in the audit log. (BR-022, BR-023)", "POST-3: The current invited internal participants are notified that the Meeting started, except the person who started it. (BR-035)", "POST-4: Online Meeting Room access is governed by the Meeting mode and current status."], "normal": [{"id": "", "title": "Start Meeting", "notes": [], "steps": [{"n": 1, "text": "The assigned Chair or Secretary selects Start Meeting for the Published Meeting."}, {"n": 2, "text": "The system verifies the starter is an active current Chair or Secretary, one active current Chair and at least one active Secretary exist, and the Meeting remains Published. (BR-024)"}, {"n": 3, "text": "The system changes status to InProgress, saves Actual Start Time, and records the start in the status history and in the audit log. (BR-022, BR-023, BR-024)"}, {"n": 4, "text": "The current invited internal participants are notified, except the person who started the 5, BR-026)"}, {"n": 3, "text": "The system changes the Meeting to Ended, records Actual End Time and records the end in the status history and in the audit log. (BR-022, BR-023)"}, {"n": 4, "text": "The system completes any InProgress Agenda Item and deletes Draft Votes that were never opened; Pending Items stay Pending and opened Votes and their ballots are unchanged. (BR-026, BR-087)"}, {"n": 5, "text": "The system closes room access and displays MSG111 – \"Meeting ended successfully.\" (BR-025)"}, {"n": 6, "text": "Votes stop accepting ballots because the Meeting is Ended; the Chair may later close outstanding Votes to finalize their tally."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Actor or Meeting is not eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer the current Chair or the Meeting is no longer InProgress. (BR-025)"}, {"n": 2, "text": "No end is recorded. The system displays MSG114 – \"This meeting cannot be ended.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-022", "BR-023", "BR-024", "BR-025", "BR-026", "BR-086", "BR-087"], "msg": ["MSG111", "MSG114"], "cov": {"br": 7, "code": 5, "test": 5}}, "UC-22": {"id": "UC-22", "name": "Cancel Meeting", "feature": "FE-04", "line": 1375, "extra": {}, "parent": null, "actors": "Member", "secondary": "Resend Email", "desc": "Allows the Member to cancel a Meeting that will no longer take place, before it starts. A Cancelled Meeting stays in the system as a read-only record with its cancellation reason; it cannot be edited, published or started again. (BR-028)", "pre": ["PRE-1: The actor is signed in and is the Member of the Meeting.", "PRE-2: The Meeting is Draft, WaitingApproval, Rejected, Approved or Published. An InProgress Meeting is ended through UC-21 instead. (BR-028)"], "post": ["POST-1: The Meeting is Cancelled, and the reason, the actor and the cancellation time are recorded in its status history. (BR-022, BR-023, BR-028)", "POST-2: Agenda, participants, ing. (BR-016, BR-017) A Guest with a verified, current invitation sees the Agenda read-only while the Meeting is Published or InProgress; once the Meeting has ended, the Guest can no longer view it. (BR-055)"], "post": ["POST-1: Agenda title, presenter, order, execution status, recorded actual times and any recorded Item conclusion are shown read-only.", "POST-2: The Agenda shown reflects every saved change: creation, editing, deletion, reordering, Item start and completion, and completion of the current Item when the Meeting ends.", "POST-3: Viewing does not modify the Agenda."], "normal": [{"id": "", "title": "View Meeting Agenda", "notes": [], "steps": [{"n": 1, "text": "The user opens the Agenda of the Meeting."}, {"n": 2, "text": "The system verifies Meeting access and retrieves the complete saved Agenda in its current order. (BR-016, BR-017, BR-058, BR-059)"}, {"n": 3, "text": "The system shows Item title, presenter, status, order, recorded actual times and any Item conclusion with who last saved it and when."}, {"n": 4, "text": "While the user keeps the Agenda open, every saved change made by an authorized user appears without reloading the page, as long as the user may still view the Meeting. Changes that failed are never shown."}]}], "alts": [{"id": "AF-1", "title": "Empty meeting agenda", "notes": [], "steps": [{"n": 1, "text": "At Step 3, no Agenda Items exist."}, {"n": 2, "text": "The system displays the empty Agenda state."}, {"n": 3, "text": "The flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Meeting not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 4, the Meeting does not exist or the user lacks access."}, {"n": 2, "text": "No further Agenda information is disclosed."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-016", "BR-017", "BR-055", "BR-058", "BR-059"], "msg": [], "cov": {"br": 5, "code": 5, "test": 1}}, "UC-27": {"id": "UC-27", "name": "Record Agenda Item Conclusion", "featu notes": [], "steps": [{"n": 1, "text": "During the sitting, the actor opens the Notes panel — on the Meeting page or inside the online room, without leaving the call."}, {"n": 2, "text": "The system loads the actor's notes for the Meeting and opens the note of the agenda item that is InProgress."}, {"n": 3, "text": "The actor types. A line may start with a mark — Opinion, Conclusion or Task. When the minutes draft is later built without an AI draft (UC-70), each item's note goes under that item in section II, lines marked Conclusion go to section III and lines marked Task go to “Tasks, deliverables and deadlines”. (BR-133)"}, {"n": 4, "text": "Shortly after the actor stops typing, the system checks that the actor is still the current Secretary, that the Meeting still accepts notes, that the item still belongs to the Meeting, that the text is within 20,000 characters and that the note was not saved elsewhere since the actor read it. (BR-134)"}, {"n": 5, "text": "The system saves the note and shows the time it was saved: MSG415 – “Note saved.”"}]}], "alts": [{"id": "AF-1", "title": "Note on another item or on the Meeting as a whole", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 3, the actor selects another agenda item, or “Chung” [General]."}, {"n": 2, "text": "The system opens the actor's note of that choice."}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-2", "title": "The Chair moves to another item", "notes": [], "steps": [{"n": 1, "text": "After Step 2, the Chair sets another agenda item as current (UC-24)."}, {"n": 2, "text": "The system keeps the text already typed with the earlier item and opens the note of the new current item for what is typed next."}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "AF-3", "title": "The connection is lost", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the text cannot reach the system."}, {"n": 2, "text": "The system keeps the text on the actor's device and displays MSG423 – “You are offline. The note is kept on this device and will be saved when the connection returns.”"}, {"n": 3, "text": "When the connection returns, the flow resumes at Step 4 of the Normal Flow."}]}, {"id": "AF-4", "title": "The Chair reads the notes", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor is the current Chair."}, {"n": 2, "text": "The system shows the current Secretary's notes read-only. (BR-134)"}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Actor is not the current secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is no longer the current Secretary. (BR-134)"}, {"n": 2, "text": "Nothing is saved; the typed text stays in the panel so it can be copied. The system displays MSG416 – “Only the Secretary may write meeting notes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting no longer accepts notes", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting is not InProgress, or it has Ended and its minutes draft has been built. (BR-134)"}, {"n": 2, "text": "Nothing is saved; the typed text stays in the panel. The system displays MSG417 – “Notes can be written only while the meeting is in progress, or after it has ended until the minutes draft is created.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Note was changed in another window", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the note was saved from another window or device after the actor read it."}, {"n": 2, "text": "Nothing is overwritten. The system shows the latest text next to the actor's unsaved text and displays MSG418 – “This note was changed in another window. Reload to see the latest version.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Normal Flow."}]}], "br": ["BR-133", "BR-134"], "msg": ["MSG415", "MSG416", "MSG417", "MSG418", "MSG423"], "cov": {"br": 2, "code": 1, "test": 0}}, "UC-29": {"id": "UC-29", "name": "View Meeting Participants", "feature": "FE-06", "line": 1491, "extra": {}, "parent": null, "actors": "Secretary, Chair, Participant, Guest", "secondary": "None", "desc": "Allows an authorized internal participant or verified Guest to view and search the current Meeting roster, including internal participants and Guests.", "pre": ["PRE-1: The actor has current authorized Meeting participation or verified Guest access.", "PRE-2: Roster visibility follows the actor’s current Meeting permissions. (BR-016, BR-017, BR-030, BR-052)"], "post": ["POST-1: The authorized current roster is displayed.", "POST-2: No data is changed."], "normal": [{"id": "", "title": "View Meeting Participants", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Participants view of an accessible Meeting."}, {"n": 2, "text": "The system rechecks current Meeting access and roster-view permission. (BR-016, BR-017)"}, {"n": 3, "text": "The system displays current internal participants and Guests with invitation identity and Meeting Role or Guest participation type. Where available, a Guest’s self-declared display name and job title are shown separately from the verified email. A Guest actor sees names and roles but not other people’s emails, only their own. Removed or revoked entries are excluded. (BR-045, BR-016, BR-017)"}, {"n": 4, "text": "The actor reviews the roster."}]}], "alts": [{"id": "AF-1", "title": "Search participants", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor enters a name or email in the search field; a Guest actor’s search matches names only. (BR-016, BR-017)"}, {"n": 2, "text": "The system filters the current authorized roster to matching entries, ignoring letter case and Vietnamese diacritics."}, {"n": 3, "text": "The actor reviews the matching entries; the flow resumes at Step 4 of the Normal Flow."}]}], "exs": [{"id": "EX-1", "title": "Roster is not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor lacks current Meeting ponse; either all of them are added or none is. When the Meeting is Published or InProgress, they are invited."}, {"n": 6, "text": "The system displays MSG96 – “Meeting participant added successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Invite external Guest", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Secretary selects Invite Guest and enters the invitation name and email."}, {"n": 2, "text": "For a Secret Meeting, the system warns that the Meeting is Secret without asking for a further confirmation."}, {"n": 3, "text": "At Step 4, the system validates the invited email and its uniqueness against current internal participants and Guest invitations."}, {"n": 4, "text": "At Step 5, the system creates one Guest invitation with a Pending response and, when the Meeting is Published or InProgress, sends it by email. The Guest later verifies the email through UC-04."}, {"n": 5, "text": "The system displays MSG96 – “Meeting participant added successfully.” The use case ends. (BR-049, BR-050, BR-051, BR-052, BR-053, BR-054, BR-044, BR-055)"}]}], "exs": [{"id": "EX-1", "title": "Participant information or selection is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, an internal account is inactive, already current, or has an invalid Meeting Role; or the Guest name/email is missing, invalid or already represented in the Meeting."}, {"n": 2, "text": "No participant batch or Guest invitation is partially saved. The system displays MSG97 – “Invalid meeting participant information.” with the applicable field message."}, {"n": 3, "text": "The actor corrects the selection. The flow resumes at Step 2 of the Normal Flow."}]}, {"id": "EX-2", "title": "Actor is not allowed to manage participants", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor can view the Meeting but is not the current Secretary or the current Chair."}, {"n": 2, "text": "No change is saved. The system displays MSG85 – “You do not have permission to perform this action.” The use case ends."}]}, {"id": "EX-3", "title": "Participant management is no longer permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting status no longer permits the requested roster action."}, {"n": 2, "text": "No change is saved. The system displays MSG98 – “The meeting participant list cannot be modified in its current status.” The use case ends."}]}], "br": ["BR-036", "BR-037", "BR-038", "BR-039", "BR-040", "BR-044", "BR-049", "BR-050", "BR-051", "BR-052", "BR-053", "BR-054", "BR-055"], "msg": ["MSG85", "MSG96", "MSG97", "MSG98"], "cov": {"br": 13, "code": 4, "test": 1}}, "UC-30b": {"id": "UC-30b", "name": "Manage Meeting Role", "feature": "FE-06", "line": 1515, "extra": {}, "parent": "UC-30", "actors": "Secretary, Chair", "secondary": "None", "desc": "Allows the assigned Secretary to change internal Meeting Roles. Before the Meeting is Published, the Secretary may also replace the Chair. From publication onward, only the current Chair can give the Chair role to someone else, through UC-34; the only exception is that the Secretary may replace the Chair when the Chair's account is locked. After publication, the Chair and the Secretary do not swap roles. The Chair and the Secretary may both manage participants and roles while the Meeting status permits roster changes. To change the Secretary, give the Secretary role to the new person, then change the previous Secretary to Member. (BR-041, BR-042)", "pre": ["PRE-1: The actor is a current authorized Secretary or a current authorized Chair, while the Meeting status permits roster changes.", "PRE-2: The Meeting permits participant management, and the selected target is a current internal participant. (BR-036, BR-037)"], "post": ["POST-1: Approved role changes are saved for this Meeting.", "POST-2: A Chair replacement changes both affected internal Meeting Roles together. System Role and Invitation Response remain unchanged. (BR-043, BR-041, BR-042)"], "normal": [{"id": "", "title": "Manage Meeting Role", "notes": [], "steps": [{"n": 1, "text": "The Secretary opens a current participant’s role details."}, {"n": 2, "text": "The system displays the current Meeting Role."}, {"n": 3, "text": "The Secretary changes the internal participant’s Meeting Role."}, {"n": 4, "text": "The Secretary confirms the changes."}, {"n": 5, "text": "The system rechecks current authority, Meeting status, role constraints and required roles. Draft, Rejected and Approved may have no Secretary; Published and InProgress must retain or replace the last Secretary in the same save. (BR-040, BR-016, BR-017)"}, {"n": 6, "text": "The system saves all requested changes together. When the Meeting is Published or InProgress, the affected participants are notified."}, {"n": 7, "text": "If no requested change is made, the system displays MSG154 – “No changes to save.” Otherwise it displays MSG100 – “Meeting role updated successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Replace the chair", "notes": [], "steps": [{"n": 1, "text": "At Step 3, while the Meeting is not yet Published, or once it is Published or InProgress and the Chair's account is deactivated, the Secretary selects a current active internal participant as the new Chair. After publication the selected participant must not be the Secretary. (BR-041, BR-042) Before saving, the system asks for confirmation and names the participant who will become a Member."}, {"n": 2, "text": "The system changes the former Chair to Member and the selected participant to Chair in the same save, subject to the current Secretary requirements."}, {"n": 3, "text": "The system notifies the affected participants when required, but never the actor who made the change: a Chair reassigning his or her own role notifies only the new Chair, while a Secretary replacing the Chair notifies both the former and the new Chair. (BR-035) The system displays MSG100 – “Meeting role updated successfully.” The use case ends. (BR-040, BR-041, BR-042)"}]}], "exs": [{"id": "EX-1", "title": "Meeting role is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the selected Meeting Role is invalid."}, {"n": 2, "text": "No requested change is saved. The system displays MSG101 – “A valid meeting role is required.”"}, {"n": 3, "text": "The Secretary may correct the selection. The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-2", "title": "Required meeting role would be lost", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the change would violate the Chair/Secretary requirement for the current Meeting status."}, {"n": 2, "text": "No role change is saved. The system displays MSG109 – “The meeting must retain its required Chair and Secretary. Assign a replacement first.” The Secretary may revise the change. The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-3", "title": "Actor, target or meeting is no longer eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Secretary assignment, target relationship or Meeting status changed after the details were opened."}, {"n": 2, "text": "No change is saved. The system displays MSG98 – “The meeting participant list cannot be modified in its current status.” The use case ends."}]}], "br": ["BR-016", "BR-017", "BR-035", "BR-036", "BR-037", "BR-040", "BR-041", "BR-042", "BR-043"], "msg": ["MSG98", "MSG100", "MSG101", "MSG109", "MSG154"], "cov": {"br": 9, "code": 2, "test": 0}}, "UC-30c": {"id": "UC-30c", "name": "Remove Meeting Participant", "feature": "FE-06", "line": 1526, "extra": {}, "parent": "UC-30", "actors": "Secretary, Chair", "secondary": "None", "desc": "Allows an assigned Secretary to remove a current internal participant or revoke a Guest invitation while preserving required Meeting records.", "pre": ["PRE-1: The actor is a current authorized Secretary or a current authorized Chair, while the Meeting status permits roster changes.", "PRE-2: The Meeting permits participant management. The selected internal participant or Guest invitation is current. (BR-036, BR-037)"], "post": ["POST-1: The selected participant is no longer current, or the Guest invitation is revoked.", "POST-2: Access granted by the removed relationship ends, including every active session of a revoked Guest invitation; independent valid access remains effective. A Guest in the online room leaves the room when the invitation is revoked. (BR-053, BR-054)", "POST-3: Invitation Response and attendance history are retained. (BR-044, BR-045)", "POST-4: Agenda Items presented by the removed participant or revoked Guest no longer have a Presenter. (BR-064, BR-065)"], "normal": [{"id": "", "title": "Remove Meeting Participant", "notes": [], "steps": [{"n": 1, "text": "The Secretary selects a current internal participant or Guest invitation and confirms removal or revocation."}, {"n": 2, "text": "The system rechecks the Secretary assignment, Meeting status, selected relationship and required Meeting Roles. The Meeting must retain its required Chair and Secretary; a Secretary may be removed only together with a valid replacement in the same save. (BR-036, BR-037, BR-040, BR-041, BR-042)"}, {"n": 3, "text": "The system removes the internal assignment or revokes the Guest invitation, ends access granted by that relationship, and retains historical evidence."}, {"n": 4, "text": "When the Meeting is Published or InProgress, the removed person is notified; the notification does not open the Meeting."}, {"n": 5, "text": "The system displays MSG103 – “Meeting participant removed successfully.”"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Removal is no longer permitted", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting status no longer permits roster changes, or the selected relationship is no longer current."}, {"n": 2, "text": "Nothing is removed or revoked. The system displays MSG98 – “The meeting participant list cannot be modified in its current status.” The use case ends."}]}, {"id": "EX-2", "title": "Removal would violate a required meeting role", "notes": [], "steps": [{"n": 1, "text": "At Step 2, removing the selected participant would leave the Meeting without its required Chair or Secretary and no valid replacement is included in the same save."}, {"n": 2, "text": "The participant or Guest invitation remains current and access remains effective. The system displays MSG109 – “The meeting must retain its required Chair and Secretary. Assign a replacement first.”"}, {"n": 3, "text": "The Secretary may revise the change to include the required replacement. The flow resumes at Step 1 of the Normal Flow."}]}, {"id": "EX-3", "title": "Actor is not allowed to manage participants", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor can view the Meeting but is not the current Secretary or the current Chair."}, {"n": 2, "text": "Nothing is removed or revoked. The system displays MSG85 – “You do not have permission to perform this action.” The use case ends."}]}], "br": ["BR-036", "BR-037", "BR-040", "BR-041", "BR-042", "BR-044", "BR-045", "BR-053", "BR-054", "BR-064", "BR-065"], "msg": ["MSG85", "MSG98", "MSG103", "MSG109"], "cov": {"br": 11, "code": 2, "test": 0}}, "UC-31": {"id": "UC-31", "name": "Respond to Meeting Invitation", "feature": "FE-06", "line": 1537, "extra": {}, "parent": null, "actors": "Secretary, Participant, Guest", "secondary": "None", "desc": "Allows an invitee other than the Chair to confirm in advance whether they will attend, by accepting or declining their own Meeting invitation. The answer is given once and cannot be changed afterwards. The Chair does not respond because the Chair runs the Meeting. (BR-046) An invitee of a meeting created from a found time slot (UC-81b) accepts or declines it like any other invitation.", "pre": ["PRE-1: The Meeting is Published or InProgress.", "PRE-2: The actor owns a current invitation and is not the Chair of the Meeting; a Guest has verified access through UC-04. (BR-046, BR-049, BR-050, BR-051, BR-052, BR-053, BR-054)"], "post": ["POST-1: The response and its response time are recorded once and are not changed afterwards.", "POST-2: Meeting Role, attendance and the invitee's access to the Meeting, its documents and its online room are unchanged. A Declined response only hides the Meeting from the invitee's own calendar, and an invitee who has not answered is treated as attending. (BR-043, BR-047, BR-048)"], "normal": [{"id": "", "title": "Respond to Meeting Invitation", "notes": [], "steps": [{"n": 1, "text": "The invitee, who has not answered yet, sees the attendance question on the Meeting in the calendar and, while the Meeting is Published, on the Meeting details; a verified Guest sees it on the Guest Meeting page. An answer is still accepted while the Meeting is InProgress."}, {"n": 2, "text": "The system identifies the invitee and offers the question only while the invitation has no answer."}, {"n": 3, "text": "The invitee selects Accepted, or selects Declined and confirms it. The confirmation states that the answer is given once and cannot be changed and, for an internal invitee, that the Meeting will no longer appear on their calendar. (BR-046, BR-047, BR-048)"}, {"n": 4, "text": "The system rechecks invitation ownership, that the actor is not the Chair, Meeting status and response value, and compares the value with any response already recorded. (BR-046)"}, {"n": 5, "text": "The system saves the response and response time once."}, {"n": 6, "text": "The system confirms the update with MSG105 – “Meeting invitation response recorded successfully.”"}]}], "alts": [{"id": "AF-1", "title": "Same response submitted again", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the invitee submits the same response that is already recorded."}, {"n": 2, "text": "The system keeps the recorded response and response time unchanged and displays MSG154 – \"No changes to save.\" The use case ends. (BR-046)"}]}, {"id": "AF-2", "title": "Invitee does not confirm declining", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the invitee selects Declined, then does not confirm it."}, {"n": 2, "text": "No response is recorded, and the attendance question stays available. The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Invitation is no longer answerable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting status or invitation state no longer permits a response."}, {"n": 2, "text": "The prior response remains unchanged. For a Guest, email verification and Guest-access failures remain in UC-04."}, {"n": 3, "text": "The system displays MSG107 – “This meeting invitation can no longer be answered.” The use case ends."}]}, {"id": "EX-2", "title": "Response value is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the submitted value is not Accepted or Declined."}, {"n": 2, "text": "The prior response and response time remain unchanged. The system displays MSG106 – “Invalid meeting invitation response.” The invitee may correct the selection. The flow resumes at Step 3 of the Normal Flow."}]}, {"id": "EX-3", "title": "Different response after answering", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the invitee has already answered and submits a different response. (BR-046)"}, {"n": 2, "text": "The recorded response and response time remain unchanged. The system displays MSG285 – “You have already answered this invitation. Your answer cannot be changed.” The use case ends."}]}], "br": ["BR-043", "BR-046", "BR-047", "BR-048", "BR-049", "BR-050", "BR-051", "BR-052", "BR-053", "BR-054"], "msg": ["MSG105", "MSG106", "MSG107", "MSG154", "MSG285"], "cov": {"br": 10, "code": 3, "test": 0}}, "UC-32": {"id": "UC-32", "name": "View Participant Response Status", "feature": "FE-06", "line": 1548, "extra": {}, "parent": null, "actors": "Secretary, Chair, Participant, Guest", "secondary": "None", "desc": "Allows authorized internal participants and verified Guests to view the current invitation responses of the Meeting, shown as a label beside each invitee's name.", "pre": ["PRE-1: The Meeting is Published or a later status that remains readable. A Guest can read it only while the Meeting is Published or InProgress. (BR-055)", "PRE-2: The actor can currently view the Meeting."], "post": ["POST-1: The responses of current invitees are displayed as labels beside their names. The Chair and an invitee who has not answered have no label. No totals are shown.", "POST-2: No data is changed."], "normal": [{"id": "", "title": "View Participant Response Status", "notes": [], "steps": [{"n": 1, "text": "The actor opens the participant list of an accessible Meeting."}, {"n": 2, "text": "The system checks that the actor may view the Meeting. (BR-055)"}, {"n": 3, "text": "The system displays each current invitee’s name and email (a Guest actor sees names only, apart from their own email) with a label for the response given, Accepted or Declined; an invitee who has not answered and the Chair have no label. No totals by status are shown."}, {"n": 4, "text": "No data is changed."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Responses are not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor lacks current Meeting access."}, {"n": 2, "text": "The system discloses no invitee or response and treats the Meeting as not found. (BR-016, BR-017)"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-016", "BR-017", "BR-055"], "msg": [], "cov": {"br": 3, "code": 3, "test": 1}}, "UC-33": {"id": "UC-33", "name": "Record Attendance", "feature": "FE-06", "line": 1559, "extra": {}, "parent": null, "actors": "Secretary", "secondary": "None", "desc": "Allows the assigned Secretary to record or revise attendance for one or more selected current internal participants or Guests while the Meeting is InProgress.", "pre": ["PRE-1: The actor is an active current assigned Secretary.", "PRE-2: The Meeting is InProgress. (BR-056, BR-057)"], "post": ["POST-1: Submitted people have Present or Absent saved with the
