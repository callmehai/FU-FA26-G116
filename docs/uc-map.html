: "EX-1", "title": "Folder is unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the selected folder is missing or no longer belongs to the user."}, {"n": 2, "text": "No folder is deleted. The system displays MSG175 – “This personal-library item is not available.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Folder is no longer empty", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the folder contains a document or subfolder, including an item added after confirmation was displayed. (BR-223)"}, {"n": 2, "text": "The folder and its contents remain unchanged. The system displays MSG196 – “Only an empty folder can be deleted.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Operation cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot complete the operation."}, {"n": 2, "text": "The folder and all other library items remain unchanged. The system displays MSG198 – “Unable to delete the folder. The folder remains unchanged.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-192", "BR-204", "BR-219", "BR-223", "BR-228", "BR-242"], "msg": ["MSG175", "MSG196", "MSG197", "MSG198"], "cov": {"br": 6, "code": 4, "test": 0}}, "UC-74": {"id": "UC-74", "name": "Confirm Document Read", "feature": "FE-07", "line": 1780, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person who may vote to confirm that he or she has read a document linked to a Vote of the Meeting, after scrolling to its last page. The confirmation is required before casting a ballot in UC-55. It records that the person confirmed reading, not how carefully the document was read.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor can currently view the Meeting, the document is attached to the Meeting and linked to a Vote of that Meeting, and the actor is on the eligible-voter list of an Open Vote linked to that document. (BR-181, BR-275, BR-287, BR-190)", "PRE-3: The actor has opened the document in the viewer through UC-32c."], "post": ["POST-1: A read confirmation for the actor and the document is recorded with the confirmation time. (BR-290)", "POST-2: The confirmation counts for every Vote of the Meeting that links the same document and cannot be withdrawn. (BR-291)", "POST-3: No ballot, Vote or document content changes, and the confirmation is not linked to any ballot choice. (BR-293)"], "normal": [{"id": "", "title": "Confirm Document Read", "notes": [], "steps": [{"n": 1, "text": "From the Vote document list or the Meeting documents, the actor opens a Vote document through UC-32c."}, {"n": 2, "text": "The actor scrolls through the document to its last page."}, {"n": 3, "text": "The viewer enables the \"Xác nhận đã đọc\" button once the actor has scrolled to the last page; the last page reached is not stored on its own. (BR-290)"}, {"n": 4, "text": "The actor clicks \"Xác nhận đã đọc\"."}, {"n": 5, "text": "The system rechecks current Meeting access, that the document is still attached to the Meeting and linked to a Vote, and that lastPageReached is true. (BR-181, BR-275, BR-287, BR-290)"}, {"n": 6, "text": "The system records the read confirmation with the actor, the document and the confirmation time. (BR-290, BR-291, BR-293)"}, {"n": 7, "text": "The system displays MSG253 – \"Document read confirmed.\" and updates the read status in the Vote document list. When every document of an Open Vote is confirmed, Submit ballot becomes available in UC-55. (BR-289)"}]}], "alts": [{"id": "AF-1", "title": "Document already confirmed", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor has already confirmed reading this document, including for another Vote of the Meeting that links it."}, {"n": 2, "text": "The system returns MSG253 – \"Document read confirmed.\" with alreadyConfirmed: true and the existing confirmation time, and does not offer confirmation again. (BR-291)"}, {"n": 3, "text": "The use case ends successfully without a new confirmation."}]}], "exs": [{"id": "EX-1", "title": "Last page not reached", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or Step 5, the actor has not scrolled to the last page, including when the viewer was closed before the last page."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG254 – \"Scroll to the last page of the document before confirming that you have read it.\""}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-2", "title": "Document or Meeting is no longer accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor can no longer view the Meeting, or the document is no longer attached to the Meeting or linked to a Vote."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG156 – \"Meeting documents are not accessible.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Actor is not an eligible voter of an Open Vote", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor is not on the fixed eligible-voter list of any Open Vote linked to this document."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG224 – \"You are not eligible to cast a ballot in this vote.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "No Open Vote remains", "notes": [], "steps": [{"n": 1, "text": "At Step 5, none of the linked Votes is still Open, or the Meeting is not InProgress."}, {"n": 2, "text": "No confirmation is recorded. The system displays MSG225 – \"This vote is no longer accepting ballots.\""}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Confirmation cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot save the confirmation."}, {"n": 2, "text": "No confirmation is recorded and the read status is unchanged. The system displays MSG255 – \"Unable to confirm document reading. Please try again.\""}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-181", "BR-190", "BR-275", "BR-287", "BR-289", "BR-290", "BR-291", "BR-293"], "msg": ["MSG156", "MSG224", "MSG225", "MSG253", "MSG254", "MSG255"], "cov": {"br": 8, "code": 8, "test": 6}}, "UC-37": {"id": "UC-37", "name": "Join Meeting Room", "feature": "FE-08", "line": 1793, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person who currently holds access to an In Progress Online or Hybrid Meeting to check the camera and microphone and enter its online meeting room. The room opens only while the Meeting is In Progress: joining does not start, resume or change the Meeting. A person who opens the room before the Meeting starts waits in the lobby, which opens by itself when the Meeting starts.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation. (BR-120, BR-152 – BR-157, BR-181)", "PRE-2: The Meeting is In Progress and its mode is Online or Hybrid; this holds for a Guest too, who sees the waiting lobby while the Meeting is only Published (AF-3). (BR-143, BR-181)", "PRE-3: The actor holds a current participant assignment of the Meeting, or a valid Guest access relationship for it. Being the Organizer or the Approver alone is not enough. (BR-97, BR-100, BR-101, BR-323)", "PRE-4: Fewer than 50 people are connected to the room. (BR-336)"], "post": ["POST-1: The actor is connected to the meeting room and appears in the Participants panel of everyone in the room. (BR-330)", "POST-2: The Meeting lifecycle, its roster, its roles and its attendance are unchanged. (BR-324, BR-330)", "POST-3: The connection lasts until the actor leaves (UC-38) or the Meeting ends; presence in the room is never recorded as attendance. (BR-324, BR-330)", "POST-4: Each verified Guest session has its own connection: the same Guest on two devices holds two connections, and revoking the invitation closes both. The connection row keeps the Guest session and the join and leave times; the declared name comes from the Guest session. The IP address is not kept on the connection: it is in the audit row written before the room token is issued."], "normal": [{"id": "", "title": "Join Meeting Room", "notes": [], "steps": [{"n": 1, "text": "On the Meeting detail of an In Progress Online or Hybrid Meeting, the actor chooses Join online room."}, {"n": 2, "text": "The system rechecks that the actor may still view the Meeting, that it is In Progress, that it has an online room and that the actor holds a current room-entry relationship. (BR-97, BR-101, BR-143, BR-323)"}, {"n": 3, "text": "The system opens the Meeting Lobby with the camera preview, the microphone and camera switches and the microphone, speaker and camera pickers, with the microphone on and the camera off by default. (BR-331) When recording applies to the Meeting, the lobby also tells the actor that the meeting is recorded for the minutes and that the recording is deleted automatically after the number of days the server returns; turning on the microphone then means the actor’s own speech is recorded (see UC-39a, UC-80)."}, {"n": 4, "text": "The actor checks the preview, optionally chooses other devices through UC-39d and switches the microphone or camera through UC-39a and UC-39b."}, {"n": 5, "text": "The actor chooses Join room. A Guest must first confirm the recording notice; the system records that confirmation, with the Guest session, the invitation, the declared name, the IP address of the request and the time, in the audit log before issuing the connection, and refuses the join with MSG380 when the confirmation is missing. The wording shown on screen is not stored, so the audit proves that the Guest was told, not exactly what was shown."}, {"n": 6, "text": "The system rechecks room-entry eligibility and asks the room service for a connection for that actor, carrying the actor's current Meeting Role. (BR-323, BR-329)"}, {"n": 7, "text": "The system connects the actor and shows the Online Meeting Room – Video Grid with the people already in the room. (UC-40)"}, {"n": 8, "text": "The system shows the actor in the room; no separate success message is displayed, because the Video Grid is the result."}]}], "alts": [{"id": "AF-1", "title": "Rejoin after a lost connection", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor reopens the room after the connection was lost while the Meeting is still In Progress."}, {"n": 2, "text": "The system offers Rejoin in place of Join room and, on success, the flow resumes at Step 7 of the Main Flow."}, {"n": 3, "text": "No new room and no new Meeting are created. (BR-324)"}]}, {"id": "AF-2", "title": "Join from a Guest invitation", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Guest continues from the verified invitation instead of the Meeting detail."}, {"n": 2, "text": "The system verifies the invitation and that the Meeting is In Progress, then the flow resumes at Step 3 of the Main Flow. (BR-152 – BR-157, BR-181)"}]}, {"id": "AF-3", "title": "Opened before the Meeting starts", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is Published and has not been started."}, {"n": 2, "text": "The system shows the waiting lobby with MSG117 – “The meeting room opens only while the meeting is in progress.” and no Join room button. (BR-143)"}, {"n": 3, "text": "When the Chair starts the Meeting (UC-21), the lobby opens by itself and the flow resumes at Step 3 of the Main Flow. While the Meeting is still Published, a Guest page asks the server again every 10 seconds and whenever the tab regains focus, because no real-time event announces the start to a Guest."}]}, {"id": "AF-4", "title": "The browser blocks audio playback", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the browser does not let the page play sound until the actor interacts with it."}, {"n": 2, "text": "The system displays MSG338 – “The browser is blocking audio playback.” with the button “Click to hear everyone”."}, {"n": 3, "text": "The actor clicks it, the sound plays and the flow resumes at Step 8 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "The Meeting has ended", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the Meeting has ended, including while the actor was in the lobby."}, {"n": 2, "text": "No connection is made. The system displays MSG331 – “The meeting has ended, the meeting room is closed.” and offers Back to the meeting page. (BR-143) A Guest sees the same message and, within 20 seconds, the end screen of UC-04 EX-1."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Meeting is held in person", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting mode is In Person, so it has no online room."}, {"n": 2, "text": "No lobby is opened. The system displays MSG280 – “This meeting is held in person, so it has no online meeting room.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Room service is not configured", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the system cannot issue a room connection because the room service is not configured."}, {"n": 2, "text": "No connection is made. The system displays MSG281 – “The online meeting room is not ready. Please contact the administrator.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Actor is no longer eligible", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the actor was removed from the roster or the Guest invitation was revoked. (BR-97, BR-100, BR-101)"}, {"n": 2, "text": "No connection is made and the system answers as if the Meeting did not exist, so the actor cannot tell that a room exists."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Join cannot be completed", "notes": [], "steps": [{"n": 1, "text": "At Step 7, the system cannot read or save the room state."}, {"n": 2, "text": "No connection is made. The system displays MSG118 – “Unable to join the meeting room. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "The Meeting was cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the Meeting is Cancelled. (BR-299)"}, {"n": 2, "text": "No connection is made and no Join room button is offered. The system displays MSG350 – “The meeting was cancelled, so the meeting room does not open.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "The room is full", "notes": [], "steps": [{"n": 1, "text": "At Step 7, 50 people are already connected to the room. (BR-336)"}, {"n": 2, "text": "No connection is made and the actor stays in the lobby; the actor may try again when someone leaves. No catalogue message is assigned to this case yet."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-8", "title": "The room status cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the state of the meeting room."}, {"n": 2, "text": "No lobby is opened. The system displays MSG283 – “Unable to load the meeting room status. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-9", "title": "The Guest has not confirmed the recording notice", "notes": [], "steps": [{"n": 1, "text": "At Step 5, a Guest tries to join without confirming the recording notice."}, {"n": 2, "text": "No connection is made. The system displays MSG380 – “Confirm that you have read the recording notice before joining the meeting room.”"}, {"n": 3, "text": "The flow resumes at Step 5."}]}, {"id": "EX-10", "title": "The Guest session ended while waiting or joining", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the Guest session expired or the Guest signed out on another device."}, {"n": 2, "text": "No connection is made, the Meeting data is removed from the screen and the Guest returns to the verification screen with MSG378 – “The guest session has ended.”; the invitation is still valid, so the Guest may verify again. When the invitation itself was revoked, UC-04 EX-1 applies instead and the Guest cannot return."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-97", "BR-100", "BR-101", "BR-120", "BR-143", "BR-152", "BR-157", "BR-181", "BR-299", "BR-323", "BR-324", "BR-329", "BR-330", "BR-331", "BR-336"], "msg": ["MSG117", "MSG118", "MSG280", "MSG281", "MSG283", "MSG331", "MSG338", "MSG350", "MSG378", "MSG380"], "cov": {"br": 15, "code": 3, "test": 1}}, "UC-38": {"id": "UC-38", "name": "Leave Meeting Room", "feature": "FE-08", "line": 1804, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person connected to the online meeting room to disconnect. Leaving never changes the Meeting lifecycle: the Meeting stays In Progress for everyone else, and the person may join again while it is In Progress. Only the Chair ends the Meeting, through UC-22.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of the Meeting. (UC-37)", "PRE-3: The Meeting is In Progress."], "post": ["POST-1: The actor is disconnected and no longer appears in the Participants panel. (BR-330)", "POST-2: The Meeting stays In Progress with its roster, roles, attendance and recorded ballots unchanged. (BR-324)", "POST-3: The actor may join again through UC-37 while the Meeting is In Progress."], "normal": [{"id": "", "title": "Leave Meeting Room", "notes": [], "steps": [{"n": 1, "text": "The actor chooses Leave in the call controls or the back button in the room header."}, {"n": 2, "text": "The system asks for confirmation: “Leave the meeting room – The meeting continues with the others. You can rejoin while the meeting is in progress.” with Stay and Leave."}, {"n": 3, "text": "The actor confirms Leave."}, {"n": 4, "text": "The system disconnects the actor, stops the camera and microphone and returns to the Meeting detail."}, {"n": 5, "text": "The Meeting stays In Progress for everyone still connected; no separate success message is displayed. (BR-324)"}]}], "alts": [{"id": "AF-1", "title": "Stay in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor chooses Stay."}, {"n": 2, "text": "No connection is closed and the flow resumes at Step 1 of the Main Flow."}]}, {"id": "AF-2", "title": "Leave from the floating window", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the call is in a floating window (UC-78)."}, {"n": 2, "text": "The system leaves at once without asking, because the main window is not in view, and closes the floating window. The flow resumes at Step 4 of the Main Flow. (BR-332)"}]}], "exs": [{"id": "EX-1", "title": "The Meeting ends while the actor is in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Chair ended the Meeting (UC-22) and the room service closed the room."}, {"n": 2, "text": "The actor is disconnected and cannot rejoin. The system displays MSG331 – “The meeting has ended, the meeting room is closed.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The same account joins from somewhere else", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor opens the room in another tab or on another device. (BR-328)"}, {"n": 2, "text": "The earlier connection is closed. That window displays MSG329 – “You joined this room from another tab or device, so this tab left the room.” and may rejoin, which closes the newer connection in turn."}, {"n": 3, "text": "The use case ends for the earlier connection."}]}, {"id": "EX-3", "title": "The actor is no longer on the participant list", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor was removed from the roster or the Guest invitation was revoked while connected. (BR-101)"}, {"n": 2, "text": "The actor is disconnected and cannot rejoin. The system displays MSG330 – “You are no longer on the participant list of this meeting room.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "The connection is lost", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the connection to the room service drops."}, {"n": 2, "text": "The system shows MSG333 – “Connection lost, reconnecting…” and tries to restore the connection. When it cannot, the actor is disconnected and the system displays MSG332 – “Connection to the meeting room lost.” and offers Rejoin while the Meeting is In Progress."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "This tab leaves the room without Leave", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the connection of this tab is closed without the actor choosing Leave."}, {"n": 2, "text": "The actor is disconnected. The system displays MSG328 – “You have left the meeting room.” and offers Rejoin while the Meeting is In Progress."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "The Guest session ended while in the room", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Guest session expired or the Guest signed out on another device; the room closes for that session within 30 seconds."}, {"n": 2, "text": "The actor is disconnected and the Meeting data is removed from the screen. The Guest returns to the verification screen with MSG378 – “The guest session has ended.” and may verify again while the invitation is valid. A revoked invitation goes to UC-04 EX-1 instead, and the Guest cannot return."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-101", "BR-324", "BR-328", "BR-330", "BR-332"], "msg": ["MSG328", "MSG329", "MSG330", "MSG331", "MSG332", "MSG333", "MSG378"], "cov": {"br": 5, "code": 1, "test": 0}}, "UC-39": {"id": "UC-39", "name": "Manage Meeting Room Controls", "feature": "FE-08", "line": 1815, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-39a": {"id": "UC-39a", "name": "Manage Microphone", "feature": "FE-08", "line": 1817, "extra": {}, "parent": "UC-39", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to turn his or her own microphone on or off. It changes only that person's microphone: turning another person's microphone off is UC-41. While recording applies to the Meeting, the microphone button is also the only recording switch (AF-2).", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is in the Meeting Lobby or connected to the meeting room of an In Progress Meeting. (UC-37)", "PRE-3: The browser reports at least one microphone."], "post": ["POST-1: The actor's microphone is on or off as chosen, for that actor only.", "POST-2: The browser remembers the on/off state for the next visit on that device. (BR-331)", "POST-3: No other person's audio, the Meeting lifecycle and attendance are unchanged.", "POST-4: While recording applies to the Meeting, a microphone that is on means the actor’s own speech is recorded for the minutes; turning it off stops it. The microphone button is the only switch. (AF-2, UC-80, BR-352)"], "normal": [{"id": "", "title": "Manage Microphone", "notes": [], "steps": [{"n": 1, "text": "The actor chooses the microphone button in the lobby or in the call controls, or presses Ctrl+D (Cmd+D on a Mac)."}, {"n": 2, "text": "The system turns the actor's microphone on or off and shows the new state on the button and in the actor's video tile; while it is off, everyone in the room sees the microphone marked as off. (UC-40)"}, {"n": 3, "text": "The system remembers the new state for the next visit on this device. (BR-331)"}, {"n": 4, "text": "The microphone follows the choice; no separate message is displayed, because the button and the tile carry the state."}]}], "alts": [{"id": "AF-1", "title": "Choose another microphone", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor opens the arrow beside the microphone button and chooses another microphone through UC-39d."}, {"n": 2, "text": "The system switches the live audio to that microphone, keeps the on/off state and remembers the device. (BR-331)"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "AF-2", "title": "Speech recorded while the microphone is on", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor turns the microphone on in an Online or Hybrid Meeting that is In Progress. In the online room this applies to a Guest with a verified, current invitation as well: the Guest's own microphone is recorded, and the sentence is theirs while the session lasts. A Guest's sentences reach the record only after the Guest has confirmed the recording notice. (BR-340, BR-352, BR-370)"}, {"n": 2, "text": "While the microphone is on, the system captures the actor’s speech sentence by sentence, converts each sentence into text and keeps it with its time and the actor’s name. Sentences with only silence or background noise are not kept. (BR-352)"}, {"n": 3, "text": "A sentence that repeats a neighbouring person’s speech picked up by the actor’s microphone is marked as overlapping, not hidden. (BR-356)"}, {"n": 4, "text": "A sentence that cannot be delivered right away stays on the actor’s device and is delivered later, up to 7 days after the Meeting ends. (BR-354)"}, {"n": 5, "text": "Saved sentences can be reviewed, listened to and deleted by the actor in My Recorded Speech (UC-80), and are erased automatically 180 days after they are saved. (BR-347, BR-355)"}, {"n": 6, "text": "The flow resumes at Step 3 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "The browser blocks the microphone", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser has not granted microphone permission."}, {"n": 2, "text": "The microphone stays off and the actor stays in the room and can still hear everyone. The system displays MSG334 – “The browser is blocking the microphone. Click the lock icon beside the address bar, choose Allow and reload the page. You can still join the room to listen.” (BR-331)"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}, {"id": "EX-2", "title": "No microphone is available", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the browser reports no microphone, or the chosen microphone was disconnected."}, {"n": 2, "text": "The microphone picker is disabled and says why, and the actor can still join the room to listen. The system displays MSG335 – “No {device} was found on this computer.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Another application holds the microphone", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser cannot open the microphone because another application is using it."}, {"n": 2, "text": "The microphone stays off and the actor can still hear everyone. The system displays MSG336 – “The {device} is being used by another application (Zoom, Teams…). Close that application and try again.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}, {"id": "EX-4", "title": "Speech recognition unavailable", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-2, the system cannot convert a sentence into text."}, {"n": 2, "text": "The sentence stays on the actor’s device and is sent again later; the microphone and the actor’s place in the room are not affected. The system displays MSG312 – “Speech recognition service is currently unavailable. Please try again later.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-5", "title": "The Meeting cannot be recorded now", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-2, the Meeting is held in person, has not started, or ended more than 7 days ago. (BR-340, BR-354)"}, {"n": 2, "text": "The sentence is not accepted and is not kept. The system displays MSG320 – “In-person meetings do not record per-mic speech, or the meeting is no longer running.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "Sentence audio is not valid", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-2, the audio of the sentence is not a supported audio file, or its start time or length is missing or wrong, or its length is outside 1 millisecond to 60 seconds."}, {"n": 2, "text": "The sentence is not accepted and is not kept. The system displays MSG319 – “Spoken sentence audio is invalid.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "Sentence is too long", "notes": [], "steps": [{"n": 1, "text": "At Step 2 of AF-2, the audio of the sentence is larger than 3 MB."}, {"n": 2, "text": "The sentence is not accepted and is not kept. The system displays MSG321 – “A spoken sentence cannot exceed 60 seconds.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-331", "BR-340", "BR-347", "BR-352", "BR-354", "BR-355", "BR-356", "BR-370"], "msg": ["MSG312", "MSG319", "MSG320", "MSG321", "MSG334", "MSG335", "MSG336"], "cov": {"br": 8, "code": 0, "test": 0}}, "UC-39b": {"id": "UC-39b", "name": "Manage Camera", "feature": "FE-08", "line": 1828, "extra": {}, "parent": "UC-39", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to turn his or her own camera on or off. It changes only that person's camera.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is in the Meeting Lobby or connected to the meeting room of an In Progress Meeting. (UC-37)", "PRE-3: The browser reports at least one camera."], "post": ["POST-1: The actor's camera is on or off as chosen, for that actor only; the camera is off when the actor first joins.", "POST-2: The browser remembers the on/off state for the next visit on that device. (BR-331)", "POST-3: No other person's video, the Meeting lifecycle and attendance are unchanged."], "normal": [{"id": "", "title": "Manage Camera", "notes": [], "steps": [{"n": 1, "text": "The actor chooses the camera button in the lobby or in the call controls, or presses Ctrl+E (Cmd+E on a Mac)."}, {"n": 2, "text": "The system turns the actor's camera on or off and shows the new state on the button; while it is off, everyone in the room sees the actor's initials instead of a video image. (UC-40)"}, {"n": 3, "text": "The system remembers the new state for the next visit on this device. (BR-331)"}, {"n": 4, "text": "The camera follows the choice; no separate message is displayed, because the button and the tile carry the state."}]}], "alts": [{"id": "AF-1", "title": "Choose another camera", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor opens the arrow beside the camera button and chooses another camera through UC-39d."}, {"n": 2, "text": "The system switches the live video to that camera, keeps the on/off state and remembers the device. (BR-331)"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "The browser blocks the camera", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser has not granted camera permission."}, {"n": 2, "text": "The camera stays off and the actor stays in the room with audio. The system displays MSG334 – “The browser is blocking the camera. Click the lock icon beside the address bar, choose Allow and reload the page. You can still join the room to listen.” (BR-331)"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}, {"id": "EX-2", "title": "No camera is available", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the browser reports no camera, or the chosen camera was disconnected."}, {"n": 2, "text": "The camera picker is disabled and says why, and the actor can still join the room to listen. The system displays MSG335 – “No {device} was found on this computer.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Another application holds the camera", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser cannot open the camera because another application is using it."}, {"n": 2, "text": "The camera stays off. The system displays MSG336 – “The {device} is being used by another application (Zoom, Teams…). Close that application and try again.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}], "br": ["BR-331"], "msg": ["MSG334", "MSG335", "MSG336"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-39c": {"id": "UC-39c", "name": "Manage Screen Sharing", "feature": "FE-08", "line": 1839, "extra": {}, "parent": "UC-39", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person connected to the room to present a screen, window or tab to everyone and to stop presenting. One person presents at a time: when someone else starts, the previous presentation stops. Nothing is recorded; the shared content exists only while the share lasts.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of an In Progress Meeting. (UC-37)", "PRE-3: The device can share a screen: the browser offers screen capture and the device is not touch-only."], "post": ["POST-1: The actor's screen is shown on the main stage of everyone in the room, or the presentation has stopped.", "POST-2: At most one person is presenting at any time. (BR-326)", "POST-3: Nothing is recorded or stored; the Meeting and its attendance are unchanged."], "normal": [{"id": "", "title": "Manage Screen Sharing", "notes": [], "steps": [{"n": 1, "text": "The actor chooses Share screen in the call controls."}, {"n": 2, "text": "The system asks the browser which screen, window or tab to share."}, {"n": 3, "text": "The actor picks one and confirms."}, {"n": 4, "text": "The system shows the shared content on the main stage for everyone in the room and marks the button as active; the presenter sees “You are presenting to everyone”. (BR-326)"}, {"n": 5, "text": "The actor chooses Stop sharing, or stops the share in the browser."}, {"n": 6, "text": "The system ends the presentation and returns everyone to the Video Grid; no separate message is displayed."}]}], "alts": [{"id": "AF-1", "title": "Someone else starts presenting", "notes": [], "steps": [{"n": 1, "text": "At Step 4, while the actor is presenting, another person starts a share."}, {"n": 2, "text": "The system stops the actor's presentation, keeps the new one and tells the actor. (BR-326)"}, {"n": 3, "text": "The system displays MSG340 – “{name} started presenting, so your screen share was stopped.” and the flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-2", "title": "The device cannot share a screen", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the browser offers no screen capture or the device has only a touch screen."}, {"n": 2, "text": "The system does not offer Share screen; watching another person present still works."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "Sharing cannot start", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot start the share: the browser refuses the capture or the room rejects it."}, {"n": 2, "text": "Nothing is shared and the stage stays as it was. The system displays MSG341 – “Unable to share your screen. Please try again.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}], "br": ["BR-326"], "msg": ["MSG340", "MSG341"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-39d": {"id": "UC-39d", "name": "Choose Audio and Video Devices", "feature": "FE-08", "line": 1850, "extra": {}, "parent": "UC-39", "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Allows a person in the Meeting Lobby or in the meeting room to choose which microp .", "PRE-2: The actor is connected to the meeting room of an In Progress Meeting. (UC-37)"], "post": ["POST-1: The panel lists everyone connected at that moment, ordered by Meeting Role and then by name.", "POST-2: The list follows people joining, leaving, speaking, muting and changing role while it is open. (BR-329, BR-330)", "POST-3: Presence in the list is not attendance and changes no stored data. (BR-330)"], "normal": [{"id": "", "title": "View Meeting Room Participants", "notes": [], "steps": [{"n": 1, "text": "The actor chooses Participants at the bottom right of the room."}, {"n": 2, "text": "The system opens the panel with the number of people currently connected."}, {"n": 3, "text": "The system lists each connected person with initials, name, Meeting Role, a speaking indicator while the person speaks and the microphone state; the actor's own row is marked “You”. (BR-329, BR-330)"}, {"n": 4, "text": "The system orders the rows by Meeting Role (Chair, Secretary, Member, Guest) and then by name."}, {"n": 5, "text": "The actor closes the panel with the same button and the stage returns to full width; no separate message is displayed."}]}], "alts": [{"id": "AF-1", "title": "People join or leave while the panel is open", "notes": [], "steps": [{"n": 1, "text": "At Step 3, someone joins, leaves or is disconnected."}, {"n": 2, "text": "The list and the count update at once, without a reload. (BR-330)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "AF-2", "title": "A role is handed over while the panel is open", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair hands the Chair role to another participant through UC-73."}, {"n": 2, "text": "The panel shows the new role on both rows without a reload. (BR-329)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "AF-3", "title": "The Chair mutes someone", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair mutes a person through UC-41."}, {" ": 1, "text": "The actor chooses Chat at the bottom right of the room."}, {"n": 2, "text": "The system opens the Chat panel with the notice “Messages are visible only to people in the room and are not kept after the meeting.” and the messages sent since the actor joined, in time order. (BR-327)"}, {"n": 3, "text": "The actor types a message of at most 1,000 characters in the message box; the system shows the character count."}, {"n": 4, "text": "The actor presses Enter or chooses Send."}, {"n": 5, "text": "The system rechecks that the message is not blank and sends it to everyone connected. (BR-327)"}, {"n": 6, "text": "The system shows the message for everyone with the sender (“You” for the sender) and the time, clears the message box and resets the counter. No separate success message is displayed."}]}], "alts": [{"id": "AF-1", "title": "Start a new line inside a message", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor presses Shift+Enter."}, {"n": 2, "text": "The system starts a new line in the message box and does not send."}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "AF-2", "title": "Close the Chat panel", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 6, the actor chooses Chat again."}, {"n": 2, "text": "The panel closes and the stage returns to full width; messages already sent stay in the room for the others. (BR-327)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "AF-3", "title": "Messages arrive while the panel is closed", "notes": [], "steps": [{"n": 1, "text": "At Step 1, messages arrived while the panel was closed."}, {"n": 2, "text": "The Chat button shows the number of unread messages until the actor opens the panel. (BR-327)"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "The message cannot be sent", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the message cannot be sent."}, {"n": 2, "text": "The message stays in the message box so the actor can try again. The system displays MSG343 – “Unable to send the message. Please try again.”"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "EX-2", "title": "The connection is lost", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the connection to the room service drops."}, {"n": 2, "text": "The message is not sent. The room displays MSG333 – “Connection lost, reconnecting…” and, if the connection cannot be restored, reports it through UC-38 EX-4. (BR-327)"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-327"], "msg": ["MSG333", "MSG343"], "cov": {"br": 1, "code": 0, "test": 0}}, "UC-78": {"id": "UC-78", "name": "Keep Meeting in a Floating Window", "feature": "FE-08", "line": 1894, "extra": {}, "parent": null, "actors": "Chair, Secretary, Participant, Guest", "secondary": "None", "desc": "Extends UC-37. Allows a person connected to the room to keep the call in a small always-on-top window while working in other tabs, and to bring it back to the main window. The floating window shows the same room connection; it is not a second join.", "pre": ["PRE-1: The internal user is signed in, or the Guest has verified the invited email and has a valid invitation.", "PRE-2: The actor is connected to the meeting room of an In Progress Meeting. (UC-37)", "PRE-3: The browser supports a floating document window. (BR-332)"], "post": ["POST-1: The call is shown in a floating window and the main window says the meeting is in the floating window. (BR-332)", "POST-2: The actor stays in the room with the same microphone, camera and connection. (BR-332)", "POST-3: The floating window closes when the actor leaves the room or closes it, and no second connection is created. (BR-328, BR-332)"], "normal": [{"id": "", "title": "Keep Meeting in a Floating Window", "notes": [], "steps": [{"n": 1, "text": "The actor chooses Open floating window in the call controls."}, {"n": 2, "text": "The system opens a small floating window with the current presentation or speaker, the actor's own camera and the call controls, using the existing room connection. (BR-332)"}, {"n": 3, "text": "The system replaces the stage in the main window with “The meeting is in a floating window” and Bring the meeting back to this window. (BR-332)"}, {"n": 4, "text": "The actor chooses Bring the meeting back to this window, or closes the floating window."}, {"n": 5, "text": "The system returns the call to the main window; the connection is unchanged. No separate message is displayed. (BR-332)"}]}], "alts": [{"id": "AF-1", "title": "The browser opens the floating window on its own", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor switches to another tab and the browser offers its picture-in-picture action."}, {"n": 2, "text": "The system opens the floating window and the flow resumes at Step 3 of the Main Flow. (BR-332)"}]}, {"id": "AF-2", "title": "Leave from the floating window", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the actor chooses Leave in the floating window."}, {"n": 2, "text": "The system leaves the room through UC-38 without asking for confirmation, because the main window is not in view, and closes the floating window."}, {"n": 3, "text": "The use case ends."}]}, {"id": "AF-3", "title": "The browser does not support it", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the browser has no floating document window."}, {"n": 2, "text": "The system does not offer the control and the room works as in UC-37."}, {"n": 3, "text": "The use case ends."}]}], "exs": [{"id": "EX-1", "title": "The floating window is refused", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the browser refuses to open the window, for example because it was not opened by a direct action."}, {"n": 2, "text": "The call stays in the main window and no message is displayed. (BR-332)"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-328", "BR-332"], "msg": [], "cov": {"br": 2, "code": 1, "test": 0}}, "UC-79": { eak on a person, usually the first in the queue. (BR-338)"}, {"n": 5, "text": "The system marks the request as invited and shows the person that it is his or her turn."}, {"n": 6, "text": "The person turns the microphone on (UC-39a) and chooses Start speaking; the system marks the turn as speaking and keeps its start time. (BR-339)"}, {"n": 7, "text": "The person chooses Finish speaking, or the Chair closes the turn; the system keeps the end time, lowers the hand and removes the request from the queue. The Chair may invite the next person from Step 4. (BR-338, BR-339)"}]}], "alts": [{"id": "AF-1", "title": "Lower the hand", "notes": [], "steps": [{"n": 1, "text": "At any step before Step 6, the person chooses Lower hand."}, {"n": 2, "text": "The system cancels the request, lowers the hand and removes it from the queue. (BR-337)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "AF-2", "title": "The Chair reorders the queue", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair moves a request up or down in the queue."}, {"n": 2, "text": "The system keeps the new order for everyone who sees the queue. (BR-338)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "AF-3", "title": "The Chair declines a request", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Chair removes a request without inviting the person."}, {"n": 2, "text": "The system cancels the request and lowers the hand. (BR-338)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "The Meeting is no longer In Progress", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 4, the Meeting ended."}, {"n": 2, "text": "No request is created or changed. The system displays MSG117 – “The meeting room opens only while the meeting is in progress.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The person already has an open request", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor’s earlier request is still open."}, {"n": 2, "text": "Nothing changes and the hand stays raised. (BR-337)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The person leaves the room", "notes": [], "steps": [{"n": 1, "text": "At Step 3 to Step 6, the person leaves the room or is disconnected. (UC-38)"}, {"n": 2, "text": "The system cancels the open request and the Chair’s queue moves up. (BR-337)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-4", "title": "The actor is no longer the Chair", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Chair role was handed over through UC-73."}, {"n": 2, "text": "The Chair controls disappear from the actor’s panel and nothing is changed. (BR-338)"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "The room service does not respond", "notes": [], "steps": [{"n": 1, "text": "At Step 2, Step 4 or Step 7, the room service fails or refuses the request."}, {"n": 2, "text": "The request stays as it was. The system displays MSG124 – “The meeting room server did not respond. Please try again.”"}, {"n": 3, "text": "The flow resumes at the step where the failure happened."}]}], "br": ["BR-325", "BR-330", "BR-337", "BR-338", "BR-339"], "msg": ["MSG117", "MSG124"], "cov": {"br": 5, "code": 3, "test": 3}}, "UC-43": {"id": "UC-43", "name": "View & Play Meeting Recordings", "feature": "FE-09", "line": 1918, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-43a": {"id": "UC-43a", "name": "View Meeting Recordings", "feature": "FE-09", "line": 1920, "extra": {}, "parent": "UC-43", "actors": "Chair, Secretary, Participant", "secondary": "None", "desc": "Allows a person who currently holds a Chair, Secretary or Participant assignment of a Meeting to view what was recorded in it on the Recordings tab: the sentences recorded from each person's own microphone and the recordings of the meeting room.", "pre": ["PRE-1: The actor is signed in as an internal user and may view the Meeting.", "PRE-2: The actor currently holds a Chair, Secretary or Participant assignment of the Meeting. Being the Organizer or the Approver alone is not enough. (BR-350)"], "post": ["POST-1: The actor sees the recorded sentences and the room recordings that apply to the Meeting's format. Nothing is changed.", "POST-2: A Guest, or a person who is not on the current roster, sees no recording and cannot tell that any exists. (BR-350, BR-370)", "POST-3: A sentence excluded from the record appears to everyone except the Chair and the Secretary as an empty entry, without its text. (BR-357)"], "normal": [{"id": "", "title": "View Meeting Recordings", "notes": [], "steps": [{"n": 1, "text": "On the Meeting detail, the actor selects the Recordings tab."}, {"n": 2, "text": "The system checks that the actor currently holds a Chair, Secretary or Participant assignment and loads the recorded sentences and the room recordings of the Meeting. (BR-350, BR-370)"}, {"n": 3, "text": "The system shows the recorded sentences as a timeline with the speaker, the time and the text of each sentence. A sentence that repeats a neighbour's speech picked up by another microphone is marked as overlapping. (BR-356)"}, {"n": 4, "text": "For an In-person or Hybrid Meeting, the system also shows each room recording with its state (Recording, Available or Erased), its source (room microphone or uploaded file), its length, the date it will be erased, its takes and the state of its transcript. (BR-340, BR-347)"}, {"n": 5, "text": "While a room take is being recorded, the system shows everyone on the tab a Recording indicator."}]}], "alts": [{"id": "AF-1", "title": "Online Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting is held online."}, {"n": 2, "text": "The system shows only the recorded sentences. No room recording and no audio upload is offered, because an Online Meeting records each person's own microphone. (BR-340)"}, {"n": 3, "text": "The flow resumes at Step 5 of the Main Flow."}]}, {"id": "AF-2", "title": "Sentence excluded from the record", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the Chair or the Secretary has excluded a sentence from the record."}, {"n": 2, "text": "The Chair and the Secretary see the sentence with its text and the reason. Everyone else sees an empty entry in its place: they can tell that a sentence once existed, but cannot read or play it. (BR-357)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Recordings cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the recordings."}, {"n": 2, "text": "Nothing is shown. The system displays MSG297 – “Unable to load meeting recordings.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Recorded sentences cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the recorded sentences."}, {"n": 2, "text": "The sentences are not shown. The system displays MSG299 – “Unable to load transcript.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Actor is not on the current roster", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is a Guest or no longer holds a Chair, Secretary or Participant assignment. (BR-350, BR-370)"}, {"n": 2, "text": "Nothing is shown and the system answers as if the Meeting had no recordings, so the actor cannot tell that any exist."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-340", "BR-347", "BR-350", "BR-356", "BR-357", "BR-370"], "msg": ["MSG297", "MSG299"], "cov": {"br": 6, "code": 1, "test": 0}}, "UC-43b": {"id": "UC-43b", "name": "Play Meeting Recording", "feature": "FE-09", "line": 1931, "extra": {}, "parent": "UC-43", "actors": "Chair, Secretary, Participant", "secondary": "None", "desc": "Allows a person who currently holds a Chair, Secretary or Participant assignment of a Meeting to her the Chair nor the Secretary. (BR-350, BR-357)"}, {"n": 2, "text": "Nothing plays and the system answers as if the audio did not exist."}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-350", "BR-357"], "msg": ["MSG297"], "cov": {"br": 2, "code": 1, "test": 0}}, "UC-43c": {"id": "UC-43c", "name": "Download Meeting Recording", "feature": "FE-09", "line": 1942, "extra": {}, "parent": "UC-43", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to download the audio file of a room recording to the computer.", "pre": ["PRE-1: The actor is signed in and currently holds the Chair or Secretary assignment of the Meeting. (BR-351)", "PRE-2: The Meeting is not Secret. (BR-351)", "PRE-3: The recording is Available, not Erased."], "post": ["POST-1: The audio file is saved on the actor's device.", "POST-2: The download is recorded in the audit log. (BR-351)"], "normal": [{"id": "", "title": "Download Meeting Recording", "notes": [], "steps": [{"n": 1, "text": "On the Recordings tab, the actor selects Download on an available room recording."}, {"n": 2, "text": "The system checks that the actor is the current Chair or Secretary and that the Meeting is not Secret. (BR-351)"}, {"n": 3, "text": "The system records the download in the audit log. (BR-351)"}, {"n": 4, "text": "The system delivers the audio file and the browser saves it."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Participant tries to download", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is a Participant, not the Chair or the Secretary. (BR-351)"}, {"n": 2, "text": "No file is delivered and nothing is logged. The system displays MSG355 – “Only the Chair or Secretary may download meeting recordings and transcripts.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Secret Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is Secret. (BR-351)"}, {"n": 2, "text": "No file is delivered. The system dis ke is open, opens a new take and keeps the time of the confirmation and the purpose. (BR-341, BR-342, BR-343, BR-344)"}, {"n": 5, "text": "The Secretary's browser starts the microphone and sends the sound to the system as it is recorded. No text is shown while recording."}, {"n": 6, "text": "The system shows everyone watching the Meeting the Recording indicator."}]}], "alts": [{"id": "AF-1", "title": "Reopening the Meeting while a take is open", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the Secretary closed the tab or the browser while the room microphone was on and opens the Meeting again."}, {"n": 2, "text": "The system offers Continue recording or Save recorded part."}, {"n": 3, "text": "If the Secretary chooses Continue recording, the recording carries on in the same take and the flow resumes at Step 5 of the Main Flow."}, {"n": 4, "text": "If the Secretary chooses Save recorded part, the part already recorded is saved as a take through UC-44b, which completes the take."}]}, {"id": "AF-2", "title": "Later take of the same Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting still has a room recording, so an earlier take of it already received the confirmation."}, {"n": 2, "text": "The system does not ask again and the flow resumes at Step 4 of the Main Flow. (BR-343) If that room recording was erased (UC-44e), the confirmation is asked again."}]}, {"id": "AF-3", "title": "Take reaches the size limit", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the take is close to the limit of 300 MB for one recording."}, {"n": 2, "text": "The system saves that take by itself as in UC-44b and opens a new take, so recording goes on without a break and the Secretary does not need to act. (BR-344, BR-345)"}, {"n": 3, "text": "The flow resumes at Step 5 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Invalid recording information", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the confirmation is missing or the recording information is incomplete."}, {"n": 2, "text": "No take is opened. The system displays MSG291 – “Invalid recording information.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-2", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the actor is not the current Secretary. (BR-341)"}, {"n": 2, "text": "No take is opened. The system displays MSG295 – “Only the meeting Secretary may manage recordings.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "Recording cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 4 or Step 5, the system cannot keep the recording."}, {"n": 2, "text": "The system displays MSG298 – “Unable to save recording changes. Please try again.” Sound not yet delivered stays on the Secretary's device and is sent again."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Online Meeting", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting is Online. (BR-340)"}, {"n": 2, "text": "No take is opened. The system displays MSG358 – “Online meetings record per-mic speech; room recordings are not available.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Meeting is not In Progress", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the Meeting is not In Progress. (BR-342)"}, {"n": 2, "text": "No take is opened. The system displays MSG359 – “Room microphone can only be turned on while the meeting is in progress.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "A take is already open on another device", "notes": [], "steps": [{"n": 1, "text": "At Step 4, another take of the Meeting is open on a different device or tab. (BR-344)"}, {"n": 2, "text": "No take is opened. The system displays MSG360 – “Room microphone is currently active on another device.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "Part of the recording is not valid", "notes": [], "steps": dited and the names assigned so far, without a warning. (UC-45c, BR-345, BR-360)"}, {"n": 4, "text": "The system displays MSG363 – “Room recording take saved.” and the Recording indicator disappears."}]}], "alts": [{"id": "AF-1", "title": "No sound received", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the take received no sound at all."}, {"n": 2, "text": "The system discards the take and leaves the recording unchanged. It displays MSG365 – “Microphone detected no speech; take was not saved.”"}, {"n": 3, "text": "The take is closed and the use case ends, because there is nothing to add to the recording."}]}, {"id": "AF-2", "title": "Take left open for 12 hours", "notes": [], "steps": [{"n": 1, "text": "At Step 1, an open take receives no sound for 12 hours, for instance because the Secretary left it open and went away."}, {"n": 2, "text": "The system saves the take by itself, without a message. (BR-346)"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "AF-3", "title": "Take left open on another device", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the take is still open on another computer."}, {"n": 2, "text": "The Secretary selects Save take on this device. (BR-341)"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "AF-4", "title": "Room recording is full", "notes": [], "steps": [{"n": 1, "text": "At Step 2, adding the take would make the Meeting's room recording larger than 300 MB. (BR-345)"}, {"n": 2, "text": "The system keeps the take as a new room recording instead of adding it to the existing one."}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}], "exs": [{"id": "EX-1", "title": "Take already saved", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the take was already saved by another action."}, {"n": 2, "text": "Nothing is added. The system displays MSG362 – “This recording take has been closed and cannot accept additional audio.”"}, {"n": 3, "text": "The use cas nd may enter the purpose of the recording. (BR-343)"}, {"n": 4, "text": "The Secretary selects Upload."}, {"n": 5, "text": "The system checks the Secretary's role, the format and the status of the Meeting, the type and the size of the file, keeps the file and puts it in line for transcription. (BR-340, BR-341, BR-342, BR-343)"}, {"n": 6, "text": "The system displays MSG290 – “Meeting recording saved.”"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "Invalid recording information", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the confirmation is missing or the recording information is incomplete."}, {"n": 2, "text": "No file is kept. The system displays MSG291 – “Invalid recording information.”"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "EX-2", "title": "Unsupported audio type", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the file is not one of the supported audio types."}, {"n": 2, "text": "No file is kept. The system displays MSG292 – “Unsupported audio format. Use MP3, M4A, WAV, WebM, or OGG.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-3", "title": "File is too large", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the file is larger than 300 MB."}, {"n": 2, "text": "No file is kept. The system displays MSG293 – “Recording exceeds 300 MB.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "EX-4", "title": "Meeting is not in a valid state", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the Meeting is neither In Progress nor Ended. (BR-342)"}, {"n": 2, "text": "No file is kept. The system displays MSG294 – “Recordings may only be saved while the meeting is in progress or has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "Actor is not the current Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor is not the current Secretary. (BR-341)"}, {"n": 2, "text": "No file is kept. The system dis e current Secretary of the Meeting. (BR-341)", "PRE-2: The transcript of the room recording is Completed."], "post": ["POST-1: The chosen name is shown on every passage of that speaker, or the name is cleared. (BR-367)", "POST-2: The change is recorded in the audit log.", "POST-3: A speaker whose voice matches a consenting person clearly is named by the system before the Secretary acts, and the audit log marks that name as assigned automatically (BR-366)."], "normal": [{"id": "", "title": "Assign Speaker", "notes": [], "steps": [{"n": 1, "text": "In the transcript, the Secretary sees each speaker as Speaker N or with the name assigned — including a name the system filled in automatically — and the suggestion that matches the voice best, shown even when a name is already assigned. (BR-366)"}, {"n": 2, "text": "The Secretary chooses a person from the Meeting roster or a Guest with a current invitation of the Meeting, or clears the assignment. The request names either a user or a Guest, never both; naming neither clears the assignment. (BR-368)"}, {"n": 3, "text": "The system checks that the person is on the current roster, or that the Guest has a current invitation of the Meeting. (BR-368)"}, {"n": 4, "text": "The system applies the name to every passage of that speaker and records the change in the audit log. (BR-367)"}, {"n": 5, "text": "The system displays MSG316 – “Speaker assigned.”"}]}], "alts": [{"id": "AF-1", "title": "Several voices of the same person", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the suggestions show that two or more speakers may be the same person."}, {"n": 2, "text": "When the voices match the same person clearly the system has already filled in the name; the Secretary may assign the person to the whole group of speakers in one action, or clear a name the system filled in. (BR-366, BR-367)"}, {"n": 3, "text": "The flow resumes at Step 3 of the Main Flow."}]}, {"id": "AF-2", "title": "Change the speaker of one sentence", "notes": [], ": "The voice is not in this recording", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the chosen voice does not belong to this recording."}, {"n": 2, "text": "Nothing is changed. The system answers as if the recording had no such voice, without a message."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "The request does not name exactly one target", "notes": [], "steps": [{"n": 1, "text": "In AF-2, the request does not name exactly one of a user, a Guest and a voice. (BR-368)"}, {"n": 2, "text": "The sentence keeps its voice. The system displays MSG317 – “Assigned person must be on the current meeting roster.”"}, {"n": 3, "text": "The flow resumes at Step 2 of the Main Flow."}]}], "br": ["BR-341", "BR-366", "BR-367", "BR-368", "BR-395"], "msg": ["MSG295", "MSG304", "MSG316", "MSG317", "MSG407"], "cov": {"br": 5, "code": 1, "test": 0}}, "UC-46c": {"id": "UC-46c", "name": "Exclude or Restore a Sentence", "feature": "FE-10", "line": 2082, "extra": {}, "parent": "UC-46", "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or Secretary to exclude a recorded sentence from the record, for instance because it picked up a neighbour's speech, giving a reason, or to restore a sentence that was excluded.", "pre": ["PRE-1: The actor is the current Chair or Secretary of the Meeting. (BR-357)", "PRE-2: The sentence exists on the timeline of recorded sentences."], "post": ["POST-1: An excluded sentence is marked with its reason. It is not deleted: the Chair and the Secretary can still read and play it, while everyone else sees an empty entry in its place. (BR-357)", "POST-2: Excluded sentences are left out of exported transcripts. (BR-358)"], "normal": [{"id": "", "title": "Exclude or Restore a Sentence", "notes": [], "steps": [{"n": 1, "text": "On the timeline of recorded sentences, the actor selects Exclude sentence on a sentence."}, {"n": 2, "text": "The system asks for the reason: Overlapping speech or Other."}, {"n": rrent Secretary only. Issued minutes and the revisions they superseded can also be downloaded as a Word or PDF file, except for a Secret Meeting. (BR-385, BR-386, BR-412)", "pre": ["PRE-1: The actor is signed in and may read the Meeting. (BR-412)", "PRE-2: The actor is its current Chair or current Secretary, and a revision of the minutes exists; or the actor is anyone else who may read the Meeting, and an issued revision exists. (BR-386, BR-412)"], "post": ["POST-1: The revision of the minutes the actor may read and its state are displayed.", "POST-2: No content, state or Meeting record is changed.", "POST-3: Nobody learns of a draft, a revision waiting for approval, a returned revision or a correction that is not issued yet. (BR-412)"], "normal": [{"id": "", "title": "View Meeting Minutes", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Biên bản tab of the Meeting."}, {"n": 2, "text": "The system checks the assignment, or that the actor may read the Meeting, and loads the revision the actor may read: the current Chair and Secretary get the latest revision, everyone else gets the latest issued one; the list of revisions is filtered on the server. (BR-386, BR-412)"}, {"n": 3, "text": "The system displays the minutes as the paper that will be printed — the heading, the two-column opening and signature block, sections I–III and the closing line — read from the HTML the server filtered. (BR-385)"}, {"n": 4, "text": "The system shows the revision number, the status, who created it and when, and when it was last saved. For the current Chair and Secretary it also shows who submitted, approved or returned it and when, and the reason of the latest return. (BR-407)"}, {"n": 5, "text": "When the minutes have more than one revision, the actor may open another revision from the list: the current Chair and Secretary every revision, everyone else only an issued or superseded one. (BR-409, BR-412)"}, {"n": 6, "text": "The actor may download the revision being read as a Word or PDF file when it is issued or superseded. (BR-412)"}]}], "alts": [{"id": "AF-1", "title": "No minutes yet", "notes": [], "steps": [{"n": 1, "text": "At Step 2, no revision exists that the actor may read."}, {"n": 2, "text": "The system shows an empty state; for the current Chair or Secretary it offers the control to build one (UC-59), and for everyone else the empty state reads that no minutes have been issued yet."}, {"n": 3, "text": "The use case ends successfully."}]}, {"id": "AF-2", "title": "Read an earlier revision", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the actor chooses an earlier revision from the list."}, {"n": 2, "text": "The system loads the chosen revision and shows it with its own revision number and status; a revision replaced by a correction is shown as superseded and stays readable. (BR-409)"}, {"n": 3, "text": "The flow resumes at Step 4 of the Main Flow."}]}, {"id": "AF-3", "title": "Download an issued revision as a reader", "notes": [], "steps": [{"n": 1, "text": "At Step 6, the actor is neither the current Chair nor the current Secretary, and the revision is issued or superseded."}, {"n": 2, "text": "The system checks that the actor may read the Meeting, that the actor is not a Guest and that the Meeting is not Secret, builds the Word or PDF file from the same content and delivers it. (BR-390, BR-412)"}, {"n": 3, "text": "The revision is unchanged. The use case ends successfully."}]}], "exs": [{"id": "EX-1", "title": "The minutes cannot be loaded", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the revision."}, {"n": 2, "text": "Nothing is shown. The system displays MSG403 – “Unable to load the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The revision is not readable by the actor", "notes": [], "steps": [{"n": 1, "text": "At Step 2 or Step 5, the actor is neither the current Chair nor the current Secretary and asks for a draft, a revision waiting for approval, a returned revision or a correction that is not issued yet. (BR-412)"}, {"n": 2, "text": "The system answers as if the revision did not exist and discloses nothing about it, with no message code."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The Meeting is not accessible", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is unavailable or the actor may no longer read it."}, {"n": 2, "text": "The system answers as if the Meeting did not exist and discloses nothing about its minutes."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "The minutes are Secret", "notes": [], "steps": [{"n": 1, "text": "At Step 6 or AF-3 Step 2, the Meeting is Secret. (BR-390)"}, {"n": 2, "text": "No file is delivered; the minutes are read on the screen only. The system displays MSG405 – “The minutes of a Secret meeting cannot be downloaded.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-385", "BR-386", "BR-390", "BR-407", "BR-409", "BR-412"], "msg": ["MSG403", "MSG405"], "cov": {"br": 6, "code": 4, "test": 3}}, "UC-59": {"id": "UC-59", "name": "Generate Meeting Minutes", "feature": "FE-12", "line": 2342, "extra": {}, "parent": null, "actors": "Chair, Secretary", "secondary": "None", "desc": "Allows the current Chair or the current Secretary to build the draft of the minutes from the one fixed template and the Meeting's records, using the meeting's current AI draft, reviewed or not, for sections I–III when there is one. (BR-383, BR-384)", "pre": ["PRE-1: The actor is signed in and is the current Chair or the current Secretary of the Meeting. (BR-386)", "PRE-2: The Meeting is InProgress or Ended. (BR-387)", "PRE-3: No minutes exist yet, or the latest revision is a draft or was returned by the Chair. (BR-388, BR-407)"], "post": ["POST-1: A draft of the minutes exists, filled from the Meeting's records. (BR-384)", "POST-2: Building again replaces the whole content of the draft, including every correction. (BR-388)", "POST-3: No other Meeting record is changed."], "normal": [{"id": "", "title": "Generate Meeting Minutes", "notes": [], "steps": [{"n": 1, "text": "On the Biên bản tab, the actor selects “Tạo bản nháp” [Create draft] when no draft exists, or “Tạo lại” [Rebuild] with confirmation when a draft or a returned revision already exists."}, {"n": 2, "text": "The system checks the assignment, the Meeting status and that the latest revision is a draft or was returned. (BR-387, BR-407)"}, {"n": 3, "text": "The system fills the fixed template: the title, the start and end time, the place, the attendance, the Chair, the Secretary, the agenda and each item's recorded conclusion, the result and conclusion of each closed vote, and the closing line. (BR-384)"}, {"n": 4, "text": "The system fills sections I–III from the meeting's current AI draft when there is one; without a draft it lists the agenda in section II and holds the conclusions the Chair recorded and the vote results in section III, with “……” where the Secretary must write. (BR-382)"}, {"n": 5, "text": "The system saves the draft with its revision number and displays MSG395 – “Minutes draft created.”"}]}], "alts": [{"id": "AF-1", "title": "Build for the first time", "notes": [], "steps": [{"n": 1, "text": "At Step 1, no minutes exist yet."}, {"n": 2, "text": "The flow resumes at Step 2 of the Main Flow."}]}, {"id": "AF-2", "title": "Build again over an existing draft", "notes": [], "steps": [{"n": 1, "text": "At Step 1, a draft exists."}, {"n": 2, "text": "The system warns that every correction will be replaced and asks for confirmation. (BR-388)"}, {"n": 3, "text": "The actor confirms and the flow resumes at Step 2 of the Main Flow."}]}, {"id": "AF-3", "title": "No AI draft", "notes": [], "steps": [{"n": 1, "text": "At Step 4, no AI draft exists, or the AI has not finished writing it."}, {"n": 2, "text": "The system leaves “……” in the places the Secretary must write and continues at Step 5. (BR-382)"}]}, {"id": "AF-4", "title": "AI draft not yet reviewed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the meeting's AI draft exists but has not been reviewed."}, {"n": 2, "text": "The system fills sections I–III with the draft as it is and marks the minutes as built from an unreviewed draft; the minutes card offers the way to the “Dự thảo nội dung” card in the Biên bản tab to review it. (BR-382)"}, {"n": 3, "text": "The flow resumes at Step 5 of the Main Flow."}]}, {"id": "AF-5", "title": "AI draft changed after the minutes were built", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the AI draft has been created again or corrected since the minutes were built, or the minutes were built before any AI draft existed and a draft has appeared since."}, {"n": 2, "text": "The minutes card shows that the draft is out of date and offers Rebuild; rebuilding asks for confirmation as in AF-2. (BR-382, BR-388)"}, {"n": 3, "text": "The use case ends successfully."}]}], "exs": [{"id": "EX-1", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is neither the current Chair nor the current Secretary. (BR-386)"}, {"n": 2, "text": "No draft is built. The system displays MSG397 – “Only the Chair or Secretary may write the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "The Meeting has not started or was cancelled", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the Meeting is not InProgress or Ended. (BR-387)"}, {"n": 2, "text": "No draft is built. The system displays MSG398 – “The minutes can be written only while the meeting is in progress or after it has ended.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "A draft already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a draft exists and the actor did not ask to replace it. (BR-388)"}, {"n": 2, "text": "Nothing is built and the existing draft stays as it is. The system displays MSG399 – “This meeting already onger be changed", "notes": [], "steps": [{"n": 1, "text": "At Step 4, the revision is waiting for approval or has been issued. (BR-388)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG400 – “The minutes have been submitted or issued and can no longer be changed.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-4", "title": "Actor is not the current Chair or Secretary", "notes": [], "steps": [{"n": 1, "text": "Before Step 2, the actor is neither the current Chair nor the current Secretary. (BR-386)"}, {"n": 2, "text": "Nothing is shown or saved; a draft is answered as if it did not exist. For an issued minutes the system displays MSG397 – “Only the Chair or Secretary may write the minutes.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "The change cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 5, the system cannot save the change."}, {"n": 2, "text": "The text stays as it was. The system displays MSG404 – “Unable to save the minutes. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "The Meeting is Secret", "notes": [], "steps": [{"n": 1, "text": "In AF-1 or AF-2, the Meeting is Secret. (BR-390)"}, {"n": 2, "text": "No file is delivered; the minutes are read on the screen only. The system displays MSG405 – “The minutes of a Secret meeting cannot be downloaded.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-7", "title": "The Meeting is not accessible", "notes": [], "steps": [{"n": 1, "text": "Before Step 2, the Meeting is unavailable or the actor may no longer read it."}, {"n": 2, "text": "The system answers as if the Meeting did not exist and discloses nothing about its minutes."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-8", "title": "The download format is not supported", "notes": [], "steps": [{"n": 1, "text": "In AF-1 or AF-2, the requested format is neither docx nor pdf."}, {"n": 2, "text": "No file is delivered. The system displays MSG406 – “Download the minutes as a Word (docx) or PDF file only.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-385", "BR-386", "BR-388", "BR-389", "BR-390", "BR-391", "BR-394", "BR-407", "BR-412"], "msg": ["MSG396", "MSG397", "MSG400", "MSG401", "MSG402", "MSG404", "MSG405", "MSG406"], "cov": {"br": 9, "code": 5, "test": 4}}, "UC-61": {"id": "UC-61", "name": "Submit Meeting Minutes for Approval", "feature": "FE-12", "line": 2364, "extra": {}, "parent": null, "actors": "Secretary", "secondary": "Chair (notified)", "desc": "Allows the current Secretary to send the finished minutes to the current Chair for approval. From then on nobody can correct or rebuild the revision until the Chair approves or returns it. (BR-404, BR-405)", "pre": ["PRE-1: The actor is signed in and is the current Secretary of the Meeting. (BR-404)", "PRE-2: The Meeting has Ended. (BR-405)", "PRE-3: The latest revision of the minutes is a draft or was returned by the Chair. (BR-407)"], "post": ["POST-1: The revision is waiting for approval, with who submitted it and when.", "POST-2: The revision can no longer be corrected or rebuilt. (BR-388)", "POST-3: The current Chair is notified. (BR-411)", "POST-4: The Meeting status is unchanged. (BR-408)", "POST-5: The state change and the notification are saved together; when the save fails nothing changes and nobody is notified. (BR-411)"], "normal": [{"id": "", "title": "Submit Meeting Minutes for Approval", "notes": [], "steps": [{"n": 1, "text": "On the Biên bản tab, the actor selects “Gửi duyệt” [Submit for approval] and confirms."}, {"n": 2, "text": "The system checks the assignment, that the Meeting has Ended, that the latest revision is a draft or was returned, and that it is the copy the actor read. (BR-404, BR-405, BR-407, BR-389)"}, {"n": 3, "text": "The system marks the revision as waiting for approval, records who submitted it and when, and creates the notification for the current Chair in the same save. (BR-388, BR-411)"}, {"n": 4, "t
