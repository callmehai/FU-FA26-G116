 owner’s calendar to the actor is Pending (Chờ đồng ý) or Effective (Đang hiệu lực). (BR-423)"], "post": ["POST-1: A Pending share exists and the owner is notified. (BR-423, BR-426)", "POST-2: No meeting content of the owner is disclosed either way. (BR-427)", "POST-3: Shares of other people stay invisible: asking about them discloses nothing about the other share or account."], "normal": [{"id": "", "title": "Request Calendar Share", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Chia sẻ lịch page (or starts from someone shown “Chưa được chia sẻ lịch” on the UC-85a page) and chooses the owner (the list excludes the actor), a level (Mốc 1 or Mốc 2) and a date range."}, {"n": 2, "text": "The system checks that the actor is still a Meeting Organizer (else EX-1), that the owner is an active internal account different from the actor (else EX-4), that no Pending or Effective share of the owner’s calendar to the actor exists (else EX-2) and that the range is valid (else EX-3). (BR-414, BR-423, BR-430, BR-431)"}, {"n": 3, "text": "The system saves the Pending share, audits and notifies the owner. MSG435 – “Calendar share request sent.” The use case ends; the answer is UC-84c."}]}], "alts": [], "exs": [{"id": "EX-1", "title": "The actor has no right to create meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer a Meeting Organizer. (BR-430)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG448 – “Only a Meeting Organizer can do this.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "A share already exists", "notes": [], "steps": [{"n": 1, "text": "At Step 2, a Pending or Effective share of the owner’s calendar to the actor already exists. (BR-423)"}, {"n": 2, "text": "Nothing is saved. The system displays MSG449 – “There is already a pending or effective share with this person.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The range is invalid", "notes": [], "steps": [{" se case ends."}]}, {"id": "EX-4", "title": "The share cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot save the share."}, {"n": 2, "text": "Everything stays as it was and nobody is notified. The system displays MSG447 – “Unable to save the calendar sharing data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "The acting account is not active at loading", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the owner’s account is no longer an active internal account."}, {"n": 2, "text": "The system refuses the request, shows nothing and discloses nothing about the account."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-6", "title": "The candidate list cannot be read", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the system cannot read the list of people to choose from."}, {"n": 2, "text": "Nothing is shown. The system displays MSG467 – “Unable to load the candidate list.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-414", "BR-423", "BR-426", "BR-427", "BR-430", "BR-431"], "msg": ["MSG441", "MSG443", "MSG447", "MSG449", "MSG455", "MSG467"], "cov": {"br": 6, "code": 6, "test": 5}}, "UC-84c": {"id": "UC-84c", "name": "Respond to Calendar Share", "feature": "FE-16", "line": 2522, "extra": {}, "parent": "UC-84", "actors": "User — the asked side (the calendar owner, for a UC-84a request or a UC-84d change; the receiving Meeting Organizer, for a UC-84b direct share)", "secondary": "The sender (receives a notification about the answer)", "desc": "Allows the asked person to accept or decline a calendar share request, a direct share or a pending change. Accepting a UC-84a request may lower the level or shorten the range. A Pending request whose sender’s account is deactivated can only be declined (BR-424). (BR-414, BR-423, BR-426)", "pre": ["PRE-1: The actor is the asked side of a Pending (Chờ đồng ý) share or pending change.", "PRE-2: The share or change is still Pending. (BR-423)"], "post": ["POST-1: The share is Effective (Đang hiệu lực) with the chosen level/range, or closed, or kept as it was for a declined change; the sender is notified in every case. (BR-426)", "POST-2: No meeting content of the owner is disclosed either way. (BR-427)", "POST-3: Shares of other people stay invisible: asking about them discloses nothing about the other share or account."], "normal": [{"id": "", "title": "Respond to Calendar Share", "notes": [], "steps": [{"n": 1, "text": "The actor opens the notification (or the Chia sẻ lịch page) and sees the Pending request: who sent it, the level and the date range."}, {"n": 2, "text": "The system checks that the actor is the asked side (else EX-1), that the share is still Pending (else EX-2). An Effective share whose viewer lost the Meeting Organizer right was stopped at that moment; a Pending one is kept and can only be declined (BR-424). (BR-423)"}, {"n": 3, "text": "On accept the system marks the share Effective — for a UC-84a request the owner may choose a lower level or a shorter range (BR-414, BR-431) — audits and notifies the sender. MSG436 – “Calendar share accepted.”"}, {"n": 4, "text": "On decline the system closes the share, audits and notifies the sender. MSG437 – “Calendar share request declined.”"}]}], "alts": [{"id": "AF-1", "title": "Answer a pending change (UC-84d)", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the pending item is a change (raise to Mốc 2 or extend the range) instead of a new share."}, {"n": 2, "text": "On approval the system applies the new level/range, audits and notifies the viewer. MSG442 – “Calendar share updated.”"}, {"n": 3, "text": "On decline everything stays as it was, both sides are notified. MSG452 – “Calendar share change declined.”"}]}], "exs": [{"id": "EX-1", "title": "The actor is not the asked side", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is not the asked side of this share."}, {"n": 2, "text": "Nothing changes and nothing about the share or account is disclosed."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Nothing to answer", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the share or change is no longer Pending, or its end date has passed (BR-425). (BR-423)"}, {"n": 2, "text": "Nothing changes. The system displays MSG450 – “This action is not allowed in the current state of the share.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The range is invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the owner shortens the range to an invalid range. (BR-431)"}, {"n": 2, "text": "Nothing changes. The system displays MSG443 – “The date range is invalid.”"}, {"n": 3, "text": "The flow resumes at Step 3."}]}, {"id": "EX-4", "title": "The answer cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 3 or AF-1 Step 2, the system cannot save the share."}, {"n": 2, "text": "Everything stays as it was and nobody is notified. The system displays MSG447 – “Unable to save the calendar sharing data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-5", "title": "The sender’s account is deactivated", "notes": [], "steps": [{"n": 1, "text": "At Step 3, on accept, the sender of the request or direct share is no longer an active account. (BR-424)"}, {"n": 2, "text": "Nothing changes; the share stays Pending and the asked person can still decline at Step 4. The system displays MSG468 – “The sender's account has been deactivated. You cannot accept this share.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-414", "BR-423", "BR-424", "BR-425", "BR-426", "BR-427", "BR-431"], "msg": ["MSG436", "MSG437", "MSG442", "MSG443", "MSG447", "MSG450", "MSG452", "MSG468"], "cov": {"br": 7, "code": 7, "test": 6}}, "UC-84d": {"id": "UC-84d", "name": "Change Calendar Share", "feature": "FE-16", "line": 2533, "extra": {}, "parent": "UC-84", "actors": "Meeting Organizer (the viewer) and User — the calendar owner (depending on who acts)", "secondary": "The other side of the share (receives a notification; answers a pending change in UC-84c)", "desc": "Allows the viewer to ask for a higher level or a longer range (answered in UC-84c); the owner lowers the level or changes the dates at once. A stopped share shows its state and reveals no hours; a share past its end date is no longer listed (BR-425). (BR-423, BR-424, BR-425, BR-426)", "pre": ["PRE-1: Both sides are signed in as the two people of the share when they act. (BR-430)", "PRE-2: The share is Effective (Đang hiệu lực); a Pending (Chờ đồng ý) share is withdrawn in UC-84e and asked for again instead. (BR-423)"], "post": ["POST-1: The share holds a pending change, or the new level/range; the other side is notified in both cases. (BR-426)", "POST-2: Shares of other people stay invisible: asking about them discloses nothing about the other share or account."], "normal": [{"id": "", "title": "Change Calendar Share", "notes": [], "steps": [{"n": 1, "text": "The viewer opens their share and asks for Mốc 2 (raise) or a longer range (extend); only one pending change at a time."}, {"n": 2, "text": "The system saves the pending change, audits and notifies the owner. MSG454 – “Calendar share change request sent.” The use case ends; the owner’s answer is UC-84c."}]}], "alts": [{"id": "AF-1", "title": "The owner lowers the level or changes the dates", "notes": [], "steps": [{"n": 1, "text": "At any time on an Effective share, the owner chooses a lower level or a new date range, even while the viewer has a change pending; that change stays pending and the owner still answers it in UC-84c."}, {"n": 2, "text": "The system applies it at once, audits and notifies the viewer. MSG442 – “Calendar share updated.”"}]}], "exs": [{"id": "EX-1", "title": "The actor is not one of the two people", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor is not one of the two people of this share."}, {"n": 2, "text": "Nothing changes and nothing about  of the share when they act. (BR-430)", "PRE-2: Withdrawing needs a Pending (Chờ đồng ý) share or change; ending needs an Effective (Đang hiệu lực) share. (BR-423)"], "post": ["POST-1: The request is closed (a withdrawn new share leaves nothing; a withdrawn change leaves the share as it was), or the share is ended; the other side is notified in every case. (BR-426)", "POST-2: A stopped share reveals no busy hours and never comes back; viewing again needs a new share. (BR-424, BR-425)", "POST-3: Shares of other people stay invisible: asking about them discloses nothing about the other share or account."], "normal": [{"id": "", "title": "Withdraw Calendar Share", "notes": [], "steps": [{"n": 1, "text": "The side that sent the request or the change withdraws it."}, {"n": 2, "text": "The system closes the request (a withdrawn new share leaves nothing; a withdrawn change leaves the share as it was), audits and notifies the other side. MSG438 – “Calendar share request withdrawn.”"}]}], "alts": [{"id": "AF-1", "title": "Either side ends an Effective share (“Ngừng chia sẻ” / “Thôi xem lịch”)", "notes": [], "steps": [{"n": 1, "text": "Either side ends the share."}, {"n": 2, "text": "The system closes it, audits and notifies the other side. Hours already found are not removed from anyone’s screen, but no new lookup uses this share. MSG451 – “Calendar sharing ended.”"}]}], "exs": [{"id": "EX-1", "title": "The actor is not one of the two people", "notes": [], "steps": [{"n": 1, "text": "At Step 1, the actor is not one of the two people of this share."}, {"n": 2, "text": "Nothing changes and nothing about the share or account is disclosed."}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-2", "title": "Nothing to withdraw or end", "notes": [], "steps": [{"n": 1, "text": "At Step 1 (or AF-1 Step 1), there is nothing Pending to withdraw, or the share is not Effective to end, or its end date has passed (BR-425). (BR-423)"}, {"n": 2, "text": "Nothing changes. The system displays MSG450 – “This action is not allowed in the current state of the share.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The withdrawal or ending cannot be saved", "notes": [], "steps": [{"n": 1, "text": "At Step 2 (or AF-1 Step 2), the system cannot save the change."}, {"n": 2, "text": "Everything stays as it was and nobody is notified. The system displays MSG447 – “Unable to save the calendar sharing data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-423", "BR-424", "BR-425", "BR-426", "BR-430"], "msg": ["MSG438", "MSG447", "MSG450", "MSG451"], "cov": {"br": 5, "code": 5, "test": 4}}, "UC-84f": {"id": "UC-84f", "name": "View Calendar Shares", "feature": "FE-16", "line": 2555, "extra": {}, "parent": "UC-84", "actors": "User — the calendar owner and, when holding the Meeting Organizer right, the viewer", "secondary": "The other side of each share", "desc": "Allows a signed-in user to see the calendar shares they take part in: who can see their calendar (“Người xem được lịch của tôi”) and, for a Meeting Organizer, who shared with them (“Lịch được chia sẻ với tôi”). Each share shows its state and only the actions the user can take now; the actions themselves are UC-84a to UC-84e. (BR-423, BR-424, BR-425, BR-430)", "pre": ["PRE-1: The actor is signed in with an active internal account. (BR-430)"], "post": ["POST-1: The actor sees only shares where they are one of the two people; nothing about other people’s shares is disclosed. (BR-423)", "POST-2: A stopped (Đã dừng) share stays listed and reveals no hours; a share past its end date is not listed. (BR-424, BR-425)"], "normal": [{"id": "", "title": "View Calendar Shares", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Chia sẻ lịch page."}, {"n": 2, "text": "The system checks that the actor is an active internal account, loads the shares where the actor is the owner and, if the actor holds the Meeting Organizer right, the shares where the actor is the viewer; it leaves out every share whose end date is before today. (BR-423, BR-425, BR-430)"}, {"n": 3, "text": "The system shows the two lists, newest first, open shares (Pending / Effective) before closed ones (Declined / Withdrawn / Ended). Each row shows the other person, the level, the date range, the state (Chờ đồng ý / Đang hiệu lực / Đã dừng / Từ chối / Đã rút / Đã kết thúc), any pending change and only the buttons the actor may use now. A Pending request whose sender is deactivated shows “Tài khoản người gửi đã bị vô hiệu hoá, chỉ từ chối được.” Opening a stopped share shows MSG439. (BR-424)"}]}], "alts": [{"id": "AF-1", "title": "Nobody has shared yet", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor has no share in either list."}, {"n": 2, "text": "The system shows empty lists pointing to UC-84a (ask) and UC-84b (share). The flow ends successfully."}]}, {"id": "AF-2", "title": "The actor is not a Meeting Organizer", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor does not hold the Meeting Organizer right."}, {"n": 2, "text": "The system loads only the owner list; the “Lịch được chia sẻ với tôi” list is empty and asking for a share is not offered. The actor can still answer, change or end the shares of their own calendar and share directly. (BR-430; PO 10/11/2026)"}]}], "exs": [{"id": "EX-1", "title": "The shares cannot be read", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the system cannot read the shares."}, {"n": 2, "text": "Nothing is shown. The system displays MSG453 – “Unable to load the calendar sharing data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-423", "BR-424", "BR-425", "BR-430"], "msg": ["MSG439", "MSG453"], "cov": {"br": 4, "code": 4, "test": 4}}, "UC-85": {"id": "UC-85", "name": "Find Meeting Time", "feature": "FE-16", "line": 2566, "extra": {}, "parent": null, "br": [], "msg": [], "cov": {"br": 0, "code": 0, "test": 0}}, "UC-85a": {"id": "UC-85a", "name": "Find Meeting Time Slots", "feature": "FE-16", "line": 2568, "extra": {}, "parent": "UC-85", "actors": "Meeting Organizer (will become the Secretary of the meeting created in UC-85b)", "secondary": "User — the invitees (each shown in their own busy/free colour; a person without a share shows “Chưa được chia sẻ lịch”)", "desc": "Allows a Meeting Organizer to find slots where everyone invited is free, using only shared calendars. From anyone shown “Chưa được chia sẻ lịch”, the finder may start UC-84a. (BR-414–BR-422, BR-427, BR-428)", "pre": ["PRE-1: The actor is signed in as a Meeting Organizer. (BR-430)"], "post": ["POST-1: The actor sees common slots by day, or — when none fits everyone — the slots with the most people free and who is busy. Attendee names come from the actor’s own invite list; no meeting titles, locations, attendee lists or sensitivity levels are shown. (BR-416, BR-427)", "POST-2: Days outside a share and people who never shared show “unknown” / “Chưa được chia sẻ lịch”, never free. (BR-415, BR-416)"], "normal": [{"id": "", "title": "Find Meeting Time Slots", "notes": [], "steps": [{"n": 1, "text": "The actor opens the Tìm giờ họp page (tab Tìm khung giờ) and enters: invitees (at most 10 people besides the actor; “Tính cả tôi” also counts the actor’s own calendar), duration, date range, weekdays, working hours, lunch break, “Cách cuộc họp khác” (buffer) and “Làm tròn giờ bắt đầu” (step); defaults follow BR-421/BR-422. The page always shows one fixed sentence: only shared calendars are counted and invitees may still be busy. (BR-428)"}, {"n": 2, "text": "The system checks the parameters (BR-421, BR-422)."}, {"n": 3, "text": "The system loads the Effective shares of each invitee’s calendar to the actor (BR-423) and those invitees’ meetings; it keeps only meetings at shared levels, counts the actor’s own meetings only when “Tính cả tôi” is ticked (then at every level), marks busy with the buffer on both sides of every busy period and then rounds start times up to the step, skips past start times and treats out-of-range days as unknown. (BR-414–BR-420, BR-422)"}, {"n": 4, "text": "The system lists the common slots by day."}]}], "alts": [{"id": "AF-1", "title": "No slot fits everyone", "notes": [], "steps": [{"n": 1, "text": "At Step 4, no slot fits all invitees."}, {"n": 2, "text": "The system shows the slots with the most people free, with who is busy, per day. MSG445 – “No time slot fits everyone. Showing the slots with the most people free.”"}]}], "exs": [{"id": "EX-1", "title": "Search parameters are invalid", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the parameters break BR-421/BR-422 (too many people, bad duration, range over 31 days, bad hours/buffer/step)."}, {"n": 2, "text": "Nothing is searched. The system displays MSG444 – “The meeting-time search is invalid. Check the highlighted fields.”"}, {"n": 3, "text": "The flow resumes at Step 1 of the Main Flow."}]}, {"id": "EX-2", "title": "The actor has no right to create meetings", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the actor is no longer a Meeting Organizer."}, {"n": 2, "text": "Nothing is searched. The system displays MSG448 – “Only a Meeting Organizer can do this.”"}, {"n": 3, "text": "The use case ends."}]}, {"id": "EX-3", "title": "The search cannot be read", "notes": [], "steps": [{"n": 1, "text": "At Step 3, the system cannot read the shares or the meetings."}, {"n": 2, "text": "Nothing is shown. The system displays MSG453 – “Unable to load the calendar sharing data. Please try again.”"}, {"n": 3, "text": "The use case ends."}]}], "br": ["BR-414", "BR-415", "BR-416", "BR-420", "BR-421", "BR-422", "BR-423", "BR-427", "BR-428", "BR-430"], "msg": ["MSG444", "MSG445", "MSG448", "MSG453"], "cov": {"br": 10, "code": 6, "test": 6}}, "UC-85b": {"id": "UC-85b", "name": "Create Draft Meeting from Slot", "feature": "FE-16", "line": 2579, "extra": {}, "parent": "UC-85", "actors": "Meeting Organizer (the finder in UC-85a, will become the Secretary of the created meeting)", "secondary": "User — the invitees in the chosen slot", "desc": "Extends UC-85a. Allows a Meeting Organizer to create a Draft meeting from a slot found in UC-85a, reusing the UC-14 creation flow. A slot that overlaps an undisclosed Secret meeting still allows a draft; the recheck before saving uses the same shared data. (BR-428, BR-429)", "pre": ["PRE-1: The actor is signed in as a Meeting Organizer. (BR-430)", "PRE-2: The actor has just found the slot in UC-85a."], "post": ["POST-1: A chosen slot creates a Draft meeting through UC-14 (MSG29) with the first listed person as Chair, the rest as Member and the actor as Secretary; it follows the normal approval flow. (BR-429)", "POST-2: No signal — no distinct error, warning, notification or audit — differs only because a Secret meeting overlaps. (BR-428)"], "normal": [{"id": "", "title": "Create Draft Meeting from Slot", "notes": [], "steps": [{"n": 1, "text": "The actor chooses a slot; the system opens the meeting dialog prefilled with the slot and the invitees."}, {"n": 2, "text": "The actor confirms; the system rechecks the slot against the same shared data as the UC-85a search — never against undisclosed meetings. (BR-428)"}, {"n": 3, "text": "The system creates the meeting in Draft through Steps 5–6 of the UC-14 Main Flow (UC-14 AF-1); a value Step 5 rejects, such as a start time that has passed since the search, follows UC-14 EX-1: the first listed invitee becomes Chair, the rest become Member, the actor becomes Secretary. MSG29 – “Meeting created successfully.” The meeting follows the normal approval flow. (BR-429)"}]}], "alts": [], "exs": [{"id": "EX-1", "title": "The slot is no longer free", "notes": [], "steps": [{"n": 1, "text": "At Step 2, the slot no longer fits the shared data (someone’s shared calendar changed)."}, {"n": 2, "text": "No meeting is created. The system displays MSG446 – “This time slot is no longer free. Please choose another slot.” The message is the same whether or no  "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-07"]}, "BR-02": {"text": "Authentication failure messages must not reveal whether a specific username or email exists in the system.", "applies": ["UC-01"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01"]}, "BR-03": {"text": "A deactivated user account must not be allowed to sign in or access authenticated system functions.", "applies": ["UC-01", "UC-02", "UC-06c", "UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02", "UC-06c", "UC-07"]}, "BR-04": {"text": "A user without active system access or the required active role/permission must not be allowed to access the system.", "applies": ["UC-01", "UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02"]}, "BR-05": {"text": "Identity information returned by Google must be successfully verified before it can be used for authentication.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-06": {"text": "A Google-authenticated email may be used to sign in only when it is linked to an existing internal user account.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-07": {"text": "Signing in with Google must not automatically create a new internal user account.", "applies": ["UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-02"]}, "BR-08": {"text": "User permissions are determined by the system and must not be selected manually during the sign-in process.", "applies": ["UC-01", "UC-02"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-01", "UC-02"]}, "BR-09": {"text": "After a successful sign-out, the current authentication state must no longer grant access to protected system functions. The user must authenticate again before protected functions can be accessed.", "applies": ["UC-03"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-03"]}, "BR-10": {"text": "Sensitive authentication information, including passwords, password hashes, reset credentials, and authentication tokens, must not be displayed in User Management.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-11": {"text": "List views must support pagination when the number of records exceeds the configured page size.", "applies": ["UC-05", "UC-13", "UC-17", "UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-05", "UC-13", "UC-17", "UC-66"]}, "BR-12": {"text": "When a search or filter returns no matching records, the system must display an appropriate no-results message instead of treating the result as a system error.", "applies": ["UC-05", "UC-13", "UC-17"], "rationale": "", "enforced": "", "code": ["frontend/src/features/audit/AuditLogPage.tsx:248"], "test": [], "ucs": ["UC-05", "UC-13", "UC-17"]}, "BR-13": {"text": "Username and email must each be unique across user accounts.", "applies": ["UC-06a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a"]}, "BR-14": {"text": "All mandatory user-account information must be provided and valid before an account can be created or updated.", "applies": ["UC-06a", "UC-06b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a", "UC-06b"]}, "BR-15": {"text": "A newly created user account must have Active status by default.", "applies": ["UC-06a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a"]}, "BR-16": {"text": "Successful administrative changes to user accounts or role-permission configuration must be recorded in the audit log.", "applies": ["UC-06a", "UC-06b", "UC-06c", "UC-07", "UC-11", "UC-12a", "UC-12b", "UC-12c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06a", "UC-06b", "UC-06c", "UC-07", "UC-11", "UC-12a", "UC-12b", "UC-12c"]}, "BR-17": {"text": "General user-account updates may modify Full Name, Job Title, and Contact Information. Email, System Role, and password credentials must be managed separately.", "applies": ["UC-06b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06b"]}, "BR-18": {"text": "When a user account is deactivated, all active authenticated sessions for that account must be terminated.", "applies": ["UC-06c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06c"]}, "BR-19": {"text": "Deactivating a user account must not delete historical records associated with that user.", "applies": ["UC-06c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-06c"]}, "BR-20": {"text": "A password-reset link must have a limited validity period and must not be reusable after a successful password reset.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-21": {"text": "An administrator must not be able to view a user's existing password.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-22": {"text": "Password reset may only be initiated for an account that is eligible to use password-based authentication.", "applies": ["UC-07"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-07"]}, "BR-23": {"text": "A role-permission configuration may contain only permissions defined by the system and must satisfy the system's permission-configuration rules before it can be applied.", "applies": ["UC-11"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-11"]}, "BR-24": {"text": "All required meeting information must be provided before a meeting can be created. Planned End Time must be after Planned Start Time.", "applies": ["UC-14"], "rationale": "", "enforced": "", "code": ["frontend/src/features/meetings/MeetingForm.tsx:186"], "test": [], "ucs": ["UC-14", "UC-15"]}, "BR-25": {"text": "Planned Start Time and Planned End Time are required meeting-level schedule fields; each Meeting represents one sitting.", "applies": ["UC-14", "UC-15", "UC-16", "UC-17", "UC-18", "UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-14", "UC-15", "UC-16", "UC-17", "UC-18", "UC-20"]}, "BR-26": {"text": "A newly created meeting must have Draft status.", "applies": ["UC-14"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-14"]}, "BR-27": {"text": "Meeting information may be edited in Draft or Rejected; in Published, the Meeting Organizer may reschedule only times or location.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:26"], "test": [], "ucs": ["UC-15"]}, "BR-28": {"text": "Updating meeting information must not implicitly change the meeting lifecycle status.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15"]}, "BR-29": {"text": "A user may access a meeting only when the user has an authorized relationship with that meeting as its Meeting Organizer, assigned Meeting Approver, Chair, Secretary, or Participant. Authentication alone does not grant access to a meeting.", "applies": ["UC-16", "UC-17", "UC-26", "UC-27", "UC-30", "UC-32a", "UC-37", "UC-68"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:63", "frontend/src/features/calendar/CalendarFilter.tsx:26", "frontend/src/features/calendar/useSchedule.ts:23"], "test": [], "ucs": ["UC-16", "UC-17", "UC-26", "UC-27", "UC-30", "UC-32a", "UC-37", "UC-52a", "UC-52b", "UC-68"]}, "BR-30": {"text": "The Meeting list offers fixed time choices. Today and This week match a Meeting whose own planned start/end interval overlaps that day or week in the viewer's time zone. Not yet held matches a Meeting whose planned start time is later than the current time; Already held matches a Meeting whose planned start time is the current time or earlier, so a Meeting in progress counts as Already held.", "applies": ["UC-17"], "rationale": "SCRUM-18 (PR #111) — fixed time choices", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingRepository.cs:32", "frontend/src/types/meeting.ts:172", "frontend/src/features/calendar/useSchedule.ts:22"], "test": ["tests/TrustCabinet.Web.Tests/Meetings/MeetingRepositoryTests.cs:1625"], "ucs": ["UC-17"]}, "BR-31": {"text": "When multiple search or filter criteria are applied, a record must satisfy all applicable criteria to appear in the result.", "applies": ["UC-05", "UC-13", "UC-17"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Audit/AuditLogQueryService.cs:52"], "test": [], "ucs": ["UC-05", "UC-13", "UC-17"]}, "BR-32": {"text": "The meeting list must support sorting, and the current search, filter, and sorting criteria must be preserved when navigating between pages.", "applies": ["UC-17"], "rationale": "", "enforced": "", "code": ["frontend/src/features/meetings/listParams.ts:16"], "test": [], "ucs": ["UC-17"]}, "BR-33": {"text": "Meeting approval submission requires all mandatory information including the planned schedule and Draft or Rejected status.", "applies": ["UC-18"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-18"]}, "BR-34": {"text": "Submitting a Draft or Rejected Meeting for approval changes its status to WaitingApproval. General Meeting information cannot be edited until an approval decision is made. This restriction does not apply to Agenda Management: the assigned Secretary may create, update, delete and reorder Agenda Items under BR-65, BR-68 and BR-74.", "applies": ["UC-15", "UC-18", "UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-18", "UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-35": {"text": "For each approval cycle, an eligible Meeting Approver must be assigned. If no eligible approver is available, submission cannot proceed: the Meeting remains Draft or Rejected, its existing assignment and history are unchanged, and no submission notification is issued. Only the currently assigned Meeting Approver with the required permission may approve or reject the Meeting.", "applies": ["UC-18", "UC-19"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-18", "UC-19"]}, "BR-36": {"text": "Approving a meeting changes its status from WaitingApproval to Approved. Rejecting a meeting changes its status from WaitingApproval to Rejected. A rejection reason is mandatory.", "applies": ["UC-19"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-19"]}, "BR-37": {"text": "Only an authorized Meeting Organizer may publish a meeting that is in Approved status and satisfies the publication readiness requirements. Publishing changes the meeting status from Approved to Published and initiates participant invitations.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-38": {"text": "Every meeting lifecycle transition must have a history record containing at least the acting user, timestamp, action and resulting status; a rejection also includes its reason. For submission, approval, rejection and publication, the corresponding assignment, decision, status and history must be completed together. If any part cannot be completed, all previous Meeting information and history remain unchanged, no new notification or invitation is issued, and the action is not reported as successful. Existing history must never be changed or removed.", "applies": ["UC-18", "UC-19", "UC-20", "UC-21", "UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-18", "UC-19", "UC-20", "UC-21", "UC-22", "UC-75"]}, "BR-39": {"text": "After successful publication, current internal participants other than the user who published the Meeting must be notified in the application, and all current internal participants must be sent invitation emails. Each external Guest with a current invitation must receive a separate email invitation to verify their invited email address and access only that Meeting. Invitation delivery must not delay confirmation of publication.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-40": {"text": "If an invitation notification or email cannot be delivered, the system must retry delivery. The Meeting remains Published; delivery failure does not undo successful publication.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-41": {"text": "Meeting publication scope is strictly limited to meetings in Approved status and cannot be bypassed by direct state manipulation.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-42": {"text": "All participant invitation notifications must include a direct link to the published meeting details and attached materials.", "applies": ["UC-20", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a"]}, "BR-43": {"text": "System logging must track the queuing and delivery status of all asynchronous invitation messages for auditability.", "applies": ["UC-20", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a"]}, "BR-44": {"text": "Re-publishing or updating invitation delivery for an already published meeting requires explicit organizer action and creates a distinct lifecycle record.", "applies": ["UC-15", "UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-15", "UC-20"]}, "BR-45": {"text": "The system creates an in-app notification for the intended recipient when they are invited to a meeting, when a meeting they are involved in is approaching its start time.", "applies": ["UC-20", "UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-66"]}, "BR-46": {"text": "Notifications are saved for later viewing. If the recipient is connected, a new notification and the unread count are updated in real time without a page reload.", "applies": ["UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-47": {"text": "A user may retrieve, open, or change the read status of only notifications belonging to that user's account.", "applies": ["UC-67a", "UC-67b", "UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-67a", "UC-67b", "UC-68"]}, "BR-48": {"text": "The notification bell shows how many of the current user's notifications are unread.", "applies": ["UC-66", "UC-67b", "UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66", "UC-67b", "UC-68"]}, "BR-49": {"text": "Opening the notification list does not mark any notification as read.", "applies": ["UC-66"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-66"]}, "BR-50": {"text": "Marking an already-read notification as read leaves its status unchanged and does not reduce the unread count again.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-68"]}, "BR-51": {"text": "Mark All as Read applies to all notifications belonging to the current recipient that are unread when the request is processed, including notifications not displayed on the current page.", "applies": ["UC-67b"], "rationale": "", "enforced": "", "code": ["frontend/src/features/notifications/NotificationsProvider.tsx:126"], "test": [], "ucs": ["UC-67b"]}, "BR-52": {"text": "A meeting notification links to its corresponding target. Opening the link must check the recipient’s current access permission and must not reveal protected content when access is denied.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-68"]}, "BR-53": {"text": "Selecting a notification to open its target attempts to mark the notification as read. Failure to save the read status does not block opening an authorized target.", "applies": ["UC-68"], "rationale": "", "enforced": "", "code": ["frontend/src/features/notifications/NotificationsProvider.tsx:136"], "test": [], "ucs": ["UC-68"]}, "BR-62": {"text": "A Meeting Planned End Time must be later than Planned Start Time.", "applies": ["UC-14", "UC-15", "UC-18"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:43", "frontend/src/features/meetings/MeetingForm.tsx:177", "frontend/src/features/meetings/MeetingForm.tsx:186"], "test": [], "ucs": ["UC-14", "UC-15", "UC-18"]}, "BR-64": {"text": "Each Agenda Item belongs directly to one Meeting. Reordering is within that Meeting.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26", "UC-77"]}, "BR-65": {"text": "Only the active assigned Secretary may create, update, delete or reorder Agenda Items while the Meeting is Draft, WaitingApproval, Rejected, Approved, Published or InProgress. Chair-only execution actions remain governed by BR-69.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Agenda/AgendaRules.cs:21"], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-66": {"text": "An Agenda Item requires a Title. Presenter and Description are optional; attached documents must belong to the Meeting.", "applies": ["UC-23a", "UC-23b"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b"]}, "BR-67": {"text": "A new Agenda Item is always Pending and is appended after the last existing position, including while the Meeting is InProgress. Existing Item positions are not changed.", "applies": ["UC-23a"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a"]}, "BR-68": {"text": "The Title, Presenter and Description of an Agenda Item may be edited in any execution status while Agenda Management is permitted. Editing does not change its execution status, actual times, position or the Meeting lifecycle.", "applies": ["UC-23b"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-23b"]}, "BR-69": {"text": "Only the current Chair may set or complete the current Agenda Item while Meeting is InProgress.", "applies": ["UC-24", "UC-25"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Agenda/AgendaService.cs:132"], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-70": {"text": "Any Pending Agenda Item may be started, whatever its position. Starting it changes Pending to InProgress; completing the current Item changes InProgress to Done. The Item status must be checked again when the change is saved.", "applies": ["UC-24", "UC-25"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order)", "enforced": "", "code": [], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-71": {"text": "At most one Agenda Item of a Meeting may be InProgress at a time. Concurrent requests must not start two Items; an unsuccessful request leaves the Agenda unchanged.", "applies": ["UC-24"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-24"]}, "BR-72": {"text": "Starting and completing an Agenda Item record its actual start and end times. The Chair may complete the current Item at any time. Completion does not automatically start another Item or end the Meeting. An Item must be started before it can be completed, and only an Item that has not been started can be deleted; a started or Done Item cannot be deleted.", "applies": ["UC-24", "UC-25"], "rationale": "PO 16/10/2026 — simplified Agenda (no planned time, no start order); PO 25/10/2026", "enforced": "", "code": [], "test": [], "ucs": ["UC-24", "UC-25"]}, "BR-73": {"text": "After an Agenda change is successfully saved, the complete Agenda is automatically refreshed for authorized users currently viewing the same Meeting. This applies to creation, editing, deletion, reordering, setting the current Item, completing an Item and completing the current Item when the Meeting ends. Refreshing must respect current Meeting access; an unsuccessful change must not be shown as a successful update.", "applies": ["UC-22", "UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-22", "UC-23a", "UC-23b", "UC-23c", "UC-23d", "UC-24", "UC-25", "UC-26", "UC-77"]}, "BR-74": {"text": "Agenda Management is permitted in Draft, WaitingApproval, Rejected, Approved, Published or InProgress, including while approval is pending and while the Meeting is running. It is locked in Ended and subsequent lifecycle states. The server rechecks status and Secretary assignment when saving.", "applies": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-23a", "UC-23b", "UC-23c", "UC-23d"]}, "BR-75": {"text": "Rescheduling a Published Meeting requires a planned start time later than the current time.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:32", "frontend/src/features/meetings/MeetingForm.tsx:186"], "test": [], "ucs": ["UC-15"]}, "BR-76": {"text": "Rescheduling a Published Meeting must notify all current invitees: internal invitees in the application, except whoever rescheduled (BR-322), and each invited Guest by email. Delivery failures do not undo the change.", "applies": ["UC-15"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingRepository.cs:153", "backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:263"], "test": [], "ucs": ["UC-15"]}, "BR-78": {"text": "Retired on 04/11/2026 (PO 20/10/2026): additional Meeting permissions per participant were removed. This rule must not be reused.", "applies": ["UC-28a"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-79": {"text": "Current assigned Secretaries and the current Chair manage the Meeting roster while its status permits. The Meeting Organizer has no separate roster-management authority. WaitingApproval remains read-only.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-80": {"text": "Participant management is allowed only while the Meeting is Draft, Rejected, Approved, Published, or InProgress.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-81": {"text": "An internal participant must reference an active internal user account.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-82": {"text": "An internal user may appear at most once as a current participant in the same Meeting.", "applies": ["UC-27", "UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a"]}, "BR-83": {"text": "Internal users are selected individually, and one or more users may be added in one submission. Organisational-unit invitations are not supported. (BR-168)", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-84": {"text": "External Guests are represented by meeting-specific Guest invitations rather than internal Meeting Participant records.", "applies": ["UC-27", "UC-28a", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28c"]}, "BR-85": {"text": "Each current internal participant has exactly one Meeting Role: Chair, Secretary, or Member.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-86": {"text": "A participant's Meeting Role is independent of the user's system Role.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-87": {"text": "An external Guest cannot satisfy a required Chair or Secretary role.", "applies": ["UC-20", "UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-21"]}, "BR-88": {"text": "A newly added internal participant or external Guest invitation starts with Pending Invitation Response and no response time.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-90": {"text": "When an internal participant is added to a Published or InProgress Meeting, the participant is notified through the applicable invitation channels.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-91": {"text": "When an external Guest is invited to a Published or InProgress Meeting, the invitation is delivered by email.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-92": {"text": "Changing a Meeting role in a Published or InProgress Meeting notifies every affected participant. Replacing the Chair notifies both people (the previous and the new Chair), except that the person making the change is not notified in the application (BR-322); for example, a Chair reassigning their own role notifies only the new assignee. Notification failure does not cancel saved changes. (BR-94, BR-169)", "applies": ["UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-93": {"text": "Removing an internal participant or revoking a Guest invitation from a Published or InProgress Meeting notifies the affected invitee through the applicable channel.", "applies": ["UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-94": {"text": "Failure to deliver a participant or Guest notification does not undo an otherwise successful roster change.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-95": {"text": "A participant-removal or Guest-revocation notification must not contain a protected meeting-access link.", "applies": ["UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c"]}, "BR-96": {"text": "Changing a Meeting role does not change the participant’s invitation response or attendance.", "applies": ["UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-29"]}, "BR-97": {"text": "Removing a current internal participant ends the access granted through that assignment. Independent valid access relationships remain effective.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37"]}, "BR-100": {"text": "Revoking an external Guest invitation revokes access granted by that Guest relationship.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37"]}, "BR-101": {"text": "After a roster or Guest-access relationship changes, room-entry eligibility must be re-evaluated; a connected user is disconnected only when no valid room-entry relationship remains.", "applies": ["UC-28c", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28c", "UC-37", "UC-38"]}, "BR-102": {"text": "Removing or revoking a roster entry after publication preserves its Invitation Response and Attendance evidence as historical data.", "applies": ["UC-27", "UC-28c", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28c", "UC-30"]}, "BR-103": {"text": "Historical or revoked roster records are excluded from the current roster, current access checks, and required-role counts.", "applies": ["UC-27", "UC-28c", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28c", "UC-30"]}, "BR-104": {"text": "Only the owner of a current invitation may respond to that invitation.", "applies": ["UC-29"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-105": {"text": "Current internal participants and external Guests may respond only Accepted or Declined. The Chair does not respond because the Chair runs the Meeting. Responding does not transfer or change any Meeting Role.", "applies": ["UC-29"], "rationale": "PO 21/10/2026 — Chair does not respond", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-106": {"text": "Each invitation is answered once while the Meeting is Published or InProgress. After an Accepted or Declined response is recorded it cannot be changed; submitting the same response again is not an error and changes nothing.", "applies": ["UC-29"], "rationale": "PO 21/10/2026 — answer once", "enforced": "", "code": [], "test": [], "ucs": ["UC-29"]}, "BR-115": {"text": "The Invitation Response and its response time are recorded once for each current invitation; an invitation that is not answered stays Pending. The Chair's response is not displayed, even when the Chair answered earlier as another role; changing a member's role does not reset the response.", "applies": ["UC-29", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-30"]}, "BR-116": {"text": "Invitation Response and Attendance are independent; Accepted does not mean the invitee attended the Meeting.", "applies": ["UC-29", "UC-30", "UC-31"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-30", "UC-31"]}, "BR-117": {"text": "Roster and invitation-response information is accessible only to users whose relationship with the Meeting permits that information.", "applies": ["UC-16", "UC-27", "UC-29", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-27", "UC-29", "UC-30"]}, "BR-118": {"text": "An active assigned Secretary may read the Meeting before publication; WaitingApproval is read-only for roster management.", "applies": ["UC-16", "UC-17", "UC-27", "UC-28a", "UC-28b", "UC-28c"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-17", "UC-27", "UC-28a", "UC-28b", "UC-28c"]}, "BR-119": {"text": "A Chair or Member assignment alone does not grant meeting-read access before the Meeting is Published.", "applies": ["UC-16", "UC-17"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-16", "UC-17"]}, "BR-120": {"text": "An external Guest receives access only to the Meeting to which that Guest was invited.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-29", "UC-37"]}, "BR-121": {"text": "A user who is not authorized to access a Meeting must not receive its roster or invitation-response information.", "applies": ["UC-27", "UC-30"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-30"]}, "BR-122": {"text": "Draft, Rejected and Approved Meetings may temporarily have no current Secretary. Published and InProgress Meetings must retain at least one current Secretary, or replace the last Secretary together with the same successful roster change. WaitingApproval roster changes remain prohibited; publication and start still require active Secretary assignments under BR-125 and BR-127.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-123": {"text": "A Meeting may have at most one current Chair at a time.", "applies": ["UC-28a", "UC-28b"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-124": {"text": "Publishing a Meeting requires exactly one current Chair whose internal account is active.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-125": {"text": "Publishing a Meeting requires at least one current Secretary whose internal account is active.", "applies": ["UC-20"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20"]}, "BR-126": {"text": "A Published or InProgress Meeting must retain its current Chair. From publication onward, the Chair role changes only when the current Chair hands it over through UC-73; the Secretary and the Meeting Organizer cannot replace the Chair, except that the Secretary may replace the Chair when the Chair's account is locked. (BR-169, BR-295)", "applies": ["UC-28b", "UC-28c", "UC-73"], "rationale": "PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair; PO 23/10/2026 — Secretary replaces the Chair only when the Chair's account is locked", "enforced": "", "code": [], "test": [], "ucs": ["UC-28b", "UC-28c", "UC-73"]}, "BR-127": {"text": "Starting a Meeting requires exactly one current Chair and at least one current Secretary whose internal accounts are active.", "applies": ["UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-129": {"text": "Invitation responses do not change readiness requirements for the assigned active Chair and Secretary when publishing or starting a Meeting.", "applies": ["UC-20", "UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-21"]}, "BR-130": {"text": "Only an active current Chair assigned to the Meeting may explicitly start or end that Meeting.", "applies": ["UC-21", "UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21", "UC-22"]}, "BR-131": {"text": "A Meeting may be started only while it is Published.", "applies": ["UC-21"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-132": {"text": "A Meeting may be ended only while it is InProgress.", "applies": ["UC-22"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-22"]}, "BR-143": {"text": "When a Meeting becomes Ended, its Online Meeting Room stops accepting joins and disconnects currently connected users.", "applies": ["UC-22", "UC-37"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/Calls/CallRoomService.cs:231"], "test": [], "ucs": ["UC-22", "UC-37"]}, "BR-148": {"text": "An external Guest is invited using a name and email without an internal account. After email verification, the Guest provides a self-declared display name and optional job title for this Meeting. The invited name remains invitation evidence; only control of the email is verified. (BR-180)", "applies": ["UC-27", "UC-28a", "UC-29"], "rationale": "PO 13/10/2026", "enforced": "", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-29"]}, "BR-149": {"text": "Within one Meeting, a Guest email may have at most one current Guest invitation.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-150": {"text": "A Guest cannot hold an internal Meeting Role, including Chair or Secretary.", "applies": ["UC-28a", "UC-37"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-37"]}, "BR-151": {"text": "A Guest invitation must not be created when the same email is already represented by a current internal participant of that Meeting.", "applies": ["UC-28a"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-152": {"text": "External Guest access requires a secure, meeting-specific invitation.", "applies": ["UC-20", "UC-28a", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-20", "UC-28a", "UC-29", "UC-37"]}, "BR-153": {"text": "An external Guest must verify control of the invited email before Guest access is established. The one-time code is sent only to the invited email, is valid for 15 minutes and is locked after 5 incorrect entries; a newer code replaces the previous one.", "applies": ["UC-04", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/GuestVerificationChallenge.cs:6"], "test": [], "ucs": ["UC-04", "UC-20", "UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-154": {"text": "External Guest access is limited to the invited Meeting.", "applies": ["UC-29", "UC-37"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Domain/Entities/GuestSession.cs:6"], "test": [], "ucs": ["UC-29", "UC-37"]}, "BR-155": {"text": "External Guest access lasts 12 hours from email verification and is not extended. It ends earlier when the Guest signs out, the invitation is revoked, or the Meeting ends.", "applies": ["UC-04", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": ["backend/TrustCabinet.Infrastructure/GuestAccess/GuestAccessOptions.cs:24"], "test": [], "ucs": ["UC-04", "UC-28c", "UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-156": {"text": "External Guest access does not require an internal account login.", "applies": ["UC-28a", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": ["frontend/src/components/NotFound.tsx:12", "frontend/src/features/guest/GuestMeetingPage.tsx:40", "frontend/src/features/guest/GuestPage.tsx:37"], "test": [], "ucs": ["UC-20", "UC-28a", "UC-29", "UC-37"]}, "BR-157": {"text": "Revoking an external Guest invitation immediately invalidates access granted by that invitation.", "applies": ["UC-28c", "UC-29", "UC-37"], "rationale": "", "enforced": "", "code": [], "test": [], "ucs": ["UC-28a", "UC-28c", "UC-29", "UC-32a", "UC-32c", "UC-35", "UC-37"]}, "BR-158": {"text": "Only the Meeting Organizer may reschedule a Published Meeting; only planned times or location may change.", "applies": ["UC-15"], "rationale": "PO 09/10/2026", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingService.cs:262", "backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:26", "frontend/src/types/meeting.ts:49", "frontend/src/features/meetings/MeetingForm.tsx:268"], "test": [], "ucs": ["UC-15"]}, "BR-159": {"text": "Ending a Meeting neither requires nor automatically closes its Votes and preserves previously recorded ballots.", "applies": ["UC-22"], "rationale": "PO 13/10/2026 — follow-up", "enforced": "Meeting / Voting Management", "code": [], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:456"], "ucs": ["UC-22", "UC-56"]}, "BR-160": {"text": "Only the current Chair may open a Draft Vote, and only while its Meeting is InProgress.", "applies": ["UC-54"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": ["backend/TrustCabinet.Infrastructure/Meetings/MeetingLifecycleService.cs:75", "backend/TrustCabinet.Infrastructure/Votes/VoteMeetingEnd.cs:12"], "test": ["tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:60"], "ucs": ["UC-53", "UC-54"]}, "BR-161": {"text": "The current Chair may record Passed, NotPassed or Deferred, with an optional note, for a Closed and tallied Vote while its Meeting is InProgress or Ended.", "applies": ["UC-52b", "UC-57"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-57"]}, "BR-162": {"text": "When a new Meeting is created, Planned Start Time must be later than the current time.", "applies": ["UC-14"], "rationale": "PO Q7 / BF-02", "enforced": "Meeting / Voting / Minutes services", "code": ["backend/TrustCabinet.Domain/Meetings/MeetingRules.cs:31", "frontend/src/features/meetings/MeetingForm.tsx:186"], "test": ["tests/TrustCabinet.Web.Tests/Meetings/MeetingEndpointsTests.cs:126"], "ucs": ["UC-14"]}, "BR-163": {"text": "Online/Hybrid Meetings use the internal TrustCabinet Online Meeting Room. Online Link is managed by the system as part of Online Meeting Room functionality and may be empty until generated. Users cannot enter or modify it during Meeting creation, editing or rescheduling. Link generation is outside Create Meeting and Update Meeting.", "applies": ["UC-14", "UC-15"], "rationale": "PO Q4 / BF-02", "enforced": "Meeting / Voting / Minutes services", "code": ["backend/TrustCabinet.Domain/Entities/Meeting.cs:37", "frontend/src/types/meeting.ts:96"], "test": [], "ucs": ["UC-14", "UC-15"]}, "BR-164": {"text": "Starting a Meeting creates an in-app notification for its currently invited internal participants; notification failure does not roll back the successful Meeting start. The Chair who pressed Start is not notified in the application (BR-322).", "applies": ["UC-21"], "rationale": "PO Q11 / BF-03", "enforced": "Meeting / Voting / Minutes services", "code": [], "test": [], "ucs": ["UC-21"]}, "BR-165": {"text": "A ballot may be cast only while the Meeting is InProgress, the Vote is Open and the voter retains current Meeting access.", "applies": ["UC-55"], "rationale": "PO 14/10/2026 — FE-11 specification / ADR-0019", "enforced": "Meeting / Voting Management", "code": [], "test": [], "ucs": ["UC-52b", "UC-55", "UC-56"]}, "BR-166": {"text": "When designated minutes signers request revision or minutes content changes after signing begins, previous signatures on the earlier content version are invalidated and the revised version requires a new signing cycle. Only the assigned Secretary may finalize and seal the completed minutes after all designated signers sign.", "applies": ["UC-60", "UC-61", "UC-62", "UC-64", "UC-65"], "rationale": "PO / BF-04", "enforced": "Meeting / Voting / Minutes services", "code": [], "test": [], "ucs": ["UC-60", "UC-61", "UC-62", "UC-64", "UC-65"]}, "BR-167": {"text": "User account list sorting must use an allowed sort field/order, and current search/filter/sort criteria are preserved across pages.", "applies": ["UC-05"], "rationale": "UC-05 user-list acceptance criteria", "enforced": "User Management", "code": [], "test": [], "ucs": ["UC-05"]}, "BR-168": {"text": "A submission adding multiple internal Meeting Participants must be saved as one indivisible roster change. If any selected account or assigned Meeting Role is invalid, no account in the submitted batch may be added. Invitation dispatch occurs only after a successful roster save; delivery errors follow BR-94.", "applies": ["UC-28a"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a"]}, "BR-169": {"text": "Replacing or handing over the Chair changes the outgoing Chair to Member and the incoming current internal participant to Chair together. The final list must retain the required Secretary and Chair. If either change fails, both people keep their previous roles.", "applies": ["UC-28b", "UC-73"], "rationale": "FE-06 revision, 12/10/2026; PO 16/10/2026 — Chair hands over the Chair role; Secretary does not replace the Chair", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28b", "UC-73"]}, "BR-170": {"text": "Only an active current assigned Secretary may save or revise official attendance while the Meeting is InProgress. For each current internal participant or current Guest, the only official saved attendance values are Present or Absent.", "applies": ["UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-171": {"text": "A person whose attendance has not been recorded remains unmarked. An unmarked person must not be counted as Absent. Only Present and Absent may be saved as official attendance.", "applies": ["UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-172": {"text": "Attendance may be saved or revised for one or more selected current internal participants or Guests without covering the full roster. Every submitted entry must identify a current person and contain Present or Absent; omitted entries retain their saved or unmarked value. All submitted changes succeed together or none are saved, with the responsible Secretary and save time. Revalidate submitted entries and current authority/status when saving; unrelated roster additions do not require attendance for those people. Each person’s attendance has its own version, which changes only when that attendance changes, not when the person’s role or invitation response changes; a submission carrying an out-of-date version is rejected as a whole, nothing is saved, and the Secretary reloads and selects again — unsaved selections are not kept. Attendance completeness never prevents End Meeting.", "applies": ["UC-31"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-31"]}, "BR-173": {"text": "Each current internal participant has exactly one Meeting role: Chair, Secretary or Member. Each role provides predefined permissions for that Meeting. Meeting roles are independent of the person’s system role.", "applies": ["UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30"]}, "BR-174": {"text": "Retired on 04/11/2026 (PO 20/10/2026): additional Meeting permissions per participant were removed. This rule must not be reused.", "applies": ["UC-27", "UC-28a", "UC-28b", "UC-30"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-28a", "UC-28b", "UC-30"]}, "BR-175": {"text": "Retired on 04/11/2026 (PO 20/10/2026): additional Meeting permissions per participant were removed. This rule must not be reused.", "applies": ["UC-28a", "UC-28b"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b"]}, "BR-176": {"text": "Anyone who can currently view the Meeting may view its participant list and invitation responses. A Guest viewer sees names and roles but not other people's emails, only their own.", "applies": ["UC-27", "UC-30"], "rationale": "PO 13/10/2026; PO 01/11/2026 - a Guest viewer does not see other people's emails (SCRUM-116)", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-27", "UC-30"]}, "BR-177": {"text": "Retired on 04/11/2026 (PO 20/10/2026): additional Meeting permissions per participant were removed. This rule must not be reused.", "applies": ["UC-28a", "UC-28b", "UC-28c"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28a", "UC-28b", "UC-28c"]}, "BR-178": {"text": "Official attendance must be recordable and retrievable for both current internal Meeting Participant records and current external Guest invitations. An attendance record includes the saved status, the responsible Secretary and the save time; historical evidence is retained when a published Meeting's participant or Guest is removed/revoked.", "applies": ["UC-28c", "UC-31"], "rationale": "FE-06 revision, 12/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-28c", "UC-31"]}, "BR-179": {"text": "Retired on 13/10/2026 by PO decision. Attendance completeness is not a prerequisite for ending a Meeting. This ID must not be reused.", "applies": ["UC-22", "UC-31"], "rationale": "PO 13/10/2026", "enforced": "Meeting Participant Management", "code": [], "test": [], "ucs": ["UC-22", "UC-31"]}, "BR-180": {"text": "After verifying the invited email, a Guest provides a display name (required, up to 200 characters) and a job title (optional, up to 200 characters) for presentation in the Meeting; neither may contain control characters, and the Guest cannot enter the Meeting without a display name. These are self-declared information; only control of the invited email is verified. The display name and job title are declared once per invitation and apply to every session of that invitation; afterwards they cannot be changed, and submitting the same values again still succeeds. The display information does not change the invitation identity or the invited email.", "applies": ["UC-04", "UC-27", "UC-37", "UC-40"], "rationale": "PO 13/10/2026; PO 01/11/2026 - the display name and job title are locked after the first entry (SCRUM-116)", "enforced": "Guest participation / Meeting Participant Management", "code": ["backend/TrustCabinet.Infrastructure/GuestAccess/GuestAccessService.cs:208", "backend/TrustCabinet.Domain/Entities/MeetingGuestInvitation.cs:25", "frontend/src/features/guest/GuestProfileForm.tsx:13"], "test": [], "ucs": ["UC-04", "UC-27", "UC-28a", "UC-37", "UC-40"]}, "BR-181": {"text": "A Guest has the same participation rights as a Participant within the invited Meeting, but only while the Meeting is Published or InProgress. When the Meeting ends, the Guest loses all access to it.", "applies": ["UC-04", "UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30", "UC-31", "UC-32a", "UC-32c", "UC-35", "UC-37", "UC-42", "UC-52a", "UC-52b", "UC-55"], "rationale": "PO 14/10/2026 — atomic rule review; PO 30/10/2026 - a Guest loses all access when the Meeting ends (SCRUM-116)", "enforced": "Guest participation / Meeting Participant Management", "code": ["backend/TrustCabinet.Web/Endpoints/DocumentCommentEndpoints.cs:7", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:17", "backend/TrustCabinet.Infrastructure/Documents/DocumentCommentService.cs:78", "backend/TrustCabinet.Infrastructure/Votes/VoteService.cs:44", "backend/TrustCabinet.Domain/Documents/DocumentCommentContracts.cs:23", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:111", "frontend/src/features/documents/DocumentViewerPage.tsx:40"], "test": ["tests/TrustCabinet.Web.Tests/GuestAccess/GuestDocumentAccessTests.cs:348", "tests/TrustCabinet.Web.Tests/Votes/VoteEndpointTests.cs:343"], "ucs": ["UC-04", "UC-26", "UC-27", "UC-28a", "UC-28b", "UC-29", "UC-30", "UC-31", "UC-32a", "UC-32c", "UC-35", "UC-37", "UC-42", "UC-52a", "UC-52b", "UC-55", "UC-74"]}, "BR-182": {"text": "Inviting a Guest into a Secret Meeting displays a clear inline warning that the Guest will receive Member participation and Meeting-document access. Invitation creation uses the ordinary invite flow; no extra confirmation or separate sensitivity approval flow is required. Record the inviting Secretary, Meeting sensitivity and invitation time for accountability.", "applies": ["UC-28a"], "rationale": "PO 13/10/2026", "enforced": "Guest participation / Meeting Participant Management", "code": ["frontend/src/features/participants/ParticipantDialogs.tsx:218"], "test": [], "ucs": ["UC-28a"]}, "BR-183": {"text": "An uploaded file's content cannot be changed.", "applies": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-34", "UC-36", "UC-71"], "rationale": "PO 14/10/2026 — atomic rule review", "enforced": "Document Management", "code": ["backend/TrustCabinet.Web/Endpoints/MeetingDocumentEndpoints.cs:176", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:102", "frontend/src/features/documents/DocumentViewerPage.tsx:34"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentEndpointsTests.cs:57", "tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:325"], "ucs": ["UC-32a", "UC-32c", "UC-33a", "UC-33c", "UC-34", "UC-36", "UC-71", "UC-71b"]}, "BR-184": {"text": "Only the current Chair or Secretary may add or remove Meeting documents or their Agenda Item links.", "applies": ["UC-33a", "UC-33b", "UC-33c", "UC-33d"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", 2c", "UC-33a", "UC-36"]}, "BR-219": {"text": "A personal-library folder belongs to one user.", "applies": ["UC-34", "UC-72"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-34", "UC-72", "UC-72a", "UC-72b", "UC-72c", "UC-72d"]}, "BR-220": {"text": "A folder name must not be empty.", "applies": ["UC-72a", "UC-72b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:357"], "test": [], "ucs": ["UC-72a", "UC-72b"]}, "BR-221": {"text": "Folder names need not be unique.", "applies": ["UC-72a", "UC-72b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:126", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:357", "frontend/src/api/library.ts:68"], "test": ["tests/TrustCabinet.Web.Tests/Documents/PersonalLibraryEndpointsTests.cs:143"], "ucs": ["UC-72a", "UC-72b"]}, "BR-222": {"text": "A folder cannot be moved into itself or one of its descendants.", "applies": ["UC-72c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:154", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:17", "frontend/src/features/documents/LibraryDialogs.tsx:122", "frontend/src/features/documents/libraryTree.ts:24"], "test": [], "ucs": ["UC-72c"]}, "BR-223": {"text": "Only an empty folder can be deleted.", "applies": ["UC-72d"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:171", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:19"], "test": [], "ucs": ["UC-72d"]}, "BR-224": {"text": "A user may rename documents in their own personal library.", "applies": ["UC-71b"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-71b"]}, "BR-225": {"text": "A user may move personal-library documents only between their own folders or the library root.", "applies": ["UC-71c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-71c"]}, "BR-226": {"text": "The first direct upload creates a personal-library folder for that user and Meeting.", "applies": ["UC-33a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Configurations/FolderConfiguration.cs:13", "backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:437"], "test": [], "ucs": ["UC-33a"]}, "BR-227": {"text": "Later uploads to the same Meeting reuse its existing personal-library folder, even after it is renamed or moved.", "applies": ["UC-33a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Configurations/FolderConfiguration.cs:13", "backend/TrustCabinet.Domain/Documents/DocumentContracts.cs:162", "backend/TrustCabinet.Domain/Entities/Folder.cs:21", "frontend/src/features/documents/AddDocumentsDialog.tsx:298"], "test": [], "ucs": ["UC-33a", "UC-72b", "UC-72c"]}, "BR-228": {"text": "If the Meeting's personal-library folder was deleted, the next direct upload recreates it at the library root, named with the Meeting title and planned start date in Vietnam time.", "applies": ["UC-33a"], "rationale": "ADR-0020 / PO 15/10/2026", "enforced": "Document Management", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:437", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:174"], "test": [], "ucs": ["UC-33a", "UC-72d"]}, "BR-229": {"text": "Separate uploads are different documents, even when their names or contents match.", "applies": ["UC-33a", "UC-36"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/MeetingDocumentService.cs:446", "backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:205"], "test": ["tests/TrustCabinet.Web.Tests/Documents/MeetingDocumentEndpointsTests.cs:380"], "ucs": ["UC-33a", "UC-36"]}, "BR-231": {"text": "Removing a Meeting document does not remove it from personal libraries or other Meetings.", "applies": ["UC-33c"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-33c"]}, "BR-232": {"text": "Deleting an unused file preserves its history and comments, but its content is no longer available.", "applies": ["UC-33c", "UC-71a"], "rationale": "ADR-0018 / PO 14/10/2026 — atomic rule review", "enforced": "Document / Guest access", "code": ["backend/TrustCabinet.Infrastructure/Documents/PersonalLibraryService.cs:244", "backend/TrustCabinet.Domain/Documents/PersonalLibraryContracts.cs:92"], "test": [], "ucs": ["UC-33c", "UC-71a"]}, "BR-235": {"text": "Declining a Meeting invitation does not revoke document-reading access.", "applies": ["UC-32a", "UC-32c"], "rationale": "ADR-0006 — cross-review 14/10/2026", "enforced": "Document / Guest access", "code": [], "test": [], "ucs": ["UC-32a", "UC-32c"]}, "BR-236": {"text": "Retired on 18/10/2026 by PO decision of 16/10/2026: merged into BR-68. This ID must not be reused.", "applies": ["UC-23b"], "rationale": "PO 16/10/2026", "enforced": "Agenda Management", "code": [], "test": [], "ucs": ["UC-23b"]}, "BR-237": {"text": "Only Pending Agenda Items may be deleted.", "applies": ["UC-23c"], "rationale": "Split from forme
