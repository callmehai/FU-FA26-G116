# PostgreSQL cho môi trường dev. Chỉ dùng ở máy cá nhân — không phải cấu hình triển khai thật.
#
#   cp .env.example .env     # rồi tự đặt mật khẩu trong .env (.env đã bị gitignore)
#   docker compose up -d
#
# Hướng dẫn đầy đủ: docs/02-design/03-co-so-du-lieu.md
services:
  postgres:
    # alpine cho ảnh nhỏ, và có sẵn bản arm64 nên chạy native trên máy Apple Silicon.
    image: postgres:17-alpine
    container_name: trustcabinet-postgres
    environment:
      POSTGRES_DB: trustcabinet
      POSTGRES_USER: trustcabinet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD - xem .env.example}
    ports:
      - "5432:5432"
    volumes:
      - trustcabinet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustcabinet -d trustcabinet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Refresh token cho đăng nhập (SCRUM-11). Không cần volume: mất dữ liệu ở đây chỉ có nghĩa là
  # mọi người phải đăng nhập lại, còn token hết hạn thì Redis tự xoá bằng TTL.
  redis:
    image: redis:8-alpine
    container_name: trustcabinet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Kho tệp tài liệu (SCRUM-107, ADR-0024): S3 API như Cloudflare R2 trên server test, nên dev chạy
  # cùng một đoạn code. Không bật xác thực nên không cần secret, và vì vậy chỉ mở trên loopback. Tạo
  # bucket một lần và đặt FileStorage:* trong user-secrets — docs/02-design/03-co-so-du-lieu.md §5.
  files:
    image: chrislusf/seaweedfs:3.97
    container_name: trustcabinet-files
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - trustcabinet-files:/data

  # Phòng họp trực tuyến (SCRUM-39, ADR-0010). Chỉ chạy khi cần:
  #   docker compose --profile calls up -d
  # Nằm trong profile để ai không làm phần gọi vẫn `docker compose up -d` như cũ, không cần secret.
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: trustcabinet-livekit
    profiles: ["calls"]
    command: --config /etc/livekit.yaml
    environment:
      # "tên-key: secret". Secret ít nhất 32 ký tự — SDK .NET từ chối secret ngắn hơn.
      # Không dùng ${VAR:?}: compose nội suy cả file, kể cả service ngoài profile đang chạy.
      LIVEKIT_KEYS: "trustcabinet-dev: ${LIVEKIT_API_SECRET:-}"
    ports:
      - "7880:7880"       # HTTP API + WebSocket signalling
      - "7881:7881"       # ICE/TCP
      - "7882:7882/udp"   # ICE/UDP
    volumes:
      - ./docker/livekit.dev.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      # Docker Desktop có sẵn host.docker.internal; Linux cần dòng này.
      - "host.docker.internal:host-gateway"

  # Worker nhận dạng giọng nói (SCRUM-31/35): chuyển giọng nói thành chữ, tách người nói, vector
  # giọng cho Voice ID. Chạy CPU, model nằm sẵn trong image. Chỉ chạy khi cần:
  #   docker compose --profile speech up -d --build
  # Lần build đầu tải ~110 MB model. Chỉ mở cổng cho máy mình (127.0.0.1): backend gọi vào,
  # không ai khác cần tới. Hướng dẫn: workers/speech/README.md
  speech:
    build: ./workers/speech
    image: trustcabinet-speech:dev
    container_name: trustcabinet-speech
    profiles: ["speech"]
    restart: unless-stopped
    environment:
      # Để trống thì không bắt xác thực — chỉ nên vậy khi cổng không ra ngoài máy.
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
    ports:
      - "127.0.0.1:8090:8090"
    # Đo được: rảnh ~260 MB, đỉnh ~1.5 GB với một bản ghi 10 phút, và process giữ tới ~2.4 GB sau
    # vài bản liên tiếp. Một giờ âm thanh giải mã ra thêm ~230 MB. 3 GB vẫn đủ.
    mem_limit: 3g

volumes:
  trustcabinet-pgdata:
  trustcabinet-files:
