# Server test chung của nhóm — app + PostgreSQL + Redis + LiveKit (phòng họp) + Caddy (tự lấy chứng
# chỉ HTTPS), và máy chuyển chữ khi bật profile speech.
# Hướng dẫn: deploy/README.md. Lý do chọn cách này: docs/05-decisions/0015-server-test-tren-lightsail.md
#
#   cp deploy/.env.example deploy/.env   # rồi điền giá trị thật, .env đã bị gitignore
#   docker compose -f deploy/docker-compose.yml up -d --build
name: trustcabinet-test

services:
  app:
    # Tên cố định: .github/workflows/deploy.yml build image trên GitHub rồi nạp vào server dưới
    # đúng tên này; `up -d --build` trên server vẫn build ra cùng tên nếu cần làm tay.
    image: trustcabinet-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Development có chủ đích: app tự migrate và seed 4 tài khoản demo khi khởi động. Ngoài
      # Development thì không có tài khoản nào để đăng nhập — xem ADR-0015.
      ASPNETCORE_ENVIRONMENT: Development
      # App chỉ nhận request qua Caddy (không mở cổng ra ngoài), nên tin X-Forwarded-For từ Caddy
      # là an toàn — nhật ký kiểm toán ghi IP thật của người dùng thay vì IP của Caddy.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__TrustCabinet: "Host=postgres;Port=5432;Database=trustcabinet;Username=trustcabinet;Password=${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong deploy/.env};GSS Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      Authentication__SigningKey: "${SIGNING_KEY:?Chua dat SIGNING_KEY trong deploy/.env}"
      Email__ApplicationBaseUrl: "https://${SITE_ADDRESS}"
      # Tắt mặc định; điền SMTP_* trong deploy/.env để gửi email thật (thư mời, đặt lại mật khẩu).
      Email__Smtp__Enabled: "${SMTP_ENABLED:-false}"
      Email__Smtp__Host: "${SMTP_HOST:-}"
      Email__Smtp__Port: "${SMTP_PORT:-587}"
      Email__Smtp__Username: "${SMTP_USERNAME:-}"
      Email__Smtp__Password: "${SMTP_PASSWORD:-}"
      Email__Smtp__FromAddress: "${SMTP_FROM:-}"
      # Phòng họp (ADR-0010). Trình duyệt vào signalling qua Caddy (/rtc), backend gọi API của LiveKit
      # thẳng trong mạng Docker. Tên key phải trùng deploy/livekit.yaml.
      LiveKit__PublicUrl: "wss://${SITE_ADDRESS}"
      LiveKit__ApiUrl: "http://livekit:7880"
      LiveKit__ApiKey: trustcabinet-test
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET:?Chua dat LIVEKIT_API_SECRET trong deploy/.env}"
      # Kho tệp tài liệu trên Cloudflare R2 (ADR-0024). Để trống thì app vẫn chạy, tải tài liệu trả
      # 503/MSG166. Xem deploy/README.md §9.
      FileStorage__ServiceUrl: "${R2_ENDPOINT:-}"
      FileStorage__BucketName: "${R2_BUCKET:-}"
      FileStorage__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
      FileStorage__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
      # Máy chuyển chữ (ADR-0026). Chỉ chạy khi deploy/.env có COMPOSE_PROFILES=speech, vì cần máy 4 GB.
      # Để trống thì app vẫn chạy, chuyển chữ và ghi theo micro trả 503/MSG312. Xem deploy/README.md §10.
      Speech__BaseUrl: "${SPEECH_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustcabinet
      POSTGRES_USER: trustcabinet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong deploy/.env}
    # Chỉ mở trên loopback của server — Internet không vào được. DBeaver ở máy mình kết nối qua
    # SSH tunnel, xem deploy/README.md.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustcabinet -d trustcabinet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  livekit:
    # Cùng phiên bản với docker-compose.yml ở gốc repo (máy dev).
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # "tên-key: secret", secret ít nhất 32 ký tự — SDK .NET từ chối secret ngắn hơn.
      LIVEKIT_KEYS: "trustcabinet-test: ${LIVEKIT_API_SECRET:?Chua dat LIVEKIT_API_SECRET trong deploy/.env}"
    # Chỉ media mở ra Internet, và phải mở thêm trên firewall Lightsail. Cổng 7880 (signalling, API)
    # không mở: trình duyệt đi qua Caddy, backend đi trong mạng Docker.
    ports:
      - "7881:7881"       # ICE/TCP
      - "7882:7882/udp"   # ICE/UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  speech:
    # Chỉ chạy khi deploy/.env có COMPOSE_PROFILES=speech. Workflow deploy build image trên GitHub và
    # chỉ chép sang khi workers/speech đổi, vì image ~770 MB.
    image: trustcabinet-speech:latest
    build:
      context: ../workers/speech
    profiles: ["speech"]
    restart: unless-stopped
    environment:
      # Máy test có 2 vCPU: dùng hết cho một model, các yêu cầu khác xếp hàng ở backend.
      SPEECH_THREADS: "2"
    # Không mở cổng: chỉ app gọi vào, trong mạng Docker. Âm thanh không rời server.
    # Đo ở máy dev: rảnh ~260 MB, đỉnh ~1.5 GB với một bản ghi 10 phút. Giới hạn để một bản ghi dài
    # không đẩy PostgreSQL và LiveKit ra khỏi RAM của máy 4 GB.
    mem_limit: 2500m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Chua dat SITE_ADDRESS trong deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - livekit

volumes:
  pgdata:
  caddy-data:
  caddy-config:
