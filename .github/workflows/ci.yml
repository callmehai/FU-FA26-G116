# Chạy trên mọi pull request và mọi lần push lên main. Mục đích là bắt được lỗi build/lint
# trước khi merge, vì cả nhóm cùng push vào một repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới lên cùng một PR huỷ lần chạy cũ còn dở: chỉ kết quả của commit cuối có ý nghĩa, và repo
# private chỉ có 2.000 phút Actions miễn phí mỗi tháng (tháng 10/2026 hết sạch trước ngày 26).
# Trên main thì không huỷ, vì mỗi lần push kéo theo một lần deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    env:
      # Cùng giá trị với PostgreSQL service bên dưới; chỉ tồn tại trong runner CI dùng một lần.
      POSTGRES_PASSWORD: "123"

    # RedisRefreshTokenStoreTests và UserRepositoryTests chạy thật trên Redis và PostgreSQL chứ
    # không dùng fake, nên CI phải có cả hai. Đây là chỗ bắt được lỗi mà fake không thấy: fake
    # từng có guard mà code thật thiếu, nên test xanh trong khi production sai.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trustcabinet
          POSTGRES_USER: trustcabinet
          # Chỉ là mật khẩu của container dùng một lần trong CI, không phải secret.
          POSTGRES_PASSWORD: "123"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustcabinet -d trustcabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Commit merge của PR cùng cha đầu tiên của nó (đầu nhánh đích), để so ra các file PR đổi.
          fetch-depth: 2

      # PR không đụng tới backend, test hay CI (chỉ frontend/ hoặc docs/) thì chỉ chạy các test đọc
      # mã nguồn ngoài backend: danh mục mã thông báo (đọc FE và docs) và bản sao skill. Hơn 1.500 test
      # còn lại chạy trên PostgreSQL mất ~6 phút mà kết quả không thể đổi. Build vẫn chạy đủ, và push
      # lên main luôn chạy toàn bộ.
      - name: Chọn test
        id: scope
        run: |
          filter=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            # Đọc hết danh sách trước khi lọc: grep -q thoát sớm làm git diff chết vì SIGPIPE, và
            # bash của runner chạy với pipefail.
            changed=$(git diff --name-only HEAD^1 HEAD)
            outside=$(grep -vE '^(frontend/|docs/|\.agents/|\.claude/|[^/]+\.md$)' <<< "$changed" || true)
          fi
          if [ "${{ github.event_name }}" = pull_request ] && [ -z "$outside" ]; then
            filter="FullyQualifiedName~MessageCodeCatalogueTests|FullyQualifiedName~SkillMirrorTests"
          fi
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "Bộ lọc test: ${filter:-toàn bộ}"

      # global-json-file đảm bảo CI dùng đúng bản SDK đã pin trong global.json.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore TrustCabinet.sln

      # -warnaserror: warning của compiler và analyzer làm đỏ CI, không trôi qua thành
      # annotation không ai đọc. Chỉ đặt ở đây chứ không đặt trong csproj — build dưới máy vẫn
      # cho phép warning để còn chạy thử code viết dở; cổng chặn nằm ở lúc xin vào main.
      # Warning cố ý thì khai báo <WarningsNotAsErrors>MãLỗi</WarningsNotAsErrors> trong csproj
      # kèm lý do, chứ đừng gỡ cờ này.
      - run: dotnet build TrustCabinet.sln --no-restore --configuration Release -warnaserror

      - run: dotnet test TrustCabinet.sln --no-build --configuration Release --verbosity normal --filter "$FILTER"
        env:
          FILTER: ${{ steps.scope.outputs.filter }}

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci cài đúng theo package-lock.json, không tự nâng version như npm install.
      - run: npm ci

      - run: npm run lint

      # `npm run build` chạy tsc -b trước, nên bước này bắt luôn lỗi kiểu TypeScript.
      - run: npm run build

  # Push lên main mà hai job trên xanh thì deploy lên server test (.github/workflows/deploy.yml).
  # Nằm trong CI để commit hiện cả trạng thái deploy; trên pull request job này hiện là Skipped.
  deploy:
    name: Deploy server test
    needs: [backend, frontend]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
