# Chạy trên mọi pull request và mọi lần push lên main. Mục đích là bắt được lỗi build/lint
# trước khi merge, vì cả nhóm cùng push vào một repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới lên cùng một PR huỷ lần chạy cũ còn dở: chỉ kết quả của commit cuối có ý nghĩa, và repo
# private chỉ có 2.000 phút Actions miễn phí mỗi tháng (tháng 10/2026 hết sạch trước ngày 26).
# Trên main thì không huỷ, vì mỗi lần push kéo theo một lần deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chỉ chạy phần bị đổi: PR chỉ sửa README hay deploy/ không build lại backend và frontend. Không
  # khớp nhóm nào ở đây thì job đó Skipped — repo không bắt check nào phải xanh nên Skipped không
  # chặn merge. Image của server test thì deploy.yml tự quyết có build lại không.
  changes:
    name: Chọn phần cần chạy
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit merge của PR cùng cha đầu tiên của nó (đầu nhánh đích), để so ra các file PR đổi.
          fetch-depth: 2

      # backend=full: build và chạy hết test. backend=source: PR chỉ đụng frontend/, docs/ hay skill,
      # nên chỉ chạy các test đọc mã nguồn ngoài backend — danh mục mã thông báo (đọc FE và docs) và
      # bản sao skill; hơn 1.500 test còn lại chạy trên PostgreSQL mất ~6 phút mà kết quả không thể
      # đổi. backend=skip: không đụng gì backend build hay test đọc tới.
      - name: So file đã đổi
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          else
            # Push lên main: so với đầu main trước lần push, kể cả khi một lần push mang nhiều commit.
            base=$BEFORE
            git fetch -q --depth=1 origin "$base" 2> /dev/null || base=""
          fi
          all=false
          if [ -z "$base" ] || ! changed=$(git diff --name-only "$base" HEAD); then
            echo "Không so được với commit trước, chạy tất cả"
            all=true
          fi
          # Here-string chứ không pipe: grep -q thoát sớm làm lệnh trước chết vì SIGPIPE, và bash
          # của runner chạy với pipefail.
          has() { grep -qE "$1" <<< "$changed"; }
          ci='^\.github/workflows/ci\.yml$'
          if $all || has "$ci|^(backend|tests)/|^(global\.json|TrustCabinet\.sln|dotnet-tools\.json|\.editorconfig)$"; then
            backend=full
          elif has '^(frontend|docs|\.claude|\.agents)/'; then
            backend=source
          else
            backend=skip
          fi
          frontend=false
          if $all || has "$ci|^frontend/"; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Backend: $backend, frontend: $frontend"

  backend:
    name: Backend — build & test
    needs: changes
    if: needs.changes.outputs.backend != 'skip'
    runs-on: ubuntu-latest
    env:
      # Cùng giá trị với PostgreSQL service bên dưới; chỉ tồn tại trong runner CI dùng một lần.
      POSTGRES_PASSWORD: "123"

    # RedisRefreshTokenStoreTests và UserRepositoryTests chạy thật trên Redis và PostgreSQL chứ
    # không dùng fake, nên CI phải có cả hai. Đây là chỗ bắt được lỗi mà fake không thấy: fake
    # từng có guard mà code thật thiếu, nên test xanh trong khi production sai.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trustcabinet
          POSTGRES_USER: trustcabinet
          # Chỉ là mật khẩu của container dùng một lần trong CI, không phải secret.
          POSTGRES_PASSWORD: "123"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustcabinet -d trustcabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # global-json-file đảm bảo CI dùng đúng bản SDK đã pin trong global.json.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore TrustCabinet.sln

      # -warnaserror: warning của compiler và analyzer làm đỏ CI, không trôi qua thành
      # annotation không ai đọc. Chỉ đặt ở đây chứ không đặt trong csproj — build dưới máy vẫn
      # cho phép warning để còn chạy thử code viết dở; cổng chặn nằm ở lúc xin vào main.
      # Warning cố ý thì khai báo <WarningsNotAsErrors>MãLỗi</WarningsNotAsErrors> trong csproj
      # kèm lý do, chứ đừng gỡ cờ này.
      - run: dotnet build TrustCabinet.sln --no-restore --configuration Release -warnaserror

      - run: dotnet test TrustCabinet.sln --no-build --configuration Release --verbosity normal --filter "$FILTER"
        env:
          FILTER: ${{ needs.changes.outputs.backend == 'source' && 'FullyQualifiedName~MessageCodeCatalogueTests|FullyQualifiedName~SkillMirrorTests' || '' }}

  frontend:
    name: Frontend — lint & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci cài đúng theo package-lock.json, không tự nâng version như npm install.
      - run: npm ci

      - run: npm run lint

      # `npm run build` chạy tsc -b trước, nên bước này bắt luôn lỗi kiểu TypeScript.
      - run: npm run build

  # Push lên main mà hai job trên xanh hoặc Skipped thì deploy lên server test
  # (.github/workflows/deploy.yml) — kể cả lần chỉ sửa deploy/ hay docs, để server luôn chạy đúng
  # commit đầu main. Nằm trong CI để commit hiện cả trạng thái deploy; trên pull request job này
  # hiện là Skipped.
  deploy:
    name: Deploy server test
    needs: [changes, backend, frontend]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
